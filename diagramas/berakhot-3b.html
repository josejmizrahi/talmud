  const panel = document.getElementById('noche-david-panel');
  const nodos = document.querySelectorAll('.noche-david-nodo');

  nodos.forEach(n => {
    n.addEventListener('click', () => {
      const id = n.getAttribute('data-id');
      const d = datos[id];
      if (!d) return;

      nodos.forEach(o => {
        o.classList.remove('activa', 'dim');
        if (o !== n) o.classList.add('dim');
      });
      n.classList.add('activa');

      panel.innerHTML = `
        <div class="noche-david-panel-header">
          <h4 class="noche-david-panel-titulo">${d.titulo}</h4>
          <div class="noche-david-panel-hebreo">${d.hebreo}</div>
        </div>
        <p class="noche-david-panel-traduccion">${d.traduccion}</p>
        <p class="noche-david-panel-explicacion">${d.explicacion}</p>
      `;
    });
  });
})();
</script>
