  var contenedor = document.currentScript
    ? document.currentScript.closest('.cerca-interactivo')
    : document.querySelector('.cerca-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#cerca-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.cerca-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="cerca-panel-header">' +
        '<p class="cerca-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="cerca-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="cerca-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="cerca-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.cerca-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.cerca-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="cerca-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
