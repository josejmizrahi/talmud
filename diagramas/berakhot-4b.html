<!-- ====================================================================== -->
<!-- SECCIÓN A · LA CERCA RABÍNICA · L0-L4                                   -->
<!-- ====================================================================== -->
<text x="60" y="82" font-size="10" fill="#8b1a1a" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">RESOLUCIÓN DEL MISHNÁ · LA CERCA DEL "CHATZOT"</text>

<g class="cerca-nodo" data-id="la-cerca">
  <rect x="60" y="94" width="640" height="64" rx="6" fill="rgba(139,26,26,0.06)" stroke="#8b1a1a" stroke-width="1.1"/>
  <text x="78" y="116" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">Los Jajamim coinciden con R. Gamliel — el zman REAL es hasta el amanecer</text>
  <text x="682" y="116" text-anchor="end" font-size="11" direction="rtl" fill="#8b1a1a" font-weight="500">כְּדֵי לְהַרְחִיק אֶת הָאָדָם מִן הָעֲבֵירָה</text>
  <text x="78" y="138" font-size="10" fill="#3d2f23">"hasta chatzot" es סְיָיג — una cerca rabínica para que la persona no se descuide y pierda el zman entero.</text>
  <text x="78" y="153" font-size="9" fill="#6b4423" font-style="italic">la halajá derabanan limita la halajá de'oraita preventivamente</text>
</g>

<g class="cerca-nodo" data-id="trabajador">
  <rect x="60" y="172" width="640" height="92" rx="6" fill="rgba(139,26,26,0.08)" stroke="#8b1a1a" stroke-width="1.3"/>
  <text x="78" y="193" font-size="10" font-family="'JetBrains Mono', monospace" fill="#8b1a1a" letter-spacing="1.5">EL ESCENARIO · BARAITA DEL TRABAJADOR DEL CAMPO</text>
  <text x="78" y="214" font-size="12" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">"comeré poco, beberé poco, dormiré poco, y después recitaré shema y rezaré"</text>
  <text x="682" y="214" text-anchor="end" font-size="10" direction="rtl" fill="#8b1a1a">אוֹכַל קִימְעָא · אֶשְׁתֶּה · אִישַׁן</text>
  <text x="78" y="234" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">…y el sueño lo atrapa, y queda durmiendo toda la noche.</text>
  <text x="78" y="252" font-size="10" fill="#3d2f23">La solución: pasar por el beit knesset DIRECTO, recitar antes de comer. La cerca evita el desastre.</text>
</g>

<g class="cerca-nodo" data-id="chayav-mita">
  <rect x="60" y="278" width="640" height="74" rx="6" fill="rgba(139,26,26,0.07)" stroke="#8b1a1a" stroke-width="1.1"/>
  <text x="78" y="299" font-size="10" font-family="'JetBrains Mono', monospace" fill="#8b1a1a" letter-spacing="1.5">LA FÓRMULA SEVERA · L2-L4</text>
  <text x="682" y="299" text-anchor="end" font-size="12" direction="rtl" fill="#8b1a1a" font-weight="500">כָּל הָעוֹבֵר עַל דִּבְרֵי חֲכָמִים חַיָּיב מִיתָה</text>
  <text x="78" y="321" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">"quien transgrede las palabras de los Sabios es reo de muerte"</text>
  <text x="78" y="340" font-size="10" fill="#3d2f23">¿Por qué tan severa aquí? Dos razones: (a) hay אוֹנֶס שֵׁינָה — el peligro real del sueño; (b) para refutar a quien dice que ARVIT es opcional.</text>
</g>

<!-- ====================================================================== -->
<!-- SECCIÓN B · SEMIJAT GEULAH LE-TEFILAH · L5-L14                          -->
<!-- ====================================================================== -->
<text x="60" y="378" font-size="10" fill="#1e3a5f" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">SEMIJAT GEULAH LE-TEFILAH · UNA TÉCNICA QUE GARANTIZA OLAM HA-BA</text>

<g class="cerca-nodo" data-id="r-yochanan-bonha">
  <use href="#estrella" x="78" y="408" width="14" height="14"/>
  <rect x="60" y="390" width="640" height="76" rx="6" fill="rgba(184,134,11,0.10)" stroke="#b8860b" stroke-width="1.4"/>
  <text x="100" y="412" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">R. Yojanán · "¿quién es ben olam ha-ba? El que CONECTA geulá a tefilá en arvit"</text>
  <text x="682" y="412" text-anchor="end" font-size="11" direction="rtl" fill="#b8860b" font-weight="500">הַסּוֹמֵךְ גְּאוּלָּה לִתְפִלָּה</text>
  <text x="100" y="434" font-size="10" fill="#3d2f23">No interrumpir entre la berajá "גָּאַל יִשְׂרָאֵל" y la Amidá — gesto micro-litúrgico con valor escatológico.</text>
  <text x="100" y="453" font-size="10" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">R. Yehoshua ben Levi disiente: "las tefilot fueron instituidas EN EL MEDIO" (geulá no requiere conexión inmediata).</text>
</g>

<g class="cerca-nodo" data-id="debate-svara-kra">
  <rect x="60" y="478" width="640" height="86" rx="6" fill="rgba(30,58,95,0.08)" stroke="#1e3a5f" stroke-width="1.1"/>
  <text x="78" y="499" font-size="10" font-family="'JetBrains Mono', monospace" fill="#1e3a5f" letter-spacing="1.5">¿EN QUÉ DIFIEREN? · SVARA O KRA</text>
  <text x="78" y="521" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">SVARA · R. Yojanán: la "geulá" existe ya de noche aunque la geulá perfecta sea solo al amanecer (cuando se ve la luz).</text>
  <text x="78" y="538" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">R. Yehoshua ben Levi: como la geulá perfecta es solo al amanecer, de noche NO hay obligación de conectar.</text>
  <text x="78" y="557" font-size="10" fill="#3d2f23">KRA · ambos leen "בְּשָׁכְבְּךָ וּבְקוּמֶךָ". R. Yojanán hace hekesh: como en la mañana, en la noche también shema→tefilá. R. Yehoshua ben Levi: como en la mañana shema se dice "סמוך למטתו" (junto a la cama), en la noche también.</text>
</g>

<g class="cerca-nodo" data-id="hashkiveinu">
  <rect x="60" y="578" width="640" height="74" rx="6" fill="rgba(30,58,95,0.07)" stroke="#1e3a5f" stroke-width="1.1"/>
  <text x="78" y="599" font-size="10" font-family="'JetBrains Mono', monospace" fill="#1e3a5f" letter-spacing="1.5">LA OBJECIÓN Y LA SALIDA · "HASHKIVEINU" COMO GEULÁ EXTENDIDA</text>
  <text x="682" y="599" text-anchor="end" font-size="11" direction="rtl" fill="#1e3a5f" font-weight="500">כִּגְאוּלָּה אֲרִיכְתָּא דָּמְיָא</text>
  <text x="78" y="621" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">Mar bar Ravina: ¡pero en arvit decimos "Hashkiveinu" ENTRE geulá y tefilá!</text>
  <text x="78" y="640" font-size="10" fill="#3d2f23">Respuesta: Hashkiveinu es una "geulá extendida" — la berajá rabínica está pegada a la geulá, no la interrumpe.</text>
</g>

<!-- SECCIÓN C · ASHREI · L15-L21                                            -->
<!-- ====================================================================== -->
<text x="60" y="678" font-size="10" fill="#b8860b" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">TEHILÁ LEDAVID · SEGUNDO PASAPORTE AL OLAM HA-BA</text>

<g class="cerca-nodo" data-id="ashrei-promesa">
  <use href="#estrella" x="78" y="708" width="14" height="14"/>
  <rect x="60" y="690" width="640" height="92" rx="6" fill="rgba(184,134,11,0.10)" stroke="#b8860b" stroke-width="1.4"/>
  <text x="100" y="712" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">R. Elazar / R. Avina · quien recita "Tehilá leDavid" 3 veces al día — ben olam ha-ba</text>
  <text x="682" y="712" text-anchor="end" font-size="11" direction="rtl" fill="#b8860b" font-weight="500">תְּהִלָּה לְדָוִד · ג׳ פְּעָמִים</text>
  <text x="100" y="734" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">¿Por qué Ashrei? Tres razones examinadas y refutadas, hasta llegar a la verdadera:</text>
  <text x="100" y="752" font-size="10" fill="#3d2f23">(1) ¿porque es alfabético? No — Tehilim 119 también lo es. (2) ¿porque tiene "פותח את ידך"? No — Halel HaGadol también.</text>
  <text x="100" y="769" font-size="10" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">(3) Porque tiene LAS DOS COSAS — alfabeto + פותח את ידך. La densidad litúrgica garantiza el premio escatológico.</text>
</g>

<g class="cerca-nodo" data-id="nun-falta">
  <rect x="60" y="794" width="640" height="76" rx="6" fill="rgba(184,134,11,0.06)" stroke="#b8860b" stroke-width="1"/>
  <text x="78" y="816" font-size="10" font-family="'JetBrains Mono', monospace" fill="#b8860b" letter-spacing="1.5">¿POR QUÉ NO HAY נ EN ASHREI? · L20-L21</text>
  <text x="78" y="838" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">R. Yojanán: la letra נ insinúa "נָפְלָה לא תוסיף קום" — la caída de Israel — y David la omite.</text>
  <text x="78" y="856" font-size="10" fill="#3d2f23">En Eretz Yisrael leen: "נָפְלָה ולא תוסיף לִנְפּוֹל עוֹד · קוּם בְּתוּלַת יִשְׂרָאֵל" (cayó y no caerá más; ¡levántate, virgen de Israel!).</text>
</g>

<text x="60" y="894" font-size="10" fill="#5a3a8a" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">LA ESCALA DE LOS ÁNGELES · ¿CUÁNTOS VUELOS NECESITAN?</text>

    <text x="0" y="34" font-size="10" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">Eliyahu</text>

  </g>

<text x="60" y="1028" font-size="10" fill="#6b4423" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">SHEMA AL ACOSTARSE · MITZVÁ PERSONAL · L26</text>

<g class="cerca-nodo" data-id="shema-mita">
  <rect x="60" y="1040" width="640" height="34" rx="6" fill="rgba(107,68,35,0.08)" stroke="#6b4423" stroke-width="1.1"/>
  <text x="78" y="1062" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">R. Yehoshua ben Levi: aunque ya recitó shema en el beit knesset — מצוה לקרותו על מטתו</text>
  <text x="682" y="1062" text-anchor="end" font-size="10" direction="rtl" fill="#6b4423">רִגְזוּ וְאַל תֶּחֱטָאוּ · תהילים ד:ה</text>
</g>
