  <text x="100" y="1246" font-size="9.5" fill="#3d2f23">la lectura burda produce oraciones crueles (R. Meir) y burlas vacías (los minim)</text>

      explicacion: 'La respuesta de Beruria abre con un insulto técnico: שָׁטְיָא — «necio». No es (solo) descortesía: es un diagnóstico. El error del min no es de información sino de MÉTODO — leyó medio verso y se detuvo. Y la receta es la misma que le dio a su esposo: שְׁפֵיל לְסֵיפֵיהּ דִּקְרָא, baja al final del verso.\n\nEl final dice: כִּי רַבִּים בְּנֵי שׁוֹמֵמָה — «porque son MÁS los hijos de la desolada que los de la desposada». El verso entero no celebra la esterilidad: promete que la estéril tendrá MÁS hijos que la fecunda. La «estéril» es una figura — y Beruria la identifica: KNÉSET ISRAEL, la congregación de Israel, desolada en el exilio pero destinada a la multiplicación.\n\nY entonces la estocada: ¿por qué «canta» la estéril ya AHORA? Porque no ha parido hijos para el GUEHINOM — כְּוָותַיְיכוּ, «como ustedes». La esterilidad aparente de Israel es limpieza: no producir hijos destinados a la perdición ya es motivo de canto.\n\nBeruria no se limita a neutralizar la burla — la DEVUELVE. El verso que el min usó contra Israel termina describiendo al propio min como hijo del Guehinom. La lectura fina no es solo defensa: bien ejecutada, convierte el arma del atacante en su propia refutación.'

      explicacion: 'Las tres escenas forman una sola lección con tres calibres.\n\n1. LA LECTURA BURDA ES TRANSVERSAL. La comete un tana santo movido por el dolor (R. Meir), un burlador de mala fe (el min de la estéril) y un polemista sofisticado (el min del orden). El error no distingue piadosos de herejes: citar fragmentos al servicio de lo que uno ya siente es la tentación universal del lector. Por eso la corrección de Beruria a su esposo y su respuesta al min usan LA MISMA fórmula — la guemará iguala deliberadamente los dos casos.\n\n2. BERURIA. Es la única mujer con voz halájica del perek — y una de las muy pocas del Talmud que argumenta con las herramientas técnicas del bet midrash: dicción (jotim/jataim), contexto (el final del verso), identificación de figuras (la estéril = Knéset Israel). La guemará no la presenta como excepción pintoresca sino como la MEJOR lectora de las tres escenas: corrige a R. Meir y él acepta; aplasta al min y no hay réplica. Su violeta en este diagrama marca eso: una autoridad hermenéutica propia.\n\n3. LA ESCALADA DEL MÉTODO. Escena 1: el final del VERSO corrige la lectura del comienzo. Escena 2: el final del verso más la identificación de la FIGURA. Escena 3: ya no el interior del verso sino el ORDEN de los capítulos — smujin. El principio crece de la microgramática a la macroestructura: en el canon todo significa, desde la vocal de חַטָּאִים hasta la posición de Tehilim 3 junto a Tehilim 2.\n\nLa cinta dorada que atraviesa el diagrama es esa única herramienta: contra la oración cruel, contra la burla y contra la impugnación estructural, la defensa es la misma — seguir leyendo hasta el final.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.beruria-interactivo')
    : document.querySelector('.beruria-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#beruria-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.beruria-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="beruria-panel-header">' +
        '<p class="beruria-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="beruria-panel-hebreo" dir="rtl">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="beruria-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="beruria-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.beruria-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.beruria-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="beruria-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
