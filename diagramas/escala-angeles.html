      explicacion: 'R. Yehoshua ben Levi establece una práctica halájica que sigue vigente hoy: DOS recitaciones del shema en arvit.\n\n  1. PRIMERA recitación — en la sinagoga, como parte del rezo público de arvit, con sus brachot rodeantes (ma\'ariv aravim, ahavat olam, emet ve-emuná, hashkiveinu).\n\n  2. SEGUNDA recitación — privada, sobre la cama, justo antes de dormir, SIN las brachot.\n\nLa primera cumple la obligación bíblica de la mitzvá del shema. ¿Por qué entonces una segunda? R. Yehoshua ben Levi responde: porque la cama es un espacio de vulnerabilidad ESPECIAL que requiere protección ritual ADICIONAL.\n\nLa práctica se codifica en el sidur moderno como «keriat shema al ha-mita» — un servicio completo que incluye:\n  · selichá (perdón por agravios)\n  · shema (al menos el primer párrafo)\n  · Tehilim 91 (yoshev be-séter elyón)\n  · la invocación de los cuatro ángeles\n  · brachot de protección\n\nEsta es la TERCERA vía al olam ha-ba después de la semijá (#10) y el Ashrei (#11): la disciplina nocturna privada.'

    'verseta-yose': {

      traduccion: '«Tiemblen y no pequen · digan en su corazón sobre su cama · y guarden silencio» (Tehilim 4:5)',
      explicacion: 'R. Yose aporta el versículo escriturario que da base bíblica a la práctica. Tehilim 4:5 contiene CUATRO cláusulas que se mapean al ritual de acostarse:\n\n  · רִגְזוּ — «tiemblen»: temor reverencial al transicionar al estado de vulnerabilidad\n\n  · וְאַל תֶּחֱטָאוּ — «no pequen»: vigilancia moral antes de perder conciencia (no acostarse con un agravio sin reconciliar)\n\n  · אִמְרוּ בִלְבַבְכֶם — «digan en su corazón»: el shema interior, la afirmación de unidad divina como último pensamiento del día\n\n  · עַל מִשְׁכַּבְכֶם — «sobre su cama»: el lugar exacto. NO en la silla, NO de pie. Sobre la cama, en posición de entrega.\n\n  · וְדֹמּוּ סֶלָה — «y guarden silencio»: la calma del sueño, el cese del habla.\n\nEl versículo describe un protocolo psicológico completo: del temor a la vigilancia, a la afirmación interna, al silencio. Es como un descenso ritual hacia el sueño.\n\nLa palabra סֶלָה (selah) al final marca interrupción musical — pausa solemne. El día concluye con un silencio cantado.'

    'mazikin-alejan': {
      titulo: 'Rav Yitzjak · los mazikin se alejan',
      hebreo: 'כָּל הַקּוֹרֵא קְרִיאַת שְׁמַע עַל מִטָּתוֹ — מַזִּיקִין בְּדֵילִין הֵימֶנּוּ',
      traduccion: '«Todo el que recita shema sobre su cama — los mazikin se alejan de él»',
      explicacion: 'Rav Yitzjak añade la motivación práctica de la práctica: PROTECCIÓN contra los mazikin (los demonios destructivos).\n\nEsta enseñanza enraíza el shema-sobre-la-cama en la cosmología talmúdica de los peligros espirituales nocturnos (ver diagrama #4 sobre las TRES RAZONES de la ruina — donde los mazikin son una de las tres causas para no entrar).\n\nLa cama, en esta cosmología, es un espacio LIMINAL:\n  · el hombre PIERDE conciencia\n  · NO controla su cuerpo\n  · está expuesto a influencias espirituales\n  · está en una «muerte parcial» (1/60 de la muerte según otra sugyá)\n\nLos mazikin son atraídos precisamente por este estado. La conciencia del hombre vigilante los repele. Cuando uno duerme, la barrera natural se debilita — necesita un escudo ritual.\n\nEl shema funciona como escudo porque:\n  · proclama la unidad divina (los mazikin operan en la fragmentación)\n  · invoca la presencia de HKBH\n  · estructura la atención en una afirmación teológica fuerte\n\nLa derashá talmúdica deriva esto del versículo «ויחל לבי בכל שעת אגוז» (suelto de Tehilim 119:62 o similar) — donde la actividad espiritual nocturna se asocia con liberación del cuerpo del peligro.'

    'cuatro-angeles': {
      titulo: 'Los cuatro ángeles cardinales · invocación cosmológica',

      traduccion: '«Mikhael a mi derecha · Gabriel a mi izquierda · delante de mí Uriel · tras de mí Rafael»',
      explicacion: 'La práctica acompaña el shema-sobre-la-cama con la invocación de los CUATRO ÁNGELES CARDINALES, distribuidos en una geometría sagrada alrededor del durmiente:\n\n  · DERECHA — מִיכָאֵל (Mikhael): el ángel de la MISERICORDIA, asociado con el elemento AGUA. La derecha en hebreo es יָמִין (yamin), donde acampa la jésed (bondad) en la cosmología cabalística.\n\n  · IZQUIERDA — גַּבְרִיאֵל (Gabriel): el ángel del RIGOR, asociado con el FUEGO. La izquierda es שְׂמֹאל (smol), lado de la guevurá (severidad). Gabriel es el que ejecuta los juicios divinos (destruye Sodoma, anuncia el fin del exilio en Daniel).\n\n  · DELANTE — אוּרִיאֵל (Uriel): el ángel de la LUZ (אוּר = luz) y el ENTENDIMIENTO. Va delante porque ilumina el camino — la conciencia que precede a la acción.\n\n  · DETRÁS — רְפָאֵל (Rafael): el ángel de la CURACIÓN (רפא = curar) y la PAZ. Va detrás porque cura las heridas del camino ya recorrido — la sanación del pasado.\n\n  · ARRIBA — שְׁכִינָה (Shejiná): la Presencia divina sobre la cabeza. NO es un ángel — es la presencia INMEDIATA de HKBH, supervisando todo el dispositivo.\n\nLa formación es PENTAGONAL: cuatro ángeles en los puntos cardinales + la Shejiná en el vector vertical. El durmiente queda EN EL CENTRO de un cubo protector con vértices angélicos.\n\nEsta cosmología funcional NO es metáfora poética — es entendida en el rabinismo clásico como protección REAL. Cada noche el judío se acuesta dentro de un altar geométrico de ángeles.'

    'escala-velocidad': {
      titulo: 'La escala de velocidad · saltos desde el Trono',
      hebreo: 'מַסַּעַ הַמַּלְאָכִים',
      traduccion: 'El viaje de los ángeles',
      explicacion: 'La tradición rabínica clasifica los ángeles por la VELOCIDAD con que viajan desde el Trono Celestial hasta el mundo de los hombres. La métrica son los «saltos» (פְּסִיעוֹת) que cada uno necesita.\n\nLa escala:\n\n  · מִיכָאֵל — 1 SALTO. El más cercano al Trono. Llega de un solo movimiento. La MISERICORDIA es la fuerza más próxima a HKBH — no requiere distancia.\n\n  · גַּבְרִיאֵל — 2 SALTOS. Un poco más lejos. El RIGOR llega «con peso» — necesita más espacio para movilizarse. La justicia divina no es inmediata: se procesa.\n\n  · אֵלִיָּהוּ הַנָּבִיא — 4 SALTOS. Bastante más lejos. Eliyahu es el AGENTE PROFÉTICO — viene «del cielo distante» (cf. su ascenso en 2 Reyes 2). Su llegada requiere un trayecto cosmológico mayor.\n\n  · מַלְאַךְ הַמָּוֶת — 8 SALTOS. El MÁS LEJANO. La muerte habita en la frontera más distante de la cosmología. Para llegar al alma de un hombre, debe atravesar 8 esferas cosmológicas.\n\nLa estructura es NUMÉRICA en progresión geométrica (1, 2, 4, 8) — duplicación constante. Cada ángel está al doble de distancia que el anterior.\n\nLa lección teológica:\n  · la MISERICORDIA está siempre a un paso\n  · la MUERTE está siempre a ocho\n  · invocar a los cercanos (Mikhael) garantiza llegada rápida del rescate\n  · esto justifica orden de la invocación: primero los más cercanos\n\nEstos números no son numerología decorativa. Son MEDIDA FUNCIONAL del trayecto cosmológico de cada agente celestial. La halajá del rezo se apoya implícitamente en esta jerarquía: invocas a Mikhael en primer lugar porque, simplemente, llega antes.'
    },
    'excepcion-plaga': {
      titulo: 'La excepción · en tiempo de plaga la distancia se colapsa',
      hebreo: 'בְּשַׁעַת הַמַּגֵּפָה — מַלְאַךְ הַמָּוֶת מְקַפֵּץ בִּפְסִיעָה אַחַת',
      traduccion: '«En tiempo de plaga, el ángel de la muerte salta en una sola pasada»',
      explicacion: 'La normalidad cosmológica es que el ángel de la muerte está a 8 saltos. PERO en tiempo de epidemia, esa distancia se COLAPSA. El Mal\'aj Ha-Mavet llega en UN SOLO salto — la misma velocidad que Mikhael.\n\nEsto es teológicamente alarmante. Significa que durante una magefá, la frontera cósmica entre la vida y la muerte se ha REORGANIZADO. Lo que normalmente está lejano se vuelve adyacente.\n\nImplicaciones halájicas concretas:\n\n  1. Durante plaga, la halajá ordena PROTOCOLOS ESPECIALES — encierro, ayuno, oración intensificada, invocaciones particulares. Esto no es solo medida sanitaria — es respuesta a una alteración cosmológica.\n\n  2. La distancia entre el durmiente y la muerte ya no es de 8 saltos. La protección ritual ordinaria (los cuatro ángeles) puede no bastar — se necesita reforzar con prácticas adicionales.\n\n  3. La sensibilidad espiritual del judío debe aumentar — la negligencia que en tiempo normal es tolerable, en plaga es fatal.\n\nEsta enseñanza tiene resonancia particular en periodos de pandemia (ej. el COVID-19 de 2020). La tradición rabínica entiende que las plagas alteran la geometría del cosmos espiritual — no son meros eventos biológicos.\n\nNote la simetría: en magefá, el ángel de la muerte iguala la velocidad del ángel de la misericordia. La carrera es directa. Esto es por qué los judíos en plaga han practicado históricamente intensificación de la tefilá: cada oración cuenta el doble en el equilibrio invertido.'

    'doctrina': {

      hebreo: 'שֵׁינָה אֶחָד מִשִּׁשִּׁים בַּמָּוֶת',
      traduccion: '«El sueño es 1/60 de la muerte» (Berajot 57b)',
      explicacion: 'La sugyá entera sobre keriat shema al ha-mita está apoyada en una doctrina central del rabinismo: EL SUEÑO NO ES UN EVENTO NEUTRAL BIOLÓGICO. Es un espacio teológico real, con leyes y peligros propios.\n\nLa famosa cláusula de Berajot 57b — «el sueño es 1/60 de la muerte» — codifica esto. Cada noche, el judío experimenta una pequeña muerte. Pierde la conciencia, abandona el control del cuerpo, entra en estados de vulnerabilidad. La halajá responde con protocolos rituales precisos.\n\nLas tres componentes del protocolo nocturno:\n\n  1. TEXTUAL — el shema sobre la cama, Tehilim 91, las brachot de protección. Texto sagrado como escudo.\n\n  2. ESPACIAL — la invocación de los cuatro ángeles cardinales. El espacio físico de la cama se REORGANIZA como altar protegido.\n\n  3. PSICOLÓGICA — el cierre del día con perdón (selichá), reconciliación, intención específica para el sueño. El estado mental del durmiente importa.\n\nLa cosmología asociada es realista pero no naturalista:\n  · los ángeles son AGENTES funcionales con direcciones y velocidades\n  · los mazikin son PELIGROS reales que el shema neutraliza\n  · las distancias entre el Trono y el mundo son MENSURABLES en saltos\n  · las plagas REORGANIZAN esta geometría\n\nEsta visión del mundo es continua con la teología de los DIAGRAMAS ANTERIORES:\n  · #2 (vigilias) — la noche cósmica tiene estructura de turnos\n  · #4 (tres razones de la ruina) — los espacios tienen carga espiritual\n  · #5 (kinor de David) — los vientos cosmológicos golpean instrumentos sagrados\n\nEl mundo del rabinismo NO es un universo desencantado. Es un cosmos POBLADO de agentes, fuerzas, peligros y protecciones. La halajá es el manual técnico para navegarlo con seguridad.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.angeles-interactivo')
    : document.querySelector('.angeles-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#angeles-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.angeles-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="angeles-panel-header">' +
        '<p class="angeles-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="angeles-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="angeles-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="angeles-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.angeles-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.angeles-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="angeles-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
