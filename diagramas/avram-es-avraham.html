      explicacion: 'El tercer renombrado es estructuralmente DISTINTO de los dos primeros — y esa diferencia es el corazón de la sugyá.\n\nCon Avram y Sarai, el nombre viejo quedó ANULADO: la Torá nunca vuelve a usarlos después del cambio. Con Yaakov, en cambio, la Torá misma sigue alternando: a veces Israel, a veces Yaakov — incluso en el mismo versículo.\n\nLa fórmula que los jajamim acuñaron (y que la sugyá anterior ya usó como modelo para Egipto en la era mesiánica): לֹא שֶׁיֵּעָקֵר — no se ARRANCA el nombre de su lugar. Se RE-JERARQUIZA: Israel pasa a ser עִיקָּר (ikar, lo principal) y Yaakov queda טָפֵל (tafel, secundario) — subordinado pero LEGÍTIMO.\n\nEl nombre Israel registra la victoria («porque luchaste con lo divino y con los hombres, y pudiste»); el nombre Yaakov registra el origen (el que nació agarrando el talón). La identidad madura NO borra el punto de partida — lo conserva en segundo plano.\n\nEsta es la tercera categoría del espectro: no «prohibido volver» (Avraham), no «mandato privado» (Sara), sino COEXISTENCIA JERARQUIZADA. Tres renombrados, tres gramáticas distintas de la transformación.'

      explicacion: 'La sugyá convierte la teología en HALAJÁ: ¿qué pasa si alguien, hoy, llama «Avram» a Avraham?\n\nBar Kappara: transgrede un PRECEPTO POSITIVO (עֲשֵׂה). La fuente: ״וְהָיָה שִׁמְךָ אַבְרָהָם״ — «tu nombre SERÁ Avraham» (Bereshit 17:5). El futuro del versículo se lee como mandato permanente: su nombre DEBE ser Avraham, para siempre. Usar el nombre viejo es incumplir esa instrucción.\n\nR. Eliezer va más lejos: transgrede una PROHIBICIÓN (לָאו). La fuente: ״וְלֹא יִקָּרֵא עוֹד אֶת שִׁמְךָ אַבְרָם״ — «y NO se llamará más tu nombre Avram» (el mismo versículo, primera mitad). El «no se llamará» se lee como veto activo, no como mera predicción.\n\nLa dureza de la regla es notable: un solo versículo produce a la vez un aseh y un lav — y decir una palabra («Avram») viola potencialmente ambos. ¿Por qué tanta severidad con un nombre?\n\nPorque el nombre nuevo REGISTRA el pacto. Avraham fue renombrado en el momento exacto del brit milá y de la promesa de av hamon goyim. Volver al nombre viejo es, verbalmente, RETROCEDER el pacto — reducir al padre de todas las naciones a figura regional de Aram. La halajá protege la irreversibilidad de la expansión: hay transformaciones de las que NO se vuelve.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.avram-interactivo')
    : document.querySelector('.avram-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#avram-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.avram-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="avram-panel-header">' +
        '<p class="avram-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="avram-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="avram-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="avram-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.avram-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.avram-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="avram-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
