      explicacion: 'La segunda defensa, ahora DIURNA: el ministerio halájico real.\n\nLas mujeres del pueblo venían a David con consultas de pureza ritual: ¿es esta mancha de sangre niddah que la separa de su marido? ¿es de aborto? ¿de menstruación? ¿de qué clase?\n\nDavid no las despachaba a un escriba. Él MISMO examinaba las muestras, manchándose las manos en el proceso. Y emitía un veredicto: «pura para su marido» o «debe esperar».\n\nObsérvese la inversión simbólica: los demás reyes tienen MANOS LIMPIAS y vidas LLENAS de sangre (guerra, ejecución, venganza). David tiene MANOS MANCHADAS y vida llena de RESTAURACIÓN MARITAL — devolver a las mujeres a sus maridos por dictamen halájico.\n\nLa sangre en las manos del rey-chasid es sangre que UNE, no que separa.'

    'shafir-shilya': {

      hebreo: 'שָׁפִיר · שִׁלְיָה · דָּם',

      explicacion: 'David distinguía con precisión halájica entre tres categorías de productos uterinos:\n\n  • שָׁפִיר — el saco fetal (feto en estado muy temprano); ciertas formas implican tum\'á de niddah, otras de leda (parto).\n\n  • שִׁלְיָה — la placenta; tiene leyes propias de tum\'á del cuerpo materno.\n\n  • דָּם — la sangre uterina; categorías separadas según color y origen.\n\nCada categoría tenía consecuencias halájicas diferentes para el estado de la mujer (pura, impura, días de espera). Confundir una con otra significaba imponer cargas innecesarias o, al revés, permitir lo prohibido.\n\nEste es el contenido del «manos manchadas»: no es una metáfora — David realmente realizaba la examinación material de muestras. El rey trabajaba como un dayán de niddah.'
    },
    'anti-rey': {
      titulo: 'El anti-rey: la inversión de la realeza',
      hebreo: 'הֲפָכָה שֶׁל הַמַּלְכוּת',
      traduccion: 'La inversión de la realeza',
      explicacion: 'La doble defensa de David revela un patrón coherente: David es el ANTI-REY.\n\nSi la realeza pagana es:\n  · pompa nocturna · banquete · gloria pública\n  · descanso prolongado · sueño hasta tarde\n  · ministros que ejecutan · el rey nunca se ensucia\n\nLa realeza davídica es:\n  · Torah nocturna · estudio en soledad · invisible\n  · medianoche · vigilia\n  · examinación directa · sangre en las manos del rey\n\nNo es solo una diferencia de estilo — es una redefinición de la NATURALEZA del poder. Para David, ser rey es SERVIR, no exhibirse. Y precisamente por eso puede llamarse chasid sin contradicción.\n\nLa lectura talmúdica de Tehilim 86:2 se convierte así en una doctrina política: la realeza verdadera (la mesiánica, la davídica) es por definición chesed-servicio. El rey legítimo se manifiesta en lo invisible.'
    },
    'mefivoshet-pregunta': {
      titulo: 'David al maestro Mefivoshet',
      hebreo: 'מְפִיבֹשֶׁת רַבִּי — יָפֶה דַּנְתִּי? יָפֶה חִיַּיבְתִּי? יָפֶה זִכִּיתִי? יָפֶה טִמֵּאתִי? יָפֶה טִהַרְתִּי?',
      traduccion: '«Mefivoshet maestro mío: ¿juzgué bien? ¿condené bien? ¿absolví bien? ¿declaré impuro bien? ¿declaré puro bien?»',
      explicacion: 'La tercera capa de la defensa davídica: NO solo trabajaba en halajá — VERIFICABA cada dictamen con su maestro.\n\nEl detalle es asombroso: David — el rey ungido, el autor de Tehilim, el comandante en jefe — preguntaba a Mefivoshet después de cada decisión:\n\n  · ¿juzgué bien en este pleito civil?\n  · ¿condené correctamente a este reo?\n  · ¿absolví correctamente a este otro?\n  · ¿declaré impuro esto correctamente?\n  · ¿declaré puro esto correctamente?\n\nY la línea decisiva: וְלֹא בּוֹשְׁתִּי — «y no me avergoncé».\n\nEl rey de Israel se sometía a la corrección de un maestro sin que el orgullo intermediara. Si Mefivoshet decía «erraste», David revisaba.\n\nEsta es la marca más íntima del chasid davídico: NO la confianza en sí mismo (ningún rey la tiene mayor), sino la CAPACIDAD DE SER CORREGIDO.'

    'rylevi-nombre': {
      titulo: 'R. Yehoshua ben Levi: el origen del nombre Mefivoshet',

      traduccion: '«Su nombre no era Mefivoshet sino Ish-Boshet; ¿y por qué se le llamó Mefivoshet? — porque avergonzaba (mevayesh) la cara de David en halajá»',
      explicacion: 'R. Yehoshua ben Levi cierra la sugyá con una explicación etimológica del nombre del maestro:\n\n  · Su nombre real: אִישׁ־בֹּשֶׁת (Ish-Boshet — «hombre de vergüenza», un nombre con su propia historia)\n  · El apodo midráshico: מְפִיבֹשֶׁת = מֵפִי בֹשֶׁת («de su boca, vergüenza»)\n\nLa lectura disecciona el nombre como midrash: era llamado «Mefivoshet» PORQUE «מַבִּישׁ» (avergonzaba) a David «en halajá» — corregía sus dictámenes con tal precisión y autoridad que David tenía que reconocer públicamente su error.\n\nNote el detalle: el maestro era ALGUIEN QUE AVERGONZABA AL REY. No un cortesano, no un asesor diplomático — un crítico halájico despiadado.\n\nY el genio del retrato: David ELEGÍA voluntariamente como maestro a alguien capaz de avergonzarle. Esa elección es la prueba final de su título de chasid.'
    },
    'doctrina': {
      titulo: 'Doctrina meta: ¿qué es un chasid?',
      hebreo: 'הַחָסִיד — הַמִּתְבַּטֵּל לִפְנֵי הַהֲלָכָה',
      traduccion: 'El chasid es el que se anula ante la halajá',
      explicacion: 'La sugyá redefine el concepto de chasid a partir del retrato davídico.\n\nNo es:\n  · piedad romántica\n  · ascetismo extremo\n  · austeridad social\n\nEs una disposición CONCRETA con tres marcas:\n\n  1. MANCHARSE en el ministerio — entrar al detalle ritual real del pueblo (sangre, niddah, pureza). El chasid no delega lo «sucio».\n\n  2. SOMETERSE al maestro — admitir que la opinión propia, por más informada que sea, necesita revisión. El chasid no confía en su solo juicio.\n\n  3. NO AVERGONZARSE de la corrección — וְלֹא בּוֹשְׁתִּי. La marca decisiva: aceptar pública e íntimamente que se erró cuando se erró.\n\nEsta doctrina es exportable más allá del rey: cualquier persona que ejerce autoridad (rabino, juez, padre, médico) se convierte en chasid si se conduce con estas tres marcas.\n\nY hay una ironía bellísima en la conclusión: el chasid NO es el que no se equivoca. Es el que TIENE UN MEFIVOSHET — un crítico que le avergüenza en halajá, y al que NO despide.'
    }
  };

  var contenedor = document.currentScript
    ? document.currentScript.closest('.chasid-interactivo')
    : document.querySelector('.chasid-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#chasid-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.chasid-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="chasid-panel-header">' +
        '<p class="chasid-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="chasid-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="chasid-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="chasid-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.chasid-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.chasid-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="chasid-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
</script>
