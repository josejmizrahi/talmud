  var contenedor = document.currentScript

    : document.querySelector('.birkat-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#birkat-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.birkat-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="birkat-panel-header">' +
        '<p class="birkat-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="birkat-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="birkat-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="birkat-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.birkat-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.birkat-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="birkat-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
