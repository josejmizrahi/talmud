      hebreo: 'אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם עַל לְבָבֶךָ',

      explicacion: 'R. Akiva responde a R. Eliezer desde el texto mismo del shema: el versículo dice אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם עַל לְבָבֶךָ — «estas palabras que yo te ordeno hoy estarán SOBRE TU CORAZÓN». El corazón no aparece solo al principio: gobierna todas «estas palabras».\n\nConclusión: TODA LA PARASHÁ necesita kavaná. No hay tramo del primer párrafo que pueda recitarse sin el corazón puesto.\n\nY la sugyá registra el veredicto: Rabba bar bar Jana en nombre de R. Yojanan — la halajá sigue a R. Akiva. La lectura maximalista de la interioridad gana, al menos en esta versión de la tradición.'
    },
    'aja': {
      titulo: 'La otra versión · R. Aja en nombre de R. Yehuda',
      hebreo: 'כֵּיוָן שֶׁכִּוֵּון לִבּוֹ בְּפֶרֶק רִאשׁוֹן — יָצָא',
      traduccion: 'Si dirigió su corazón en el primer párrafo — cumplió',
      explicacion: 'La sugyá conserva una segunda versión del veredicto: la halajá es como R. Aja en nombre de R. Yehuda — KAVANÁ EN EL PRIMER PÁRRAFO BASTA. Quien dirigió su corazón en la primera parashá cumplió, aunque el resto de la lectura vaya sin corazón.\n\nLas dos versiones conviven en la página: una hace halajá a R. Akiva (toda la parashá), la otra fija el mínimo en el primer párrafo completo. En ambas, lo innegociable es lo mismo: el primer párrafo es el núcleo donde la interioridad no puede faltar.\n\nEsta gradación — un centro denso de exigencia y una periferia negociable — es la que Rav Zutra y R. Yoshiya van a convertir en arquitectura con sus dos escaleras invertidas.'
    },
    'zutra': {
      titulo: 'Rav Zutra · la escalera que baja hacia la voz',
      hebreo: 'עַד כָּאן מִצְוַת כַּוָּנָה · מִכָּאן וְאֵילָךְ מִצְוַת קְרִיאָה',
      traduccion: '«Hasta aquí, mitzvá de kavaná · de aquí en adelante, mitzvá de lectura»',
      explicacion: 'Rav Zutra parte el shema en dos mitades. En el PRIMER PÁRRAFO se exige todo: kavaná + kriá — el corazón y la voz deben coincidir. En el SEGUNDO PÁRRAFO baja un escalón: basta la kriá sin kavaná — la voz sola, la pronunciación correcta, aunque el corazón esté en otra parte.\n\nEl dibujo es una escalera descendente: el primer peldaño tiene dos capas (corazón sobre voz); el segundo conserva solo la capa de abajo — la VOZ.\n\nPara Rav Zutra, lo que la Torá sigue exigiendo hasta el final es el ACTO EXTERIOR: las palabras deben sonar. La interioridad es el lujo del núcleo; la disciplina de la boca acompaña hasta el final.'
    },
    'yoshiya': {
      titulo: 'R. Yoshiya · la escalera espejo, hacia el corazón',
      hebreo: 'עַד כָּאן מִצְוַת קְרִיאָה · מִכָּאן וְאֵילָךְ מִצְוַת כַּוָּנָה',
      traduccion: '«Hasta aquí, mitzvá de lectura · de aquí en adelante, mitzvá de kavaná»',
      explicacion: 'R. Yoshiya construye la escalera EXACTAMENTE INVERTIDA. En el PRIMER PÁRRAFO, igual que Rav Zutra: kriá + kavaná, la voz y el corazón juntos. Pero en el SEGUNDO PÁRRAFO conserva la otra mitad: kavaná sin kriá — el CORAZÓN solo, la meditación del contenido aunque la boca calle.\n\nLas dos escaleras comparten el mismo primer peldaño — el núcleo denso donde voz y corazón coinciden — y se separan en espejo: Zutra suelta el corazón y retiene la voz; Yoshiya suelta la voz y retiene el corazón.\n\nJuntas dibujan la tensión fundadora del perek (ver keva-y-kavaná): ¿qué es lo esencial de la mitzvá — el acto pronunciado o la intención vivida? El Talmud no la resuelve: la deja abierta, en dos escaleras que bajan en direcciones opuestas desde la misma cima.'
    }
  };

  var contenedor = document.currentScript
    ? document.currentScript.closest('.kavana-interactivo')
    : document.querySelector('.kavana-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#kavana-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.kavana-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="kavana-panel-header">' +
        '<p class="kavana-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="kavana-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="kavana-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="kavana-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.kavana-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.kavana-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="kavana-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
</script>
</div>
