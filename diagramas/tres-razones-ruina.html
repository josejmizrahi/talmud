  const panel = document.getElementById('ruina-panel');
  const nodos = document.querySelectorAll('.ruina-nodo');

  nodos.forEach(n => {
    n.addEventListener('click', () => {
      const id = n.getAttribute('data-id');
      const d = datos[id];
      if (!d) return;

      nodos.forEach(o => {
        o.classList.remove('activa', 'dim');
        if (o !== n) o.classList.add('dim');
      });
      n.classList.add('activa');

      panel.innerHTML = `
        <div class="ruina-panel-header">
          <h4 class="ruina-panel-titulo">${d.titulo}</h4>
          <div class="ruina-panel-hebreo">${d.hebreo}</div>
        </div>
        <p class="ruina-panel-traduccion">${d.traduccion}</p>
        <p class="ruina-panel-explicacion">${d.explicacion}</p>
      `;
    });
  });
})();
