  var contenedor = document.currentScript
    ? document.currentScript.closest('.zmansh-interactivo')
    : document.querySelector('.zmansh-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#zmansh-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.zmansh-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="zmansh-panel-header">' +
        '<p class="zmansh-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="zmansh-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="zmansh-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="zmansh-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.zmansh-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.zmansh-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="zmansh-vacio">↑ Click en cualquier umbral de la línea de luz para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
