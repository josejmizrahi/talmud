  var contenedor = document.currentScript
    ? document.currentScript.closest('.saludos-interactivo')
    : document.querySelector('.saludos-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#saludos-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.saludos-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="saludos-panel-header">' +
        '<p class="saludos-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="saludos-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="saludos-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="saludos-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.saludos-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.saludos-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="saludos-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
