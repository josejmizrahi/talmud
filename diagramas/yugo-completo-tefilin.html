      explicacion: 'El veredicto de Ula es de una dureza quirúrgica. El shema NO es solo una plegaria — es una DECLARACIÓN, un testimonio. Y dentro del texto que la boca recita está la frase: וּקְשַׁרְתָּם לְאוֹת עַל יָדֶךָ — «y los atarás como señal sobre tu mano».\n\nAhora la escena: un hombre recita esa frase con el brazo DESNUDO. Su boca declara «los ato sobre mi mano» y su mano exhibe que no ató nada. El testigo se contradice a sí mismo EN EL ACTO de testificar. Eso es עֵדוּת שֶׁקֶר — testimonio falso.\n\nLa precisión de la frase בְּעַצְמוֹ («contra sí mismo») admite dos lecturas complementarias:\n\n  · SOBRE sí mismo: el contenido falso del testimonio es su propio cuerpo — declara atado lo que está suelto. El perjurio no es sobre un tercero sino sobre el propio brazo visible.\n\n  · CONTRA sí mismo: el testimonio falso lo perjudica a él. Nadie más resulta dañado; el que pierde es el declarante, cuya aceptación del yugo queda desmentida por su propia piel.\n\nLa lógica profunda conecta con toda la sugyá: el shema es la aceptación del עוֹל מַלְכוּת שָׁמַיִם, y una aceptación es un acto PERFORMATIVO — no basta decirla, hay que ejecutarla. Los tefilín son la ejecución física de la frase que la boca pronuncia. Sin ellos, la declaración queda en enunciado sin cuerpo: técnicamente recitada, existencialmente desmentida.\n\nNótese lo que Ula NO dice: no dice que el shema sin tefilín sea inválido ni que haya que repetirlo. El testimonio falso es una categoría MORAL, no una invalidación halájica. El shema cumple; el testigo queda en evidencia.'
    },
    'korban-mutilado': {
      titulo: 'R. Jiya bar Aba · como olá sin minjá, zevaj sin nesajim',
      hebreo: 'כְּאִילּוּ הִקְרִיב עוֹלָה בְּלֹא מִנְחָה וְזֶבַח בְּלֹא נְסָכִים',
      traduccion: '«Como si ofreciera una olá sin su minjá y un zevaj sin sus nesajim» — R. Jiya bar Aba beshem R. Yojanan',
      explicacion: 'R. Jiya bar Aba, en nombre de R. Yojanan, da el segundo veredicto sobre el que lee el shema sin tefilín — y el registro cambia por completo. Donde Ula usó el lenguaje del TRIBUNAL (testimonio, perjurio), R. Yojanan usa el lenguaje del TEMPLO.\n\nLa olá (ofrenda de ascensión) venía acompañada de su minjá — la oblación de harina y aceite que la Torá le asigna. El zevaj (sacrificio animal) venía con sus nesajim — las libaciones de vino. Un korban ofrecido sin sus acompañamientos es un korban REAL pero MUTILADO: sube al mizbeaj, cumple, pero le falta la mitad que la Torá le diseñó.\n\nEsa es exactamente la anatomía del shema sin tefilín:\n\n  · NO es nulo — como la olá sin minjá no es nula. El shema recitado cumple la mitzvá de recitarlo.\n  · PERO está incompleto — le falta el acompañamiento corporal que su propio texto exige.\n  · Y la falta NO es accesoria: minjá y nesajim no son adorno del korban, son parte de su definición completa. Los tefilín no son adorno del shema — son su mitad ejecutada.\n\nLa elección de la metáfora prepara el nodo central: si el shema mutilado es un KORBAN defectuoso, entonces el shema completo — con sus cinco pasos — es un korban ENTERO. R. Yojanan está construyendo el vocabulario sacrificial que culminará en «como si construyera un mizbeaj y ofrendara sobre él» (Tehilim 26:6).\n\nLos dos veredictos — el forense de Ula y el litúrgico de R. Yojanan — dicen lo mismo con imágenes distintas: la omisión del tefilín no anula el acto, lo DESFIGURA. La mitzvá a medias no es media mitzvá — es una mitzvá entera con una herida visible.'
    },
    'secuencia': {
      titulo: 'La secuencia de 5 pasos · la maljut shamayim shlemá',
      hebreo: 'יִפָּנֶה, וְיִטּוֹל יָדָיו, וְיַנִּיחַ תְּפִילִּין, וְיִקְרָא קְרִיאַת שְׁמַע, וְיִתְפַּלֵּל — וְזוֹ הִיא מַלְכוּת שָׁמַיִם שְׁלֵמָה',
      traduccion: '«Que evacúe, se lave las manos, se ponga tefilín, lea el shema y rece — y esa es la maljut shamayim COMPLETA»',
      explicacion: 'El nodo central de la sugyá. R. Yojanan responde la pregunta que toda la discusión venía preparando: ¿qué hace falta para que la aceptación del Reino sea ENTERA — שְׁלֵמָה?\n\nLa respuesta es una COREOGRAFÍA de cinco pasos:\n\n  1 · יִפָּנֶה — evacuar: el cuerpo limpio por dentro\n  2 · וְיִטּוֹל יָדָיו — lavarse las manos: limpio por fuera\n  3 · וְיַנִּיחַ תְּפִילִּין — atarse los tefilín: el cuerpo marcado con la señal\n  4 · וְיִקְרָא קְרִיאַת שְׁמַע — leer el shema: la boca declara lo que el brazo ya cumple\n  5 · וְיִתְפַּלֵּל — rezar: la tefilá corona la secuencia\n\nEl orden NO es intercambiable — cada paso habilita al siguiente. La preparación corporal (1-2) precede a la señal (3); la señal precede a la declaración (4), para que no haya testimonio falso (ver Ula); y la declaración precede a la petición (5): primero se acepta al Rey, después se le pide.\n\nY EL PREMIO (R. Jiya bar Aba beshem R. Yojanan): la Escritura se lo cuenta כְּאִילּוּ בָּנָה מִזְבֵּחַ וְהִקְרִיב עָלָיו קָרְבָּן — «como si construyera un mizbeaj y ofrendara sobre él un korban». La fuente es Tehilim 26:6: אֶרְחַץ בְּנִקָּיוֹן כַּפָּי וַאֲסוֹבְבָה אֶת מִזְבַּחֲךָ ה׳ — «lavaré en pureza mis manos y RODEARÉ TU MIZBEAJ». David une en un solo versículo el lavado de manos y el altar: el que se lava para el servicio YA está circulando alrededor del mizbeaj.\n\nRava sube la apuesta con una lectura de precisión gramatical: el versículo dice אֶרְחַץ — «me lavaré» (el verbo sin objeto, sobre todo el cuerpo) — y no אַרְחִיץ כַּפָּי, «lavaré mis manos». Entonces el que completa la secuencia es como si SE SUMERGIERA ENTERO — no netilat yadayim sino tevilá total. La mañana bien ordenada no limpia una parte: transforma el estado del cuerpo completo.\n\nDicho por amoraim SIN Templo, el premio es también una respuesta a la destrucción: ¿dónde se construye hoy un mizbeaj? En la secuencia de la mañana. Cada judío que evacúa, se lava, se ata los tefilín, declara y reza — construye el altar y ofrenda sobre él. La liturgia doméstica y corporal sustituye al servicio interrumpido.'
    },
    'sin-agua': {
      titulo: 'Sin agua · tierra, piedra, astilla — y la maldición de Rav Jisda',
      hebreo: 'מְקַנֵּחַ יָדָיו בְּעָפָר וּבִצְרוֹר וּבְקִסְמִית',
      traduccion: '«Limpia sus manos con tierra, con piedra o con astilla»',
      explicacion: 'Si el paso 2 de la secuencia — lavarse las manos — exige agua, ¿qué pasa cuando NO la hay? Ravina trae la enseñanza de Occidente (Eretz Israel): מְקַנֵּחַ יָדָיו בְּעָפָר וּבִצְרוֹר וּבְקִסְמִית — se limpia las manos con TIERRA, con PIEDRA o con ASTILLA.\n\nRava la aprueba con la misma lupa gramatical que usó sobre אֶרְחַץ: el versículo ¿acaso dice «me lavaré CON AGUA»? Dice בְּנִקָּיוֹן — «en LIMPIEZA». El criterio del pasuk no es la sustancia sino el RESULTADO: בְּכָל מִידֵּי דִּמְנַקֵּי — con todo lo que limpie. El agua es el medio habitual, no la esencia del requisito. La tierra que friega, la piedra que raspa, la astilla que rasca — todas cumplen נִקָּיוֹן.\n\nLa flexibilidad tiene una consecuencia halájica afilada, y Rav Jisda la defiende con violencia verbal: MALDECÍA (לייט) a quien retrasaba la tefilá dando vueltas en busca de agua. Si la limpieza se logra con lo que hay a mano, salir a buscar agua es un lujo — y el lujo que hace pasar el zman es un pecado disfrazado de piedad.\n\nLa guemará calibra la balanza con precisión geográfica:\n\n  · PARA EL SHEMA: no se sale a buscar agua en absoluto. El zman del shema es corto y fijo; se limpia con tierra, piedra o astilla y se recita a tiempo.\n\n  · PARA LA TEFILÁ: hay más margen — se busca agua hasta una PARSÁ hacia adelante (en la dirección del camino) y un MIL hacia atrás (desandar). Más allá de esas medidas, tampoco: se limpia con lo que haya y se reza.\n\nLa asimetría (cuatro milin adelante, uno atrás) es de sentido práctico: avanzar hacia el agua es seguir viaje; retroceder es perder camino dos veces.\n\nEl cierre conceptual de la sugyá está en esta jerarquía: la PUREZA es criterio real — por eso el paso 2 existe y por eso se admiten sustitutos. Pero la PUNTUALIDAD pesa más — por eso Rav Jisda maldice al buscador de agua. El mizbeaj de la mañana (ver el nodo dorado) no exige materiales perfectos: exige llegar a tiempo con lo que limpia. בְּנִקָּיוֹן — la limpieza es una función, no una sustancia.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.yugo-interactivo')
    : document.querySelector('.yugo-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#yugo-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.yugo-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="yugo-panel-header">' +
        '<p class="yugo-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="yugo-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="yugo-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="yugo-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.yugo-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.yugo-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="yugo-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
