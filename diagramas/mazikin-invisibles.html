      traduccion: '«Si se diera al ojo permiso de ver — ninguna criatura podría mantenerse en pie ante los mazikin»',
      explicacion: 'La tercera enseñanza de Aba Binyamin en este perek (después de las dos preocupaciones del diagrama #16) es una de las declaraciones más vívidas del Talmud sobre la COSMOLOGÍA POBLADA.\n\nLa premisa es radical: el espacio que nos rodea NO está vacío. Está LLENO de seres que normalmente no vemos — los mazikin (fuerzas destructivas, demonios). Y la única razón por la que podemos seguir viviendo es que NO los vemos.\n\nLa frase clave es אִילָּמָלֵא נִיתְּנָה רְשׁוּת — «si se diera permiso». La invisibilidad NO es una característica intrínseca de los mazikin. Es una RESTRICCIÓN ACTIVA impuesta sobre el ojo humano. HKBH le quita al ojo la capacidad de ver lo que está ahí.\n\n¿Por qué? Porque si lo viéramos:\n\n  · אֵין כָּל בִּרְיָה יְכוֹלָה לַעֲמוֹד — «ninguna criatura podría mantenerse en pie»\n  · El espectáculo sería de tal horror que el cuerpo se paralizaría\n  · El miedo por sí solo sería incapacitante\n  · La vida cotidiana sería imposible\n\nLa lección teológica es invertida pero profunda: LA INVISIBILIDAD ES MISERICORDIA. HKBH «cierra el ojo» humano como ACTO DE PROTECCIÓN. Lo que parece carencia (no ver) es regalo (no morir de pánico).\n\nEsto reorienta toda la fenomenología cotidiana: el mundo que vemos NO es el mundo total. Es solo la fracción que HKBH nos permite ver para sobrevivir. La realidad excede infinitamente nuestra percepción.\n\nY explícitamente la declaración prepara el censo que sigue — Abaye y Rav Huna van a CUANTIFICAR cuántos mazikin hay. Pero antes hay que aceptar el principio fundamental: están AHÍ, aunque no los veamos.'

    'abaye-cresta': {

      hebreo: 'אִינְהוּ נְפִישֵׁי מִינַּן · וְקָיְימִי עֲלַן כִּי כִּסְלָא לְאוּגְיָא',
      traduccion: '«Son más numerosos que nosotros · y están sobre nosotros como cresta sobre el surco»',
      explicacion: 'Abaye ofrece una imagen agrícola precisa para describir la disposición de los mazikin: כִּסְלָא לְאוּגְיָא — «cresta sobre el surco».\n\nLa metáfora viene del campo arado: cuando se hace un surco para sembrar, la tierra extraída se acumula a los lados, formando una CRESTA (כִּסְלָא). El surco propiamente es el espacio bajo; la cresta es la pared elevada que lo rodea.\n\nAplicado a nosotros: NOSOTROS somos el surco. Los mazikin son la cresta que nos rodea por todos lados. Estamos en el ESPACIO INTERIOR de un cerco hecho de seres invisibles.\n\nDos lecciones de la metáfora:\n\n  1. ESTAMOS RODEADOS, NO PENETRADOS. Como el surco está bajo la cresta sin que la cresta entre en él, los mazikin están ALREDEDOR de nosotros sin (normalmente) entrar. Hay una membrana invisible que los mantiene fuera.\n\n  2. SON ESTRUCTURALES, NO ESPORÁDICOS. La cresta NO es accidente — es el RESULTADO ESTRUCTURAL de cómo se hizo el surco. De la misma manera, los mazikin NO son ocasionales — son parte de la geometría cosmológica permanente. Donde hay un ser humano, hay mazikin rodeándolo, automáticamente.\n\nLa primera frase — אִינְהוּ נְפִישֵׁי מִינַּן («son más numerosos que nosotros») — establece la PROPORCIÓN inquietante. NO somos la mayoría del cosmos. Somos minoría dentro de un mundo poblado por agentes que nos exceden numéricamente.\n\nEsta es una corrección teológica al antropocentrismo ingenuo. El judaísmo rabínico NO supone que el ser humano sea el centro numérico del cosmos. Compartimos el espacio con vastas multitudes de seres invisibles. Nuestro estatus especial NO viene del número sino de la imagen divina y la mitzvá.\n\nLa imagen del surco también tiene resonancia con la vulnerabilidad: el surco es BAJO, EXPUESTO, el lugar donde la semilla está más vulnerable. El surco depende de la PROTECCIÓN de las crestas circundantes para no ser pisado, lavado por la lluvia, etc. Nosotros, en el sentido cosmológico, dependemos de la BARRERA INVISIBLE (mezuzá, tefilín, mitzvot) que mantiene a los mazikin como crestas — alrededor, no encima.'

    'rav-huna-cifra': {
      titulo: 'Rav Huna · la cifra exacta · Tehilim 91:7',
      hebreo: 'אַלְפָא מִשְּׂמָאלֵיהּ · וּרְבָבָה מִימִינֵיהּ',
      traduccion: '«Mil a su izquierda · diez mil a su derecha»',
      explicacion: 'Rav Huna sube la apuesta: NO solo «son más numerosos» — son EXACTAMENTE 1.000 a la izquierda y 10.000 a la derecha de cada persona.\n\nLa cifra parece especulativa hasta que se ve su FUENTE: Tehilim 91:7. El versículo del Salterio dice:\n\n  «יִפֹּל מִצִּדְּךָ אֶלֶף · וּרְבָבָה מִימִינֶךָ · אֵלֶיךָ לֹא יִגָּשׁ»\n  «Caerán mil a tu lado · diez mil a tu derecha · A TI NO SE ACERCAN»\n\nEl versículo originalmente se lee como una promesa de protección contra ENEMIGOS (humanos o militares). Rav Huna lo relee como descripción del CERCO INVISIBLE de mazikin que rodea al protegido.\n\nLas cifras del versículo se vuelven literales: hay UN NÚMERO PRECISO de mazikin por persona — mil a un lado, diez mil al otro. La asimetría (10:1) es notable. ¿Por qué más a la derecha?\n\nDos explicaciones tradicionales:\n  · La derecha es el lado del PODER y la acción — donde uno actúa, más peligro\n  · La derecha simboliza la jésed (bondad) que atrae más oposición espiritual\n  · O simplemente: el versículo lo dice así\n\nPero la frase decisiva del versículo es la última: אֵלֶיךָ לֹא יִגָּשׁ — «A TI NO SE ACERCAN». Esta es la promesa de PROTECCIÓN. Los mazikin existen en cifras enormes alrededor del justo, pero NO LO TOCAN. La barrera invisible los mantiene en sus posiciones.\n\nLa lectura combinada de Tehilim 91 con la enseñanza de Aba Binyamin produce una cosmología vívida:\n  · existen 11.000 mazikin por persona\n  · están distribuidos asimétricamente (1.000 izq + 10.000 der)\n  · rodean al hombre como un ejército\n  · pero al protegido NO se acercan\n\nEsta es la fuente de la práctica tradicional de recitar Tehilim 91 antes de dormir y en momentos de peligro — el versículo INVOCA la protección que describe. Recitar es activar el cerco protector que mantiene a los 11.000 en sus posiciones.\n\nLa precisión numérica también tiene una función pedagógica: convierte la afirmación general («hay muchos») en imagen contable. Cada vez que el judío camina, puede imaginar 11.000 ojos invisibles rodeándolo. La concretización transforma una doctrina abstracta en disposición espiritual cotidiana.'

    'visualizacion-hombre': {
      titulo: 'El hombre en medio del cerco · «a ti no se acerca»',
      hebreo: 'אֵלֶיךָ לֹא יִגָּשׁ',

      explicacion: 'La visualización central del diagrama representa la cosmología completa: el hombre en el CENTRO, los 1.000 mazikin a la izquierda, los 10.000 a la derecha. El círculo dorado del hombre contiene el versículo de protección.\n\nLa estructura visual codifica varias verdades simultáneas:\n\n  1. AISLAMIENTO PROTEGIDO — el hombre está en el centro, separado por espacio del cerco circundante. NO está mezclado con los mazikin; está EN MEDIO de ellos pero NO los toca.\n\n  2. ASIMETRÍA — la derecha tiene 10x más que la izquierda. La visualización refleja esta proporción para que el ojo capture la disproporción.\n\n  3. CONEXIONES VISIBLES — las líneas punteadas desde los grupos al hombre representan la VECINDAD CONSTANTE. Los mazikin están en RELACIÓN espacial activa con el hombre, no lejanos. La punteadura indica que el contacto está SUSPENDIDO (no roto).\n\n  4. EL VERSO COMO ESCUDO — el texto «אֵלֶיךָ לֹא יִגָּשׁ» dentro del círculo del hombre representa que la protección OPERA desde el interior. Es el verso recitado/internalizado el que mantiene la distancia.\n\n  5. FONDO PUNTEADO — el patrón de pequeños puntos rojos en el fondo del recuadro representa la TEXTURA INVISIBLE del aire poblado. Aunque no se ven mazikin individuales, el «aire» mismo tiene una textura distinta de la vacuidad — está cargado de presencia espiritual.\n\nEsta visualización integra las enseñanzas de Aba Binyamin (existen pero no se ven), Abaye (rodean como cresta sobre surco) y Rav Huna (con números precisos del versículo). Es la condición cotidiana del judío observante: caminar en medio de un cerco invisible, protegido por las palabras del Salterio internalizadas.\n\nLa práctica derivada: cada vez que se recita Tehilim 91 (en el shema sobre la cama, en situaciones de peligro, en oraciones funerarias), se INVOCA esta cosmología. El recitante activa la promesa: existen multitudes invisibles, pero a mí no se me acercan.\n\nLa frase «אֵלֶיךָ לֹא יִגָּשׁ» es PERSONAL (tú singular). NO es general. La protección es individual, otorgada al que confía y recita. El cerco se mantiene mientras la conexión con HKBH se mantiene.'

    'cuatro-sintomas': {
      titulo: 'Los cuatro síntomas · Rava diagnostica',
      hebreo: 'אַרְבָּעָה סִימָנִים',
      traduccion: 'Cuatro síntomas',
      explicacion: 'Rava aterriza la doctrina abstracta en EXPERIENCIA COTIDIANA. Ofrece una fenomenología clínica: cuatro situaciones que la gente atribuye a causas mundanas, pero que en realidad son CONTACTO con los mazikin invisibles.\n\nSÍNTOMA 1 · חֲבִיטָה דִּצְלוֹתָא — «el empujón del rezo»\n  El contexto: durante la amidá comunitaria en la sinagoga, los fieles están parados próximos unos a otros. A menudo uno siente un EMPUJÓN o codazo que asume del vecino. Pero el vecino jura no haberse movido.\n  Diagnóstico: NO fue el vecino. Fueron los mazikin atravesando el espacio durante el rezo.\n  Implicación: la sinagoga durante la amidá es un lugar de FRICCIÓN ESPIRITUAL — los mazikin se concentran donde hay actividad sagrada. El empujón inexplicable es síntoma.\n\nSÍNTOMA 2 · כָּרְעֵי דְרַבָּנַן דְּשָׁלְפֵי — «rodillas de rabinos que se debilitan»\n  Los grandes maestros experimentan fatiga inexplicable en las rodillas — más allá de lo que justifica la edad o el ejercicio.\n  Diagnóstico: la fricción CONTINUA con los mazikin desgasta las articulaciones. Los rabinos, dedicados al estudio y la oración, atraen MÁS contacto espiritual — y por tanto MÁS desgaste físico.\n  Implicación: la grandeza espiritual tiene un PRECIO físico discreto. Los cuerpos de los justos llevan las cicatrices invisibles de su servicio.\n\nSÍNTOMA 3 · לְבוּשַׁיְיהוּ דְּרַבָּנַן דְּבָלוּ — «ropas de rabinos que se gastan»\n  La vestimenta de los maestros se desgasta inexplicablemente. NO por uso excesivo, NO por baja calidad — simplemente «se pudre».\n  Diagnóstico: el ROCE CONSTANTE con los mazikin va deshaciendo la tela. Cada vez que un maestro camina entre el cerco invisible, su ropa absorbe la fricción.\n  Implicación: el desgaste material tiene causas espirituales tanto como físicas. La economía doméstica de un rabino refleja su realidad cosmológica.\n\nSÍNTOMA 4 · כָּרְעֵי דְאִינָשֵׁי דִּמְנַקְפָן — «rodillas de gente común golpeadas»\n  La gente común también sufre golpes en las rodillas — chocan con muebles, tropiezan, se lastiman en formas que parecen accidentales.\n  Diagnóstico: NO son accidentes. Son COLISIONES con mazikin invisibles. El cuerpo humano se mueve por un espacio poblado, y a veces el cálculo del paso falla porque hay algo invisible donde se asumía vacío.\n  Implicación: la VULNERABILIDAD cotidiana es mayor de la que parece. Los pequeños accidentes domésticos tienen una dimensión cosmológica.\n\nLA LECCIÓN GENERAL del diagnóstico de Rava:\n\nLa REALIDAD COTIDIANA está saturada de signos del mundo invisible. La fatiga, los golpes, los empujones, el desgaste — todo lo que parece banal accidente — es en realidad TRAZA de un cosmos poblado. La sensibilidad espiritual del rabino consiste en saber leer estos signos. Donde otros ven coincidencia, el sabio ve la geometría invisible.\n\nEsto NO produce paranoia (el mundo no es hostil), sino HUMILDAD cosmológica (no eres el único actor en el espacio). La diferencia es crucial. La doctrina de los mazikin invisibles no pretende aterrorizar — pretende re-encantar el mundo cotidiano, devolverle su densidad espiritual.'
    },
    'ceniza': {

      hebreo: 'קִיטְמָא נְהִילָא · כִּי כַרְעֵי דְתַרְנְגוֹלָא',
      traduccion: 'Ceniza fina · como patas de gallo',
      explicacion: 'La sugyá ofrece un EXPERIMENTO empírico para los escépticos. Si quieres VERIFICAR que existen los mazikin, sigue este protocolo:\n\n  PASO 1 — קִיטְמָא נְהִילָא: traer CENIZA FINA (la palabra נְהִילָא indica «cernida», muy fina, como talco). La textura es importante: debe ser capaz de captar huellas delicadas.\n\n  PASO 2 — נֶהְדַּר אַפּוּרְיֵיהּ: esparcirla AROUND THE BED (la palabra אַפּוּרְיֵיהּ significa «alrededor de su cama»). Antes de dormir, hacer un anillo de ceniza alrededor del mueble.\n\n  PASO 3 — בְּצַפְרָא חָזֵי: AL DESPERTAR, observar. En la ceniza habrá huellas.\n\n  PASO 4 — כִּי כַרְעֵי דְתַרְנְגוֹלָא: las huellas tienen forma DE PATAS DE GALLO — tres dedos delgados separados.\n\nLa propuesta es brillantemente EMPÍRICA. NO es magia, NO es revelación. Es un EXPERIMENTO REPRODUCIBLE: si hago X, observo Y. La presencia invisible deja TRAZAS MATERIALES en la ceniza.\n\n¿Por qué patas de gallo? Algunas tradiciones sugieren que los mazikin tienen forma parcialmente animal. Otras dicen que es solo la descripción de los rastros que se ven empíricamente. Sea como sea, la ESPECIFICIDAD del detalle («patas de gallo, no de gato, no de ratón») sugiere que esta práctica era REALMENTE realizada por algunos sabios.\n\nLa lógica epistemológica:\n\n  · Lo invisible NO es lo imposible de detectar\n  · La invisibilidad opera contra el ojo, no contra otros medios\n  · La ceniza es un MEDIO INDIRECTO de visualización\n  · El método transforma una presencia invisible (mazikin) en evidencia visible (huellas en ceniza)\n\nEsta es una temprana experiencia con detección INDIRECTA — el principio que después fundamentará la ciencia experimental: lo que no se ve directamente puede REGISTRARSE si se elige el medio adecuado.\n\nLa lección teológica: la fe NO requiere ceguera. La doctrina de los mazikin invisibles puede VERIFICARSE empíricamente por quien quiera. El judaísmo no exige credulidad — ofrece evidencias proporcionalmente accesibles.\n\nNo se especifica si todos los sabios realizaban este experimento o si era patrimonio de unos pocos. Pero el hecho de que la halajá lo PROVEA — un protocolo paso-a-paso — sugiere que se consideraba un recurso disponible para los curiosos.\n\nEl experimento NO se ha estandarizado en la práctica rabínica posterior. Probablemente porque la halajá considera SUFICIENTE la fe en la doctrina sin requerir verificación. Pero la opción está ahí, en el corpus, para quien la necesite.'

    'receta-gato': {
      titulo: 'La receta para verlos directamente · con advertencia',
      hebreo: 'שִׁילְיְיתָא דְּשׁוּנְּרָא אוּכַמְתָּא',
      traduccion: 'Placenta de gata negra',
      explicacion: 'Para los aún MÁS audaces, la sugyá ofrece un protocolo de visión DIRECTA — no por huellas indirectas, sino por contacto perceptual real. Pero la receta es alquímica, compleja, y la guemará advierte explícitamente del PELIGRO de realizarla.\n\nLA RECETA:\n\n  · Conseguir una placenta de gata\n  · La gata debe ser NEGRA\n  · La gata debe ser HIJA DE NEGRA (negra de raza, no manchada)\n  · La gata debe ser PRIMOGÉNITA\n  · La gata debe ser HIJA DE PRIMOGÉNITA (también primogénita su madre)\n\nLas cinco condiciones encadenadas (placenta + negra + hija de negra + primogénita + hija de primogénita) hacen que el material sea EXTREMADAMENTE RARO. Encontrar una gata que cumpla los cuatro requisitos genealógicos es prácticamente imposible. Y solo se puede usar SU PLACENTA — un material que aparece solo en el parto.\n\nUna vez conseguido el material:\n  · Quemarlo en el fuego (לִיקְלְיֵהּ בְּנוּרָא)\n  · Molerlo hasta polvo fino (לִישְׁחֲקֵיהּ)\n  · Llenar los ojos con ese polvo (לִימְלֵי עֵינֵיהּ מִינֵּיהּ)\n  · ENTONCES — y solo entonces — se ven los mazikin\n\n¿Por qué tan complicado? Probablemente porque la dificultad es UN FILTRO. Solo quien REALMENTE quiere ver los mazikin invierte el esfuerzo. Y quien tiene la determinación de seguir este protocolo ya ha demostrado un cierto grado de preparación espiritual.\n\nLA ADVERTENCIA:\n\nLa guemará añade que el procedimiento es PELIGROSO. La visión de los mazikin puede causar daño físico o espiritual real al que la realiza. La declaración inicial de Aba Binyamin — «si vieras, no podrías estar de pie» — se aplica AQUÍ: el que abre los ojos a los mazikin sufre las consecuencias de quitar la misericordia de la invisibilidad.\n\nDos lecciones de la receta y su advertencia:\n\n  1. EL CONOCIMIENTO EXISTE PERO LA PRUDENCIA LO PROHÍBE. La halajá NO oculta la receta. Está ahí, en el texto canónico, para quien quiera leerla. Pero advierte. La sabiduría rabínica confía en la capacidad del estudiante para resistir la tentación. No se ofrece censura — se ofrece información con advertencia.\n\n  2. LA TRANSGRESIÓN DE LA MISERICORDIA TIENE COSTO. HKBH «cierra el ojo» para protegernos. Quien insiste en abrirlo va contra el diseño protector. El daño que sufre es CAUSAL — no es castigo divino, es consecuencia natural de haber quitado la barrera de misericordia.\n\nEn la práctica histórica, no hay registros amplios de sabios realizando esta receta. Aparece en el texto como REFERENCIA — una manera de decir «sí, es posible verlos» — pero no como manual práctico. La función del pasaje es teológica: confirmar la REALIDAD de los mazikin (no son metáfora) sin invitar a la experiencia directa.\n\nUn ejercicio interesante: la receta es estructuralmente similar a otras pociones mágicas de las tradiciones antiguas (gata negra, primogénita, placenta — todos motivos clásicos de la magia premoderna). El judaísmo rabínico RECONOCE el conocimiento mágico de su entorno pero lo desactiva con la advertencia: «existe pero no lo uses». Esto refleja una postura matizada — ni negación total del conocimiento esotérico, ni adopción sin filtro.'
    },
    'doctrina': {
      titulo: 'Doctrina meta · la invisibilidad como misericordia',
      hebreo: 'הָאִי־רְאוּת הוּא רַחֲמִים',
      traduccion: 'La no-vista es misericordia',
      explicacion: 'La sugyá entera enseña una doctrina coherente sobre la relación entre VISIÓN, REALIDAD y MISERICORDIA.\n\nTESIS CENTRAL: El mundo que vemos NO es el mundo total. Es la fracción FILTRADA que HKBH nos permite ver para que podamos vivir. La INVISIBILIDAD de lo demás es un don activo, no una limitación pasiva.\n\nLAS IMPLICACIONES TEOLÓGICAS:\n\n  1. EL ESPACIO NO ESTÁ VACÍO. La concepción moderna del «aire vacío» entre objetos es POBRE. En realidad, el aire está saturado de presencias espirituales — mazikin, ángeles, fuerzas, agentes. La densidad cosmológica del mundo rabínico es mucho mayor que la del mundo materialista.\n\n  2. SOMOS MINORÍA. Numéricamente, los seres humanos NO son la población principal del cosmos. 11.000 mazikin por persona — solo la cifra de mazikin EN UNA CATEGORÍA. Suma ángeles, otros tipos de seres espirituales, y el cosmos rabínico aparece poblado más allá de la imaginación.\n\n  3. LA PERCEPCIÓN ES PROTECTORA. NO ver no es defecto — es regalo. Si el ojo se abriera, la visión nos paralizaría. La halajá del «ojo cerrado» permite la actividad humana cotidiana. Cada vez que abrimos los ojos por la mañana sin colapsar de terror, estamos recibiendo un acto de misericordia divina.\n\n  4. LA REALIDAD ES DETECTABLE. Aunque invisible, lo espiritual NO es indetectable. La halajá ofrece protocolos (ceniza, recetas) para verificar la presencia. La fe NO compite con la evidencia — la fe REORDENA la evidencia.\n\n  5. EL JUSTO ESTÁ PROTEGIDO. La cosmología es VULNERABLE pero también ORDENADA. Los mazikin existen en cifras enormes, pero AL JUSTO NO LO TOCAN (Tehilim 91:7). La protección NO es por número (somos minoría) sino por ALIANZA (la promesa divina al pueblo de Israel).\n\nLAS PRÁCTICAS DERIVADAS:\n\n  · La mezuzá en la puerta — barrera contra mazikin que entran\n  · El tefilín — invocación de protección personal\n  · El shema sobre la cama (#12) — protección nocturna\n  · La recitación de Tehilim 91 — invocación de la promesa de 91:7\n  · La invocación de los cuatro ángeles cardinales (#12) — cerco angélico positivo\n  · La halajá de no entrar en ruina solo (#4) — evitación de concentraciones de mazikin\n\nTodas estas prácticas operan dentro del marco cosmológico de los mazikin invisibles. SON las herramientas para navegar el cosmos poblado.\n\nCONEXIÓN CON LA MODERNIDAD:\n\nUna pregunta natural: ¿cómo se relaciona esta cosmología con la ciencia moderna? Tres posibles respuestas:\n\n  1. LITERALISTA: los mazikin existen literalmente como entidades empíricas, simplemente la ciencia aún no los ha detectado.\n\n  2. SIMBÓLICA: los mazikin son representación rabínica de las FUERZAS DE DESORDEN (entropía, vulnerabilidad, accidente, enfermedad) que operan en el mundo. El lenguaje es figurado, pero el referente es real.\n\n  3. FENOMENOLÓGICA: lo importante no es la METAFÍSICA de los mazikin sino la EXPERIENCIA que producen — la conciencia de vulnerabilidad cotidiana, la necesidad de protección ritual, la humildad cósmica.\n\nLas tres interpretaciones son legítimas dentro del judaísmo contemporáneo. El texto de Berajot 6a opera en cualquiera de ellas: como descripción literal del cosmos, como simbolismo del riesgo, o como herramienta fenomenológica de cultivo espiritual.\n\nLo que la doctrina NO permite es la negación TOTAL — la pretensión moderna de que el mundo está vacío de espíritu. Para el rabinismo, el aire SIEMPRE tiene textura. El mundo SIEMPRE está poblado. La vida espiritual SIEMPRE opera contra un fondo de fuerzas invisibles. Esta densidad cosmológica es la atmósfera básica del judío observante.'
    }
  };

  var contenedor = document.currentScript
    ? document.currentScript.closest('.mazinv-interactivo')
    : document.querySelector('.mazinv-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#mazinv-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.mazinv-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="mazinv-panel-header">' +
        '<p class="mazinv-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="mazinv-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="mazinv-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="mazinv-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.mazinv-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.mazinv-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="mazinv-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
</script>
</div>
