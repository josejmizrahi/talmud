      explicacion: 'La mishná más obrera del tratado saca el shema del beit midrash y lo sube a un andamio. Los אוּמָּנִין — artesanos, jornaleros — están donde el trabajo los pone: podando en la copa del árbol, colocando piedras en el נִדְבָּךְ (la hilera del muro en construcción). Y ahí mismo, a esa altura, recitan el shema.\n\nLa distinción es quirúrgica:\n\n  · SHEMA — se recita ARRIBA, donde el cuerpo está. El shema es aceptación del yugo del cielo: acompaña al trabajador a su altura, no exige postura, ni lugar, ni descenso. Beit Hillel ya había establecido que se lee «cada uno en su camino» (Devarim 6:7 — וּבְלֶכְתְּךָ בַדֶּרֶךְ).\n\n  · TEFILÁ — NO se reza arriba. La amidá es audiencia ante el Rey: exige los pies juntos, la mente asentada, el cuerpo entero disponible. Un hombre agarrado a una rama no puede estar «de pie ante HKBH». La tefilá lo BAJA al suelo.\n\nLa mishná mide la kavaná recién legislada en el perek contra el mundo real del trabajo. El resultado es un mapa de exigencias: el shema pide atención (posible arriba, pausando); la amidá pide PRESENCIA total (imposible trepado).\n\nEl detalle económico ya está implícito: los obreros trabajan en tiempo ajeno. Bajar del árbol para el shema costaría minutos del patrón; la halajá no lo exige. Para la tefilá sí — porque ahí no hay sustituto posible de la compostura.'

      traduccion: '«Porque su mente no está asentada sobre él»',
      explicacion: 'La Tosefta refina la regla de la tefilá arriba con criterio de INGENIERÍA:\n\n  · OLIVO E HIGUERA (זַיִת וּתְאֵנָה) — sus ramas son densas, gruesas, entrelazadas. El que está arriba está FIRME, como parado en un pequeño piso. Ahí la tefilá se permite incluso en lo alto: la estabilidad física habilita la estabilidad mental.\n\n  · LOS DEMÁS ÁRBOLES — ramas finas, el cuerpo ocupado en no caer. De esos hay que BAJAR para rezar. El criterio no es la altura en sí — es el MIEDO. Una mente que monitorea el equilibrio no puede estar delante del Rey.\n\n  · EL BAAL HABAYIT — baja SIEMPRE, de cualquier árbol, incluso del olivo. La razón es la frase clave: לְפִי שֶׁאֵין דַּעְתּוֹ מְיוּשֶּׁבֶת עָלָיו — «su mente no está asentada».\n\n¿Por qué el patrón es MÁS estricto que el obrero? La lógica es económica y psicológica a la vez:\n\n  1. El obrero trabaja en tiempo AJENO. La halajá le permite rezar arriba (en árbol firme) para no robarle minutos al patrón. La dispensa nace del contrato.\n\n  2. El patrón decide su PROPIO tiempo. No tiene la excusa del jornal — puede bajar sin robarle a nadie. Si no baja, es porque no quiere.\n\n  3. Y más profundo: el dueño está pensando en su hacienda, sus cuentas, su cosecha. Su mente está estructuralmente inquieta. El jornalero, paradójicamente, tiene la cabeza más libre: el árbol no es suyo.\n\nLa halajá lee la psicología de la propiedad: poseer distrae. El que no tiene nada que perder arriba del árbol reza mejor que el dueño del árbol.'

      explicacion: 'Rav Mari (hijo de la hija de Shmuel) le plantea a Rava la contradicción frontal:\n\n  · La BARAITA exige kavaná: הַסְכֵּת וּשְׁמַע יִשְׂרָאֵל — «atiende y escucha» (Devarim 27:9). El shema requiere atención real.\n  · La MISHNÁ deja recitar trepado a un árbol, en plena faena. ¿Qué kavaná puede haber colgado de una rama con el martillo en la mano?\n\nRava calla — y Rav Sheshet resuelve con dos palabras: בְּטֵלִין מִמְּלַאכְתָּן — los obreros recitan PAUSANDO el trabajo. La mishná nunca dijo que leen mientras martillan: leen ARRIBA (no bajan — eso el contrato no lo exige), pero DETIENEN las manos (eso la kavaná sí lo exige).\n\nLa objeción siguiente: ¿no dice Beit Hillel עוֹסְקִים בִּמְלַאכְתָּן וְקוֹרִין — «siguen en su trabajo y recitan»? ¿Trabajando Y leyendo a la vez?\n\nLa resolución final divide el shema en dos niveles — la misma escala de kavaná que el perek ya construyó:\n\n  · PRIMER PÁRRAFO (שְׁמַע) — exige pausa TOTAL. Ahí está קבלת עול מלכות שמים, la aceptación del yugo. Las manos se detienen. Según la halajá final, el mínimo absoluto de kavaná es el primer verso: seis palabras de quietud.\n\n  · SEGUNDO PÁRRAFO (וְהָיָה אִם שָׁמֹעַ) — ahí aplica Beit Hillel: se puede seguir trabajando mientras se recita. La boca dice, las manos hacen.\n\nLa escala de kavaná se traduce así a derecho laboral: seis palabras de pausa total le pertenecen al Cielo; después, el martillo puede volver. Ni el patrón pierde su jornada, ni HKBH pierde su verso.'

      explicacion: 'La técnica exacta de la abreviación:\n\nBirkat hamazón normal tiene tres berajot de origen (más la cuarta, rabínica posterior):\n\n  1. הַזָּן אֶת הַכֹּל — «el que alimenta a todos» (atribuida a Moshé)\n  2. בִּרְכַּת הָאָרֶץ — la berajá de la tierra (atribuida a Yehoshúa)\n  3. בּוֹנֵה יְרוּשָׁלָיִם — «el que construye Jerusalén» (atribuida a David y Shlomó)\n\nEl obrero dice la PRIMERA completa — el agradecimiento básico por el alimento no se toca. Después FUNDE la segunda y la tercera: dice la berajá de la tierra e INCLUYE dentro de ella la mención de Jerusalén, cerrando con una sola firma. Dos berajot → una.\n\nLa elegancia del mecanismo: no se ELIMINA contenido — se elimina ESTRUCTURA. Todos los temas obligatorios se mencionan (alimento, tierra, pacto, Torá, Jerusalén); lo que se ahorra es la arquitectura formal de aperturas y cierres. El agradecimiento queda íntegro en sustancia y comprimido en forma.\n\nHay aquí una ironía hermosa que el Talmud deja a la vista: el obrero que está construyendo un muro (בְּרֹאשׁ הַנִּדְבָּךְ) abrevia justamente la berajá del que CONSTRUYE Jerusalén (בּוֹנֵה יְרוּשָׁלָיִם). El constructor de abajo comprime al Constructor de arriba — porque el andamio no espera.\n\nLa cuarta berajá (הַטּוֹב וְהַמֵּטִיב, rabínica) directamente no se dice: si el formato de la Torá se comprime por el trabajo, el agregado rabínico cede primero.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.obreros-interactivo')
    : document.querySelector('.obreros-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#obreros-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.obreros-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="obreros-panel-header">' +
        '<p class="obreros-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="obreros-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="obreros-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="obreros-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.obreros-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.obreros-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="obreros-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
