      explicacion: 'La guemará usa esta aritmética para sondear las opiniones: si la noche tiene cuatro vigilias de 3 horas cada una, la primera vigilia termina a las 3 horas; si tiene tres vigilias de 4 horas, termina a las 4 horas. Es la pregunta que pone a R. Eliezer en tensión consigo mismo cuando dice "hasta el fin de la primera vigilia" sin especificar horas.'
    },
    'rabbi-4': {
      titulo: 'Rabbi · última vigilia',
      hebreo: 'אַשְׁמוֹרֶת אַחֲרוֹנָה',

      explicacion: 'Las últimas tres horas de la noche según la cuenta de cuatro vigilias. R. Natan responde a Rabbi: el versículo de Gideón habla de la תיכונה sin más, no de "la intermedia de las intermedias" — bastaría con tres vigilias para tener una en el medio. La halajá no cierra el debate aquí; ambas posiciones quedan vivas en la tradición.'
    },
    'yose-1': {
      titulo: 'Pregunta 1 · ¿Por qué entraste?',
      hebreo: 'בְּנִי, מִפְּנֵי מָה נִכְנַסְתָּ לְחוּרְבָּה זוֹ?',
      traduccion: '"Hijo mío, ¿por qué entraste a esta ruina?"',
      explicacion: 'Eliyahu HaNavi montó guardia en la puerta mientras R. Yose oraba. Cuando terminó lo saludó "shalom alejá rabí" y le hizo la pregunta. R. Yose respondió: "para orar". Eliyahu replicó que debió rezar en el camino, y rezar una tefilá ketzará. R. Yose concluye: "en esa hora aprendí de él tres cosas — שֶׁאֵין נִכְנָסִין לְחוּרְבָּה · שֶׁמִּתְפַּלְּלִין בַּדֶּרֶךְ · שֶׁהַמִּתְפַּלֵּל בְּדֶרֶךְ מִתְפַּלֵּל תְּפִלָּה קְצָרָה". La baraita posterior da los tres peligros de la ruina: חֲשָׁד (sospecha de inmoralidad), מַפּוֹלֶת (derrumbe) y מַזִּיקִין (demonios).'

    'yose-2': {

      hebreo: 'בְּנִי, מָה קוֹל שָׁמַעְתָּ בְּחוּרְבָּה זוֹ?',

      traduccion: '"No solo en esta hora — sino cada día, tres veces dice así"',
      explicacion: 'Eliyahu cierra el círculo del daf: la voz de la paloma se oye tres veces al día, una por cada vigilia. Esto une la baraita de R. Yose con la enseñanza de R. Eliezer sobre las tres vigilias y el rugido del león. Y añade un consuelo: cuando Israel responde "יְהֵא שְׁמֵיהּ הַגָּדוֹל מְבֹורָךְ" en batei knesiot y batei midrashot, HaKadosh Baruch Hu mueve la cabeza y dice "אַשְׁרֵי הַמֶּלֶךְ שֶׁמְּקַלְּסִין אוֹתוֹ בְּבֵיתוֹ כָּךְ — מַה לּוֹ לָאָב שֶׁהִגְלָה אֶת בָּנָיו, וְאוֹי לָהֶם לַבָּנִים שֶׁגָּלוּ מֵעַל שׁוּלְחַן אֲבִיהֶם".'

  const panel = document.getElementById('vigilias-panel');
  const opciones = document.querySelectorAll('.vigilias-opinion');

  opciones.forEach(op => {
    op.addEventListener('click', () => {
      const id = op.getAttribute('data-id');
      const d = datos[id];
      if (!d) return;

      opciones.forEach(o => {
        o.classList.remove('activa', 'dim');
        if (o !== op) o.classList.add('dim');
      });
      op.classList.add('activa');

      panel.innerHTML = `
        <div class="vigilias-panel-header">
          <h4 class="vigilias-panel-titulo">${d.titulo}</h4>
          <div class="vigilias-panel-hebreo">${d.hebreo}</div>
        </div>
        <p class="vigilias-panel-traduccion">${d.traduccion}</p>
        <p class="vigilias-panel-explicacion">${d.explicacion}</p>
      `;
    });
  });
})();
</script>
</div>
