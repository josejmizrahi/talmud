      explicacion: 'R. Yojanan en nombre de R. Shimon bar Yojai lee el elogio de la Eshet Jayil (Mishlei 31:26) como palabras de Shlomó sobre SU PADRE DAVID.\n\n¿Por qué «su boca abrió con sabiduría» describe a David? Porque David hizo algo único: HABITÓ CINCO MUNDOS — cinco condiciones existenciales radicalmente distintas — y en CADA UNA dijo shirá.\n\nLa sabiduría de la boca de David no es elocuencia. Es la capacidad de encontrar, en cada estación de la existencia — incluso en el vientre antes de nacer, incluso en el día de morir — un motivo específico de alabanza.\n\nLos cinco «mundos» no son lugares: son ESTADOS. El vientre, el aire del mundo, el pecho materno, la visión de la justicia divina, la muerte. Cada uno tiene su propio בָּרְכִי נַפְשִׁי — su propio «bendice, alma mía» — anclado en Tehilim 103 y 104.\n\nLa estructura es una biografía espiritual completa: el midrash recorre la vida entera de un ser humano y muestra que NO HAY TRAMO SIN CANTO. La shirá no es un género para momentos altos: es la respuesta adecuada a la existencia como tal.'
    },

      traduccion: '«Bendice, alma mía, a Hashem — y todas mis entrañas a Su santo nombre» (Tehilim 103:1)',
      explicacion: 'El primer mundo es el más sorprendente: David dijo shirá EN EL VIENTRE de su madre, antes de nacer.\n\nLa prueba está en la letra del versículo: וְכָל קְרָבַי — «y todas mis ENTRAÑAS». La palabra קְרָבַי (kravai) significa literalmente los órganos internos, el interior del cuerpo. El midrash lee: David agradece CON las entrañas — y POR las entrañas — que lo formaron. La shirá del vientre agradece al lugar mismo donde fue tejido.\n\nEl feto habita un «mundo» completo: oscuro, acuático, cerrado — y sin embargo suficiente para la alabanza. Antes de haber visto nada, antes de haber recibido nada del mundo exterior, ya hay motivo de canto: el puro hecho de estar siendo FORMADO.\n\nEste primer mundo enlaza directamente con el midrash del Artista que sigue: HKBH צָר צוּרָה בְּתוֹךְ צוּרָה — forma una forma dentro de otra forma. El vientre es el taller del tzayar divino, y David canta desde adentro del taller.'

      explicacion: 'El segundo mundo: David NACE, sale al aire del mundo — y lo primero que hace es MIRAR HACIA ARRIBA.\n\nVio las estrellas y las constelaciones (כוכבים ומזלות) y dijo shirá — pero no una shirá sobre sí mismo: una CONVOCATORIA. «Bendecid a Hashem, Sus ángeles... todos Sus ejércitos». El recién llegado invita a los veteranos del cosmos — los ejércitos celestes que llevan alabando desde la creación — a bendecir junto con él.\n\nEl gesto es de una humildad enorme: el primer acto del nacido no es celebrar su propia llegada sino RECONOCER LA INMENSIDAD que lo precede. El mundo al que uno nace ya estaba cantando; nacer es sumarse a un coro en marcha.\n\nEl contraste con el mundo 1 es deliberado: en el vientre, la shirá era íntima (mis entrañas); al nacer, la shirá se vuelve cósmica (Sus ejércitos). Cada mundo tiene la escala de alabanza que le corresponde.'

      explicacion: 'El tercer mundo: David mamó del pecho de su madre, miró los pechos — y dijo shirá: «no olvides todos Sus גְּמוּלָיו». La palabra גְּמוּלָיו (favores/retribuciones) resuena con גְּמוּלֵי מֵחָלָב — los «destetados de leche». El favor concreto que David canta es la LACTANCIA misma.\n\n¿Qué tiene de extraordinario? R. Abahu lo explica: HKBH puso los pechos de la mujer בִּמְקוֹם בִּינָה — «en el lugar del entendimiento», junto al corazón — a diferencia de los animales, donde están abajo, junto a las patas.\n\n¿Y por qué ahí? Dos respuestas amoraicas:\n\n  · RAV YEHUDA: para que el lactante NO MIRE LA ERVÁ — la anatomía humana protege la mirada del bebé desde su primer alimento.\n\n  · RAV MATNA: para que NO MAME JUNTO AL LUGAR DE LA INMUNDICIA — que el alimento no venga contaminado por la proximidad de lo sucio.\n\nAmbas respuestas leen el CUERPO como diseño moral: la ubicación de los pechos es una decisión del Artista con intención de tzniut y de pureza. El bebé humano, a diferencia del animal, es alimentado cara a cara, a la altura del corazón y del entendimiento.\n\nLa shirá del tercer mundo agradece un favor que nadie nota: la GEOMETRÍA de la misericordia, inscrita en la anatomía.'

      explicacion: 'El cuarto mundo: David vio la CAÍDA DE LOS RESHAIM — el momento en que la maldad se agota — y dijo shirá.\n\nEl dato editorial es precioso: este הַלְלוּיָהּ es el PRIMER halleluyá de todo el libro de Tehilim. En 103 salmos previos David nunca usó la palabra. La reservó para este momento: cuando los pecados se terminan de la tierra.\n\nEs el mismo versículo que Beruria corrigió (Berajot 10a, justo antes): se lee יִתַּמּוּ חַטָּאִים — que se acaben los PECADOS (jataím), no los pecadores (jotím). Cuando los pecados cesan, los reshaim «ya no son» — no porque mueran, sino porque dejan de ser reshaim. El halleluyá inaugural del Tehilim celebra la desaparición del MAL, no de los malvados.\n\nA diferencia de los otros cuatro mundos — vientre, aire, pecho, muerte, que son estaciones biológicas — este mundo es MORAL: la visión de la justicia divina completándose. La biografía espiritual de David incluye, como un mundo en sí mismo, el momento en que uno ve al mal agotarse. También eso merece su propio canto — y el más alto de todos.'

      explicacion: 'El quinto mundo: David miró EL DÍA DE LA MUERTE — יוֹם הַמִּיתָה — y dijo shirá: «Bendice, alma mía, a Hashem... de esplendor y majestad te has vestido».\n\n¿De dónde sabemos que este versículo habla de la muerte? RABBA BAR RAV SHEILA lo prueba del FINAL del mismo salmo (104:29): תַּסְתִּיר פָּנֶיךָ יִבָּהֵלוּן — «escondes Tu rostro: se aterran; recoges su aliento: expiran y al polvo vuelven». El salmo 104 entero culmina en la muerte de las criaturas; por tanto su apertura — el esplendor y la majestad — también pertenece a ese horizonte.\n\nLa audacia teológica: el día de morir es descrito como un VESTIRSE DE GALA. הוֹד וְהָדָר — esplendor y majestad — es vocabulario de coronación. La muerte no es despojo sino investidura: el alma que regresa se viste, no se desnuda.\n\nHasta el morir es un mundo que merece canto. La biografía de las cinco shirot queda así enmarcada por dos oscuridades — el vientre antes de la vida y la muerte después de ella — y David canta EN AMBAS. El arco se cierra donde empezó: en la mano del Artista que forma y que recoge.'

      traduccion: 'El de carne y hueso pinta una forma sobre el muro... y HKBH forma una forma dentro de otra forma',
      explicacion: 'Rav Shimi bar Ukva (que servía ante R. Shimon ben Pazi) transmite el midrash que fundamenta todo el pasaje.\n\nLA COMPARACIÓN:\n\n  · El artista humano — מִדַּת בָּשָׂר וָדָם — pinta una forma SOBRE EL MURO: superficie plana, exterior, inerte. Y por más perfecta que sea su figura, וְאֵינוֹ יָכוֹל לְהָטִיל בָּהּ רוּחַ וּנְשָׁמָה — no puede echarle espíritu ni alma, ni entrañas ni intestinos.\n\n  · HKBH — צָר צוּרָה בְּתוֹךְ צוּרָה: forma una forma DENTRO de otra forma. El feto dentro del vientre. Una obra tridimensional, interior, viva — y le insufla רוּחַ וּנְשָׁמָה, espíritu y alma, קְרָבַיִם וּבְנֵי מֵעַיִם, entrañas e intestinos.\n\nLa diferencia no es de grado sino de dimensión: el arte humano decora superficies; el arte divino crea INTERIORIDADES — y dentro de la interioridad, otra interioridad más: el alma dentro del cuerpo dentro del vientre.\n\nPor eso cantó Jana (Shmuel I 2:2): אֵין צוּר כֵּאלֹהֵינוּ — «no hay Roca como nuestro Dios». Y la guemará relee: אֵין צַיָּר כֵּאלֹהֵינוּ — no hay TZAYAR, no hay ARTISTA, como nuestro Dios. El juego צוּר/צַיָּר convierte el nombre divino «Roca» en el título «Pintor»: la solidez de Dios ES su arte.\n\nQue sea Jana quien lo canta no es casual: la madre estéril que recibió un hijo conoce desde adentro el taller del Artista. Y el midrash conecta con el mundo 1 de David: la shirá del vientre es el canto de la obra al Artista, desde dentro de la obra misma.'

      traduccion: 'Como HKBH llena todo el mundo — así el alma llena todo el cuerpo',
      explicacion: 'Primera semejanza del espejo: la OMNIPRESENCIA.\n\nHKBH llena todo el mundo — no hay lugar vacío de Su presencia (מְלֹא כָל הָאָרֶץ כְּבוֹדוֹ). Y el alma llena todo el cuerpo: no reside en un órgano, no tiene «asiento» localizable. Está entera en cada miembro — en la mano que escribe y en el pie que camina — sin dividirse.\n\nLa analogía enseña en ambas direcciones:\n\n  · Del alma hacia HKBH: así como sabes que estás vivo entero aunque no puedas señalar DÓNDE está tu alma, así el mundo está lleno de su Creador aunque no puedas señalarlo.\n\n  · De HKBH hacia el alma: la relación del alma con el cuerpo es una miniatura de la relación de Dios con el mundo. El cuerpo es el «mundo» del alma; el mundo es el «cuerpo» de la presencia divina.\n\nEsta primera semejanza establece la lógica de toda la serie: el alma es el único objeto de la experiencia humana que se comporta COMO Dios — y por eso es la única capacitada para alabarlo con conocimiento de causa.'

    'espejo-3': {

      traduccion: 'Como HKBH nutre al mundo entero — así el alma nutre al cuerpo entero',
      explicacion: 'Tercera semejanza: la NUTRICIÓN.\n\nHKBH es הַזָּן אֶת הָעוֹלָם כֻּלּוֹ — el que sustenta al mundo entero (la primera berajá de Birkat HaMazon). Y el alma nutre al cuerpo entero: mientras el alma está, el cuerpo se mantiene, digiere, se repara, crece. En el momento en que el alma parte, el mismo cuerpo con los mismos órganos comienza a descomponerse.\n\nLa vida no es una propiedad de la materia — es un SUMINISTRO constante. El cuerpo no «tiene» vida; la RECIBE del alma a cada instante, igual que el mundo no «tiene» existencia sino que la recibe de su Creador a cada instante.\n\nEsta semejanza dialoga con el mundo 3 de David — el pecho materno. Allí David cantó la nutrición VISIBLE (la leche, colocada con sabiduría junto al corazón); aquí el alma replica la nutrición INVISIBLE. La madre que amamanta es imagen del alma que sostiene — y ambas son imagen del זָן אֶת הַכֹּל.'

      explicacion: 'Cuarta semejanza: la PUREZA.\n\nHKBH es puro — ninguna impureza lo toca, ningún contacto lo contamina. Y el alma es pura: אֱלֹהַי, נְשָׁמָה שֶׁנָּתַתָּ בִּי טְהוֹרָה הִיא — «Dios mío, el alma que pusiste en mí es PURA», dice la berajá matinal.\n\nLa afirmación es más radical de lo que parece: el alma habita un cuerpo que come, enferma, peca, se contamina — y sin embargo ELLA no se ensucia. Como HKBH, que llena un mundo lleno de impurezas sin contaminarse, el alma atraviesa la biografía entera del cuerpo — sus errores incluidos — y permanece limpia en su núcleo.\n\nDe aquí la doctrina de la teshuvá: el retorno es posible porque hay ADÓNDE volver — un núcleo que nunca se manchó. El pecado se adhiere a las capas exteriores de la persona, no a su alma.\n\nY otra vez el eco del mundo 3: Rav Matna explicó que los pechos están junto al corazón para que el bebé no mame «junto al lugar de la inmundicia». El diseño del Artista separa alimento y suciedad en el cuerpo — como separó pureza y contaminación en la estructura del alma.'

      traduccion: 'Como HKBH habita en cámaras interiores — así el alma habita en cámaras interiores',
      explicacion: 'Quinta y última semejanza: la INTERIORIDAD.\n\nHKBH habita בְּחַדְרֵי חֲדָרִים — en «cámaras de cámaras», en el interior del interior. No en la superficie del mundo sino en su recinto más recóndito. Y el alma igual: no está en la piel ni en los miembros visibles, sino en lo más interior de lo interior del cuerpo.\n\nLa expresión duplicada — jadrei jadarim, cámaras DE cámaras — es la misma lógica que צָר צוּרָה בְּתוֹךְ צוּרָה, forma dentro de forma. La interioridad divina no es un escondite: es una ANIDACIÓN infinita. Siempre hay un adentro más adentro.\n\nEsta semejanza cierra la serie con una consecuencia práctica para la avodá: a Dios no se lo encuentra saliendo sino ENTRANDO. El camino hacia el que habita en cámaras interiores pasa por las cámaras interiores propias — por el alma, que vive en el mismo tipo de recinto.\n\nCinco semejanzas, cinco mundos, cinco barji nafshi: la aritmética del pasaje es deliberada. David dijo CINCO alabanzas porque el alma se parece a su Creador en CINCO cosas.'

    'cierre': {
      titulo: 'El cierre · la shirá como espejo ontológico',

      traduccion: 'Que venga quien tiene estas cinco cosas — y alabe a Quien tiene estas cinco cosas',
      explicacion: 'La conclusión de la sugyá responde la pregunta con la que empezó el espejo: ¿FRENTE A QUIÉN dijo David los cinco barji nafshi? — לֹא אֲמָרָן דָּוִד אֶלָּא כְּנֶגֶד הַקָּדוֹשׁ בָּרוּךְ הוּא וּכְנֶגֶד נְשָׁמָה: frente a HKBH Y frente al alma.\n\nCada בָּרְכִי נַפְשִׁי es literalmente eso: «bendice, ALMA MÍA». David no le habla a su boca ni a su corazón — convoca específicamente a la neshamá. ¿Por qué ella? Porque SOLO ELLA está calificada:\n\n  · llena su recinto — como Él llena el Suyo\n  · ve sin ser vista — como Él\n  · nutre su mundo — como Él\n  · es pura — como Él\n  · habita cámaras interiores — como Él\n\nYAVÓ MI... — «que VENGA quien tiene estas cinco cosas y alabe a Quien tiene estas cinco cosas». La alabanza no es un cumplido lanzado hacia lo desconocido: es un RECONOCIMIENTO entre semejantes. El alma alaba a Dios como un espejo «alaba» al rostro: reflejándolo.\n\nEsto reordena todo el pasaje hacia atrás:\n\n  · Los CINCO MUNDOS de David son cinco estaciones donde el alma, atravesando el cuerpo (vientre, nacimiento, lactancia, justicia, muerte), reconoce en cada una la firma de su Semejante.\n\n  · El MIDRASH DEL ARTISTA explica por qué existe tal semejanza: el que forma «forma dentro de forma» dejó, dentro de la forma, algo de Sí.\n\n  · Y la SHIRÁ resulta ser un espejo ontológico: cantar no es adular a Dios — es que lo más divino que hay en el ser humano reconozca su origen.\n\nLa biografía de David — del vientre a la muerte — es entonces la biografía de un alma que nunca dejó de reconocer. En cinco mundos distintos, la misma voz: בָּרְכִי נַפְשִׁי אֶת ה׳.'

      : '';
    panel.innerHTML =
      '<div class="cincom-panel-header">' +
        '<p class="cincom-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="cincom-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="cincom-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="cincom-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.cincom-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.cincom-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="cincom-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
</script>
</div>
