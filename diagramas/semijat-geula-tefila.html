  var contenedor = document.currentScript
    ? document.currentScript.closest('.semija-interactivo')
    : document.querySelector('.semija-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#semija-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.semija-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="semija-panel-header">' +
        '<p class="semija-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="semija-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="semija-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="semija-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.semija-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.semija-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="semija-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
