        (d.hebreo ? '<span class="jitum-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="jitum-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="jitum-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.jitum-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.jitum-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="jitum-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
</script>
</div>
