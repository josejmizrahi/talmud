<!-- ============================================================ -->
<text x="60" y="76" font-size="9.5" fill="#1e3a5f" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">VITRINA 1 · מרגלא בפומיה · LA PERLA DE CADA BOCA</text>

<!-- R. Meir -->
<g class="dichos-nodo" data-id="r-meir">
  <rect x="60" y="86" width="290" height="128" rx="6" fill="rgba(30,58,95,0.06)" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="205" y="108" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1e3a5f" font-weight="700">R. Meir · estudia con todo el corazón</text>
  <text x="205" y="130" text-anchor="middle" font-size="10" direction="rtl" fill="#1e3a5f">גְּמוֹר בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ</text>
  <text x="205" y="148" text-anchor="middle" font-size="10" direction="rtl" fill="#1e3a5f">שְׁמוֹר פִּיךָ מִכָּל חֵטְא</text>
  <text x="78" y="168" font-size="9" fill="#3d2f23" font-style="italic">estudia con todo el corazón · guarda tu boca</text>
  <text x="78" y="182" font-size="9" fill="#3d2f23" font-style="italic">de todo pecado —</text>
  <text x="78" y="200" font-size="9.5" fill="#6b4423" font-weight="600">«y Yo estaré contigo en todo lugar»</text>
</g>

<!-- Rabanan de Yavne -->
<g class="dichos-nodo" data-id="yavne">
  <rect x="370" y="86" width="290" height="128" rx="6" fill="rgba(30,58,95,0.06)" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="515" y="108" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1e3a5f" font-weight="700">Los rabanan de Yavne · dos criaturas</text>
  <text x="515" y="130" text-anchor="middle" font-size="10.5" direction="rtl" fill="#1e3a5f">אֲנִי בְּרִיָּה וַחֲבֵרִי בְּרִיָּה</text>
  <text x="388" y="150" font-size="9" fill="#3d2f23" font-style="italic">yo soy criatura y mi compañero es criatura:</text>
  <text x="388" y="164" font-size="9" fill="#3d2f23" font-style="italic">yo trabajo en la ciudad, él en el campo —</text>
  <text x="388" y="178" font-size="9" fill="#3d2f23" font-style="italic">ni él presume de mi oficio ni yo del suyo</text>
  <text x="388" y="200" font-size="9" fill="#6b4423">y el remate que nivela todo el edificio ↓</text>
</g>

<!-- líneas hacia el remate -->
<line x1="205" y1="214" x2="205" y2="230" stroke="#b8860b" stroke-width="1" marker-end="url(#flecha-di-gold)"/>
<line x1="515" y1="214" x2="515" y2="230" stroke="#b8860b" stroke-width="1" marker-end="url(#flecha-di-gold)"/>

<!-- REMATE IGUALADOR · nodo dorado central -->
<g class="dichos-nodo" data-id="remate">
  <rect x="110" y="234" width="500" height="88" rx="6" fill="rgba(184,134,11,0.10)" stroke="#b8860b" stroke-width="1.8"/>
  <text x="360" y="260" text-anchor="middle" font-size="13" direction="rtl" fill="#b8860b" font-weight="700">אֶחָד הַמַּרְבֶּה וְאֶחָד הַמַּמְעִיט</text>
  <text x="360" y="282" text-anchor="middle" font-size="13" direction="rtl" fill="#b8860b" font-weight="700">וּבִלְבַד שֶׁיְּכַוֵּין לִבּוֹ לַשָּׁמַיִם</text>
  <text x="360" y="306" text-anchor="middle" font-size="10" fill="#3d2f23" font-style="italic">«uno que hace mucho y uno que hace poco — con tal de que dirija su corazón al Cielo»</text>
</g>

<line x1="205" y1="322" x2="205" y2="340" stroke="#1e3a5f" stroke-width="1" marker-end="url(#flecha-di)"/>
<line x1="515" y1="322" x2="515" y2="340" stroke="#1e3a5f" stroke-width="1" marker-end="url(#flecha-di)"/>

<!-- Abaye -->
<g class="dichos-nodo" data-id="abaye">
  <rect x="60" y="344" width="290" height="136" rx="6" fill="rgba(30,58,95,0.06)" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="205" y="366" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1e3a5f" font-weight="700">Abaye · la respuesta suave</text>
  <text x="205" y="388" text-anchor="middle" font-size="10.5" direction="rtl" fill="#1e3a5f">מַעֲנֶה רַךְ מֵשִׁיב חֵמָה</text>
  <text x="78" y="408" font-size="9" fill="#3d2f23" font-style="italic">la respuesta suave aplaca la ira ·</text>
  <text x="78" y="422" font-size="9" fill="#3d2f23" font-style="italic">multiplica la paz con todo hombre —</text>
  <text x="78" y="438" font-size="9.5" fill="#6b4423" font-weight="600">hasta con el gentil en el mercado</text>
  <text x="78" y="456" font-size="8.5" fill="#6b4423" font-style="italic">de R. Yojanan ben Zakai nadie logró jamás</text>
  <text x="78" y="469" font-size="8.5" fill="#6b4423" font-style="italic">saludarlo primero — ni el gentil del mercado</text>
</g>

<!-- Rava -->
<g class="dichos-nodo" data-id="rava">
  <rect x="370" y="344" width="290" height="136" rx="6" fill="rgba(30,58,95,0.06)" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="515" y="366" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1e3a5f" font-weight="700">Rava · el fin de la sabiduría</text>
  <text x="515" y="388" text-anchor="middle" font-size="10.5" direction="rtl" fill="#1e3a5f">תַּכְלִית חָכְמָה</text>
  <text x="515" y="406" text-anchor="middle" font-size="10.5" direction="rtl" fill="#1e3a5f">תְּשׁוּבָה וּמַעֲשִׂים טוֹבִים</text>
  <text x="388" y="426" font-size="9" fill="#3d2f23" font-style="italic">el fin de la sabiduría: teshuvá y buenas</text>
  <text x="388" y="440" font-size="9" fill="#3d2f23" font-style="italic">acciones — que uno no lea y estudie</text>
  <text x="388" y="454" font-size="9" fill="#3d2f23" font-style="italic">y patee a su padre y a su maestro</text>
  <text x="388" y="470" font-size="8.5" fill="#6b4423" font-style="italic">quien estudia shelo lishmá — mejor no creado</text>
</g>

<line x1="360" y1="480" x2="360" y2="498" stroke="#1e3a5f" stroke-width="1.2" marker-end="url(#flecha-di)"/>

<!-- Rav · las coronas -->
<g class="dichos-nodo" data-id="rav-coronas">
  <rect x="60" y="502" width="600" height="168" rx="6" fill="rgba(30,58,95,0.06)" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="360" y="524" text-anchor="middle" font-size="11.5" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1e3a5f" font-weight="700">Rav · el olam habá · la más famosa de las perlas</text>
  <text x="360" y="546" text-anchor="middle" font-size="11" direction="rtl" fill="#1e3a5f">הָעוֹלָם הַבָּא אֵין בּוֹ לֹא אֲכִילָה וְלֹא שְׁתִיָּה</text>
  <text x="360" y="565" text-anchor="middle" font-size="11" direction="rtl" fill="#1e3a5f">אֶלָּא צַדִּיקִים יוֹשְׁבִין וְעַטְרוֹתֵיהֶם בְּרָאשֵׁיהֶם וְנֶהֱנִים מִזִּיו הַשְּׁכִינָה</text>
  <!-- tres tzadikim sentados, coronas en la cabeza -->
  <path d="M235,596 l3,-11 l7,7 l7,-9 l7,9 l7,-7 l3,11 z" fill="rgba(184,134,11,0.25)" stroke="#b8860b" stroke-width="1"/>
  <circle cx="252" cy="612" r="12" fill="rgba(30,58,95,0.08)" stroke="#1e3a5f" stroke-width="1.1"/>
  <path d="M343,596 l3,-11 l7,7 l7,-9 l7,9 l7,-7 l3,11 z" fill="rgba(184,134,11,0.25)" stroke="#b8860b" stroke-width="1"/>
  <circle cx="360" cy="612" r="12" fill="rgba(30,58,95,0.08)" stroke="#1e3a5f" stroke-width="1.1"/>
  <path d="M451,596 l3,-11 l7,7 l7,-9 l7,9 l7,-7 l3,11 z" fill="rgba(184,134,11,0.25)" stroke="#b8860b" stroke-width="1"/>
  <circle cx="468" cy="612" r="12" fill="rgba(30,58,95,0.08)" stroke="#1e3a5f" stroke-width="1.1"/>
  <text x="360" y="644" text-anchor="middle" font-size="9.5" fill="#3d2f23" font-style="italic">sin comer ni beber, sin celos ni odio: los tzadikim sentados, coronas en la cabeza,</text>
  <text x="360" y="659" text-anchor="middle" font-size="9.5" fill="#3d2f23" font-style="italic">gozando del resplandor de la Shejiná</text>
</g>

<line x1="360" y1="670" x2="360" y2="688" stroke="#5a3a8a" stroke-width="1.2" marker-end="url(#flecha-di)"/>

<text x="60" y="702" font-size="9.5" fill="#2d6b4e" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">VITRINA 2 · LAS PROMESAS Y LAS DESPEDIDAS</text>

<!-- Las mujeres -->
<g class="dichos-nodo" data-id="mujeres">
  <rect x="60" y="712" width="600" height="104" rx="6" fill="rgba(90,58,138,0.07)" stroke="#5a3a8a" stroke-width="1.4"/>
  <text x="360" y="736" text-anchor="middle" font-size="12" direction="rtl" fill="#5a3a8a" font-weight="700">גְּדוֹלָה הַבְטָחָה שֶׁהִבְטִיחָן הַקָּדוֹשׁ בָּרוּךְ הוּא לְנָשִׁים יוֹתֵר מִן הָאֲנָשִׁים</text>
  <text x="360" y="756" text-anchor="middle" font-size="10" fill="#3d2f23" font-style="italic">«mayor es la promesa que hizo HKBH a las mujeres que a los hombres»</text>
  <text x="360" y="778" text-anchor="middle" font-size="9.5" fill="#3d2f23">¿y con qué merecen? — llevando a los hijos a la sinagoga, enviando a los maridos al beit midrash</text>
  <text x="360" y="796" text-anchor="middle" font-size="9.5" fill="#5a3a8a" font-weight="600">y ESPERÁNDOLOS · el mérito de quien hace posible el estudio ajeno</text>
</g>

<line x1="205" y1="816" x2="205" y2="834" stroke="#2d6b4e" stroke-width="1" marker-end="url(#flecha-di)"/>
<line x1="515" y1="816" x2="515" y2="834" stroke="#2d6b4e" stroke-width="1" marker-end="url(#flecha-di)"/>

<!-- Despedida de la casa de R. Ami -->
<g class="dichos-nodo" data-id="r-ami">
  <rect x="60" y="838" width="290" height="128" rx="6" fill="rgba(30,107,90,0.07)" stroke="#2d6b4e" stroke-width="1.3"/>
  <text x="205" y="860" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#2d6b4e" font-weight="700">Al salir de la casa de R. Ami</text>
  <text x="205" y="884" text-anchor="middle" font-size="11" direction="rtl" fill="#2d6b4e">עוֹלָמְךָ תִּרְאֶה בְּחַיֶּיךָ</text>
  <text x="78" y="906" font-size="9" fill="#3d2f23" font-style="italic">«que veas tu mundo en tu vida,</text>
  <text x="78" y="920" font-size="9" fill="#3d2f23" font-style="italic">y tu final sea para la vida del olam habá»</text>
  <text x="78" y="940" font-size="8.5" fill="#6b4423" font-style="italic">que tus ojos brillen con la luz de la Torá ·</text>
  <text x="78" y="953" font-size="8.5" fill="#6b4423" font-style="italic">la bendición del que se va del beit midrash</text>
</g>

<!-- Despedida de la casa de Rav Jisda -->
<g class="dichos-nodo" data-id="alufeinu">
  <rect x="370" y="838" width="290" height="128" rx="6" fill="rgba(30,107,90,0.07)" stroke="#2d6b4e" stroke-width="1.3"/>
  <text x="515" y="860" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#2d6b4e" font-weight="700">Al salir de la casa de Rav Jisda</text>
  <text x="515" y="884" text-anchor="middle" font-size="11" direction="rtl" fill="#2d6b4e">אַלּוּפֵינוּ מְסֻבָּלִים</text>
  <text x="388" y="906" text-anchor="middle" font-size="9" fill="#3d2f23" font-style="italic">«nuestros líderes cargados» (Tehilim 144:14) —</text>
  <text x="388" y="920" text-anchor="middle" font-size="9" fill="#3d2f23" font-style="italic">que nuestro grupo no produzca</text>
  <text x="515" y="940" text-anchor="middle" font-size="9" fill="#2d6b4e" font-weight="600">ni un Ajitofel · ni un Doeg · ni un Guejazí</text>
  <text x="515" y="955" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">la Torá sin maasim tovim es peligrosa</text>
</g>

<line x1="360" y1="966" x2="360" y2="984" stroke="#5a3a8a" stroke-width="1.2" marker-end="url(#flecha-di)"/>

<!-- La bat kol del Jorev -->
<g class="dichos-nodo" data-id="janina">
  <rect x="60" y="988" width="600" height="112" rx="6" fill="rgba(90,58,138,0.07)" stroke="#5a3a8a" stroke-width="1.4"/>
  <text x="360" y="1010" text-anchor="middle" font-size="10.5" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#5a3a8a" font-weight="700">La bat kol diaria desde el monte Jorev</text>
  <text x="360" y="1032" text-anchor="middle" font-size="11.5" direction="rtl" fill="#5a3a8a">כָּל הָעוֹלָם כּוּלּוֹ נִזּוֹנִין בִּשְׁבִיל חֲנִינָא בְּנִי</text>
  <text x="360" y="1052" text-anchor="middle" font-size="11.5" direction="rtl" fill="#5a3a8a">וַחֲנִינָא בְּנִי דַּי לוֹ בְּקַב חָרוּבִין מֵעֶרֶב שַׁבָּת לְעֶרֶב שַׁבָּת</text>
  <text x="360" y="1074" text-anchor="middle" font-size="9.5" fill="#3d2f23" font-style="italic">«el mundo entero se sustenta por Janina mi hijo — y a Janina mi hijo le basta</text>
  <text x="360" y="1089" text-anchor="middle" font-size="9.5" fill="#3d2f23" font-style="italic">un kav de algarrobas de víspera a víspera de Shabat»</text>
</g>

<!-- EL HADRAN · CIERRE CEREMONIAL DEL PEREK 2                    -->
<!-- ============================================================ -->
<line x1="360" y1="1100" x2="360" y2="1118" stroke="#b8860b" stroke-width="1.4" marker-end="url(#flecha-di-gold)"/>

<text x="60" y="1132" font-size="9.5" fill="#b8860b" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">EL HADRAN · EL PEREK DE LA KAVANÁ LLEGA A SU FIN</text>

<g class="dichos-nodo" data-id="hadran">
  <rect x="60" y="1142" width="600" height="184" rx="8" fill="rgba(184,134,11,0.09)" stroke="#b8860b" stroke-width="2"/>
  <rect x="70" y="1152" width="580" height="164" rx="5" fill="none" stroke="#b8860b" stroke-width="0.7" stroke-dasharray="1,3"/>
  <!-- viñeta ornamental superior -->
  <line x1="230" y1="1172" x2="330" y2="1172" stroke="#b8860b" stroke-width="0.6"/>
  <text x="360" y="1176" text-anchor="middle" font-size="12" fill="#b8860b">❦</text>
  <line x1="390" y1="1172" x2="490" y2="1172" stroke="#b8860b" stroke-width="0.6"/>
  <text x="360" y="1210" text-anchor="middle" font-size="23" direction="rtl" fill="#b8860b" font-weight="700">הֲדַרַן עֲלָךְ הָיָה קוֹרֵא</text>
  <text x="360" y="1232" text-anchor="middle" font-size="11" fill="#3d2f23" font-style="italic" font-family="'Cormorant Garamond', serif">«Volveremos a ti, El que estaba leyendo»</text>

      explicacion: 'La despedida de la casa de Rav Jisda (algunos dicen: de R. Shmuel bar Najmani) es un versículo de Tehilim convertido en plegaria del grupo: אַלּוּפֵינוּ מְסֻבָּלִים — «nuestros líderes, cargados» (de Torá y de mitzvot).\n\nPero la guemará lee la continuación del versículo — «no hay brecha, ni salida, ni grito» — como una lista de CATÁSTROFES POSIBLES del beit midrash, cada una con nombre y apellido:\n\n  · אֵין פֶּרֶץ — que no haya BRECHA: que nuestro grupo no produzca uno como AJITOFEL, el consejero de David cuya sabiduría era «como quien consulta la palabra de Dios» — y que la usó para asesorar la rebelión de Avshalom.\n\n  · וְאֵין יוֹצֵאת — que no haya quien SALGA mal: uno como DOEG el edomita, «el más fuerte de los pastores» en Torá según la tradición — y delator que provocó la masacre de los sacerdotes de Nov.\n\n  · וְאֵין צְוָחָה — que no haya GRITO: uno como GUEJAZÍ, el discípulo de Elisha que convirtió el milagro en negocio y salió leproso — el talmid que corrompe la herencia del maestro.\n\nLa lista es escalofriante por su premisa: los tres monstruos citados NO eran ignorantes. Eran GRANDES en Torá. Ajitofel, Doeg y Guejazí son la demostración histórica de la perla de Rava: se puede leer y estudiar — y patear. Por eso ESTA es la bendición de salida: el peligro del beit midrash no es que entre poca Torá, sino que salga Torá sin maasim tovim. El grupo entero se bendice para no engendrar a su propio traidor.'

    'janina': {
      titulo: 'La bat kol del Jorev · el mundo entero por Janina — y a Janina le basta un kav',
      hebreo: 'כָּל הָעוֹלָם כּוּלּוֹ נִזּוֹנִין בִּשְׁבִיל חֲנִינָא בְּנִי וַחֲנִינָא בְּנִי דַּי לוֹ בְּקַב חָרוּבִין מֵעֶרֶב שַׁבָּת לְעֶרֶב שַׁבָּת',
      traduccion: '«El mundo entero se sustenta por Janina Mi hijo — y a Janina Mi hijo le basta un kav de algarrobas de víspera de Shabat a víspera de Shabat»',
      explicacion: 'Antes del hadran, la última imagen de la sugyá: בְּכָל יוֹם וָיוֹם — cada día — una bat kol sale del monte JOREV (el Sinaí, la montaña de la revelación, que sigue emitiendo) y proclama la paradoja de Janina ben Dosa.\n\nLa estructura de la proclamación es un quiasmo perfecto de la economía divina:\n\n  · כָּל הָעוֹלָם כּוּלּוֹ נִזּוֹנִין בִּשְׁבִיל חֲנִינָא בְּנִי — el MUNDO ENTERO se alimenta בִּשְׁבִיל («por el canal de», leen los jasidim; «por el mérito de», leen los rishonim) Janina Mi hijo. Un solo justo funciona como el conducto por el que baja el sustento de TODOS.\n\n  · וַחֲנִינָא בְּנִי דַּי לוֹ — y a ese mismo Janina LE BASTA un kav de algarrobas (la medida mínima, el alimento de los pobres y de las cabras) de víspera de Shabat a víspera de Shabat: una semana entera.\n\nEl canal por el que pasa la abundancia del mundo no retiene casi nada para sí. El que más da es el que menos consume. Y la voz lo llama בְּנִי — «Mi hijo» — dos veces: la pobreza de Janina no es abandono divino, es intimidad.\n\nNótese quién cierra la galería del perek: no un rosh yeshivá sino Janina ben Dosa — el hombre de los milagros y de la tefilá (el mismo que sabía por la fluidez de su rezo si el enfermo viviría), célebre por sus maasim más que por sus jidushim. Tras las perlas de los grandes académicos y las bendiciones de las grandes academias, la bat kol recuerda desde el Sinaí que el mundo no se sostiene por el volumen del estudio sino por la calidad de un corazón — אֶחָד הַמַּמְעִיט, uno que hace poco, con el corazón enteramente dirigido al Cielo.'
    },
    'hadran': {
      titulo: 'Hadran alaj Hayá Koré · el cierre del perek 2',
      hebreo: 'הֲדַרַן עֲלָךְ הָיָה קוֹרֵא',
      traduccion: '«Volveremos a ti, El que estaba leyendo»',
      explicacion: 'Con la bat kol del Jorev todavía resonando, el segundo perek de Berajot llega a su fin. La tradición lo sella con la fórmula del hadran: הֲדַרַן עֲלָךְ — «volveremos a ti» (también leído: «nuestra gloria está sobre ti») — seguida del nombre del perek, que es siempre su primera palabra: הָיָה קוֹרֵא, «el que estaba leyendo».\n\nEl nombre del perek es su tesis. הָיָה קוֹרֵא בַּתּוֹרָה וְהִגִּיעַ זְמַן הַמִּקְרָא — el que estaba leyendo la Torá y le llegó el momento del shemá: ¿cumplió? La respuesta de la mishná — אִם כִּיוֵּן לִבּוֹ, יָצָא: si dirigió su corazón, cumplió — instaló la kavaná como el eje de todo lo que siguió. El perek midió la kavaná mínima (seis palabras, el primer versículo); la negoció con la vida real (los obreros sobre el árbol, el novio en su noche, el doliente, Rabán Gamliel recitando la primera noche); la extendió al cuerpo entero (Eluli y Bevari, la escritura de una mezuzá); y la coronó con las dos galerías finales: las tefilot personales y las perlas de cada boca.\n\nY el círculo del perek es perfecto. Abrió con un hombre LEYENDO un texto fijo, sorprendido por el zman, sin saber si su lectura valió. Cierra con los sabios cuyas palabras fijas —repetidas cada día, מַרְגְּלָא בְּפוּמֵּיהּ— eran pura kavaná cristalizada: la diferencia entre recitar y decir de corazón, resuelta por una vida entera de repetición intencionada. Entre la kavaná mínima (seis palabras) y la máxima (toda una vida de dichos), el perek enseñó que la lectura vale lo que el corazón que la dirige.\n\nEl hadran no es despedida — es promesa de RETORNO, como las despedidas de R. Ami y Rav Jisda no eran adioses sino bendiciones de umbral. El estudio talmúdico es circular: todo perek concluido queda pendiente de ser re-estudiado.\n\nהֲדַרַן עֲלָךְ הָיָה קוֹרֵא — volveremos a ti, El que estaba leyendo.'
    }
  };

  var contenedor = document.currentScript
    ? document.currentScript.closest('.dichos-interactivo')
    : document.querySelector('.dichos-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#dichos-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.dichos-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="dichos-panel-header">' +
        '<p class="dichos-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="dichos-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="dichos-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="dichos-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.dichos-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.dichos-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="dichos-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
</script>
