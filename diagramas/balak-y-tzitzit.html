  <text x="360" y="112" text-anchor="middle" font-size="12.5" direction="rtl" fill="#1a1410">בִּקְּשׁוּ לִקְבּוֹעַ פָּרָשַׁת בָּלָק בִּקְרִיאַת שְׁמַע</text>
  <text x="360" y="134" text-anchor="middle" font-size="10.5" fill="#3d2f23" font-style="italic">«Quisieron fijar la parashá de Balak en la recitación del shema»</text>
  <text x="360" y="154" text-anchor="middle" font-size="9" fill="#6b4423" font-style="italic">R. Abahu ben Zutarti en nombre de R. Yehuda bar Zvida · el canon estuvo ABIERTO</text>
  <text x="360" y="170" text-anchor="middle" font-size="9" fill="#8b1a1a" font-style="italic">¿por qué las bendiciones de Bilam junto al shema? — dos hipótesis ↓</text>

      explicacion: 'La cuarta cosa es una exégesis quirúrgica del verso central de la parashá: וְלֹא תָתוּרוּ אַחֲרֵי לְבַבְכֶם וְאַחֲרֵי עֵינֵיכֶם — «no explorarán tras su corazón ni tras sus ojos». La baraita disecciona la frase en sus órganos: אַחֲרֵי לְבַבְכֶם — «tras su corazón» — זוֹ מִינוּת: esto es la MINUT, la herejía.\n\nLa prueba textual es Tehilim 14:1: אָמַר נָבָל בְּלִבּוֹ אֵין אֱלֹהִים — «dijo el vil EN SU CORAZÓN: no hay Dios». La conexión es la palabra לב, corazón: el lugar donde el verso de tzitzit prohíbe explorar es exactamente el lugar donde el salmo ubica la negación de Dios. La herejía, enseña la equivalencia, no es una doctrina que se predica en la plaza — es un movimiento que ocurre EN el corazón, en silencio, antes de cualquier palabra.\n\nEsto convierte a la tercera parashá del shema en el ANTÍDOTO diario contra la erosión interior de la fe. Obsérvese la precisión: el verso no prohíbe «concluir» que no hay Dios — prohíbe תָתוּרוּ, EXPLORAR, vagar tras el corazón. El verbo es el mismo de los espías (וְיָתֻרוּ אֶת אֶרֶץ כְּנַעַן, Bamidbar 13 — apenas dos capítulos antes): el corazón explora el territorio de la increencia como los meraglim exploraron la tierra, y como ellos, vuelve con un informe desmoralizador. La parashá de tzitzit está colocada en la Torá inmediatamente después del desastre de los espías — y usa su verbo: hay espionaje EXTERNO que perdió una generación, y hay espionaje INTERNO que puede perder cualquier alma.\n\nQue esta advertencia esté en el shema tiene su ironía histórica: fue precisamente la querella con los MINIM la que expulsó a los Diez Mandamientos del rezo diario (Berajot 12a, el diagrama hermano). La liturgia perdió el Sinaí por culpa de los herejes — pero conservó, dos veces al día, la advertencia contra el mecanismo íntimo que FABRICA herejes: el corazón que explora solo.'

    'cosa-5': {
      titulo: 'Quinta cosa · contra el hirhur · los ojos y la deriva',
      hebreo: '״אַחֲרֵי עֵינֵיכֶם״ — זֶה הִרְהוּר עֲבֵירָה · ״אַתֶּם זוֹנִים״ — זֶה הִרְהוּר עֲבוֹדָה זָרָה',
      traduccion: '«"Tras sus ojos" — el pensamiento de transgresión; "ustedes se desvían" — el pensamiento de idolatría»',
      explicacion: 'La quinta cosa completa la disección del verso — y es doble, porque el verso tiene dos frases más:\n\n  · אַחֲרֵי עֵינֵיכֶם — «tras sus ojos» — זֶה הִרְהוּר עֲבֵירָה: el HIRHUR AVEIRÁ, el pensamiento de transgresión (sexual). La prueba es SHIMSHON: כִּי הִיא יָשְׁרָה בְעֵינָי — «tómala para mí, porque ella es recta EN MIS OJOS» (Shoftim 14:3). El héroe más fuerte de Israel cayó por el canal de los ojos: vio a la mujer de Timná, y el ojo decidió antes que la ley. Sus ojos, dice la guemará en otro lugar, fueron también su castigo — los pelishtim se los arrancaron. El órgano de la caída fue el órgano de la cuenta.\n\n  · אַתֶּם זוֹנִים — «ustedes se desvían/prostituyen» — זֶה הִרְהוּר עֲבוֹדָה זָרָה: el pensamiento de IDOLATRÍA. La prueba: וַיִּזְנוּ אַחֲרֵי הַבְּעָלִים — «se prostituyeron tras los baales» (Shoftim 8:33). El verbo זנה, común a ambos versos, revela que la idolatría es en su raíz una infidelidad — no un error intelectual sino una traición conyugal contra el Dios del pacto.\n\nLo radical de esta quinta cosa es su OBJETO: no castiga actos — vigila PENSAMIENTOS. El hirhur es la transgresión en estado embrionario: la fantasía que precede al acto, la curiosidad que precede al culto ajeno. La Torá legisla aquí sobre el territorio que ningún tribunal puede alcanzar — el interior de la imaginación — y coloca su guardia en la puerta de entrada: los ojos.\n\nJunto con la cuarta cosa, el verso queda cartografiado como un mapa del deseo: el CORAZÓN deriva hacia la herejía, los OJOS hacia la carne, y la deriva misma (zonim) hacia los dioses ajenos. Corazón y ojos — dice el midrash — son los dos ESPÍAS del cuerpo: el ojo ve, el corazón desea, y el cuerpo ejecuta. La parashá de tzitzit interrumpe la cadena en su primer eslabón — y por eso el fleco se lleva puesto A LA VISTA: para que el ojo, el espía infiel, encuentre en su propio campo visual al agente doble que trabaja para el Reino. La tercera parashá del shema es un tratado en miniatura sobre el deseo — y por eso ganó su lugar en la recitación diaria.'

    'moraleja': {
      titulo: 'Moraleja · el criterio editorial del canon',
      hebreo: 'טוֹרַח צִבּוּר · חֲמִשָּׁה דְּבָרִים',
      traduccion: 'La fatiga de la comunidad · las cinco cosas',
      explicacion: 'Leídas juntas, las dos mitades de la sugyá revelan el CRITERIO EDITORIAL con que se compuso el shema — el rezo más recitado de la historia judía:\n\n  1. EL CONTENIDO ES NECESARIO PERO NO SUFICIENTE. Balak tenía un verso litúrgicamente perfecto — el león que se acuesta y se levanta, eco exacto de ubshojbeja uvkumeja — y quedó fuera. La santidad del texto no compra sola su lugar en el rezo.\n\n  2. LA INTEGRIDAD TEXTUAL ES INNEGOCIABLE. Lo que Moshé no cortó, no se corta. La liturgia selecciona unidades completas de la Torá; no fabrica antologías de versos sueltos. Antes que un rezo óptimo, un texto íntegro.\n\n  3. EL TIEMPO DEL TZIBUR ES UN VALOR HALÁJICO. Toraj tzibur — la fatiga de la comunidad — vetó a Balak. No es concesión a la pereza: es la comprensión de que un rezo diario debe ser SOSTENIBLE para sobrevivir siglos de cotidianidad. Lo insostenible no se reza mal — deja de rezarse.\n\n  4. GANA LA DENSIDAD. Tzitzit entró porque paga su tiempo con cinco contenidos: la mitzvá recordatorio, la salida de Egipto, el yugo de todas las mitzvot, el dique contra la herejía del corazón y el dique contra el hirhur de los ojos. Nueve versos, cinco cosas — la mejor tasa de cambio de la Torá.\n\nEl resultado es el canon que rezamos hoy: tres parashiyot, ni una más. Y la última — la de los flecos — resulta ser la más psicológica de todas: un mapa del deseo humano (corazón que deriva, ojos que exploran) con su contramedida portátil cosida a la ropa.\n\nLa sugyá enseña, en el fondo, una lección de diseño institucional: las cosas que deben durar para siempre se diseñan livianas. El shema sobrevivió a templos, exilios e imperios en parte porque sus editores tuvieron la disciplina de decir NO a un texto hermoso — y la lucidez de decir SÍ al texto denso. Qué entra y qué queda fuera: ese es el oficio invisible detrás de toda liturgia que sigue viva.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.balak-interactivo')
    : document.querySelector('.balak-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#balak-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.balak-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="balak-panel-header">' +
        '<p class="balak-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="balak-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="balak-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="balak-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.balak-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.balak-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="balak-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
