      explicacion: 'Rabbi — R. Yehudá HaNasí, el príncipe, el hombre más poderoso del judaísmo de su generación — pedía cada día ser LIBRADO: de los insolentes, del hombre malo, del mal encuentro, del mal yetzer, del mal compañero, del mal vecino, del satán destructor, del juicio duro y del litigante duro — «sea בֶן בְּרִית o no lo sea»: el peligro no distingue judío de gentil.\n\nY la guemará agrega el detalle que convierte la tefilá en enseñanza: אַף עַל גַּב דְּקָיְימִי קְצוּצֵי עֲלֵיהּ דְּרַבִּי — lo decía AUNQUE tenía guardias imperiales apostados a su puerta. El hombre con la mejor seguridad del imperio rezaba como el más desprotegido.\n\nLa lección es doble. Primero: la protección visible no cancela la necesidad de la invisible — los guardias paran al asaltante, no al mal vecino, ni al mal yetzer, ni al satán. Segundo: la lista de Rabbi mezcla sin costura amenazas externas (adam ra, shajén ra) e internas (yetzer ra) — el catálogo del peligro humano es continuo, y la escolta romana solo cubre un tramo. Su tefilá sobrevive en la del amanecer de todo sidur: יְהִי רָצוֹן... שֶׁתַּצִּילֵנוּ... es de las primeras cosas que un judío dice cada mañana.'

      explicacion: 'El tercer medallón dorado — y el de destino más asombroso: la tefilá de Mar bar Ravina es, palabra por palabra, el אֱלֹהַי נְצוֹר que CIERRA LA AMIDÁ EN TODO SIDUR DEL MUNDO hasta hoy. Tres veces al día, cada judío que reza termina sus dieciocho berajot con la oración personal de este sabio de Babilonia.\n\nSu tema es el HABLA — y la simetría es perfecta: la amidá es el ejercicio supremo de la palabra dirigida a HKBH, y su cierre pide por la palabra dirigida a los humanos. Guarda mi lengua del mal, mis labios del engaño; ante los que me maldicen — SILENCIO (נַפְשִׁי תִדּוֹם); que mi alma sea polvo para todos. El que acaba de hablar con Dios pide no herir con la misma boca.\n\nY el movimiento interno es de tres pasos: primero contención (lengua, labios, silencio), después apertura (פְּתַח לִבִּי בְּתוֹרָתֶךָ — abre mi corazón a Tu Torá), y al final protección (anula el consejo de los que traman mal). Que la galería entera haya quedado representada en el sidur precisamente por ESTA tefilá dice algo: de todas las peticiones posibles, la que el pueblo adoptó como cierre diario es la que pide dominar la propia boca.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.tefsab-interactivo')
    : document.querySelector('.tefsab-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#tefsab-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.tefsab-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="tefsab-panel-header">' +
        '<p class="tefsab-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="tefsab-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="tefsab-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="tefsab-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.tefsab-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.tefsab-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="tefsab-vacio">↑ Click en cualquier medallón de la galería para ver la tefilá completa y su explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
