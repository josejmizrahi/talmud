<div class="zman-panel" id="zman-panel">
  <p class="zman-vacio">Selecciona cualquier opinión arriba para ver su detalle.</p>
</div>

<script>
(function() {
  const datos = {
    'eliezer-inicio': {
      titulo: 'Rabí Eliezer · inicio',
      hebreo: 'משעה שקדש היום בערבי שבתות',
      traduccion: 'Desde la hora en que se santifica el día en víspera de Shabat',
      explicacion: 'R. Eliezer adopta el marcador más temprano posible: cuando se entra al Shabat por aceptación voluntaria, antes incluso de que oscurezca completamente. Refleja su estricta interpretación de cuándo comienza la noche halájica.'
    },
    'yehoshua': {
      titulo: 'Rabí Yehoshua · inicio',
      hebreo: 'משעה שהכהנים מטוהרים לאכול בתרומתן',
      traduccion: 'Desde la hora en que los cohanim ya están purificados para comer terumá',
      explicacion: 'Esta es la opinión de la mishná de 2a. Marca la noche por el momento en que los cohanim impuros, tras sumergirse Y esperar al anochecer, ya están metoharim (purificados) para comer terumá. Es POSTERIOR a R. Meir: primero טובלין (la inmersión, todavía de día), después al tzet hakojavim quedan מטוהרים. Es el indicador estándar del anochecer halájico.'
    },
    'meir': {
      titulo: 'Rabí Meir · inicio',
      hebreo: 'משעה שהכהנים טובלין לאכול בתרומתן',
      traduccion: 'Desde la hora en que los cohanim se sumergen para comer terumá',
      explicacion: 'R. Meir marca el momento de la INMERSIÓN, no del comer — y es por eso ANTERIOR a R. Yehoshua en la línea del tiempo. R. Yehuda en 2b lo confronta: "וַהֲלֹא כֹּהֲנִים מִבְּעוֹד יוֹם הֵם טוֹבְלִים!" — ¡los cohanim se sumergen aún de día! R. Meir defiende: se refiere al bein hashmashot de R. Yose, un instante imperceptible como un parpadeo (כהרף עין), donde "uno entra y otro sale". La inmersión sucede en ese instante-frontera, justo antes de la pureza para comer.'
    },
    'janina': {
      titulo: 'Rabí Janina · inicio',
      hebreo: 'משעה שעני נכנס לאכול פתו במלח',
      traduccion: 'Desde la hora en que el pobre entra a comer su pan con sal',
      explicacion: 'Marcador del anochecer basado en la rutina del más humilde, que come temprano por necesidad. La guemará usa esta opinión para demostrar que el shiur del pobre es posterior al del cohén: si fueran iguales, R. Janina sería redundante con R. Yehoshua.'
    },
    'ajai': {
      titulo: 'Rabí Ajai · inicio',
      hebreo: 'משעה שרוב בני אדם נכנסין להסב',
      traduccion: 'Desde la hora en que la mayoría de las personas se recuestan para comer',
      explicacion: 'El marcador más tardío. Se refiere a la cena formal, cuando la mayoría ya terminó sus labores y se reclina para la comida nocturna. Es notablemente después del anochecer, ya en plena noche.'
    },
    'ani-fin': {
      titulo: 'Baraita de 2b · fin: el pobre termina su comida',
      hebreo: 'עַד שָׁעָה שֶׁעוֹמֵד לִיפָּטֵר מִתּוֹךְ סְעוּדָתוֹ',
      traduccion: 'hasta la hora en que (el pobre) se levanta de su comida',
      explicacion: 'En 2b una baraita enseña: "מאימתי קורין את שמע בערבין — משהעני נכנס לאכול פתו במלח, עד שעה שעומד ליפטר מתוך סעודתו" — desde que el pobre entra a comer su pan con sal, HASTA que se levanta. La guemará reconoce: "סֵיפָא, וַדַּאי פְּלִיגָא אַמַּתְנִיתִין" — el seifa de esta baraita ciertamente conflictúa con la mishná. Es un CUARTO marcador del FIN del zman shema, anterior a R. Eliezer: el pobre come breve y se levanta antes de la primera vigilia.'
    },
    'eliezer-fin': {
      titulo: 'Rabí Eliezer · fin',
      hebreo: 'עד סוף האשמורה הראשונה',
      traduccion: 'Hasta el final de la primera vigilia de la noche',
      explicacion: 'La opinión más restrictiva sobre el final del zman, dividiendo la noche en tres vigilias (ashmurot). Da apenas las primeras horas de la noche para recitar shma. Es coherente con su posición temprana sobre el inicio: define el zman en su forma más estrecha.'
    },
    'jajamim': {
      titulo: 'Jajamim · fin',
      hebreo: 'עד חצות',
      traduccion: 'Hasta la medianoche halájica',
      explicacion: 'Opinión de los sabios, intermedia. La halajá final adopta una posición compleja: deOraita el zman se extiende hasta el amanecer (como R. Gamliel), pero derabanan los rabinos lo limitan a jatzot para alejar al ser humano de la transgresión (כדי להרחיק אדם מן העבירה).'
    },
    'gamliel': {
      titulo: 'Rabán Gamliel · fin',
      hebreo: 'עד שיעלה עמוד השחר',
      traduccion: 'Hasta que sube la columna del amanecer',
      explicacion: 'La opinión más permisiva. Toda la noche es potencialmente zman de kriat shma. Esta es la posición que la halajá acepta deOraita: el límite bíblico real es el amanecer. La restricción a jatzot es una valla rabínica posterior.'
    }
  };

  const panel = document.getElementById('zman-panel');
  const opiniones = document.querySelectorAll('.zman-opinion');

  opiniones.forEach(op => {
    op.addEventListener('click', () => {
      const id = op.getAttribute('data-id');
      const d = datos[id];
      if (!d) return;

      opiniones.forEach(o => {
        o.classList.remove('activa', 'dim');
        if (o !== op) o.classList.add('dim');
      });
      op.classList.add('activa');

      panel.innerHTML = `
        <div class="zman-panel-header">
          <h4 class="zman-panel-titulo">${d.titulo}</h4>
          <div class="zman-panel-hebreo">${d.hebreo}</div>
        </div>
        <p class="zman-panel-traduccion">${d.traduccion}</p>
        <p class="zman-panel-explicacion">${d.explicacion}</p>
      `;
    });
  });
})();
</script>
