  <text x="205" y="272" text-anchor="middle" font-size="10" direction="rtl" fill="#8b1a1a">כׇּל הַנּוֹתֵן שָׁלוֹם לַחֲבֵרוֹ קוֹדֶם שֶׁיִּתְפַּלֵּל</text>
  <text x="205" y="290" text-anchor="middle" font-size="10" direction="rtl" fill="#8b1a1a">כְּאִילּוּ עֲשָׂאוֹ בָּמָה</text>
  <text x="205" y="308" text-anchor="middle" font-size="9" fill="#3d2f23" font-style="italic">«como si le hubiera hecho una bamá»</text>
  <text x="78" y="330" font-size="9" fill="#1e3a5f" font-weight="600">el pasuk · Yeshayahu 2:22:</text>
  <text x="205" y="348" text-anchor="middle" font-size="9.5" direction="rtl" fill="#1e3a5f">חִדְלוּ לָכֶם מִן הָאָדָם אֲשֶׁר נְשָׁמָה בְּאַפּוֹ</text>
  <text x="205" y="364" text-anchor="middle" font-size="9.5" direction="rtl" fill="#1e3a5f">כִּי בַמֶּה נֶחְשָׁב הוּא · אַל תִּקְרֵי בַּמֶּה אֶלָּא בָּמָה</text>
  <text x="78" y="384" font-size="8.5" fill="#6b4423" font-style="italic">no leas «¿en qué [es estimado]?» — lee «altar»</text>
  <text x="78" y="400" font-size="8.5" fill="#6b4423" font-style="italic">madrugar hacia un humano = construirle un altar</text>
</g>

  <text x="205" y="654" text-anchor="middle" font-size="10" direction="rtl" fill="#8b1a1a">כׇּל הָעוֹשֶׂה חֲפָצָיו קוֹדֶם שֶׁיִּתְפַּלֵּל</text>

  <text x="78" y="728" font-size="9.5" fill="#3d2f23">la autocorrección: — ¿«bamá» dijiste?</text>
  <text x="205" y="750" text-anchor="middle" font-size="10" direction="rtl" fill="#8b1a1a">לָא — אָסוּר קָאָמֵינָא</text>
  <text x="205" y="770" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">«no: dije prohibido» · la tradición se corrige hacia la sobriedad</text>

  <text x="515" y="672" text-anchor="middle" font-size="10" direction="rtl" fill="#1e3a5f">וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו</text>

      explicacion: 'La mishná acababa de pesar el saludo DENTRO del shema — cuándo se permite por respeto, cuándo por miedo. El editor engancha ahora la otra cara de la misma moneda: el saludo ANTES de la tefilá. שְׁאִילַת שָׁלוֹם es la palabra-puente.\n\nRav no dice que el saludo madrugador sea descortesía ni distracción. Dice algo mucho más fuerte: כְּאִילּוּ עֲשָׂאוֹ בָּמָה — «como si le hubiera hecho una bamá», un altar de los prohibidos, de los que compiten con el Templo. El amigo saludado se convierte en objeto de CULTO.\n\nEl pasuk fuente es Yeshayahu 2:22:\n\n  חִדְלוּ לָכֶם מִן הָאָדָם אֲשֶׁר נְשָׁמָה בְּאַפּוֹ · כִּי בַמֶּה נֶחְשָׁב הוּא\n  «Apartaos del hombre cuyo aliento está en su nariz — pues ¿en qué (bamé) es estimado?»\n\nY la derashá opera con la técnica de אַל תִּקְרֵי: no leas בַּמֶּה (bamé, «¿en qué?») sino בָּמָה (bamá, «altar»). Las mismas letras, otra vocalización — y la pregunta retórica se vuelve diagnóstico: el hombre al que madrugaste ES considerado un altar.\n\nLa lógica de fondo: el amanecer es el momento en que se decide la PRIMERA dirección del día. El aliento del hombre está «en su nariz» — frágil, prestado, recibido cada mañana. Dirigir el primer gesto del día hacia quien tiene el aliento prestado, antes que hacia Quien lo presta, es invertir el orden del culto. No hace falta incienso para construir un altar: basta madrugar hacia la persona equivocada.'
    },
    'shmuel': {
      titulo: 'Shmuel · la lectura directa',

      traduccion: '«¿En qué lo estimaste a él — y no a Dios?»',
      explicacion: 'Shmuel llega a la misma conclusión que Rav, pero por un camino exegético distinto — y la diferencia es instructiva.\n\nRav necesitó el אַל תִּקְרֵי: re-vocalizar בַּמֶּה como בָּמָה para extraer el altar del versículo. Shmuel lee el pasuk TAL COMO ESTÁ: בַּמֶּה נֶחְשָׁב הוּא — «¿en qué es estimado?». Y responde con su propia pregunta: בַּמֶּה חֲשַׁבְתּוֹ לָזֶה וְלֹא לָאֱלוֹהַּ — «¿en qué lo estimaste a ESTE y no a Dios?».\n\nPara Shmuel la acusación ya está en la superficie del versículo. Quien madruga hacia su amigo hizo un cálculo de estima — decidió, con los pies, a quién considera primero. El pasuk pregunta «¿en qué es estimado el hombre?» y el madrugador respondió con su conducta: «en más que Dios».\n\nLas dos vías convergen:\n\n  · Rav: el gesto CONSTRUYE algo — un altar (imagen cúltica)\n  · Shmuel: el gesto REVELA algo — una jerarquía de estima (imagen psicológica)\n\nLa guemará conserva ambas porque juntas completan el cuadro: el problema del saludo madrugador es a la vez objetivo (erige una bamá en el mundo) y subjetivo (delata dónde está el corazón). El primer movimiento de la mañana no es neutro — es una declaración teológica hecha con el cuerpo.'

    'r-aba': {
      titulo: 'La armonización · «el que madruga a su puerta»',
      hebreo: 'תַּרְגְּמַהּ רַבִּי אַבָּא: בְּמַשְׁכִּים לְפִתְחוֹ',
      traduccion: '«Lo tradujo R. Aba: [la prohibición es] del que madruga a su puerta»',
      explicacion: 'Rav Sheshet objeta desde la mishná misma: ¡acabamos de aprender que EN LOS PERAKIM se saluda מִפְּנֵי הַכָּבוֹד, por respeto! Si la mishná permite saludar incluso en medio de las berajot del shema — ¿cómo puede Rav prohibir el saludo antes de la tefilá?\n\nR. Aba resuelve con una precisión que salva las dos fuentes: לָא אֲמַרַן אֶלָּא בְּמַשְׁכִּים לְפִתְחוֹ — la prohibición se dijo solo del que MADRUGA A LA PUERTA del otro.\n\nLa distinción es de geografía moral:\n\n  · CRUZARSE: si te encuentras con alguien camino a la sinagoga, devolver el saludo es humano — eso permite la mishná\n  · PEREGRINAR: levantarse temprano, salir de casa y presentarse ante la PUERTA del otro antes de haberse presentado ante Dios — eso es lo prohibido\n\nLa palabra clave es מַשְׁכִּים — «el que madruga». Es el mismo verbo de la devoción: uno madruga al beit hakenéset, madruga al estudio. Madrugar es el gesto litúrgico por excelencia, la ofrenda de la primera hora. Por eso madrugar A LA PUERTA DE UN HOMBRE es tan grave: no es un saludo casual, es una LITURGIA con destinatario equivocado. La puerta del otro se vuelve santuario, la visita se vuelve peregrinación.\n\nLa armonización de R. Aba convierte la aparente contradicción en un mapa fino: no se prohíbe la cortesía — se prohíbe el culto. La halajá posterior (Shulján Aruj OC 89:2) codifica exactamente esta línea: no ir a la puerta del prójimo a saludarlo antes de shajarit, aunque devolver un saludo encontrado se permite.'

    'r-yona': {
      titulo: 'R. Yona beshem R. Zeira · tus asuntos pueden esperar',
      hebreo: 'כׇּל הָעוֹשֶׂה חֲפָצָיו קוֹדֶם שֶׁיִּתְפַּלֵּל — כְּאִלּוּ בָּנָה בָּמָה · לָא, אָסוּר קָאָמֵינָא',
      traduccion: '«Quien hace sus asuntos antes de rezar — como si construyera una bamá» · «No: dije "prohibido"»',
      explicacion: 'La segunda prohibición del amanecer amplía la primera: no solo el saludo al amigo — también TUS PROPIOS ASUNTOS (חֲפָצָיו) esperan a la tefilá. Quien despacha sus negocios antes de rezar, dice R. Yona en nombre de R. Zeira, es כְּאִלּוּ בָּנָה בָּמָה — como si construyera una bamá.\n\nLa simetría con Rav es exacta: madrugar hacia el amigo hace del AMIGO un altar; madrugar hacia tus asuntos hace de TUS ASUNTOS un altar. El ídolo no necesita ser otra persona — puede ser tu propia agenda.\n\nPero entonces viene el momento más singular de la sugyá. Le preguntan: בָּמָה אֲמַרְתְּ — ¿dijiste «bamá»? Y R. Yona (o R. Zeira) se AUTOCORRIGE: לָא — אָסוּר קָאָמֵינָא. «No: dije PROHIBIDO».\n\nLa tradición se corrige hacia la sobriedad. La imagen de la bamá es potente pero inflacionaria — y la guemará documenta el gesto de un sabio que retira la hipérbole y deja la halajá desnuda: אסור, prohibido, sin metáfora. Es una lección de método: la retórica sirve para despertar, pero la norma debe poder sostenerse sin ella.\n\nEl contraste con el nodo de Rav es deliberado: allá la imagen del altar QUEDÓ (con pasuk y al-tikrei que la respaldan); acá la imagen se RETIRA y queda el issur escueto, apoyado en el pasuk de Tehilim que trae el nodo siguiente. Dos registros del mismo decoro: el saludo madrugador merece la teología del altar; los asuntos propios, la prosa seca de lo prohibido.'

    'rav-idi': {
      titulo: 'Rav Idi bar Avin · primero el tzedek, después el camino',
      hebreo: 'צֶדֶק לְפָנָיו יְהַלֵּךְ וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו',
      traduccion: '«El tzedek irá delante de él — y pondrá sus pasos en el camino» (Tehilim 85:14)',
      explicacion: 'Rav Idi bar Avin aporta la FUENTE del issur — y con ella, su reverso luminoso.\n\nEl pasuk es Tehilim 85:14: צֶדֶק לְפָנָיו יְהַלֵּךְ וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו. La derashá lee el versículo como una SECUENCIA obligada:\n\n  1. PRIMERO: צֶדֶק לְפָנָיו יְהַלֵּךְ — el tzedek (la tefilá, presentarse justo delante de Él) camina delante\n  2. DESPUÉS: וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו — recién entonces pone sus pasos en el camino\n\nEl orden gramatical del versículo se vuelve orden halájico de la mañana: la tefilá va ANTES que el camino, antes que los חֲפָצִים, antes que el primer negocio del día.\n\nY la guemará añade la promesa inversa, la cara dorada de la prohibición: כׇּל הַמִּתְפַּלֵּל וְאַחַר כָּךְ יוֹצֵא לַדֶּרֶךְ — quien reza y DESPUÉS sale al camino — הַקָּדוֹשׁ בָּרוּךְ הוּא עוֹשֶׂה לוֹ חֲפָצָיו: HKBH le hace sus asuntos. El mismo versículo lo dice: si el tzedek va delante, es DIOS quien «pone sus pasos en el camino» — el sujeto de la segunda mitad cambia, y los asuntos del madrugador piadoso pasan a manos más altas.\n\nLa economía espiritual es exacta: los asuntos hechos ANTES de la tefilá son una bamá (o simplemente asur); los mismos asuntos, después de la tefilá, los gestiona el Cielo. No se pierde nada por esperar — se gana un socio. El diagrama pinta este camino en dorado: es la única salida de la cama que no construye altares.'
    },
    'coda-suenos': {
      titulo: 'Coda · los siete días sin sueño',
      hebreo: 'וְשָׂבֵעַ יָלִין בַּל יִפָּקֶד רָע · אַל תִּקְרֵי שָׂבֵעַ אֶלָּא שֶׁבַע',
      traduccion: '«Y saciado se acuesta, no será visitado por el mal» — no leas «saciado» (savea) sino «siete» (sheva)',
      explicacion: 'La misma voz — R. Yona en nombre de R. Zeira — cierra la unidad con una enseñanza que parece de otro tema y no lo es: כׇּל הַלָּן שִׁבְעַת יָמִים בְּלֹא חֲלוֹם נִקְרָא רַע — quien pasa siete noches sin un sueño se llama «malo».\n\nEl pasuk es Mishlei 19:23: וְשָׂבֵעַ יָלִין בַּל יִפָּקֶד רָע — «y saciado se acuesta, no será visitado por el mal». La derashá re-vocaliza: אַל תִּקְרֵי שָׂבֵעַ אֶלָּא שֶׁבַע — no leas שָׂבֵעַ (savea, «saciado») sino שֶׁבַע (sheva, «siete»). Y reordena la sintaxis: quien SIETE noches se acuesta בַּל יִפָּקֶד — sin ser «visitado» (por un sueño) — ese es רָע. El sueño nocturno es una visita del Cielo; siete noches sin visita significan que ya no vale la pena visitarlo.\n\nR. Yojanan replica leyendo el MISMO pasuk como promesa: כׇּל הַמַּשְׂבִּיעַ עַצְמוֹ מִדִּבְרֵי תוֹרָה וְלָן — quien se SACIA (ahora sí שָׂבֵעַ, literal) de palabras de Torá y se acuesta — אֵין מְבַשְּׂרִין אוֹתוֹ בְּשׂוֹרוֹת רָעוֹת: no le anuncian malas noticias. La amenaza y la promesa comparten las mismas letras; la diferencia la pone lo que hiciste antes de acostarte.\n\n¿Por qué esta coda aquí? Porque completa el arco del día. La sugyá legisló el AMANECER: con qué gesto sales de la cama (tefilá antes que el amigo, antes que los asuntos). La coda legisla el ANOCHECER: con qué te metes en la cama (saciado de Torá o no). El decoro previo a la tefilá y el decoro previo al sueño son la misma doctrina: los umbrales del día — despertar y dormir — pertenecen a Dios, y lo que pongas en ellos decide si lo que te visita es una bamá o una berajá.'
    }

  var contenedor = document.currentScript
    ? document.currentScript.closest('.antesrezar-interactivo')
    : document.querySelector('.antesrezar-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#antesrezar-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.antesrezar-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="antesrezar-panel-header">' +
        '<p class="antesrezar-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="antesrezar-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="antesrezar-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="antesrezar-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.antesrezar-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.antesrezar-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="antesrezar-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
