      explicacion: 'En el centro del salmo está la verseta de la PARNASÁ (providencia / sustento).\n\n«פּוֹתֵחַ אֶת יָדֶךָ» — «abres tu mano» — es la imagen central del HKBH como proveedor universal. No solo para los justos. No solo para Israel. Para «todo ser viviente» — לְכָל חַי. Animales, plantas, gentiles, todos.\n\nEsta verseta es:\n\n  · UNIVERSAL — no exclusiva de ningún grupo\n  · CONCRETA — la mano divina se abre con materialidad\n  · ACTUAL — es continuamente verdad, no histórica\n  · COMPLETA — sacia el רָצוֹן (deseo, voluntad), no solo el hambre\n\nLa halajá practica esta verseta con extrema seriedad: cuando se recita Ashrei, hay que CONCENTRARSE especialmente en este versículo. Si uno lo recitó sin kavaná (intención), debe volver y repetirlo. Es el único versículo del Ashrei con este peso especial.\n\nLa razón teológica: la providencia es la confianza fundamental del judío. Recitar la verseta sin atención es expresar oralmente lo que internamente no se cree — una contradicción que invalida la halajá del Ashrei.'

      hebreo: 'אַף עַל פִּי שֶׁיֵּשׁ אַחֵר — אֵין כָּזֶה',
      traduccion: '«Aunque hay otros [con cada propiedad] — no hay como este [con AMBAS]»',
      explicacion: 'Rav Najman bar Yitzjak precisa el argumento: ¿no podríamos elegir OTRO salmo con acróstico (como el 119)? ¿O con providencia (como el 136)?\n\nResponde: solo Tehilim 145 tiene AMBAS propiedades:\n\n  · Tehilim 119 — acróstico mucho más extenso (8 versículos por letra) PERO no tiene la verseta de providencia.\n\n  · Tehilim 136 — «הוֹדוּ לַה\' כִּי טוֹב» — recita la providencia con el estribillo «כִּי לְעוֹלָם חַסְדּוֹ» (26 veces) PERO no es acróstico alfabético.\n\n  · Tehilim 145 — el único que COMBINA: acróstico alfabético + verseta explícita de providencia.\n\nLa lección es metodológica: la halajá NO elige al azar entre los salmos. Hay una razón ESTRUCTURAL precisa para que sea este. R. Eliezer ben Avina no inventa una práctica — DESCUBRE en este salmo una combinación única que lo cualifica para su rol.\n\nEsta es una marca del rabinismo: las prácticas litúrgicas tienen razones discernibles. No son arbitrarias. Si entendemos por qué este salmo, entendemos también qué es lo que la recitación pretende lograr: invocar la totalidad del lenguaje + reconocer la providencia universal.'

    'enigma-nun': {
      titulo: 'El enigma · la נ que falta en el acróstico',
      hebreo: 'הַאַלְפָא בֵּיתָא הַחָסֵר',
      traduccion: 'El acróstico defectuoso',
      explicacion: 'Si el salmo es un acróstico completo, debería tener 22 versículos — uno por cada letra del alfabeto. Pero un conteo cuidadoso revela: tiene SOLO 21.\n\nLa letra ausente es la נ. Después del versículo:\n  · מ — «מַלְכוּתְךָ מַלְכוּת כָּל עוֹלָמִים»\nEl siguiente NO comienza con נ. Salta directamente a:\n  · ס — «סוֹמֵךְ ה\' לְכָל הַנֹּפְלִים»\n\nEl problema es agudo: una OMISIÓN deliberada en un acróstico es un acto literario fuerte. No es error escribal — el salmo está canonizado, y la masorá ha preservado la ausencia con celo.\n\nDos preguntas inmediatas:\n\n  1. ¿POR QUÉ omitió David la נ?\n  2. ¿CÓMO se justifica que este salmo, defectuoso en su estructura formal, sea el «pasaporte» al olam ha-ba?\n\nR. Yojanan da una respuesta brillante a la primera. La segunda se responde implícitamente: la imperfección del salmo no es defecto sino MARCA — David eligió la imperfección con propósito.\n\nEsta es la lección teológica más profunda: a veces lo que falta es lo que más significa.'

    'r-yojanan-amos': {
      titulo: 'R. Yojanan explica · la נ de la caída (Amos 5:2)',
      hebreo: 'מִפְּנֵי שֶׁיֵּשׁ בָּהּ מַפַּלְתָּן שֶׁל שׂוֹנְאֵיהֶם שֶׁל יִשְׂרָאֵל',
      traduccion: '«Porque hay en ella la caída de Israel» (eufemismo: שונאיהם)',
      explicacion: 'R. Yojanan resuelve el enigma con un análisis filológico-profético.\n\nLa letra נ corresponde, en el lenguaje profético, a una versta de doom: Amos 5:2 — «נָפְלָה לֹא תוֹסִיף קוּם בְּתוּלַת יִשְׂרָאֵל» («Cayó, no se levantará más, la virgen de Israel»).\n\nEs uno de los versículos más oscuros del Tanaj. Amos profetiza el fin del Reino del Norte (las 10 tribus). El verbo «נָפְלָה» (cayó) y el sustantivo «בְּתוּלַת יִשְׂרָאֵל» (virgen de Israel) componen una imagen de pérdida irrecuperable.\n\nDavid, AL COMPONER su salmo de alabanza, evitó deliberadamente comenzar un versículo con נ. La razón:\n\n  · El alfabeto hebreo está cargado de asociaciones proféticas.\n  · Cada letra evoca, en la conciencia rabínica, los versículos famosos que comienzan con ella.\n  · La נ, en este contexto, está ligada a «נָפְלָה» — la caída.\n  · David, autor del salmo, evita verbalizar — incluso indirectamente — la caída futura de Israel.\n\nEsta es la aplicación práctica de la máxima del diagrama #8: לְעוֹלָם אַל יִפְתַּח אָדָם פִּיו לְשָׂטָן («que nunca abra el hombre su boca al Satán»). David la cumple a nivel ALFABÉTICO. No solo no dice «caída», ni siquiera USA LA LETRA INICIAL que la evoca.\n\nLa omisión es la marca del cuidado profético del rey-poeta.'

    'doble-lectura': {
      titulo: 'La doble lectura · el oeste lee positivo',
      hebreo: 'בַּמַּעֲרָב מְתָרְצֵי לֵיהּ הָכִי — נָפְלָה לֹא תוֹסִיף לִנְפֹּל עוֹד · קוּם בְּתוּלַת יִשְׂרָאֵל',
      traduccion: 'En el oeste lo resuelven así: «cayó, no caerá más; levántate, virgen de Israel»',
      explicacion: 'La guemará añade una sutileza: en el oeste (Eretz Israel), el versículo de Amos 5:2 se lee con PUNTUACIÓN DIFERENTE:\n\nLectura babli (negativa):\n  «נָפְלָה לֹא תוֹסִיף קוּם בְּתוּלַת יִשְׂרָאֵל»\n  → «Cayó, no [volverá a] levantarse, la virgen de Israel»\n\nLectura yerushalmi (positiva):\n  «נָפְלָה — לֹא תוֹסִיף לִנְפֹּל עוֹד · קוּם בְּתוּלַת יִשְׂרָאֵל»\n  → «Cayó — pero no caerá MÁS; ¡levántate, virgen de Israel!»\n\nLa diferencia es DRAMÁTICA: la lectura del oeste convierte el versículo de Amos en una PROMESA DE RESURRECCIÓN, no en una sentencia de muerte. La virgen cayó UNA VEZ — y precisamente por eso ya no caerá más.\n\nPero — y aquí está el detalle decisivo — INCLUSO con la lectura positiva, David omitió la נ. La precaución del rey-poeta operaba al nivel literal del versículo bíblico tal como llegó a sus manos, no al nivel de las interpretaciones futuras.\n\nLa lección metodológica: el cuidado de no «abrir boca al Satán» opera a nivel del TEXTO, no a nivel del COMENTARIO. Aun cuando el texto pueda releerse positivamente, su PUNTUACIÓN POTENCIAL negativa es ya suficiente razón para esquivarlo. La sensibilidad de David es preventiva, no interpretativa.'

    'samech-somej': {
      titulo: 'La samech del sostén · «הַנֹּפְלִים» esconde la נ',

      traduccion: '«Hashem SOSTIENE a todos los que CAEN»',
      explicacion: 'El detalle midráshico más sutil del diagrama. Aunque David omitió la נ como letra INICIAL de versículo, la palabra «הַנֹּפְלִים» («los que caen») aparece DENTRO del versículo siguiente:\n\n  «סוֹמֵךְ ה\' לְכָל הַנֹּפְלִים» — el versículo de samech (סּ).\n\nLa raíz נפל (caer) ESTÁ presente — pero como letra interna, no como letra inicial. David la escondió.\n\nY el contexto en que aparece es decisivo: HKBH SOSTIENE a los que caen. La caída es nombrada solo en el contexto del SOSTÉN. La palabra «caer» llega siempre acompañada del rescate.\n\nLectura estructural:\n  · La נ de la caída es ESQUIVADA como letra inicial\n  · Pero ENCAJADA dentro de la samech del sostén\n  · El rescate divino LLEGA ANTES que el acto formal de caída\n\nEsto es teología rabínica en estado puro. La caída de Israel es real (David no la niega), pero llega siempre dentro de la red del sostén divino. La estructura misma del salmo lo enseña: la נ EXISTE en el salmo — pero solo como letra interna de la palabra que reconoce el SOSTÉN, no como letra que inicia una verseta independiente de doom.\n\nLa lección es esperanzadora: ni siquiera la caída de Israel queda fuera de la providencia. Israel cae — y HKBH sostiene. Por eso el salmo es un pasaporte al olam ha-ba: contiene la teología completa de la providencia, incluso en su omisión.'

    'doctrina': {
      titulo: 'Doctrina meta · dos vías paralelas al olam ha-ba',

      traduccion: 'Dos caminos paralelos',
      explicacion: 'Los diagramas #10 y #11 forman una DÍADA editorial deliberada:\n\n  · #10 (R. Yojanan, 4b temprano): «¿quién es ben olam ha-ba? — el que junta geulá a tefilá»\n  · #11 (R. Eliezer ben Avina, 4b tardío): «todo el que recita Ashrei tres veces — garantizado ben olam ha-ba»\n\nMisma estructura formal, técnicas distintas:\n\n  | aspecto       | semijá (R. Yojanan) | Ashrei (R. Eliezer)|\n  |---------------|---------------------|--------------------|\n  | tipo          | técnica de orden    | técnica de cantidad|\n  | momento       | en cada tefilá      | tres veces al día  |\n  | foco          | ENTRE brachot       | en una bracha sola |\n  | tema teológico| geulá-presente      | providencia        |\n\nLa lección editorial: el rabinismo NO confía en una sola vía. El olam ha-ba es alcanzable POR MÚLTIPLES TÉCNICAS, todas accesibles, todas precisas.\n\nEsta multiplicación de vías democratiza la salvación. No es un asunto de eliminación («solo X»), sino de proliferación («también Y»). El judío promedio tiene varias herramientas técnicas precisas, todas con la misma promesa.\n\nEl orden en el daf también es significativo. Las dos vías aparecen una tras otra. El editor las quiere PEGADAS — pares de fórmula. Después vendrán otras formulaciones (diagrama #12, etc.). El editor está construyendo una constelación de TÉCNICAS DE SALVACIÓN — un catálogo halájico de cómo alcanzar el olam ha-ba.\n\nLa subversión es notable: en otros sistemas religiosos, la salvación es asunto de pertenencia o de fe abstracta. En el rabinismo de Berajot, es asunto de TÉCNICAS LITÚRGICAS PRECISAS, reproducibles, aprendibles, contables. La doctrina más profunda es accesible POR LA REPETICIÓN ATENTA.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.ashrei-interactivo')
    : document.querySelector('.ashrei-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#ashrei-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.ashrei-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="ashrei-panel-header">' +
        '<p class="ashrei-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="ashrei-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="ashrei-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="ashrei-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.ashrei-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.ashrei-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="ashrei-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
