      hebreo: 'יַעֲסוֹק בְּתוֹרָה',
      traduccion: '«Que se ocupe en Torá»',
      explicacion: 'Si el escalón 1 falla — la voluntad sola no puede — se sube al SEGUNDO: el estudio de Torá.\n\nLa lógica es psicológica precisa: la mente humana NO puede sostener dos focos de atención simultáneamente con intensidad. Si pones la mente a estudiar Torá con concentración real, NO TIENE ESPACIO para procesar la tentación.\n\nLa Torá actúa como DESPLAZADOR DEL OBJETO:\n\n  · El yetzer ha-rá necesita atención mental para operar\n  · Quita la atención del objeto deseado\n  · Dirígela a otro objeto, uno SAGRADO y COMPLEJO\n  · El yetzer ha-rá pierde su combustible y se debilita\n\nEsta enseñanza es práctica: NO es «piensa en cosas santas» en abstracto. Es ESTUDIA TORÁ — un texto concreto, con su gramática, sus paralelos, sus problemas, sus comentarios. La complejidad cognitiva del estudio absorbe toda la capacidad mental.\n\nPor eso David se levantaba a chatzot a estudiar (#5 noche de David). No era piedad romántica — era PROTECCIÓN ACTIVA. Las horas nocturnas son las de mayor vulnerabilidad al yetzer ha-rá (silencio, soledad, fatiga, imágenes). David ocupaba esas horas en Torá precisamente para neutralizar el riesgo.\n\nEl escalón 2 es el preferido de los amoraim. Casi todas las enseñanzas talmúdicas sobre cómo vencer al yetzer recurren al estudio. Es la técnica favorita del rabinismo porque es REPRODUCIBLE, ENSEÑABLE, y compatible con el modo de vida rabínico (la mayoría del tiempo está disponible para estudio).'
    },
    'escalon-3': {
      titulo: '3 · קְרִיאַת שְׁמַע — la confesión verbal de fe',
      hebreo: 'יִקְרָא קְרִיאַת שְׁמַע',
      traduccion: '«Que recite el shema»',
      explicacion: 'Si el escalón 2 falla — incluso el estudio no logra desplazar la tentación — se sube al TERCERO: la recitación del shema.\n\nEl shema (שְׁמַע יִשְׂרָאֵל ה\' אֱלוֹקֵינוּ ה\' אֶחָד) es la confesión verbal MÁS BÁSICA de la fe judía. Su recitación:\n\n  · Verbaliza la unidad divina\n  · Invoca explícitamente a HKBH\n  · Establece al recitante como SIERVO de HKBH (acepta el yugo del reino)\n  · Es el acto litúrgico más cargado del repertorio judío\n\nEl mecanismo aquí no es solo psicológico (como en el escalón 2) — es TEOLÓGICO. El shema no solo distrae la mente: REORIENTA al hombre ante HKBH. Después de proclamar la unidad divina, transgredir es ABSURDO — sería contradecir verbalmente lo que acabas de afirmar.\n\nLa conexión con el diagrama anterior (#12) es directa: el shema sobre la cama protege contra los mazikin externos. Aquí, el shema combate al mazik interno — el yetzer ha-rá que opera dentro del hombre.\n\nNote la elegancia: el mismo recurso (shema) sirve tanto para protección EXTERIOR (mazikin) como INTERIOR (yetzer). Es la herramienta más polivalente del repertorio.\n\n¿Por qué no es el cuarto escalón? Porque el shema es ya práctica HABITUAL — se recita al menos dos veces al día. Si el yetzer ha-rá ya está acostumbrado al shema cotidiano y no se rinde ante su recitación, queda solo lo más drástico. El shema es poderoso, pero no infinito en su poder de impacto sorpresa.'
    },
    'escalon-4': {
      titulo: '4 · יוֹם הַמִּיתָה — el memento mori final',
      hebreo: 'יַזְכִּיר לוֹ יוֹם הַמִּיתָה',
      traduccion: '«Que le recuerde el día de la muerte»',
      explicacion: 'El CUARTO y último escalón: contemplar la propia mortalidad. Cuando todo lo demás ha fallado, queda esta arma final.\n\nLa lógica es psicológica radical: ningún deseo carnal sobrevive a la contemplación honesta de la muerte. La imagen de:\n\n  · El cuerpo en descomposición\n  · La cuenta final ante el tribunal celestial\n  · La nada que queda de los placeres acumulados\n  · La irreversibilidad de las decisiones del último momento\n\nfunciona como ACIDO CORROSIVO sobre los deseos del momento. ¿Qué importa esta gratificación cuando dentro de poco serás polvo?\n\nEsta técnica tiene una historia larga en la tradición ascética (no solo judía). Los estoicos romanos practicaban memento mori. Los monjes cristianos meditaban sobre el cráneo (ad mortem cogita). Reish Lakish la canoniza en el rabinismo como RECURSO LÍMITE.\n\n¿Por qué último? Porque tiene un costo:\n\n  · Es DEPRESIVA si se invoca demasiado — el hombre que vive constantemente recordando la muerte se vuelve melancólico\n  · Es DESGASTANTE — pierde fuerza con la repetición\n  · Es DESPROPORCIONADA para deseos triviales — usar pensamientos de la muerte para resistir, por ejemplo, comer un dulce extra es maladie de la imaginación\n\nReish Lakish lo coloca al final POR DEFENSA del recurso: no se gasta. Se reserva para los momentos en que realmente importa.\n\nEn las codificaciones halájicas posteriores (Rambam, Hil. Tshuvá; Shulján Aruj OC 231), esta técnica aparece pero siempre con la nota de moderación. La vida judía NO es una vida obsesionada con la muerte — es una vida que TIENE la muerte como recurso para los momentos críticos.'
    },
    'doctrina': {
      titulo: 'Doctrina meta · psicología halájica del yetzer',
      hebreo: 'הַסּוּלָּם נֶגֶד הַיֵּצֶר',
      traduccion: 'La escalera contra el yetzer',
      explicacion: 'La escalera de Reish Lakish revela una psicología halájica sofisticada que se separa de visiones simplistas de la lucha contra el deseo.\n\nLa visión simplista dice: «simplemente di no», «ten más fuerza de voluntad», «sé más santo». Esta visión culpa al individuo cuando falla — la falta de voluntad es atribuida a falta de carácter.\n\nLa visión talmúdica es ESTRUCTURAL:\n\n  1. El yetzer ha-rá NO es un enemigo fácil. Es una fuerza COMPLEJA que requiere repertorio técnico.\n\n  2. Hay NIVELES de tentación. Lo que funciona para una tentación menor (escalón 1) no funciona para una mayor (escalón 4).\n\n  3. La halajá PROVEE LAS HERRAMIENTAS — no exige al individuo inventar técnicas. La escala está canonizada. El usuario solo necesita saber escalar.\n\n  4. NO se escala por escalar. Cada nivel tiene su «מוּטָב» (descansa aquí si funciona). El usuario para en el primer nivel efectivo.\n\n  5. Los recursos MÁS PODEROSOS se preservan. Memento mori es el último porque desgastarlo lo debilita.\n\nEsta es una pedagogía espiritual madura. Reconoce que:\n\n  · La gente NO es uniforme — algunos tendrán éxito en escalón 1, otros necesitarán escalón 4\n  · El nivel de éxito puede VARIAR con la circunstancia — el mismo individuo puede necesitar el escalón 4 en un momento crítico aunque normalmente el escalón 1 le baste\n  · La gracia divina no reemplaza la TÉCNICA — el judío se entrena en el repertorio y lo aplica según el caso\n\nEsta escalera se conecta con el resto del perek:\n\n  · #5 (kinor de David) — David se levanta a chatzot y estudia Torá (escalón 2)\n  · #7 (David chasid) — David examina niddah en lugar de pompa (escalón 1 mantenido por estructura de vida)\n  · #11 (Ashrei × 3) — recitación habitual del salmo como práctica preventiva diaria\n  · #12 (cuatro ángeles) — protección EXTERNA contra mazikin · ahora #13 protección INTERNA contra yetzer\n\nEl perek se está revelando como un MANUAL TÉCNICO completo de la vida espiritual judía: protocolos para cada peligro, técnicas para cada nivel, herramientas para cada momento.'
    }
  };

  var contenedor = document.currentScript
    ? document.currentScript.closest('.escalera-interactivo')
    : document.querySelector('.escalera-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#escalera-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.escalera-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="escalera-panel-header">' +
        '<p class="escalera-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="escalera-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="escalera-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="escalera-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.escalera-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.escalera-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="escalera-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
</script>
