  <text x="360" y="168" text-anchor="middle" font-size="8.5" fill="#8b1a1a" font-style="italic">…pero fue מִכְּלָלָא — por inferencia</text>

  <text x="360" y="202" text-anchor="middle" font-size="8" fill="#6b4423" font-style="italic">¿o solo el ORDEN no bloquea? — queda en el aire</text>

  <text x="360" y="476" text-anchor="middle" font-size="12" direction="rtl" fill="#8b1a1a">אֶלָּא שֶׁכְּבָר בִּטְּלוּם מִפְּנֵי תַּרְעוֹמֶת הַמִּינִין</text>
  <text x="360" y="498" text-anchor="middle" font-size="10" fill="#3d2f23" font-style="italic">«También fuera del Mikdash quisieron leer así — pero ya los habían cancelado por la querella de los minim»</text>

  <text x="360" y="534" text-anchor="middle" font-size="8.5" fill="#8b1a1a">lo confirma R. Natan en baraita</text>

      explicacion: 'La guemará de Berajot 11b cita una mishná de OTRO tractado — Tamid — que describe el servicio matinal de los kohanim en el Beit HaMikdash. Es un documento litúrgico de primer orden: la única ventana textual al shema tal como se recitaba DENTRO del Templo.\n\nLa escena: los kohanim del mishmar (la guardia semanal) han terminado los primeros trabajos del sacrificio diario. Antes de continuar, se reúnen en la Lishkat HaGazit y el memuné — el encargado, el oficial que coordina el servicio — les da la orden litúrgica: בָּרְכוּ בְּרָכָה אַחַת, «¡bendigan una berajá!».\n\nLa formulación es notable por su ECONOMÍA: la mishná NO dice cuál berajá. Da por supuesto que los kohanim saben. Esa elipsis — «una berajá», sin nombre — es precisamente lo que la guemará explotará: ¿CUÁL era esa berajá? La pregunta viajó de ciudad en ciudad sin respuesta hasta llegar a Rav Yehuda (ver nodo [1]).\n\nLa estructura del servicio que sigue es exactamente la del shema con sus berajot que conocemos: una berajá antes, las tres parashiyot, berajot después. El shema comunitario NO nació en la sinagoga — nació en el Mikdash, como parte del servicio sacrificial. La sinagoga heredó y adaptó una liturgia sacerdotal.'

      traduccion: '¿Cuál es la «berajá ajat»? Ahava rabba · yotzer or — por inferencia',
      explicacion: 'La pregunta viajó sin respuesta de ciudad en ciudad hasta llegar a Rav Yehuda, quien respondió en nombre de Shmuel: la berajá ajat era AHAVA RABBA — otra vez la misma berajá que domina las dos sugyot anteriores. La fórmula que exime de birkat haTorá y que precede al shema resulta ser TAMBIÉN la berajá matinal de los kohanim del Tamid. Tres sugyot consecutivas colgadas de la misma frase.\n\nPero había otra tradición: de REISH LAKISH se citó que la berajá era YOTZER OR (la berajá de la luz). La disputa parecía frontal — hasta que vino Rav Yitzjak bar Yosef a desarmarla: Reish Lakish nunca lo dijo EXPLÍCITAMENTE. Se le atribuyó מִכְּלָלָא — POR INFERENCIA.\n\n¿Cuál era la inferencia? Reish Lakish había enseñado que de «berajá ajat» se aprende que בְּרָכוֹת אֵין מְעַכְּבוֹת זוֹ אֶת זוֹ — «las berajot no se bloquean entre sí»: quien dijo una sola berajá (y no las dos), cumplió. De ahí se dedujo: si los kohanim decían UNA berajá y era válido, y esa una era yotzer or (la primera del par), entonces Reish Lakish debía sostener que la berajá ajat era yotzer or.\n\nY aquí la guemará hace pura ARQUEOLOGÍA DIALÉCTICA: ¿es válida la inferencia? Quizás Reish Lakish solo quiso decir que el ORDEN no bloquea — que decirlas invertidas no invalida — y no que una sola baste. Si es así, no se puede deducir nada sobre cuál era la berajá del Mikdash. La inferencia QUEDA EN EL AIRE: la guemará documenta el razonamiento, lo cuestiona, y no lo resuelve. Un ejemplo perfecto de cómo el Talmud distingue entre lo que un sabio DIJO y lo que se INFIRIÓ de él.'

      traduccion: '«Y leyeron los Diez Mandamientos»',
      explicacion: 'El dato explosivo de la mishná de Tamid: en el Beit HaMikdash, los Diez Mandamientos se leían CADA MAÑANA, como parte del servicio diario, inmediatamente antes de las tres parashiyot del shema.\n\nLa lógica de su inclusión es evidente: los Aseret HaDibrot son el núcleo de la revelación del Sinaí — el texto que TODO el pueblo escuchó directamente. Leerlos junto al shema cada día era renovar diariamente la experiencia del Sinaí: primero la palabra dicha por HKBH a todo Israel, después la aceptación del yugo del Reino en el shema.\n\nDe hecho, esta práctica está documentada MÁS ALLÁ del Talmud: el papiro Nash (siglo II a.e.c., Egipto) contiene precisamente los Diez Mandamientos seguidos del shema — evidencia material de que la secuencia dibrot + shema era una unidad litúrgica real, no solo del Mikdash.\n\nEse es el peso dramático de este nodo: el texto MÁS sagrado de la revelación tenía su lugar en el rezo diario — y una decisión rabínica posterior lo BORRÓ (Acto 2). Cuando hoy rezamos el shema sin los Diez Mandamientos, rezamos una liturgia podada: el hueco donde estuvo el Sinaí sigue ahí, invisible.'

      traduccion: '«Shemá» · «Vehayá im shamoa» · «Vayomer»',
      explicacion: 'Después de los Diez Mandamientos, los kohanim recitaban las TRES PARASHIYOT del shema — exactamente las mismas tres que componen el shema hasta hoy:\n\n  1 · שְׁמַע (Devarim 6:4-9) — la unidad de HKBH y el amor con todo el corazón\n  2 · וְהָיָה אִם שָׁמוֹעַ (Devarim 11:13-21) — la aceptación del yugo de las mitzvot y la doctrina de la retribución\n  3 · וַיֹּאמֶר (Bamidbar 15:37-41) — los tzitzit y la salida de Egipto\n\nEste es el testimonio histórico más importante de la mishná de Tamid: el shema de tres parashiyot ya estaba PLENAMENTE FORMADO en tiempos del Segundo Templo. No es una construcción rabínica posterior a la destrucción — es una liturgia que los kohanim recitaban dentro del recinto sagrado mientras el Tamid se ofrecía.\n\nLa continuidad es exacta en las parashiyot — y la RUPTURA es exacta en lo que las precedía: en el Mikdash, antes del shema venían los Diez Mandamientos; en nuestra liturgia, no. El shema sobrevivió intacto a la destrucción; los dibrot no sobrevivieron a la polémica.'

      explicacion: 'La secuencia del Mikdash cierra con tres berajot que los kohanim pronunciaban CON EL PUEBLO — es decir, en su nombre y para su beneficio:\n\n  1 · אֱמֶת וְיַצִּיב — la berajá que sigue al shema, la confirmación de que todo lo recitado es «verdadero y firme». La misma berajá que hoy une el shema con la amidá.\n\n  2 · עֲבוֹדָה — la berajá por el SERVICIO mismo: que HKBH acepte la avodá de Israel. Es el antepasado de la berajá de retzé de nuestra amidá. En el Mikdash tenía sentido literal: se pronunciaba mientras el servicio sacrificial estaba efectivamente ocurriendo.\n\n  3 · בִּרְכַּת כֹּהֲנִים — la bendición sacerdotal (Bamidbar 6:24-26), pronunciada por los kohanim con las manos alzadas, tal como pervive en nuestra liturgia.\n\nLa estructura completa del servicio — berajá antes, shema, berajot después — es el ESQUELETO exacto del rezo matinal actual. La mishná de Tamid demuestra que la sinagoga no inventó su liturgia: la heredó del Mikdash, adaptando lo sacrificial (avodá literal) a lo verbal (avodá del corazón).'

    'mishmar': {

      explicacion: 'En Shabat, la secuencia ganaba una berajá más. R. Jelbo explica cuál: el mishmar SALIENTE se la decía al mishmar ENTRANTE.\n\nEl contexto: los kohanim servían en el Mikdash por turnos semanales (mishmarot). Cada Shabat, una guardia terminaba su semana y otra comenzaba. El momento del relevo — dos grupos de kohanim cruzándose en el recinto sagrado — recibió su propia fórmula litúrgica:\n\n«Quien hizo morar Su nombre en esta Casa — haga morar entre ustedes אַהֲבָה (amor), אַחְוָה (hermandad), שָׁלוֹם (paz) y רֵעוּת (amistad)».\n\nLa berajá tiene una arquitectura teológica precisa: el verbo es el mismo — שִׁכֵּן / יַשְׁכִּין, «hacer morar». Así como HKBH hizo MORAR (shikén) Su nombre en el Templo, que haga MORAR (yashkín) la concordia entre los kohanim. La Shejiná en la Casa y la concordia entre los hombres son la misma operación divina en dos planos.\n\nY hay una lección social discreta: el punto más delicado de una institución es el RELEVO — el momento en que un grupo entrega el poder y el privilegio a otro. Precisamente ahí, la liturgia del Mikdash insertó una plegaria de concordia. El turno saliente no se despide con nostalgia ni rivalidad, sino bendiciendo la unidad de los que llegan.'

      traduccion: 'Pensaron instituirlos en Sura — les dijo Rav Jisda: «ya los cancelaron»',
      explicacion: 'Primera escena de restauración fallida: RABBA BAR BAR JANA — el gran viajero y narrador del Talmud — quiso instituir la lectura diaria de los Diez Mandamientos en SURA, la academia fundada por Rav en Babilonia.\n\nEl impulso es comprensible: la mishná de Tamid estaba ahí, canónica, describiendo los dibrot como parte del servicio diario. ¿Por qué no recuperar en la gran academia babilónica lo que el Mikdash practicaba? Restaurar los dibrot era restaurar un fragmento del Templo perdido.\n\nPero RAV JISDA lo frenó con dos palabras: כְּבָר בִּטְּלוּם — «YA los cancelaron». El perfecto es decisivo: no «están cancelados» (estado discutible) sino «ya los cancelaron» (acto histórico consumado). La cancelación no fue una costumbre que se pueda revertir localmente — fue una DECISIÓN tomada frente a un peligro, y mientras la razón del decreto siga concebible, el decreto permanece.\n\nLa escena enseña algo sobre la maquinaria halájica: ni siquiera un sabio del calibre de Rabba bar bar Jana, ni siquiera con una mishná explícita como precedente, puede reabrir unilateralmente lo que una generación anterior cerró por motivo de polémica. El texto queda canónico en el estudio — y vetado en el rezo.'

      explicacion: 'Segunda escena, generaciones más tarde, y el guion se REPITE palabra por palabra: AMEIMAR — amora tardío, líder de Neharde\'a — quiso instituir la lectura diaria de los Diez Mandamientos en su ciudad. Y RAV ASHI — el editor del Talmud Bavli — lo frenó con la misma fórmula exacta: כְּבָר בִּטְּלוּם, «ya los cancelaron».\n\nLa repetición literal es el mensaje. El Talmud pudo registrar un solo intento; registró DOS, en ciudades distintas (Sura, Neharde\'a) y épocas distintas, con el mismo desenlace verbal. El efecto narrativo es de puerta que se cierra dos veces: la restauración de los dibrot no es una idea que fracasó una vez por circunstancias — es una idea ESTRUCTURALMENTE bloqueada.\n\nQue el segundo veto venga de Rav Ashi le da peso editorial: el redactor final del Talmud es también, dentro del relato, el guardián de la cancelación. La decisión tomada contra los minim de la época del Segundo Templo sigue vigente en la Babilonia del siglo V, cuando aquellos minim concretos ya no existían. El decreto sobrevivió a su ocasión — y así quedó codificado: hasta hoy, los Diez Mandamientos no forman parte del rezo diario obligatorio, y la halajá posterior (Rambam, Shulján Aruj) mantiene la cautela contra darles escenario litúrgico destacado.'

      explicacion: 'La sugyá entera cuenta una sola historia con dos actos: el Mikdash rezaba los Diez Mandamientos cada mañana (Acto 1) — y la liturgia posterior los perdió para siempre (Acto 2). Entre ambos actos media una decisión: la polémica con los minim.\n\nLo notable es QUÉ se sacrificó y POR QUÉ:\n\n  · Lo sacrificado: el texto más sagrado de la revelación — las únicas palabras que todo Israel escuchó directamente en Sinaí.\n\n  · La razón: no una duda sobre su santidad, sino el USO que los herejes hacían de su prominencia. El privilegio litúrgico de los dibrot se había vuelto munición contra el resto de la Torá.\n\nLa lección es incómoda y honesta: A VECES LA TEOLOGÍA DEFENSIVA PODA EL REZO. La liturgia no es solo expresión de amor a HKBH — es también un campo de batalla doctrinal, y sus textos pueden ser removidos por consideraciones estratégicas. Los rabinos prefirieron un sidur mutilado a una Torá jerarquizada por los herejes.\n\nY la segunda lección, la de Sura y Neharde\'a: lo que se borra por polémica NO VUELVE fácilmente. Dos intentos de restauración, dos vetos idénticos. La cancelación defensiva tiende a sobrevivir a la amenaza que la justificó — porque nadie puede garantizar que la amenaza no renazca. El hueco donde estuvo el Sinaí sigue en nuestro rezo matinal, y la sugyá de Berajot 12a es su acta de defunción: el Talmud registra con precisión lo que la liturgia perdió, para que al menos el ESTUDIO conserve lo que el REZO tuvo que soltar.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.tamid-interactivo')
    : document.querySelector('.tamid-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#tamid-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.tamid-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="tamid-panel-header">' +
        '<p class="tamid-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="tamid-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="tamid-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="tamid-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.tamid-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.tamid-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="tamid-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
