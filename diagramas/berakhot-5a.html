<!-- TÍTULO -->
<text x="360" y="28" text-anchor="middle" font-size="16" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">Berajot 5a · La pelea con el yetzer y los yisurim shel ahavá</text>
<text x="360" y="48" text-anchor="middle" font-size="12" fill="#6b4423">cuatro escalones de defensa · la espada de dos filos · diagnóstico del sufrimiento · los tres regalos</text>

<!-- ====================================================================== -->
<!-- SECCIÓN A · LA ESCALERA CONTRA EL YETZER · L1                           -->
<!-- ====================================================================== -->
<text x="60" y="84" font-size="10" fill="#8b1a1a" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">LA ESCALERA · REISH LAKISH · ESCALAR LA DEFENSA · L1</text>

<g class="yisurim-nodo" data-id="yetzer-escalera">
  <rect x="60" y="96" width="640" height="208" rx="6" fill="rgba(139,26,26,0.06)" stroke="#8b1a1a" stroke-width="1.3"/>
  <text x="78" y="118" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">"לְעוֹלָם יַרְגִּיז אָדָם יֵצֶר טוֹב עַל יֵצֶר הָרַע" — Reish Lakish, sobre Tehilim 4:5</text>

  <!-- Escalera visual: 4 escalones ascendentes desde abajo-izquierda hasta arriba-derecha -->
  <!-- Cada escalón = 130w × 36h, posiciones progresivas -->

  <!-- Escalón 1 (más bajo): רגזו -->
  <rect x="78" y="262" width="150" height="34" rx="3" fill="rgba(139,26,26,0.10)" stroke="#8b1a1a" stroke-width="0.7"/>
  <text x="153" y="278" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#8b1a1a" letter-spacing="1">PASO 1 · רִגְזוּ</text>
  <text x="153" y="291" text-anchor="middle" font-size="9" fill="#3d2f23" font-style="italic">enfurece tu yetzer tov</text>

  <!-- Escalón 2: Torá -->
  <rect x="218" y="222" width="150" height="34" rx="3" fill="rgba(139,26,26,0.12)" stroke="#8b1a1a" stroke-width="0.8"/>
  <text x="293" y="238" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#8b1a1a" letter-spacing="1">PASO 2 · אִמְרוּ</text>
  <text x="293" y="251" text-anchor="middle" font-size="9" fill="#3d2f23" font-style="italic">ocúpate en Torá</text>

  <!-- Escalón 3: Shema -->
  <rect x="358" y="182" width="150" height="34" rx="3" fill="rgba(139,26,26,0.14)" stroke="#8b1a1a" stroke-width="0.9"/>
  <text x="433" y="198" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#8b1a1a" letter-spacing="1">PASO 3 · עַל מִשְׁכַּבְכֶם</text>
  <text x="433" y="211" text-anchor="middle" font-size="9" fill="#3d2f23" font-style="italic">recita kriat shema</text>

  <!-- Escalón 4 (más alto): Día de la muerte -->
  <rect x="498" y="142" width="180" height="34" rx="3" fill="rgba(139,26,26,0.17)" stroke="#8b1a1a" stroke-width="1.0"/>
  <text x="588" y="158" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#8b1a1a" letter-spacing="1">PASO 4 · וְדֹמּוּ סֶלָה</text>
  <text x="588" y="171" text-anchor="middle" font-size="9" fill="#3d2f23" font-style="italic">recuerda el día de la muerte</text>

  <!-- Flechas escalando -->
  <line x1="228" y1="279" x2="218" y2="245" stroke="#8b1a1a" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="368" y1="239" x2="358" y2="205" stroke="#8b1a1a" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="508" y1="199" x2="498" y2="165" stroke="#8b1a1a" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Etiqueta de "אם לאו" -->
  <text x="78" y="138" font-size="9" fill="#6b4423" font-style="italic">si vence — מוטב. Si no — escalar.</text>
  <text x="78" y="152" font-size="9" fill="#6b4423" font-style="italic">el verso entero (תהילים ד:ה) se lee como secuencia ascendente</text>
</g>

<!-- ====================================================================== -->
<!-- SECCIÓN B · TORÁ · REVELACIÓN · L2-L7                                   -->
<!-- ====================================================================== -->
<text x="60" y="332" font-size="10" fill="#b8860b" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">TORÁ COMO REVELACIÓN COMPLETA Y ESPADA · L2-L7</text>

<g class="yisurim-nodo" data-id="seis-niveles">
  <rect x="60" y="344" width="640" height="80" rx="6" fill="rgba(184,134,11,0.08)" stroke="#b8860b" stroke-width="1.2"/>
  <text x="78" y="365" font-size="10" font-family="'JetBrains Mono', monospace" fill="#b8860b" letter-spacing="1.2">CINCO NIVELES DE TORÁ EN UN SOLO VERSO · L2</text>
  <text x="682" y="365" text-anchor="end" font-size="11" direction="rtl" fill="#b8860b" font-weight="500">כֻּלָּם נִתְּנוּ לְמֹשֶׁה מִסִּינַי</text>
  <text x="78" y="385" font-size="10" fill="#3d2f23"><tspan font-weight="500">לוחות</tspan> = 10 dibrot · <tspan font-weight="500">תורה</tspan> = mikrá · <tspan font-weight="500">מצוה</tspan> = mishná · <tspan font-weight="500">אשר כתבתי</tspan> = neviim+ketuvim · <tspan font-weight="500">להורותם</tspan> = Talmud</text>
  <text x="78" y="403" font-size="10" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">Reish Lakish encuentra los cinco corpus de la tradición en una sola frase del Sinai (Shemot 24:12)</text>
  <text x="78" y="418" font-size="9" fill="#6b4423" font-style="italic">la Torá-Oral entera ya estaba dada en el monte — no es invención posterior</text>
</g>

<g class="yisurim-nodo" data-id="shema-espada">
  <rect x="60" y="438" width="315" height="92" rx="6" fill="rgba(30,58,95,0.08)" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="78" y="460" font-size="10" font-family="'JetBrains Mono', monospace" fill="#1e3a5f" letter-spacing="1.2">R. YITZJAK · ESPADA Y DEMONIOS · L3-L4</text>
  <text x="78" y="481" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">El que recita shema en la cama es como quien</text>
  <text x="78" y="497" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">empuña una espada de dos filos.</text>
  <text x="358" y="497" text-anchor="end" font-size="11" direction="rtl" fill="#1e3a5f" font-weight="500">חֶרֶב פִּיפִיּוֹת</text>
  <text x="78" y="518" font-size="10" fill="#3d2f23">y los mazikin (demonios) se apartan de él (בְּדֵילִין הֵימֶנּוּ).</text>
</g>

<g class="yisurim-nodo" data-id="tora-protege">
  <rect x="385" y="438" width="315" height="92" rx="6" fill="rgba(184,134,11,0.08)" stroke="#b8860b" stroke-width="1.2"/>
  <text x="403" y="460" font-size="10" font-family="'JetBrains Mono', monospace" fill="#b8860b" letter-spacing="1.2">REISH LAKISH ↔ R. YOJANÁN · L5-L6</text>
  <text x="403" y="481" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">RL: la Torá aparta los yisurim ("רֶשֶׁף").</text>
  <text x="403" y="500" font-size="10" fill="#3d2f23">R. Yojanán objeta: hasta los niños lo saben — el verso</text>
  <text x="403" y="515" font-size="10" fill="#3d2f23">"לֹא אָשִׂים עָלֶיךָ" lo dice claro.</text>
  <text x="403" y="529" font-size="9" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">la novedad real: quien PUEDE estudiar y no lo hace — recibe yisurim feos</text>
</g>

<g class="yisurim-nodo" data-id="dios-alegre">
  <rect x="60" y="544" width="640" height="70" rx="6" fill="rgba(184,134,11,0.07)" stroke="#b8860b" stroke-width="1.1"/>
  <text x="78" y="565" font-size="10" font-family="'JetBrains Mono', monospace" fill="#b8860b" letter-spacing="1.2">R. ZEIRA / R. JANINA BAR PAPÁ · L7</text>
  <text x="78" y="586" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">A diferencia del mortal — vendedor triste, comprador alegre — HKBH dio la Torá Y SE ALEGRÓ.</text>
  <text x="682" y="586" text-anchor="end" font-size="11" direction="rtl" fill="#b8860b" font-weight="500">לֶקַח טוֹב נָתַתִּי לָכֶם · אַל תַּעֲזֹבוּ</text>
  <text x="78" y="604" font-size="9" fill="#6b4423" font-style="italic">"un buen regalo les di — no la abandonen" (Mishlei 4:2) — la Torá no es entrega que duele al dador</text>
</g>

<!-- ====================================================================== -->
<!-- SECCIÓN C · YISURIM SHEL AHAVÁ · L8-L18                                 -->
<!-- ====================================================================== -->
<text x="60" y="642" font-size="10" fill="#8b1a1a" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">YISURIM SHEL AHAVÁ · DIAGNÓSTICO + ACEPTACIÓN + DEBATE · L8-L18</text>

<g class="yisurim-nodo" data-id="yisurin-diagnostico">
  <rect x="60" y="654" width="640" height="98" rx="6" fill="rgba(139,26,26,0.07)" stroke="#8b1a1a" stroke-width="1.2"/>
  <text x="78" y="675" font-size="10" font-family="'JetBrains Mono', monospace" fill="#8b1a1a" letter-spacing="1.2">RAVA / RAV JISDA · TRES PASOS DIAGNÓSTICOS · L8-L9</text>
  <!-- Tres pasos en cadena -->
  <g transform="translate(78,685)">
    <rect x="0" y="0" width="180" height="44" rx="4" fill="rgba(139,26,26,0.10)" stroke="#8b1a1a" stroke-width="0.8"/>
    <text x="90" y="17" text-anchor="middle" font-size="10" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">1. פַּשְׁפֵּשׁ בְּמַעֲשֶׂיךָ</text>
    <text x="90" y="33" text-anchor="middle" font-size="9" fill="#3d2f23">examina tus actos</text>
    <line x1="180" y1="22" x2="210" y2="22" stroke="#8b1a1a" stroke-width="1" marker-end="url(#flecha-rojo-5a)"/>
    <rect x="216" y="0" width="180" height="44" rx="4" fill="rgba(139,26,26,0.10)" stroke="#8b1a1a" stroke-width="0.8"/>
    <text x="306" y="17" text-anchor="middle" font-size="10" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">2. תְּלֵה בְּבִטּוּל תּוֹרָה</text>
    <text x="306" y="33" text-anchor="middle" font-size="9" fill="#3d2f23">si no hallas culpa — bitul Torá</text>
    <line x1="396" y1="22" x2="426" y2="22" stroke="#8b1a1a" stroke-width="1" marker-end="url(#flecha-rojo-5a)"/>
    <rect x="432" y="0" width="180" height="44" rx="4" fill="rgba(139,26,26,0.15)" stroke="#8b1a1a" stroke-width="1.1"/>
    <text x="522" y="17" text-anchor="middle" font-size="10" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">3. יִסּוּרִים שֶׁל אַהֲבָה</text>
    <text x="522" y="33" text-anchor="middle" font-size="9" fill="#3d2f23">si tampoco — son de amor</text>
  </g>
  <text x="78" y="745" font-size="9" fill="#6b4423" font-style="italic">la secuencia diagnóstica del sufrimiento: examen → bitul Torá → אהבה. Verso clave: "כִּי אֶת אֲשֶׁר יֶאֱהַב ה׳ יוֹכִיחַ"</text>
</g>

<g class="yisurim-nodo" data-id="yisurin-aceptacion">
  <rect x="60" y="766" width="640" height="80" rx="6" fill="rgba(139,26,26,0.07)" stroke="#8b1a1a" stroke-width="1.1"/>
  <text x="78" y="787" font-size="10" font-family="'JetBrains Mono', monospace" fill="#8b1a1a" letter-spacing="1.2">RAVA · RAV SEJORÁ · RAV HUNÁ · ACEPTAR CON AMOR · L10-L12</text>
  <text x="682" y="787" text-anchor="end" font-size="11" direction="rtl" fill="#8b1a1a" font-weight="500">וַה׳ חָפֵץ דַּכְּאוֹ</text>
  <text x="78" y="808" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">"al que HKBH desea, LO APLASTA con sufrimiento" — pero solo cuando LO ACEPTA con amor.</text>
  <text x="78" y="826" font-size="10" fill="#3d2f23">Como el asham debe ser voluntario, los yisurim también. Recompensa: יִרְאֶה זֶרַע יַאֲרִיךְ יָמִים + el talmud se sostiene en sus manos.</text>
  <text x="78" y="841" font-size="9" fill="#6b4423" font-style="italic">la voluntariedad transforma el dolor en oferta — sin consentimiento, el sufrimiento no cumple su función</text>
</g>

<g class="yisurim-nodo" data-id="yisurin-debate">
  <rect x="60" y="860" width="640" height="98" rx="6" fill="rgba(139,26,26,0.07)" stroke="#8b1a1a" stroke-width="1.1"/>
  <text x="78" y="881" font-size="10" font-family="'JetBrains Mono', monospace" fill="#8b1a1a" letter-spacing="1.2">¿QUÉ SON YISURIM SHEL AHAVÁ? · TRES OPINIONES · L13-L16</text>
  <text x="78" y="901" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">R. Yaakov bar Idi: los que NO causan bitul Torá ("ומתורתך תלמדנו")</text>
  <text x="78" y="918" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">R. Aja bar Janina: los que NO causan bitul tefilá ("לא הסיר תפלתי")</text>
  <text x="78" y="935" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">R. Yojanán (vía R. Aba): AMBOS son de amor — el verso secreto: אל תקרי תְלַמְּדֶנּוּ אלא תְלַמְּדֵנוּ</text>
  <text x="78" y="952" font-size="9" fill="#6b4423" font-style="italic">la propia doctrina sobre yisurim se DERIVA del verso — la Torá nos enseña a leer así</text>
</g>

<g class="yisurim-nodo" data-id="esclavo-sal">
  <rect x="60" y="972" width="640" height="76" rx="6" fill="rgba(30,107,90,0.07)" stroke="#1e6b5a" stroke-width="1.1"/>
  <text x="78" y="993" font-size="10" font-family="'JetBrains Mono', monospace" fill="#1e6b5a" letter-spacing="1.2">¿POR QUÉ DUELE LIMPIAR? · KAL VAJÓMER + GEZERÁ SHAVÁ · L17-L18</text>
  <text x="78" y="1014" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">KAL VAJÓMER: si un esclavo se libera por perder UN diente o UN ojo, los yisurim que cleanan TODO el cuerpo — מכ"ש.</text>
  <text x="78" y="1032" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">GEZERÁ SHAVÁ (Reish Lakish): "ברית" en la sal · "ברית" en los yisurim — sal que endulza la carne · yisurim que purifican el alma.</text>
</g>

<!-- ====================================================================== -->
<!-- SECCIÓN D · TRES REGALOS POR SUFRIMIENTO · L19-L22                      -->
<!-- ====================================================================== -->
<text x="60" y="1076" font-size="10" fill="#5a3a8a" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">TRES REGALOS · TODOS A TRAVÉS DEL SUFRIMIENTO · RASHBÍ · L19-L22</text>

<g class="yisurim-nodo" data-id="tres-regalos">
  <rect x="60" y="1088" width="640" height="84" rx="6" fill="rgba(90,58,138,0.07)" stroke="#5a3a8a" stroke-width="1.2"/>
  <!-- Tres cajas internas -->
  <g transform="translate(78,1100)">
    <rect x="0" y="0" width="195" height="60" rx="4" fill="rgba(90,58,138,0.10)" stroke="#5a3a8a" stroke-width="0.8"/>
    <text x="97" y="20" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">תּוֹרָה</text>
    <text x="97" y="38" text-anchor="middle" font-size="10" fill="#3d2f23">Torá</text>
    <text x="97" y="52" text-anchor="middle" font-size="8" fill="#6b4423" font-style="italic">אשרי הגבר אשר תיסרנו</text>

    <rect x="205" y="0" width="195" height="60" rx="4" fill="rgba(90,58,138,0.10)" stroke="#5a3a8a" stroke-width="0.8"/>
