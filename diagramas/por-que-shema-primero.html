      explicacion: 'El primer bloque del shema litúrgico: la parashá de Devarim 6:4–9. Su contenido es la DECLARACIÓN — la unidad de HaShem, el amor con todo el corazón, y las prácticas que fijan esa declaración en el cuerpo y la casa: repetirla a los hijos (וְשִׁנַּנְתָּם), atarla al brazo y la cabeza (וּקְשַׁרְתָּם — tefilín), escribirla en las puertas (וּכְתַבְתָּם — mezuzá).\n\nEn el lenguaje de la mishná, recitar esta parashá es aceptar עוֹל מַלְכוּת שָׁמַיִם — el YUGO DEL REINO DE LOS CIELOS. No es todavía ninguna mitzvá concreta: es el acto previo a todas — reconocer al Rey.\n\nEl dato estructural que dispara toda la sugyá: este bloque NO es el primero en la Torá. Las tres parashiyot ni siquiera están juntas — dos en Devarim (capítulos 6 y 11), una en Bamidbar (capítulo 15, que en el orden bíblico viene ANTES que las otras dos). La liturgia las cosió en un orden propio.\n\nEse orden no-bíblico es una decisión editorial que exige justificación. La mishná pregunta explícitamente: לָמָּה קָדְמָה פָּרָשַׁת שְׁמַע — ¿por qué shema va primero? Las dos respuestas (R. Yehoshua ben Korjá en 13a, R. Shimon bar Yojai en 14b) son los dos sistemas de flechas de este diagrama.'

      traduccion: '«Y será, si escuchan Mis mandamientos…» (Devarim 11:13–21)',
      explicacion: 'El segundo bloque: Devarim 11:13–21. Su tema ya no es la declaración de fe sino sus CONSECUENCIAS: si escuchan los mandamientos — lluvia a su tiempo, cosecha, saciedad; si no — sequía y exilio. Es la parashá del pacto en acción: mandamiento, recompensa, castigo.\n\nPor eso la mishná la llama עוֹל מִצְוֹת — el YUGO DE LAS MITZVOT. Aquí el orante pasa de reconocer al Rey a aceptar Sus órdenes concretas.\n\nDos datos alimentan las dos razones del orden:\n\n  1. Viene DESPUÉS de shema (razón de R. Yehoshua ben Korjá): las órdenes presuponen al Rey. La secuencia Reino → mandamientos es lógica, no cronológica.\n\n  2. Viene ANTES de vayomer (segunda cláusula de la misma respuesta): esta parashá rige בֵּין בַּיּוֹם וּבֵין בַּלַּיְלָה — de día y de noche — porque contiene el estudio de la Torá (enseñar a los hijos), obligación sin horario. Vayomer (tzitzit) rige solo de día. Lo de vigencia total precede a lo de vigencia parcial.\n\nEn la escalera de R. Shimon bar Yojai, este bloque es el peldaño intermedio: tiene enseñar + hacer, pero ya no la dimensión completa de aprender que caracteriza a shema. Dos sistemas distintos — y ambos lo colocan exactamente en el medio.'

      traduccion: '«Y dijo HaShem a Moshé… que se hagan tzitzit» (Bamidbar 15:37–41)',
      explicacion: 'El tercer bloque: Bamidbar 15:37–41 — la parashá de TZITZIT. Su contenido es una mitzvá única y concreta: los flecos en las esquinas del vestido, «para que los vean y recuerden todos los mandamientos». Cierra con la salida de Egipto — la razón histórica de toda la relación.\n\nSu posición final tiene dos justificaciones convergentes:\n\n  1. R. Yehoshua ben Korjá: rige אֵינוֹ נוֹהֵג אֶלָּא בַּיּוֹם — SOLO DE DÍA. El tzitzit depende de la vista («para que los VEAN»), y de noche no se ve. Una mitzvá de vigencia parcial va después de las de vigencia total.\n\n  2. R. Shimon bar Yojai: contiene SOLO la dimensión de hacer — לַעֲשׂוֹת. Ni aprender ni enseñar: únicamente la acción. Es el peldaño mínimo de la escalera.\n\nHay una ironía estructural deliberada: en el orden de la Torá, esta parashá (Bamidbar) viene ANTES que las otras dos (Devarim). La liturgia la movió al final. El shema recitado no es una cita de la Torá — es un MONTAJE con lógica propia: del Reino al mandamiento a la acción; de lo completo a lo mínimo.\n\nY sin embargo el bloque «mínimo» carga el ancla de todo: la salida de Egipto, la memoria fundante. Lo último no es lo menos importante — es lo más concreto.'

    'yugo': {

      traduccion: '«Para que acepte sobre sí el yugo del Reino de los Cielos primero, y después acepte sobre sí el yugo de las mitzvot»',
      explicacion: 'La respuesta de R. Yehoshua ben Korjá en la mishná (13a) a la pregunta לָמָּה קָדְמָה — ¿por qué shema va primero?\n\nLa fórmula distingue dos YUGOS:\n\n  · עוֹל מַלְכוּת שָׁמַיִם — el yugo del Reino de los Cielos: reconocer que HaShem es Rey. Es la parashá de shema.\n  · עוֹל מִצְוֹת — el yugo de las mitzvot: aceptar Sus órdenes concretas. Es la parashá de vehaya im shamoa.\n\nEl orden es de LÓGICA POLÍTICA elemental: nadie acepta mandamientos de un Rey que aún no reconoció. La orden solo obliga si viene de una autoridad aceptada. Primero la soberanía, después la legislación.\n\nLa palabra יְקַבֵּל («acepte») es decisiva: la recitación del shema NO es informativa sino PERFORMATIVA. El orante no describe que Dios es Uno — ACEPTA un yugo, cada mañana y cada noche, de nuevo. La metáfora del yugo (el arnés del buey) es deliberadamente corporal: uno se somete a ser dirigido.\n\nY la secuencia se repite en escala menor: וְהָיָה antes de וַיֹּאמֶר porque el segundo bloque rige de día y de noche (contiene Torá, sin horario) y el tercero (tzitzit) solo de día. Doble criterio en una sola respuesta: primero jerarquía teológica (Reino → mitzvot), después alcance temporal (siempre → solo de día).\n\nEl orden litúrgico resulta ser un MANIFIESTO comprimido: así se estructura la vida religiosa — soberanía, mandamiento, práctica.'

    'dia-noche': {

      explicacion: 'La segunda cláusula de la respuesta de R. Yehoshua ben Korjá: explicado por qué shema encabeza, falta explicar por qué וְהָיָה precede a וַיֹּאמֶר. La respuesta cambia de criterio — ya no jerarquía de yugos sino ALCANCE TEMPORAL.\n\n  · וְהָיָה אִם שָׁמוֹעַ rige בֵּין בַּיּוֹם וּבֵין בַּלַּיְלָה — de día Y de noche. ¿Por qué? Porque contiene וְלִמַּדְתֶּם אֹתָם אֶת בְּנֵיכֶם — el ESTUDIO de la Torá, obligación sin horario: «meditarás en ella de día y de noche».\n\n  · וַיֹּאמֶר rige אֵינוֹ נוֹהֵג אֶלָּא בַּיּוֹם — solo de día. El tzitzit depende de la VISTA (וּרְאִיתֶם אֹתוֹ — «y lo verán»), y la noche no es tiempo de ver. De ahí, de hecho, la halajá de la mishná 1:2: el shema de la mañana se lee desde que se distingue entre el azul y el blanco — el criterio del tzitzit.\n\nEl principio ordenador: LO DE VIGENCIA TOTAL PRECEDE A LO DE VIGENCIA PARCIAL. Una obligación que no se apaga nunca tiene precedencia litúrgica sobre una que rige solo la mitad del ciclo.\n\nNótese la elegancia del sistema completo: el primer par (shema → vehaya) se ordena por CONTENIDO teológico; el segundo par (vehaya → vayomer) por EXTENSIÓN temporal. Dos criterios heterogéneos que producen un solo orden coherente — señal de que el editor de la liturgia trabajaba con más de una vara de medir, exactamente lo que la gemará en 14b va a hacer explícito con חֲדָא וְעוֹד קָאָמַר.'

    'escalera': {

      traduccion: '«Es justo que shema preceda… porque contiene aprender, enseñar y hacer»',
      explicacion: 'La baraita de R. Shimon bar Yojai (14b) ofrece un segundo sistema completo para el mismo orden — ya no teológico sino PEDAGÓGICO. Cada parashá se mide por cuántas de las tres dimensiones del pacto contiene:\n\n  · לִלְמוֹד — APRENDER: recibir la Torá uno mismo\n  · לְלַמֵּד — ENSEÑAR: transmitirla a otros\n  · לַעֲשׂוֹת — HACER: cumplirla en actos\n\nLa cuenta por parashá:\n\n  שְׁמַע — LAS TRES: aprender y enseñar (וְשִׁנַּנְתָּם לְבָנֶיךָ — «las repetirás a tus hijos») y hacer (וּקְשַׁרְתָּם, וּכְתַבְתָּם — tefilín y mezuzá). Puntaje: 3.\n\n  וְהָיָה אִם שָׁמוֹעַ — DOS: enseñar (וְלִמַּדְתֶּם אֹתָם אֶת בְּנֵיכֶם) y hacer (tefilín, mezuzá). Puntaje: 2.\n\n  וַיֹּאמֶר — UNA: solo hacer (וְעָשׂוּ לָהֶם צִיצִת). Ni aprender ni enseñar. Puntaje: 1.\n\nEl orden litúrgico resulta ser una PENDIENTE DESCENDENTE: 3 → 2 → 1. De la parashá más completa a la más simple; del pacto en todas sus dimensiones al acto mínimo.\n\nLa lectura pedagógica es poderosa: cada mañana el orante RECORRE esa pendiente. Empieza en la totalidad (aprender-enseñar-hacer), pasa por la transmisión (enseñar-hacer) y aterriza en la práctica desnuda (hacer). La liturgia enseña, con su propia estructura, que la vida religiosa completa incluye las tres dimensiones — y que incluso quien solo llega a «hacer» sigue dentro del shema.\n\nPero esta razón llega cuando la mishná YA había respondido con el yugo del Reino. La gemará nota la redundancia — y su solución es el último nodo del diagrama.'
    },
    'jada-veod': {
      titulo: 'La armonización · una razón y otra más',
      hebreo: 'וְתִיפּוֹק לֵיהּ מִדְּרַבִּי יְהוֹשֻׁעַ בֶּן קׇרְחָה — חֲדָא וְעוֹד קָאָמַר',
      traduccion: '«¿Y que lo deduzca de R. Yehoshua ben Korjá? — Dijo una razón, y otra más»',
      explicacion: 'La gemará hace la pregunta editorial obligada: si R. Yehoshua ben Korjá ya explicó el orden (el yugo del Reino primero), ¿para qué necesita R. Shimon bar Yojai una segunda razón? וְתִיפּוֹק לֵיהּ — «¿y que lo deduzca de» lo ya dicho?\n\nLa respuesta es una fórmula de dos palabras que es todo un método: חֲדָא וְעוֹד קָאָמַר — «dijo UNA razón Y OTRA MÁS».\n\nLas dos razones no compiten — se APILAN. Y no son intercambiables, porque operan en registros distintos:\n\n  · R. Yehoshua ben Korjá da la razón TEOLÓGICA: la jerarquía de los yugos — Reino antes que mandamientos, vigencia total antes que parcial.\n\n  · R. Shimon bar Yojai da la razón PEDAGÓGICA: la completitud decreciente — tres dimensiones, luego dos, luego una.\n\nUn mismo orden, dos lógicas independientes que convergen. Para el editor del Talmud eso no es redundancia — es ROBUSTEZ. Un orden justificado por dos sistemas distintos está doblemente fundado.\n\nEl paralelo con birkat haTorá (11b) es exacto: allí, ante tres fórmulas rivales de berajá, el veredicto fue הִלְכָּךְ לֵימְרִינְהוּ לְכוּלְּהוּ — «digámoslas todas». Aquí, ante dos razones para un orden, el veredicto es «dijo una y otra más». El método es el mismo: el Talmud NO ECONOMIZA razones. Ante algo valioso — una berajá, un orden litúrgico — la abundancia de justificaciones es virtud, no defecto.\n\nEl resultado final: el orden shema → vehaya → vayomer queda como manifiesto doble. Teológico: Reino → mandamiento → acción. Pedagógico: completo → parcial → mínimo. Cada mañana, el orante recorre ambas pendientes a la vez.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.orden3-interactivo')
    : document.querySelector('.orden3-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#orden3-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.orden3-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="orden3-panel-header">' +
        '<p class="orden3-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="orden3-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="orden3-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="orden3-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.orden3-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.orden3-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="orden3-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
