  <text x="128" y="896" font-size="10" fill="#3d2f23">R. Yojanan le da la mano y lo levanta · <tspan font-style="italic" fill="#1e3a5f">el SANO cura al enfermo</tspan></text>

  <text x="128" y="932" font-size="9" fill="#6b4423" font-style="italic">incluso el gran sabio enfermo dice «ni ellos ni su recompensa» — la doctrina no obliga a amar el dolor</text>
</g>

él.'

      hebreo: 'הַמֶּתַח שֶׁבֵּין הַתּוֹרָה לַחֲוָיָה',
      traduccion: 'La tensión entre la doctrina y la experiencia',
      explicacion: 'La sugyá de yisurim shel ahavá es uno de los textos más honestos del Talmud sobre el sufrimiento. Su grandeza está en que NO RESUELVE la tensión central — la mantiene viva.\n\nLA DOCTRINA dice:\n  · El sufrimiento del justo puede no ser castigo, sino amor\n  · Se diagnostica por descarte (pecado → bitul Torá → amor)\n  · Tiene límite: si anula Torá/tefilá, no es de amor\n  · Los bienes supremos (Torá, Tierra, olam ha-ba) se compran con él\n  · Es señal de cercanía divina, no de rechazo\n\nLA EXPERIENCIA dice (en boca de los mismos sabios):\n  · «ni ellos ni su recompensa» — no quiero el dolor, ni siquiera por sus frutos\n  · «el prisionero no se libera solo» — nadie se sana sin la mano del otro\n  · «por esto vale llorar» — hay pérdidas (la belleza, la mortalidad) sin consuelo doctrinal\n  · «y lloraron ambos» — la respuesta final al dolor es la presencia compartida\n\nAMBAS son verdad. Esta es la madurez espiritual de la sugyá:\n\n  1. Se puede ENTENDER el valor del sufrimiento Y AUN ASÍ no quererlo. No hay contradicción. La comprensión teológica no obliga al deseo emocional.\n\n  2. Los grandes maestros que ENSEÑAN la doctrina son los mismos que, al sufrir, la encuentran insuficiente como consuelo. Esto no los hace hipócritas — los hace HONESTOS.\n\n  3. El consuelo real NO viene de la doctrina sino de la RELACIÓN. La mano que se extiende, el maestro que llora contigo, el visitante que te levanta. La teología explica; el amor sana.\n\n  4. NADIE SE CURA SOLO. La autosuficiencia espiritual es una ilusión. Hasta R. Yojanan necesitó la mano de R. Janina.\n\nLa sugyá termina, significativamente, NO con una conclusión doctrinal sino con escenas de contacto humano. Después de toda la teología del sufrimiento, la última palabra es una mano extendida y dos hombres llorando juntos.\n\nEsta es la respuesta del judaísmo al problema del sufrimiento: no una solución intelectual definitiva, sino una comunidad de manos que se levantan unas a otras, y de lágrimas que se acompañan. La doctrina da sentido; la presencia da consuelo. Se necesitan ambas, y ninguna reemplaza a la otra.'
    }
  };

  var contenedor = document.currentScript
    ? document.currentScript.closest('.yisurim-interactivo')
    : document.querySelector('.yisurim-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#yisurim-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.yisurim-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="yisurim-panel-header">' +
        '<p class="yisurim-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="yisurim-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="yisurim-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="yisurim-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.yisurim-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.yisurim-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="yisurim-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
</script>
</div>
