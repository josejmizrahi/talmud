<g class="chasid-nodo" data-id="creti-pleti">
  <rect x="60" y="96" width="640" height="68" rx="6" fill="rgba(184,134,11,0.07)" stroke="#b8860b" stroke-width="1.1"/>
  <text x="78" y="118" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">Benayahu = Sanedrín · Evyatar = Urim ve-Tumim</text>
  <text x="682" y="118" text-anchor="end" font-size="11" direction="rtl" fill="#b8860b" font-weight="500">כְּרֵתִי שֶׁכּוֹרְתִים · פְּלֵתִי שֶׁמּוּפְלָאִים</text>
  <text x="78" y="138" font-size="10" fill="#3d2f23">Los Cretí "cortan" sus palabras (decisiones netas); los Pletí son "wondrous" en sus consejos.</text>
  <text x="78" y="155" font-size="9" fill="#6b4423" font-style="italic">la cadena del gobierno: consejero (Ajitofel) → cuerpo colectivo (Sanedrín) → oráculo (Urim ve-Tumim) → ministro militar (Yoav)</text>
</g>

<text x="60" y="190" font-size="10" fill="#b8860b" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">LA ARPA · PRUEBA ESCRITURARIA · L2</text>

<g class="chasid-nodo" data-id="arpa-pasuk">
  <rect x="60" y="202" width="640" height="72" rx="6" fill="rgba(184,134,11,0.10)" stroke="#b8860b" stroke-width="1.4"/>
  <text x="78" y="224" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">Rav Yitzjak bar Adda · prueba bíblica de la arpa de 3b</text>
  <text x="682" y="224" text-anchor="end" font-size="12" direction="rtl" fill="#b8860b" font-weight="500">עוּרָה כְבוֹדִי, עוּרָה הַנֵּבֶל וְכִנּוֹר, אָעִירָה שָּׁחַר</text>
  <text x="78" y="248" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">"despierta mi gloria, despierta el arpa y la lira, despertaré el alba" — Tehilim 57:9</text>
  <text x="78" y="265" font-size="9" fill="#6b4423" font-style="italic">la imagen del 3b (kinor + viento del norte) ahora gana un anclaje en David mismo</text>
</g>

<text x="60" y="300" font-size="10" fill="#1e3a5f" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">ENIGMA TEMPORAL RESUELTO · ¿AMBOS SABÍAN?</text>

<g class="chasid-nodo" data-id="r-zeira-resuelve">
  <rect x="60" y="312" width="315" height="118" rx="6" fill="rgba(30,58,95,0.08)" stroke="#1e3a5f" stroke-width="1.1"/>
  <text x="78" y="332" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">R. Zeira</text>
  <text x="358" y="332" text-anchor="end" font-size="11" direction="rtl" fill="#1e3a5f" font-weight="500">מֹשֶׁה הֲוָה יָדַע · דָּוִד הֲוָה יָדַע</text>
  <text x="78" y="354" font-size="10" fill="#3d2f23">Ambos sabían. La arpa era para DESPERTAR a David, no para informarle la hora.</text>
  <text x="78" y="372" font-size="10" fill="#3d2f23">Moshé dijo "כחצות" para que los astrólogos de Faraón</text>
  <text x="78" y="386" font-size="10" fill="#3d2f23">no lo acusen de mentiroso (לַמֵּד לְשׁוֹנְךָ לוֹמַר אֵינִי יוֹדֵעַ).</text>
  <text x="78" y="408" font-size="9" fill="#6b4423" font-style="italic">"enseña a tu lengua a decir 'no sé', para no ser atrapado en mentira"</text>
  <text x="78" y="422" font-size="9" fill="#6b4423" font-style="italic">la pedagogía moshéica: la duda declarada protege de la duda real</text>
</g>

<g class="chasid-nodo" data-id="rav-ashi-noche13">
  <rect x="385" y="312" width="315" height="118" rx="6" fill="rgba(30,58,95,0.08)" stroke="#1e3a5f" stroke-width="1.1"/>
  <text x="403" y="332" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">Rav Ashi</text>
  <text x="683" y="332" text-anchor="end" font-size="11" direction="rtl" fill="#1e3a5f" font-weight="500">בְּפַלְגָא אוּרְתָּא דִּתְלֵיסַר נָגְהֵי אַרְבֵּסַר</text>
  <text x="403" y="354" font-size="10" fill="#3d2f23">Moshé hablaba en la noche del 13 al 14, no en chatzot.</text>
  <text x="403" y="372" font-size="10" fill="#3d2f23">Dijo a Israel: "HKBH me dijo: MAÑANA, a esta hora cerca de</text>
  <text x="403" y="386" font-size="10" fill="#3d2f23">la medianoche, saldré en medio de Egipto".</text>
  <text x="403" y="408" font-size="9" fill="#6b4423" font-style="italic">el "kachatzot" no es duda — es un demostrativo temporal</text>
  <text x="403" y="422" font-size="9" fill="#6b4423" font-style="italic">("como hoy a esta hora") referido al día siguiente.</text>
</g>

  <text x="78" y="520" font-size="12" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">"Los reyes duermen hasta las 3 horas; yo me</text>
  <text x="78" y="536" font-size="12" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">levanto a chatzot a alabarte" — el madrugador</text>
  <text x="358" y="556" text-anchor="end" font-size="10" direction="rtl" fill="#1e6b5a">חֲצוֹת לַיְלָה אָקוּם לְהוֹדוֹת לְךָ</text>
</g>

  <text x="403" y="520" font-size="12" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">"Los reyes se sientan en grupos de honor;</text>
  <text x="403" y="536" font-size="12" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">yo tengo las manos manchadas — purifico</text>
  <text x="403" y="552" font-size="12" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">a una mujer para su marido" — humildad halájica</text>
  <text x="683" y="570" text-anchor="end" font-size="9" direction="rtl" fill="#1e6b5a">יָדַי מְלוּכְלָכוֹת בְּדָם · נדה</text>
</g>

<g class="chasid-nodo" data-id="lulei-pecado">

  <text x="358" y="770" text-anchor="end" font-size="11" direction="rtl" fill="#8b1a1a" font-weight="500">לוּלֵא · תהילים כז:יג</text>
  <text x="78" y="792" font-size="10" fill="#3d2f23">David: "estoy seguro del pago a los justos, pero NO SÉ</text>
  <text x="78" y="806" font-size="10" fill="#3d2f23">si tendré parte entre ellos — שֶׁמָּא יִגְרוֹם הַחֵטְא"</text>
  <text x="78" y="826" font-size="10" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#3d2f23">"quizás el pecado lo cause" — la duda del chasid</text>
  <text x="78" y="843" font-size="9" fill="#6b4423" font-style="italic">el verdadero chasid duda de su propia chasidut</text>
</g>

<g class="chasid-nodo" data-id="yaakov-ezra">

  <text x="683" y="770" text-anchor="end" font-size="11" direction="rtl" fill="#8b1a1a" font-weight="500">שֶׁמָּא יִגְרוֹם הַחֵטְא</text>
  <text x="403" y="792" font-size="10" fill="#3d2f23">Yaakov: "estaré contigo y te guardaré" + "y Yaakov tuvo</text>
  <text x="403" y="806" font-size="10" fill="#3d2f23">mucho miedo" — la promesa no garantiza el merecerlo.</text>
  <text x="403" y="826" font-size="10" fill="#3d2f23">Ezra: merecía milagro como con Yehoshua — gram hachet.</text>
  <text x="403" y="843" font-size="9" fill="#6b4423" font-style="italic">la teología del pecado retrasante: la gracia se puede perder</text>

  const nodos = document.querySelectorAll('.chasid-nodo');

  nodos.forEach(n => {
    n.addEventListener('click', () => {
      const id = n.getAttribute('data-id');
      const d = datos[id];
      if (!d) return;

      nodos.forEach(o => {
        o.classList.remove('activa', 'dim');
        if (o !== n) o.classList.add('dim');
      });
      n.classList.add('activa');

      panel.innerHTML = `
        <div class="chasid-panel-header">
          <h4 class="chasid-panel-titulo">${d.titulo}</h4>
          <div class="chasid-panel-hebreo">${d.hebreo}</div>
        </div>
        <p class="chasid-panel-traduccion">${d.traduccion}</p>
        <p class="chasid-panel-explicacion">${d.explicacion}</p>
      `;
    });
