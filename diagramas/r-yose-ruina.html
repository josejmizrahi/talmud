<text x="60" y="82" font-size="10" fill="#6b4423" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">PRÓLOGO · LA ESCENA</text>

<g class="yose-nodo" data-id="setting">

  <text x="78" y="116" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">"Una vez iba yo por el camino y entré a una de las ruinas de Yerushalayim para orar"</text>
  <text x="682" y="116" text-anchor="end" font-size="11" direction="rtl" fill="#6b4423" font-weight="500">פַּעַם אַחַת הָיִיתִי מְהַלֵּךְ בַּדֶּרֶךְ</text>
  <text x="78" y="138" font-size="10" fill="#3d2f23">R. Yose elige las RUINAS post-destrucción del Bet HaMikdash como lugar de oración. Memoria viva del Templo perdido.</text>
  <text x="78" y="156" font-size="9" fill="#6b4423" font-style="italic">cada acción del relato será luego corregida o iluminada por Eliyahu</text>
</g>

<g class="yose-nodo" data-id="eliyahu-guarda">
  <rect x="60" y="184" width="640" height="60" rx="6" fill="rgba(107,68,35,0.07)" stroke="#6b4423" stroke-width="1.1"/>
  <text x="78" y="206" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">Eliyahu HaNavi VINO y MONTÓ GUARDIA en la puerta — esperó a que R. Yose terminara</text>
  <text x="682" y="206" text-anchor="end" font-size="11" direction="rtl" fill="#6b4423" font-weight="500">בָּא אֵלִיָּהוּ זָכוּר לַטּוֹב וְשָׁמַר לִי</text>
  <text x="78" y="226" font-size="9" fill="#6b4423" font-style="italic">Eliyahu cumple TRES funciones: protector físico (no hay peligro), garante teológico (la oración no se invalida), pedagogo</text>
</g>

<g class="yose-nodo" data-id="saludo">
  <rect x="60" y="256" width="640" height="48" rx="6" fill="rgba(107,68,35,0.07)" stroke="#6b4423" stroke-width="1.1"/>
  <text x="78" y="280" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">Eliyahu: "שָׁלוֹם עָלֶיךָ, רַבִּי" · R. Yose: "שָׁלוֹם עָלֶיךָ, רַבִּי וּמוֹרִי"</text>
  <text x="682" y="280" text-anchor="end" font-size="10" direction="rtl" fill="#6b4423">דוקא — לא "מורי" אלא "רבי ומורי"</text>
  <text x="78" y="297" font-size="9" fill="#6b4423" font-style="italic">R. Yose reconoce a Eliyahu como rabí Y maestro (rabbi vs rabbi-u-mori) — humildad ante el profeta inmortal</text>
</g>

<!-- ====================================================================== -->
<!-- PRIMERA PREGUNTA · HALAJÁ DEL REZO                                      -->
<!-- ====================================================================== -->
<text x="60" y="332" font-size="10" fill="#1e3a5f" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">PRIMERA PREGUNTA · HALAJÁ DEL REZO EN EL CAMINO</text>

<g class="yose-nodo" data-id="pregunta-1">
  <rect x="60" y="344" width="640" height="120" rx="6" fill="rgba(30,58,95,0.07)" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="78" y="366" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">Eliyahu: "Hijo mío, ¿POR QUÉ entraste a esta ruina?"</text>
  <text x="682" y="366" text-anchor="end" font-size="11" direction="rtl" fill="#1e3a5f" font-weight="500">מִפְּנֵי מָה נִכְנַסְתָּ לְחוּרְבָּה זוֹ?</text>
  <text x="78" y="388" font-size="11" fill="#3d2f23">  · R. Yose: "para orar"</text>
  <text x="78" y="406" font-size="11" fill="#3d2f23">  · Eliyahu: "deberías haber orado EN EL CAMINO"</text>
  <text x="78" y="424" font-size="11" fill="#3d2f23">  · R. Yose: "tenía miedo de que me interrumpieran los pasantes"</text>
  <text x="78" y="442" font-size="11" fill="#3d2f23">  · Eliyahu: "deberías haber orado una TEFILÁ KETZARÁ (oración breve)"</text>
  <text x="78" y="459" font-size="9" fill="#6b4423" font-style="italic">DIÁLOGO ESCALONADO: cada respuesta de R. Yose es legítima, pero Eliyahu siempre ofrece una mejor opción halájica</text>
</g>

  <text x="682" y="498" text-anchor="end" font-size="11" direction="rtl" fill="#1e3a5f" font-weight="500">שְׁלֹשָׁה דְּבָרִים לָמַדְתִּי</text>

    <text x="97" y="60" text-anchor="middle" font-size="10" fill="#3d2f23" font-style="italic">no se entra a ruinas</text>

    <rect x="205" y="0" width="195" height="76" rx="4" fill="rgba(30,58,95,0.10)" stroke="#1e3a5f" stroke-width="0.8"/>
    <text x="302" y="22" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">2.</text>
    <text x="302" y="42" text-anchor="middle" font-size="11" direction="rtl" fill="#1e3a5f">מִתְפַּלְּלִין בַּדֶּרֶךְ</text>
    <text x="302" y="60" text-anchor="middle" font-size="10" fill="#3d2f23" font-style="italic">se reza en el camino</text>

    <rect x="410" y="0" width="195" height="76" rx="4" fill="rgba(30,58,95,0.10)" stroke="#1e3a5f" stroke-width="0.8"/>

    <text x="507" y="42" text-anchor="middle" font-size="11" direction="rtl" fill="#1e3a5f">תְּפִלָּה קְצָרָה</text>
    <text x="507" y="60" text-anchor="middle" font-size="10" fill="#3d2f23" font-style="italic">en el camino · tefilá breve</text>
  </g>
</g>

<!-- ====================================================================== -->
<text x="60" y="622" font-size="10" fill="#8b1a1a" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">SEGUNDA PREGUNTA · LA VOZ DE LA RUINA</text>

<g class="yose-nodo" data-id="pregunta-2">
  <rect x="60" y="634" width="640" height="50" rx="6" fill="rgba(139,26,26,0.06)" stroke="#8b1a1a" stroke-width="1.1"/>
  <text x="78" y="658" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">Eliyahu: "Hijo mío, ¿QUÉ VOZ oíste en esta ruina?"</text>
  <text x="682" y="658" text-anchor="end" font-size="11" direction="rtl" fill="#8b1a1a" font-weight="500">מָה קוֹל שָׁמַעְתָּ בְּחוּרְבָּה זוֹ?</text>
  <text x="78" y="676" font-size="9" fill="#6b4423" font-style="italic">Eliyahu sabe la respuesta — pero quiere que R. Yose la diga, porque solo así la noticia adquiere autoridad rabínica</text>
</g>

<g class="yose-nodo" data-id="bat-kol-paloma">

  <text x="78" y="717" font-size="10" font-family="'JetBrains Mono', monospace" fill="#8b1a1a" letter-spacing="1.5">LA BAT KOL · GIME COMO PALOMA</text>
  <text x="78" y="737" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">"oí una bat kol que GIME COMO PALOMA y dice:"</text>
  <text x="682" y="737" text-anchor="end" font-size="11" direction="rtl" fill="#8b1a1a" font-weight="500">בַּת קוֹל שֶׁמְּנַהֶמֶת כְּיוֹנָה</text>
  <text x="78" y="758" font-size="11" direction="ltr" fill="#3d2f23">  · אוֹי שֶׁהֶחֱרַבְתִּי אֶת בֵּיתִי</text>
  <text x="78" y="773" font-size="11" direction="ltr" fill="#3d2f23">  · וְשָׂרַפְתִּי אֶת הֵיכָלִי</text>
  <text x="78" y="788" font-size="11" direction="ltr" fill="#3d2f23">  · וְהִגְלֵיתִי אֶת בָּנַי לְבֵין אוּמּוֹת הָעוֹלָם</text>
</g>

<g class="yose-nodo" data-id="tres-veces-dia">
  <rect x="60" y="806" width="640" height="32" rx="6" fill="rgba(139,26,26,0.06)" stroke="#8b1a1a" stroke-width="1.1"/>
  <text x="78" y="827" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">Eliyahu: "no solo en esta hora — sino CADA DÍA, TRES VECES dice así" — coincide con las 3 vigilias</text>
</g>

<!-- CONSOLACIÓN                                                             -->
<!-- ====================================================================== -->

<g class="yose-nodo" data-id="yehei-shmeh">
  <rect x="60" y="850" width="640" height="22" rx="6" fill="rgba(184,134,11,0.10)" stroke="#b8860b" stroke-width="1.2"/>
  <text x="78" y="866" font-size="10" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">Y cuando Israel responde "יְהֵא שְׁמֵיהּ הַגָּדוֹל מְבֹורָךְ" en batei knesiot — HKBH mueve la cabeza con esperanza</text>
</g>

    },
    'pregunta-2': {
      titulo: 'Pregunta 2 · ¿qué voz oíste?',
      hebreo: 'בְּנִי, מָה קוֹל שָׁמַעְתָּ בְּחוּרְבָּה זוֹ?',
      traduccion: '"Hijo mío, ¿qué voz oíste en esta ruina?"',
      explicacion: 'La segunda pregunta marca un giro tonal. La primera era HALÁJICA (qué hiciste, qué deberías haber hecho). La segunda es TEOLÓGICA-MÍSTICA: ¿qué voz oíste en esa ruina? Eliyahu sabe que las ruinas del Templo no son lugares vacíos — algo se oye allí. Pero quiere que R. YOSE lo diga, porque solo así la noticia entra en el corpus rabínico con autoridad de testigo. Es la técnica del maestro que extrae el conocimiento del discípulo: yo no te digo lo que oíste — TÚ me dices lo que oíste, y yo te confirmo. La narrativa cambia de plano: pasamos de la halajá del rezo a la fenomenología del lamento divino.'
    },
    'bat-kol-paloma': {
      titulo: 'La bat kol · gime como paloma · "Oy shehecharavti"',
      hebreo: 'שָׁמַעְתִּי בַּת קוֹל שֶׁמְּנַהֶמֶת כְּיוֹנָה וְאוֹמֶרֶת: אוֹי שֶׁהֶחֱרַבְתִּי אֶת בֵּיתִי וְשָׂרַפְתִּי אֶת הֵיכָלִי וְהִגְלֵיתִי אֶת בָּנַי לְבֵין אוּמּוֹת הָעוֹלָם',
      traduccion: '"Oí una bat kol que GIME COMO PALOMA y dice: \'Ay, pues destruí mi casa, quemé mi santuario y exilié a mis hijos entre las naciones del mundo\'"',
      explicacion: 'El núcleo teológico de toda la narrativa — y el PUENTE EDITORIAL con la sección anterior. La bat kol (voz celestial) GIME COMO PALOMA — מנהמת כיונה. La paloma en la tradición bíblica simboliza tanto a Israel ("yonati", Shir HaShirim) como al duelo. Y dice EXACTAMENTE las mismas palabras que Rav Yitzjak bar Shmuel había atribuido al "rugido del león" en la sección de vigilias (#2): "אוי שהחרבתי את ביתי...". El editor del Bavli pone esta narrativa AQUÍ precisamente porque la bat kol REPITE LA FÓRMULA. La doctrina cósmica: la misma Shejiná tiene DOS REGISTROS — el león que ruge sobre las vigilias y la paloma que gime en las ruinas. Misma pena, dos imágenes. La fuerza de la frase: HKBH habla en PRIMERA PERSONA del SUJETO de la destrucción ("YO destruí mi casa") — no es la destrucción enemiga, es la auto-tragedia divina.'
    },
    'tres-veces-dia': {
      titulo: 'Revelación · cada día, tres veces',
      hebreo: 'חַיֶּיךָ וְחַיֵּי רֹאשְׁךָ, לֹא שָׁעָה זוֹ בִּלְבַד אוֹמֶרֶת כָּךְ, אֶלָּא בְּכָל יוֹם וָיוֹם, שָׁלֹשׁ פְּעָמִים אוֹמֶרֶת כָּךְ',
      traduccion: '"Por tu vida y la vida de tu cabeza — no solo en esta hora dice así, sino cada día, TRES VECES dice así"',
      explicacion: 'Eliyahu jura con una fórmula intensa — "חייך וחיי ראשך" (por tu vida y la vida de tu cabeza) — y revela: la bat kol no es un evento único de esta ruina; es una LITURGIA CÓSMICA DIARIA. Tres veces al día HKBH lamenta así. El número "tres" no es accidental — conecta con las TRES VIGILIAS del diagrama anterior (#2) donde Rav Yitzjak bar Shmuel ya había dicho que HKBH ruge tres veces por noche. La voz/rugido/gemido es UN MISMO CICLO LITÚRGICO de tres tiempos. R. Yose obtiene una visión cosmológica completa: el cosmos tiene una banda sonora de duelo divino, tres veces por ciclo. La halajá del rezo humano (las tres tefilot diarias: shajarit, minjá, arvit) entra en resonancia con el ritmo del lamento divino. Rezamos cuando Hashem también gime.'
    },
    'yehei-shmeh': {
      titulo: 'La consolación · cuando Israel dice "Yehei shmei rabba"',
      hebreo: 'בְּשָׁעָה שֶׁיִּשְׂרָאֵל נִכְנָסִין לְבָתֵּי כְּנֵסִיּוֹת וּלְבָתֵּי מִדְרָשׁוֹת וְעוֹנִין "יְהֵא שְׁמֵיהּ הַגָּדוֹל מְבֹורָךְ" — הַקָּדוֹשׁ בָּרוּךְ הוּא מְנַעְנֵעַ רֹאשׁוֹ, וְאוֹמֵר: אַשְׁרֵי הַמֶּלֶךְ שֶׁמְּקַלְּסִין אוֹתוֹ בְּבֵיתוֹ כָּךְ',
      traduccion: '"Cuando Israel entra a batei knesiot y batei midrashot y responde \'Yehei Shmei haGadol mevorach\' — HKBH mueve la cabeza y dice: \'Bendito el rey al que así alaban en Su casa\'"',
      explicacion: 'Eliyahu cierra la narrativa con LA CONSOLACIÓN. La doctrina del lamento divino podría dejar al lector en la desesperación; Eliyahu agrega que existe una RESPUESTA HUMANA que mueve a HKBH a la esperanza. Cuando los hijos de Israel — los mismos que HKBH dijo haber exiliado — entran a las casas de oración y estudio y responden el "Yehei Shmei rabba" del Kaddish ("Sea su Gran Nombre bendito"), HKBH MUEVE LA CABEZA (gesto de afirmación/esperanza, "מנענע ראשו") y dice una doble frase: feliz (אשרי) el rey alabado así Y QUÉ TIENE (מה לו) el padre que exilió a sus hijos. La frase doble captura la complejidad: el alabado y el doloroso conviven. Por eso esta enseñanza es la fuente halájica de la importancia suprema del KADDISH y de la respuesta "Yehei shmei rabba" — son la liturgia que CONSUELA A HKBH MISMO de su propia decisión de exilio. La acción humana puede mover al cielo.'
    }
  };

  const panel = document.getElementById('yose-panel');
  const nodos = document.querySelectorAll('.yose-nodo');

  nodos.forEach(n => {
    n.addEventListener('click', () => {
      const id = n.getAttribute('data-id');
      const d = datos[id];
      if (!d) return;

      nodos.forEach(o => {
        o.classList.remove('activa', 'dim');
        if (o !== n) o.classList.add('dim');
      });
      n.classList.add('activa');

      panel.innerHTML = `
        <div class="yose-panel-header">
          <h4 class="yose-panel-titulo">${d.titulo}</h4>
          <div class="yose-panel-hebreo">${d.hebreo}</div>
        </div>
        <p class="yose-panel-traduccion">${d.traduccion}</p>
        <p class="yose-panel-explicacion">${d.explicacion}</p>
      `;
    });
  });
})();
</script>
</div>
