      explicacion: 'La SEGUNDA estación: el tribunal halájico de 71 sabios.\n\nUna vez Ajitófel proponía un plan, David no actuaba directamente — lo llevaba al Sanedrín. La inversión chiástica del versículo señala precisamente esto: «Yehoyada ben Benayahu» = no la persona, sino el TRIBUNAL que presidía.\n\nEl filtro era halájico estricto:\n• ¿Es esta una guerra permitida (מלחמת רשות)?\n• ¿El motivo es legítimo según Tora?\n• ¿El número de combatientes está dentro de lo halájicamente requerido?\n• ¿Se cumplen las exenciones de Devarim 20 (recién casados, plantadores de viñedo, miedosos)?\n\nDavid SE SOMETÍA al Sanedrín. Aunque era rey, no podía declarar guerra opcional sin su aprobación. Este sometimiento del monarca a la corte rabínica es el pilar de la doctrina rabínica del poder.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.gobierno-interactivo')
    : document.querySelector('.gobierno-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#gobierno-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.gobierno-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="gobierno-panel-header">' +
        '<p class="gobierno-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="gobierno-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="gobierno-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="gobierno-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.gobierno-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.gobierno-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="gobierno-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
</script>
