  <text x="360" y="130" text-anchor="middle" font-size="10.5" fill="#3d2f23" font-style="italic">«los vatikin la terminaban [la kriat shema] con el brote del sol»</text>

  <text x="550" y="215" text-anchor="middle" font-size="9" fill="#3d2f23" font-style="italic">וְנִמְצָא מִתְפַּלֵּל בַּיּוֹם</text>

  <text x="205" y="386" text-anchor="middle" font-size="11" direction="rtl" fill="#1e3a5f">יִירָאוּךָ עִם שָׁמֶשׁ וְלִפְנֵי יָרֵחַ דּוֹר דּוֹרִים</text>
  <text x="205" y="406" text-anchor="middle" font-size="9.5" fill="#3d2f23" font-style="italic">«que te teman CON el sol…» (Tehilim 72:5)</text>

  <text x="515" y="386" text-anchor="middle" font-size="10.5" direction="rtl" fill="#2d6b4e">כָּל הַסּוֹמֵךְ גְּאוּלָּה לִתְפִלָּה</text>

  <text x="515" y="424" text-anchor="middle" font-size="9.5" fill="#3d2f23" font-style="italic">«no sufre daño en todo el día entero»</text>

</g>

<g class="vatik-nodo" data-id="objecion">

  <text x="78" y="542" font-size="9.5" fill="#3d2f23">«¡yo pegué geulá a tefilá — y fui dañado: me obligaron a llevar el mirto al palacio del rey!»</text>

  <text x="78" y="572" font-size="9.5" fill="#3d2f23" font-weight="600">La respuesta: eso NO fue daño — fue privilegio. Porque R. Yojanan enseñó:</text>
  <text x="360" y="592" text-anchor="middle" font-size="10.5" direction="rtl" fill="#8b1a1a">לְעוֹלָם יִשְׁתַּדֵּל אָדָם לָרוּץ לִקְרַאת מַלְכֵי יִשְׂרָאֵל</text>
  <text x="360" y="610" text-anchor="middle" font-size="9" fill="#6b4423" font-style="italic">correr a ver a los reyes — hasta los gentiles — para DISTINGUIR cuando llegue la redención</text>
</g>

</g>

  <text x="624" y="900" text-anchor="end" font-size="9.5" direction="rtl" fill="#2d6b4e">כִּתְפִלָּה אֲרִיכְתָּא דָּמְיָא</text>

  <text x="360" y="952" text-anchor="middle" font-size="9" fill="#6b4423" font-style="italic">paralelo nocturno: הַשְׁכִּיבֵנוּ = גְּאוּלָּה אֲרִיכְתָּא (ver el diagrama de semijat geulá-tefilá)</text>
</g>

      explicacion: 'R. Yojanan describe la proeza de los VATIKIN — los escrupulosos, los madrugadores del alma. Su práctica convierte el amanecer en una costura litúrgica de precisión quirúrgica:\n\n  · empiezan la kriat shema todavía en la penumbra\n  · calculan el ritmo para que la bracha de גָּאַל יִשְׂרָאֵל termine EXACTAMENTE cuando el sol rompe el horizonte (הָנֵץ הַחַמָּה — el «brote» del sol, como una planta que germina)\n  · y la amidá empieza con el PRIMER RAYO\n\nEl diagrama pone el sol en el centro porque el sol ES la costura: a su izquierda queda la noche del shema (que pertenece al mundo de la geulá — la redención recitada), a su derecha el día de la amidá (la petición presente). La juntura de las dos brachot coincide con la juntura cósmica de la noche y el día.\n\nLa fórmula tiene DOS logros simultáneos:\n\n  1. סְמִיכַת גְּאוּלָּה לִתְפִלָּה — pegar geulá a tefilá sin ninguna interrupción (la misma regla que en arvit hace a alguien ben olam ha-ba, Berajot 4b)\n\n  2. וְנִמְצָא מִתְפַּלֵּל בַּיּוֹם — «y resulta que reza DE DÍA»: la amidá cae dentro del día halájico desde su primer instante posible\n\nLa palabra וָתִיקִין viene de la raíz de «firme, probado, veterano»: no son un grupo social identificable sino una CATEGORÍA ESPIRITUAL — los que aman la mitzvá con tal precisión que sincronizan su liturgia con la mecánica celeste. Este es el punto máximo de la sugyá del zman de kriat shema: después de discutir los límites tardíos, el editor muestra el IDEAL.'

    'pasuk': {
      titulo: 'El pasuk · R. Zeira · «que te teman CON el sol»',

      traduccion: '«Que te teman con el sol, y ante la luna, generación tras generación» (Tehilim 72:5)',
      explicacion: 'R. Zeira encuentra el fundamento bíblico de la práctica: Tehilim 72:5, del salmo de Shlomó sobre el rey ideal.\n\nLa lectura se apoya en una sola preposición: עִם שָׁמֶשׁ — «CON el sol». No dice «después del sol», ni «durante el día», sino CON — en simultaneidad exacta.\n\n  · יִירָאוּךָ — «que te TEMAN»: el temor del Cielo es la kriat shema, el acto de aceptar el yugo del Reino\n  · עִם שָׁמֶשׁ — ese temor debe COINCIDIR con el sol: cuando el sol brota, el shema culmina\n\nLa preposición se vuelve programa litúrgico: el pasuk no manda rezar «de mañana» en general — manda una SINCRONIZACIÓN. El temor de Cielo y el sol deben aparecer juntos sobre el horizonte.\n\n(La segunda mitad del pasuk — וְלִפְנֵי יָרֵחַ, «ante la luna» — sirve en otras lecturas para la tefilá de la tarde/noche; aquí la guemará usa la primera mitad.)\n\nEs el patrón clásico de la sugyá: una práctica de piedad extrema (los vatikin) no se queda como costumbre privada — R. Zeira le encuentra RAÍZ EN EL PASUK, y con eso la convierte en ideal normativo con respaldo bíblico. La halajá posterior conserva este ideal: tefilat vatikin sigue siendo, hasta hoy, la forma más alabada de rezar shajarit.'

      traduccion: '«Todo el que pega geulá a tefilá, no sufre daño en todo el día entero»',
      explicacion: 'R. Yosei ben Elyakim testifica EN NOMBRE DE la kehilá kadisha de Yerushalayim — la «santa comunidad de Jerusalén». La atribución no es decorativa: es una TRADICIÓN COMUNITARIA de la ciudad santa, no la opinión de un individuo.\n\nLa promesa es concreta y temporal: quien logra la costura — pegar geulá a tefilá — queda PROTEGIDO durante ese día entero. אֵינוֹ נִזּוֹק — «no es dañado».\n\nNote la lógica de la recompensa: es MEDIDA POR MEDIDA temporal.\n\n  · la costura se hace en el primer instante del día (hanetz)\n  · la protección cubre el día ENTERO que ese instante inaugura\n  · quien ancla el amanecer en la geulá, tiene el día anclado en la protección divina\n\nLa doctrina complementa la de Berajot 4b (quien pega geulá a tefilá en ARVIT es ben olam ha-ba): allí la recompensa es escatológica (mundo venidero), aquí es cotidiana (el día sin daño). El arvit mira al fin de los tiempos; el shajarit mira al día que empieza.\n\nY es exactamente esta promesa — formulada en términos verificables: «no sufre daño» — la que R. Zeira va a poner a prueba con su propia biografía en el nodo siguiente. La guemará no teme exponer sus promesas a la experiencia.'

    'objecion': {
      titulo: 'La objeción de R. Zeira · el mirto al palacio',
      hebreo: 'לְעוֹלָם יִשְׁתַּדֵּל אָדָם לָרוּץ לִקְרַאת מַלְכֵי יִשְׂרָאֵל',
      traduccion: '«Siempre debe esforzarse el hombre en correr al encuentro de los reyes de Israel»',
      explicacion: 'R. Zeira — el mismo que trajo el pasuk de los vatikin — objeta la promesa de protección DESDE SU PROPIA VIDA:\n\n  «¡Yo pegué geulá a tefilá — y fui dañado! Me obligaron a llevar el mirto (אֲסָא) al palacio del rey.»\n\nLe impusieron una carga de servicio real (angariá): cargar ramas de mirto hasta el palacio. Trabajo forzado para un sabio — aparentemente, un daño en el mismo día de su costura perfecta. La promesa parece refutada por el testimonio de un testigo insospechable.\n\nLa respuesta de la guemará desarma la objeción invirtiendo la categoría: eso NO fue daño — fue PRIVILEGIO. Deberías incluso PAGAR por ver el palacio. Porque R. Yojanan enseñó:\n\n  לְעוֹלָם יִשְׁתַּדֵּל אָדָם לָרוּץ לִקְרַאת מַלְכֵי יִשְׂרָאֵל — «siempre corra el hombre al encuentro de los reyes de Israel»\n\n  וְלֹא לִקְרַאת מַלְכֵי יִשְׂרָאֵל בִּלְבַד — y no solo de los reyes de Israel, sino TAMBIÉN de los reyes de las naciones\n\n¿Por qué? שֶׁאִם יִזְכֶּה — para que, si merece ver la redención, pueda DISTINGUIR entre los reyes de Israel y los reyes del mundo. Quien vio la gloria de los imperios con sus propios ojos podrá medir cuánto mayor es la gloria del Rey Mashiaj.\n\nLa lección epistemológica es fina: el «daño» no es una categoría objetiva. Lo que R. Zeira vivió como carga era, bajo la descripción correcta, un acceso privilegiado al palacio — un ensayo para reconocer la geulá. La promesa de la kehilá kadisha queda intacta: al que pega geulá a tefilá no le pasa nada MALO; a veces le pasa algo bueno disfrazado.'

      traduccion: '«Una vez pegó geulá a tefilá — y la risa no se apartó de su boca el día entero»',
      explicacion: 'La sugyá culmina con una de las imágenes más luminosas del perek. R. Ila le encarga a Ula, que baja a Bavel:\n\n  «Cuando llegues, saluda a mi hermano Rav Beruna FRENTE A TODA LA JABURA (בְּמַעֲמַד כָּל הַחֲבוּרָה) — porque es un gran hombre y SE ALEGRA EN LAS MITZVOT (גָּדוֹל הוּא וְשָׂמֵחַ בְּמִצְוֺת).»\n\n¿Y cuál es la prueba de su grandeza? No un tratado, no una halajá famosa, no un milagro:\n\n  UNA SOLA VEZ (זִימְנָא חֲדָא) logró pegar geulá a tefilá como los vatikin — y la risa no se apartó de su boca EL DÍA ENTERO.\n\nVarias cosas notables:\n\n  1. UNA SOLA VEZ. La proeza de los vatikin es tan difícil — despertar antes del alba, calcular el ritmo exacto, acertar el instante del hanetz — que incluso un gran amora la logró una vez en la vida. La sugyá es honesta sobre la dificultad del ideal.\n\n  2. LA MEDIDA DE LA RECOMPENSA. La promesa oficial era «no sufre daño todo el día» — protección. Lo que Rav Beruna recibió fue ALEGRÍA todo el día. La simetría es exacta: un día de costura = un día de sonrisa. La alegría es la versión positiva de la protección.\n\n  3. LA DEFINICIÓN DE GRANDEZA. שָׂמֵחַ בְּמִצְוֺת — «se alegra en las mitzvot» — se convierte en título honorífico digno de saludo público ante toda la jabura. La grandeza no se mide solo por el conocimiento sino por la CAPACIDAD DE ALEGRARSE en el servicio.\n\nRav Beruna es la respuesta viviente a la objeción de R. Zeira: la recompensa de la costura no es un escudo mágico externo — es un estado del alma. Quien empieza el día cosiendo su oración a la redención camina el resto del día dentro de esa costura, y eso se le nota en la boca.'

      traduccion: '«Como los rabinos lo fijaron en la tefilá — es como tefilá extendida»',
      explicacion: 'La guemará detecta una contradicción interna en el propio R. Yojanan:\n\n  · por un lado exige PEGAR geulá a tefilá — nada en medio\n  · por otro lado enseña que antes de la amidá se dice ה׳ שְׂפָתַי תִּפְתָּח וּפִי יַגִּיד תְּהִלָּתֶךָ — «Hashem, abre mis labios y mi boca dirá Tu alabanza» (Tehilim 51:17)\n\n¿No es ese pasuk exactamente un הֶפְסֵק — una interrupción entre גָּאַל יִשְׂרָאֵל y la amidá? La costura tendría un hilo extraño metido en medio.\n\nDOS RESPUESTAS:\n\n  1. R. ELAZAR: que ese pasuk se diga solo en MINJÁ. En la tefilá de la tarde no hay geulá previa que pegar (no hay kriat shema con sus brachot antes de minjá), así que el pasuk no interrumpe nada. En shajarit y arvit, no se diría. — Una solución por EVASIÓN: reparte los elementos para que nunca choquen.\n\n  2. RAV ASHI (la resolución aceptada): se dice SIEMPRE, incluso en shajarit — porque כֵּיוָן דְּקַבְעוּהָ רַבָּנַן בִּתְפִלָּה, «como los rabinos lo FIJARON en la tefilá», כִּתְפִלָּה אֲרִיכְתָּא דָּמְיָא — «es como TEFILÁ EXTENDIDA». El pasuk no está ENTRE la geulá y la amidá: ES el comienzo de la amidá. La fijación rabínica lo anexó al bloque.\n\nEl paralelo nocturno sella el argumento: así como הַשְׁכִּיבֵנוּ en arvit no interrumpe porque es גְּאוּלָּה אֲרִיכְתָּא — geulá extendida (Berajot 4b, ver el diagrama de semijat geulá-tefilá) — así ה׳ שפתי תפתח no interrumpe porque es tefilá extendida.\n\nLa simetría es perfecta: de noche, el bloque de GEULÁ se estira hacia adelante para absorber a hashkivenu; de mañana, el bloque de TEFILÁ se estira hacia atrás para absorber al pasuk. La categoría de EXTENSIÓN (אֲרִיכְתָּא) disuelve el hefsek en ambas direcciones: lo que los sabios fijan dentro de una unidad litúrgica SE VUELVE parte de su tejido.'

    'coda': {
      titulo: 'Coda · יהיו לרצון y los dieciocho salmos',

      traduccion: '«Sean gratos los dichos de mi boca y la meditación de mi corazón ante Ti» (Tehilim 19:15)',
      explicacion: 'La sugyá cierra con la pregunta espejo: si ה׳ שפתי תפתח abre la amidá, ¿por qué יִהְיוּ לְרָצוֹן — también un pasuk de David — se dice al FINAL?\n\nLa respuesta es una aritmética midráshica exquisita: porque DAVID MISMO lo dijo después de DIECIOCHO parashiyot — יהיו לרצון es el cierre del salmo 19, y hasta ahí David había pronunciado dieciocho capítulos del Tehilim. Como la amidá tiene DIECIOCHO berajot (shemoné esré), el pasuk que selló los dieciocho salmos de David sella las dieciocho berajot del que reza.\n\nLa objeción inmediata: ¡pero son DIECINUEVE salmos, no dieciocho! (El salmo 19 es el decimonoveno.)\n\nLa resolución: אַשְׁרֵי הָאִישׁ (salmo 1) y לָמָּה רָגְשׁוּ (salmo 2) son UNA SOLA parashá — empiezan y terminan como una unidad, así que la cuenta de David da exactamente dieciocho.\n\n(La guemará añade el dato paralelo: David dijo 103 parashiyot sin pronunciar «¡Halleluyá!» — hasta que vio la caída de los reshaim, en תהלים 104: יִתַּמּוּ חַטָּאִים.)\n\nLa coda espeja la apertura con precisión de artesano:\n\n  · la amidá EMPIEZA con un pasuk de David (ה׳ שפתי תפתח, Tehilim 51) — tefilá extendida hacia atrás\n  · la amidá TERMINA con un pasuk de David (יהיו לרצון, Tehilim 19) — el sello que David puso a sus propios dieciocho\n\nLa oración entera queda ENMARCADA por el salmista: quien reza la amidá entra y sale por puertas de David. Y el número dieciocho — las berajot, las parashiyot — teje la oración del individuo con la del dulce cantor de Israel. La costura de los vatikin (geulá con tefilá, noche con día) se replica en miniatura: todo el arte de la liturgia es saber qué se cose con qué.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.vatik-interactivo')
    : document.querySelector('.vatik-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#vatik-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.vatik-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="vatik-panel-header">' +
        '<p class="vatik-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="vatik-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="vatik-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="vatik-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.vatik-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.vatik-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="vatik-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
