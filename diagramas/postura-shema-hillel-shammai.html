      explicacion: 'La mishná 1:3 convierte esta frase de la Torá en un duelo hermenéutico con consecuencias de vida o muerte.\n\nEs la MISMA frase que fundó el perek entero: de ella salió el CUÁNDO del shema (los zmanim de arvit y shajarit, diagramas anteriores). Cerrada esa pregunta — halajá como R. Yehoshua, hasta tres horas — la mishná pregunta ahora el CÓMO: ¿en qué POSTURA se lee el shema?\n\nLa ambigüedad es real y está en el texto mismo:\n\n  · Lectura CORPORAL: «al acostarte» = en posición acostada; «al levantarte» = en posición de pie. La frase describe el CUERPO del lector.\n\n  · Lectura TEMPORAL: «al acostarte» = en la hora en que la gente se acuesta; «al levantarte» = en la hora en que la gente se levanta. La frase marca el RELOJ.\n\nBeit Shammai toma la primera; Beit Hillel la segunda. De un lado sale una halajá de posturas obligatorias; del otro, una halajá de libertad corporal dentro de horarios fijos.\n\nLo notable es que ambas casas leen el MISMO versículo con total seriedad — la disputa no es sobre si la Torá obliga, sino sobre QUÉ obliga exactamente. Y el desenlace de la sugyá mostrará que elegir mal entre las dos lecturas puede costar la vida.'
    },
    'bs-postura': {

      hebreo: 'בִּשְׁעַת שְׁכִיבָה שְׁכִיבָה מַמָּשׁ',
      traduccion: '«en la hora de acostarse — acostado literalmente»',
      explicacion: 'Beit Shammai lee ובשכבך ובקומך como descripción de POSTURAS: la Torá no solo dice cuándo leer, sino CÓMO debe estar el cuerpo.\n\n  · De NOCHE (ubshojbeja): todos deben RECOSTARSE para leer — יַטּוּ וְיִקְרְאוּ.\n  · De MAÑANA (uvkumeja): todos deben ponerse DE PIE — יַעַמְדוּ.\n\nLa lógica es de fidelidad máxima a la letra: si la Torá dice «al acostarte», la mímica corporal del acostarse es parte de la mitzvá. El shema nocturno se lee en la postura del que se acuesta; el matutino en la postura del que se levanta. El cuerpo entero ESCENIFICA el versículo.\n\nHay una coherencia estética en la posición de Beit Shammai: el shema no es solo recitación — es un acto corporal total, una coreografía obligatoria que alinea el cuerpo con la palabra. La estrictez tiene su belleza.\n\nPero el precio es alto: la halajá de Beit Shammai INTERRUMPE la vida. El que camina debe detenerse y recostarse; el que trabaja debe abandonar su labor y adoptar la postura. Y como mostrará R. Tarfon, recostarse en un camino de noche puede ser literalmente mortal.\n\nQueda además una pregunta exegética: si ובשכבך ובקומך describe posturas, ¿qué hace Beit Shammai con la frase vecina — ובלכתך בדרך, «al andar por el camino»? ¿Se puede leer caminando o no? Su respuesta está en el nodo de las exenciones.'
    },
    'bs-exenciones': {
      titulo: 'El midrash del camino · las exenciones de Beit Shammai',
      hebreo: 'בְּשִׁבְתְּךָ — פְּרָט לְעוֹסֵק בְּמִצְוָה · וּבְלֶכְתְּךָ — פְּרָט לְחָתָן',
      traduccion: '«al sentarte» — excluye al ocupado en una mitzvá · «al andar» — excluye al novio',
      explicacion: 'Beit Hillel usaba ובלכתך בדרך como prueba de que se lee en cualquier postura. ¿Qué hace Beit Shammai con esa frase? La convierte en la fuente de las EXENCIONES del shema:\n\n  · בְּשִׁבְתְּךָ («al sentarte») — excluye al עוֹסֵק בְּמִצְוָה, el ocupado en una mitzvá.\n  · וּבְלֶכְתְּךָ («al andar») — excluye al חָתָן, el novio.\n\nRav Papa formula el principio: כִּי דֶּרֶךְ — מָה דֶּרֶךְ רְשׁוּת. Como el camino: así como andar por el camino es un acto VOLUNTARIO (reshut), la Torá obliga al que está en lo voluntario — y EXIME al que anda en una mitzvá. El principio general: העוסק במצוה פטור מן המצוה — el ocupado en una mitzvá está exento de otra mitzvá.\n\nDe ahí la casuística del novio:\n\n  · Quien desposa VIRGEN → EXENTO. Está טְרִיד — preocupado, absorbido — por la mitzvá misma de la primera unión. Es טִרְדָּא דְמִצְוָה: preocupación de mitzvá, y exime.\n\n  · Quien desposa VIUDA → OBLIGADO. No hay la misma טרדה halájicamente relevante.\n\n  · ¿Y el que perdió su BARCO en el mar? Está tan angustiado como el novio — o más. Pero su preocupación es טִרְדָּא דִרְשׁוּת: preocupación por asunto voluntario/mundano. Sigue OBLIGADO. El duelo económico — incluso el duelo mismo — no exime del shema.\n\nLa distinción es quirúrgica: no se mide la INTENSIDAD de la preocupación (el del barco quizá sufre más que el novio), sino su FUENTE. Solo la preocupación generada por una mitzvá exime de otra mitzvá. La angustia mundana, por real que sea, no desconecta al judío de su obligación.'
    },
    'bh-kedarko': {
      titulo: 'Beit Hillel · cada uno lee como está',
      hebreo: 'כׇּל אָדָם קוֹרֵא כְּדַרְכּוֹ',
      traduccion: '«cada persona lee según su manera» — como está',
      explicacion: 'Beit Hillel desarma la lectura corporal con una sola frase del mismo versículo: וּבְלֶכְתְּךָ בַדֶּרֶךְ — «al andar por el camino». ¡La Torá misma contempla leer el shema CAMINANDO! Si la frase describiera posturas obligatorias, «al andar» obligaría a leer en movimiento — absurdo dentro del esquema de Shammai.\n\nPor tanto ובשכבך ובקומך no describe el cuerpo: marca las HORAS —\n\n  בְּשָׁעָה שֶׁבְּנֵי אָדָם שׁוֹכְבִים — en la hora en que la gente se ACUESTA (la noche)\n  וּבְשָׁעָה שֶׁבְּנֵי אָדָם עוֹמְדִים — en la hora en que la gente se LEVANTA (la mañana)\n\nEl versículo es un RELOJ social, no una coreografía. Fija el cuándo por la conducta general de la humanidad («cuando la gente se acuesta»), y deja el cómo en libertad total: כְּדַרְכּוֹ — cada uno como está, en la postura en que la vida lo encuentre.\n\nLa diferencia de fondo entre las dos casas es una filosofía de la mitzvá:\n\n  · Para Beit Shammai, la mitzvá INTERRUMPE la vida: hay que detenerse, cambiar de postura, escenificar el versículo.\n  · Para Beit Hillel, la mitzvá se INSERTA en la vida: el shema entra en el flujo cotidiano sin romperlo — el caminante lee caminando, el trabajador trabajando.\n\nEsta es la misma lectura temporal de ובשכבך que fundó los zmanim del perek (diagramas #1-#2): Beit Hillel es consistente con la estructura entera de la masejta. Y la halajá quedó como Beit Hillel — con una severidad sorprendente contra quien elija la otra opción, como muestra el resto del diagrama.'

    'bh-baraita': {
      titulo: 'La baraita de Beit Hillel · coreografía de libertad',
      hebreo: 'עוֹמְדִין וְקוֹרִין · יוֹשְׁבִין וְקוֹרִין · מַטִּין וְקוֹרִין · הוֹלְכִין בַּדֶּרֶךְ וְקוֹרִין · עוֹשִׂין בִּמְלַאכְתָּן וְקוֹרִין',
      traduccion: 'De pie y leen · sentados y leen · recostados y leen · andando por el camino y leen · haciendo su trabajo y leen',
      explicacion: 'La baraita despliega la posición de Beit Hillel como una CINTA de escenas — cinco posturas, cinco veces el verbo וְקוֹרִין («y leen»):\n\n  1. עוֹמְדִין וְקוֹרִין — de pie y leen\n  2. יוֹשְׁבִין וְקוֹרִין — sentados y leen\n  3. מַטִּין וְקוֹרִין — recostados y leen\n  4. הוֹלְכִין בַּדֶּרֶךְ וְקוֹרִין — andando por el camino y leen\n  5. עוֹשִׂין בִּמְלַאכְתָּן וְקוֹרִין — haciendo su TRABAJO y leen\n\nLa repetición retórica es deliberada: el estribillo וקורין martillea que en TODAS las posturas se lee. La lista no es exhaustiva por casualidad — recorre el espectro completo de la vida corporal: reposo vertical, reposo sentado, reposo horizontal, movimiento, y el punto culminante: el TRABAJO.\n\nEl quinto caso es el más radical. Ni siquiera hace falta interrumpir la מְלָאכָה: el artesano puede recitar el shema mientras sus manos siguen en la labor. La aceptación del yugo del Cielo no compite con la vida productiva — la atraviesa.\n\nNótese que la lista de Beit Hillel INCLUYE el recostarse (מַטִּין): recostado también se puede leer. La libertad de Beit Hillel contiene la postura de Beit Shammai como una opción entre cinco. Lo que Beit Hillel rechaza no es recostarse — es la OBLIGACIÓN de recostarse.\n\nPor eso el pecado de R. Tarfon (nodo rojo) es sutil: recostarse per se estaba permitido. Lo que lo condena es haberse recostado COMO ACTO DE ADHESIÓN a Beit Shammai — convertir la opción en obligación, tratando la halajá rechazada como norma. La coreografía de libertad no admite que se la renuncie en nombre de una estrictez derogada.'

    'tarfon': {
      titulo: 'R. Tarfon entre los bandidos',
      hebreo: 'אֲנִי הָיִיתִי בָּא בַּדֶּרֶךְ, וְהִטֵּתִי לִקְרוֹת כְּדִבְרֵי בֵּית שַׁמַּאי, וְסִכַּנְתִּי בְּעַצְמִי מִפְּנֵי הַלִּסְטִים',
      traduccion: '«Yo venía por el camino, y me recosté para leer según las palabras de Beit Shammai, y me puse en peligro por los bandidos»',
      explicacion: 'La mishná misma trae el testimonio dramático. R. Tarfon — discípulo de la casa de HILLEL — venía de camino de noche. Llegó el momento del shema y decidió ser «más estricto»: en lugar de leer caminando (como le permitía su propia escuela), se RECOSTÓ en plena ruta, como exige Beit Shammai.\n\nY casi lo matan. Un hombre tendido e inmóvil en un camino nocturno es presa perfecta para los לִסְטִים — los bandidos que infestaban las rutas de Judea. וְסִכַּנְתִּי בְּעַצְמִי — «me puse en peligro a mí mismo».\n\nR. Tarfon cuenta el episodio quizá esperando reconocimiento por su celo. La respuesta de los sabios es una bofetada:\n\n  כְּדַי הָיִיתָ לָחוּב בְּעַצְמְךָ, שֶׁעָבַרְתָּ עַל דִּבְרֵי בֵּית הִלֵּל\n  «MERECÍAS perder la vida, porque transgrediste las palabras de Beit Hillel»\n\nNo lo consuelan. No dicen «qué bueno que te salvaste». Dicen: el peligro que corriste era MERECIDO — no a pesar de tu piedad, sino A CAUSA de ella.\n\nLa enseñanza es una de las más incisivas del perek: LA ESTRICTEZ FUERA DE LUGAR NO ES PIEDAD — ES TRANSGRESIÓN. Una vez que la halajá quedó como Beit Hillel, actuar como Beit Shammai no es «cumplir según todos»: es rebelión contra la halajá establecida. La jumrá (estrictez) unilateral socava el sistema mismo que le da sentido a cualquier norma.\n\nHay también una ironía estructural: R. Tarfon se recostó por fidelidad al versículo según Shammai — y el episodio prueba empíricamente a Hillel: la Torá dice ובלכתך בדרך porque en el camino se lee CAMINANDO. El camino real, con sus bandidos reales, es exactamente el escenario para el que la lectura de Beit Hillel fue diseñada.'

    'veredicto-yejezkel': {

      explicacion: 'La gemará de 11a pregunta qué estatus tiene, después del veredicto contra R. Tarfon, la acción de quien actuó como Beit Shammai. Tres amoraím responden en escalada — y este es el peldaño más indulgente.\n\nRav Yejezkel enseña: עָשָׂה כְּדִבְרֵי בֵּית שַׁמַּאי — עָשָׂה. Quien hizo como Beit Shammai — HIZO: su lectura del shema es válida, cumplió la mitzvá (al menos bediavad, después del hecho).\n\nLa lógica de la indulgencia: Beit Shammai no es una opinión cualquiera — es una de las dos grandes casas, con tradición y razones propias. אלו ואלו דברי אלהים חיים — «estas y estas son palabras del Dios vivo». Aunque la halajá quedó como Hillel, la posición de Shammai conserva dignidad de Torá: quien la siguió no leyó «mal», leyó según una escuela legítima derrotada.\n\nEn este esquema, la norma «halajá como Beit Hillel» fija lo que se DEBE hacer lejatjilá (de entrada), pero no anula retroactivamente el valor de la acción hecha según Shammai.\n\nEs la única de las tres opiniones que salva algo del acto. Las dos siguientes — Rav Yosef y Rav Najman bar Yitzjak — cierran esa puerta con severidad creciente, hasta llegar a la fórmula extrema: merece la muerte.'

    'veredicto-yosef': {
      titulo: 'Rav Yosef · «no hizo nada» — la prueba de la sucá',
      hebreo: 'עָשָׂה כְּדִבְרֵי בֵּית שַׁמַּאי — לֹא עָשָׂה וְלֹא כְלוּם',
      traduccion: '«Si hizo según Beit Shammai — no hizo nada en absoluto»',
      explicacion: 'Rav Yosef sube un peldaño: quien actuó como Beit Shammai לֹא עָשָׂה וְלֹא כְלוּם — NO HIZO NADA EN ABSOLUTO. Su lectura del shema es NULA: no cumplió la mitzvá ni siquiera bediavad. Debe volver a leer.\n\nY trae la PRUEBA DE LA SUCÁ. La mishná de Sucá relata: los ancianos de Beit Shammai y de Beit Hillel visitaron a R. Yojanán ben haJoraní, y lo encontraron sentado con la cabeza y la mayor parte del cuerpo dentro de la sucá, pero con la mesa dentro de la casa (postura válida para Hillel, inválida para Shammai). Los de Beit Shammai le dijeron: si así te has comportado siempre — לֹא קִיַּימְתָּ מִצְוַת סוּכָּה מִיָּמֶיךָ: «no has cumplido la mitzvá de sucá EN TU VIDA».\n\nEl argumento de Rav Yosef es de simetría: así como Beit Shammai declara NULO retroactivamente lo hecho según Beit Hillel (¡toda una vida de sucot anulada!), así, una vez fijada la halajá como Hillel, lo hecho según Shammai es NULO. Las casas no se tratan mutuamente como «opciones válidas» — cada una considera la práctica de la otra inexistente halájicamente. Fijada la halajá, esa nulidad opera contra Shammai.\n\nLa consecuencia práctica es seria: el que leyó el shema recostado «por estrictez de Shammai» tiene que volver a leerlo. Su acto piadoso no solo fue peligroso (Tarfon) — fue VACÍO. No existe.\n\nEntre la validez de Rav Yejezkel y la pena capital de Rav Najman bar Yitzjak, Rav Yosef ocupa el centro exacto: el acto no merece castigo por sí mismo, pero tampoco cuenta. Es un cero halájico.'

      traduccion: '«Si hizo según Beit Shammai — merece la muerte»',
      explicacion: 'El tercer peldaño es vertiginoso. Rav Najman bar Yitzjak: quien actuó como Beit Shammai — חַיָּיב מִיתָה, MERECE LA MUERTE.\n\nSu prueba es la propia mishná de R. Tarfon: los sabios le dijeron כְּדַי הָיִיתָ לָחוּב בְּעַצְמְךָ — «merecías perder la vida». No dijeron «no cumpliste» ni «vuelve a leer»: dijeron que la muerte que casi encuentra en el camino habría sido MERECIDA. La formulación de los sabios no es retórica — es un veredicto.\n\n¿Cómo entender semejante severidad por... recostarse a leer el shema?\n\nLa clave: el pecado no es la postura — es la REBELIÓN. Una vez que la halajá quedó fijada como Beit Hillel (por la bat kol de Yavne: הלכה כבית הלל), actuar públicamente como Beit Shammai es desafiar el mecanismo mismo de decisión halájica. Es el pecado del זָקֵן מַמְרֵא — el sabio rebelde que enseña contra el tribunal — en miniatura. Si cada quien sigue la escuela derrotada que prefiere, no hay halajá: hay dos Torás, dos pueblos.\n\nLa escalada completa (עשה → לא עשה ולא כלום → חייב מיתה) muestra a la gemará midiendo la gravedad exacta de la jumrá ilegítima:\n\n  · Rav Yejezkel la tolera (válida bediavad)\n  · Rav Yosef la anula (cero halájico)\n  · Rav Najman bar Yitzjak la criminaliza (rebelión capital)\n\nEl mensaje agregado de la sugyá es inequívoco: ser «más estricto» contra la halajá establecida no es un extra de piedad — es, en su lectura más severa, un delito contra la unidad de la Torá. Exactamente lo que le dijeron a R. Tarfon.'

    'teatro': {

      traduccion: '«No sea que vean los alumnos y fijen la halajá para las generaciones»',
      explicacion: 'La baraita final es una escena de teatro halájico. R. Yishmael (ben Elisha) y R. Elazar ben Azaria estaban juntos: Yishmael RECOSTADO, Elazar ERGUIDO. Llegó el zman del shema — y los dos se INVIRTIERON:\n\n  · R. Elazar ben Azaria SE RECOSTÓ (adoptando la postura de Beit Shammai)\n  · R. Yishmael SE IRGUIÓ (abandonando la postura en que ya estaba)\n\nElazar protesta con el MASHAL DE LA BARBA: es como uno a quien le dicen «tu barba está crecida» y responde «que sea contra los destructores» — «no me la dejé crecer para ti». Es decir: yo me recosté para cumplir como Beit Shammai, ¡y tú, que YA estabas recostado (postura válida también para Hillel), te levantaste justo para contradecirme!\n\nLa respuesta de R. Yishmael es la joya de la sugyá: yo me erguí — y tú te recostaste. Yo actué según Beit Hillel; peor aún: si me quedaba recostado, שֶׁמָּא יִרְאוּ הַתַּלְמִידִים וְיִקְבְּעוּ הֲלָכָה לְדוֹרוֹת — «no sea que los alumnos VEAN y FIJEN la halajá PARA LAS GENERACIONES».\n\nR. Yishmael estaba recostado por comodidad — postura perfectamente válida según Beit Hillel (מַטִּין וְקוֹרִין). Pero si los alumnos lo veían recostado JUNTO a Elazar recostándose deliberadamente, leerían la escena como dos maestros practicando Beit Shammai — y fijarían esa halajá para siempre. Por eso tuvo que levantarse: no porque su postura fuera inválida, sino porque su postura SIGNIFICABA en ese contexto.\n\nLa lección final del diagrama: CADA GESTO DE UN MAESTRO ES JURISPRUDENCIA EN POTENCIA. Los alumnos no aprenden solo de lo que el maestro dice — aprenden de cómo se sienta, cuándo se levanta, en qué postura lee. El cuerpo del sabio es un texto que las generaciones leerán como precedente. R. Yishmael sacrifica su comodidad (¡y su postura legítima!) para que el registro visual que queda en los alumnos sea inequívocamente la halajá de Beit Hillel.\n\nAsí cierra la sugyá el círculo: empezó con dos casas disputando si el versículo habla del cuerpo, y termina mostrando que el cuerpo del maestro — recostado o erguido — es él mismo halajá viva (ver también el diagrama de shema-dos-veces: R. Yishmael y la flexibilidad del zman).'

        (d.hebreo ? '<span class="postura-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="postura-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="postura-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.postura-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.postura-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="postura-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
</script>
</div>
