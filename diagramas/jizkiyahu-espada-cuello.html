<!-- TÍTULO -->
<text x="360" y="28" text-anchor="middle" font-size="17" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">Jizkiyahu · la espada en el cuello</text>
<text x="360" y="48" text-anchor="middle" font-size="11.5" fill="#6b4423">Berajot 10a-10b · la tefilá contra la profecía · seis decisiones de un rey</text>

<!-- ============================================================ -->
<!-- 1 · LA PESHARÁ DE HKBH                                       -->
<!-- ============================================================ -->
<text x="60" y="76" font-size="9.5" fill="#1e3a5f" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">LA PESHARÁ DE HKBH · RAV HAMNUNA · KOHELET 8:1</text>

<g class="jizk-nodo" data-id="peshara">
  <rect x="60" y="86" width="600" height="150" rx="6" fill="rgba(30,58,95,0.06)" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="360" y="110" text-anchor="middle" font-size="12" direction="rtl" fill="#1e3a5f">מִי כְּהֶחָכָם וּמִי יוֹדֵעַ פֵּשֶׁר דָּבָר</text>
  <text x="360" y="128" text-anchor="middle" font-size="10" fill="#3d2f23" font-style="italic">«¿Quién como el Sabio, que sabe hacer peshará (compromiso) entre dos tzadikim?»</text>

  <rect x="78" y="140" width="276" height="56" rx="4" fill="rgba(30,58,95,0.04)" stroke="#1e3a5f" stroke-width="0.8"/>
  <text x="216" y="158" text-anchor="middle" font-size="10" fill="#1e3a5f" font-weight="600">Jizkiyahu · «que venga él a mí»</text>
  <text x="216" y="174" text-anchor="middle" font-size="9" fill="#3d2f23">precedente: Eliyahu fue a Ajav</text>
  <text x="216" y="188" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">el profeta camina hacia el rey</text>

  <rect x="366" y="140" width="276" height="56" rx="4" fill="rgba(30,58,95,0.04)" stroke="#1e3a5f" stroke-width="0.8"/>
  <text x="504" y="158" text-anchor="middle" font-size="10" fill="#1e3a5f" font-weight="600">Yeshayahu · «que venga él a mí»</text>
  <text x="504" y="174" text-anchor="middle" font-size="9" fill="#3d2f23">precedente: Yehoram fue a Elisha</text>
  <text x="504" y="188" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">el rey camina hacia el profeta</text>

  <text x="360" y="222" text-anchor="middle" font-size="10" fill="#1e3a5f" font-style="italic" font-weight="600">HKBH trae yisurim sobre Jizkiyahu y le dice al profeta: ve a visitar al enfermo</text>
</g>

<!-- ============================================================ -->
<!-- 2 · LA SENTENCIA DOBLE                                       -->
<!-- ============================================================ -->
<line x1="360" y1="236" x2="360" y2="254" stroke="#8b1a1a" stroke-width="1.2" marker-end="url(#flecha-jz)"/>

<text x="60" y="266" font-size="9.5" fill="#8b1a1a" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">LA SENTENCIA DOBLE · YESHAYAHU 38:1</text>

<g class="jizk-nodo" data-id="sentencia">
  <rect x="60" y="276" width="600" height="150" rx="6" fill="rgba(139,26,26,0.08)" stroke="#8b1a1a" stroke-width="1.6"/>
  <text x="360" y="300" text-anchor="middle" font-size="12.5" direction="rtl" fill="#8b1a1a">צַו לְבֵיתֶךָ — כִּי מֵת אַתָּה וְלֹא תִחְיֶה</text>
  <text x="360" y="320" text-anchor="middle" font-size="11" direction="rtl" fill="#8b1a1a">מֵת אַתָּה — בָּעוֹלָם הַזֶּה · וְלֹא תִחְיֶה — לָעוֹלָם הַבָּא</text>
  <text x="360" y="338" text-anchor="middle" font-size="10" fill="#3d2f23" font-style="italic">«muerto tú» — en este mundo · «y no vivirás» — en el mundo que viene</text>

  <line x1="80" y1="350" x2="640" y2="350" stroke="#8b1a1a" stroke-width="0.5" opacity="0.4"/>

  <text x="78" y="368" font-size="9.5" fill="#3d2f23"><tspan font-weight="600" fill="#8b1a1a">causa</tspan> · porque no te ocupaste de la procreación (פריה ורביה)</text>
  <text x="78" y="384" font-size="9.5" fill="#3d2f23"><tspan font-weight="600" fill="#8b1a1a">defensa</tspan> · «vi con ruaj hakodesh que mis hijos serían malvados» (Menashé)</text>
  <text x="360" y="404" text-anchor="middle" font-size="11" direction="rtl" fill="#8b1a1a">בַּהֲדֵי כַּבְשֵׁי דְרַחֲמָנָא לְמָה לָךְ?</text>
  <text x="360" y="420" text-anchor="middle" font-size="9" fill="#6b4423" font-style="italic">«¿qué haces tú con los secretos del Misericordioso? lo ordenado, hazlo»</text>
</g>

<!-- ============================================================ -->
<!-- 3 · EL PEDIDO Y EL PORTAZO                                   -->
<!-- ============================================================ -->
<line x1="360" y1="426" x2="360" y2="444" stroke="#8b1a1a" stroke-width="1.2" marker-end="url(#flecha-jz)"/>

<text x="60" y="456" font-size="9.5" fill="#8b1a1a" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">EL PEDIDO Y EL PORTAZO · «YA FUE DECRETADO»</text>

<g class="jizk-nodo" data-id="portazo">
  <rect x="60" y="466" width="600" height="106" rx="6" fill="rgba(139,26,26,0.05)" stroke="#8b1a1a" stroke-width="1.3"/>
  <text x="78" y="490" font-size="9.5" fill="#3d2f23"><tspan font-weight="600" fill="#8b1a1a">el pedido</tspan> · «dame a tu hija — quizás el mérito de ambos engendre hijos dignos»</text>
  <text x="78" y="508" font-size="9.5" fill="#3d2f23"><tspan font-weight="600" fill="#8b1a1a">la respuesta</tspan> · «ya fue decretado sobre ti» — la puerta profética se cierra</text>
  <text x="360" y="534" text-anchor="middle" font-size="12.5" direction="rtl" fill="#8b1a1a">בֶּן אָמוֹץ, כַּלֵּה נְבוּאָתְךָ וָצֵא!</text>
  <text x="360" y="554" text-anchor="middle" font-size="10" fill="#3d2f23" font-style="italic">«¡Hijo de Amotz, termina tu profecía y sal!» — el rey expulsa al profeta</text>
</g>

<!-- ============================================================ -->
<!-- 4 · LA ESPADA · NODO CENTRAL                                 -->
<!-- ============================================================ -->
<line x1="360" y1="572" x2="360" y2="590" stroke="#b8860b" stroke-width="1.5" marker-end="url(#flecha-jz-gold)"/>

<text x="60" y="602" font-size="9.5" fill="#b8860b" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">LA ESPADA · TRADICIÓN DE LA CASA DE DAVID · NÚCLEO</text>

<g class="jizk-nodo" data-id="espada">
  <rect x="60" y="612" width="600" height="164" rx="6" fill="rgba(184,134,11,0.13)" stroke="#b8860b" stroke-width="2.2"/>
  <!-- espada decorativa -->
  <line x1="290" y1="630" x2="430" y2="630" stroke="#b8860b" stroke-width="1.5" opacity="0.7"/>
  <line x1="418" y1="624" x2="418" y2="636" stroke="#b8860b" stroke-width="1.5" opacity="0.7"/>
  <path d="M290,630 L282,627 L282,633 z" fill="#b8860b" opacity="0.7"/>

  <text x="360" y="656" text-anchor="middle" font-size="12" direction="rtl" fill="#1a1410">כָּךְ מְקוּבְּלַנִי מִבֵּית אֲבִי אַבָּא —</text>
  <text x="360" y="678" text-anchor="middle" font-size="12.5" direction="rtl" fill="#1a1410">אֲפִילּוּ חֶרֶב חַדָּה מוּנַּחַת עַל צַוָּארוֹ שֶׁל אָדָם</text>
  <text x="360" y="700" text-anchor="middle" font-size="12.5" direction="rtl" fill="#1a1410">אַל יִמְנַע עַצְמוֹ מִן הָרַחֲמִים</text>
  <text x="360" y="722" text-anchor="middle" font-size="10.5" fill="#3d2f23" font-style="italic">«Así lo recibí de la casa del padre de mi padre: aunque una espada afilada descanse</text>
  <text x="360" y="737" text-anchor="middle" font-size="10.5" fill="#3d2f23" font-style="italic">sobre el cuello del hombre — que no se abstenga de la misericordia»</text>
  <text x="78" y="758" font-size="9" fill="#6b4423">R. Yojanan y R. Eliezer · ״הֵן יִקְטְלֵנִי לוֹ אֲיַחֵל״ (Iyov 13:15)</text>
  <text x="78" y="771" font-size="9" fill="#6b4423">R. Janan · aunque el baal hajalomot te diga que mañana mueres — reza</text>
</g>

<!-- ============================================================ -->
<!-- 5 · EL MURO Y «LO BUENO ANTE TUS OJOS»                       -->
<!-- ============================================================ -->
<line x1="360" y1="776" x2="360" y2="794" stroke="#1e3a5f" stroke-width="1.2" marker-end="url(#flecha-jz)"/>

<text x="60" y="806" font-size="9.5" fill="#1e3a5f" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">EL MURO · YESHAYAHU 38:2-3 · LA TEFILÁ DEL REY</text>

<g class="jizk-nodo" data-id="muro">
  <rect x="60" y="816" width="290" height="152" rx="6" fill="rgba(30,58,95,0.06)" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="205" y="838" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1e3a5f" font-weight="700">¿Qué es el kir?</text>
  <text x="205" y="860" text-anchor="middle" font-size="10.5" direction="rtl" fill="#1e3a5f">וַיַּסֵּב חִזְקִיָּהוּ פָּנָיו אֶל הַקִּיר</text>
  <text x="78" y="880" font-size="9.5" fill="#3d2f23"><tspan font-weight="600" fill="#1e3a5f">Reish Lakish</tspan> · rezó מִקִּירוֹת לִבּוֹ,</text>
  <text x="78" y="894" font-size="9.5" fill="#3d2f23">desde los muros de su corazón</text>
  <text x="78" y="914" font-size="9.5" fill="#3d2f23"><tspan font-weight="600" fill="#1e3a5f">R. Levi</tspan> · sobre asuntos del muro:</text>
  <text x="78" y="928" font-size="9" fill="#3d2f23">la Shunamit hizo UNA pared — le reviviste</text>
  <text x="78" y="942" font-size="9" fill="#3d2f23">al hijo; mi antepasado recubrió el Heijal</text>
  <text x="78" y="956" font-size="9" fill="#6b4423" font-style="italic">de plata y oro — cuánto más</text>
</g>

<g class="jizk-nodo" data-id="hatov">
  <rect x="370" y="816" width="290" height="152" rx="6" fill="rgba(184,134,11,0.10)" stroke="#b8860b" stroke-width="1.3"/>
  <text x="515" y="838" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#b8860b" font-weight="700">¿Qué bien hizo?</text>
  <text x="515" y="860" text-anchor="middle" font-size="10.5" direction="rtl" fill="#b8860b">וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי</text>
  <text x="388" y="880" font-size="9.5" fill="#3d2f23"><tspan font-weight="600" fill="#b8860b">Rav Yehuda beshem Rav</tspan> ·</text>
  <text x="388" y="894" font-size="9.5" fill="#3d2f23">pegó geulá a tefilá</text>
  <text x="388" y="914" font-size="9.5" fill="#3d2f23"><tspan font-weight="600" fill="#b8860b">R. Levi</tspan> · escondió el Séfer Refuot,</text>
  <text x="388" y="928" font-size="9" fill="#3d2f23">el Libro de los Remedios — para que</text>
  <text x="388" y="942" font-size="9" fill="#3d2f23">los enfermos volvieran a rezar</text>
  <text x="388" y="956" font-size="9" fill="#6b4423" font-style="italic">la salud sin tefilá era demasiado fácil</text>
</g>

<line x1="205" y1="968" x2="205" y2="984" stroke="#3d2f23" stroke-width="1" marker-end="url(#flecha-jz)"/>

<g class="jizk-nodo" data-id="decisiones">
  <rect x="60" y="1008" width="600" height="182" rx="6" fill="rgba(30,107,90,0.04)" stroke="#2d6b4e" stroke-width="1.3"/>
  <text x="205" y="1032" text-anchor="middle" font-size="10.5" fill="#2d6b4e" font-weight="700">הוֹדוּ לוֹ · aprobaron ✓</text>
  <text x="515" y="1032" text-anchor="middle" font-size="10.5" fill="#6b4423" font-weight="700">לֹא הוֹדוּ לוֹ · no aprobaron ✗</text>

  <rect x="80" y="1044" width="270" height="30" rx="4" fill="rgba(30,107,90,0.08)" stroke="#2d6b4e" stroke-width="0.8"/>
  <text x="96" y="1063" font-size="9.5" fill="#3d2f23"><tspan fill="#2d6b4e" font-weight="700">✓</tspan> escondió el Séfer Refuot</text>

  <rect x="80" y="1082" width="270" height="30" rx="4" fill="rgba(30,107,90,0.08)" stroke="#2d6b4e" stroke-width="0.8"/>
  <text x="96" y="1101" font-size="9.5" fill="#3d2f23"><tspan fill="#2d6b4e" font-weight="700">✓</tspan> trituró la serpiente de cobre</text>

  <rect x="80" y="1120" width="270" height="30" rx="4" fill="rgba(30,107,90,0.08)" stroke="#2d6b4e" stroke-width="0.8"/>
  <text x="96" y="1139" font-size="9.5" fill="#3d2f23"><tspan fill="#2d6b4e" font-weight="700">✓</tspan> arrastró los huesos de su padre Ajaz</text>

  <rect x="370" y="1044" width="270" height="30" rx="4" fill="rgba(107,68,35,0.08)" stroke="#6b4423" stroke-width="0.8"/>
  <text x="386" y="1063" font-size="9.5" fill="#3d2f23"><tspan fill="#8b1a1a" font-weight="700">✗</tspan> tapó las aguas del Guijón</text>

  <rect x="370" y="1082" width="270" height="30" rx="4" fill="rgba(107,68,35,0.08)" stroke="#6b4423" stroke-width="0.8"/>
  <text x="386" y="1101" font-size="9.5" fill="#3d2f23"><tspan fill="#8b1a1a" font-weight="700">✗</tspan> cortó las puertas del Heijal para Ashur</text>

  <rect x="370" y="1120" width="270" height="30" rx="4" fill="rgba(107,68,35,0.08)" stroke="#6b4423" stroke-width="0.8"/>
  <text x="386" y="1139" font-size="9.5" fill="#3d2f23"><tspan fill="#8b1a1a" font-weight="700">✗</tspan> intercaló Nisán en Nisán</text>

  <text x="360" y="1174" text-anchor="middle" font-size="9" fill="#6b4423" font-style="italic">un rey audaz que decide solo · tres veces acertó con los sabios, tres veces no</text>
</g>

<!-- ============================================================ -->
<line x1="360" y1="1190" x2="360" y2="1208" stroke="#3d2f23" stroke-width="1" marker-end="url(#flecha-jz)"/>

<text x="60" y="1220" font-size="9.5" fill="#6b4423" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">EL QUIASMO DEL MÉRITO · R. YOJANAN BESHEM R. YOSE BEN ZIMRA</text>

<g class="jizk-nodo" data-id="quiasmo">
  <rect x="60" y="1230" width="600" height="188" rx="6" fill="rgba(107,68,35,0.07)" stroke="#6b4423" stroke-width="1.4"/>
  <text x="360" y="1252" text-anchor="middle" font-size="10.5" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410" font-weight="600">quien cuelga de su propio zjut → responden por zjut ajeno · y viceversa</text>

  <rect x="78" y="1264" width="276" height="94" rx="4" fill="rgba(184,134,11,0.06)" stroke="#b8860b" stroke-width="0.9"/>
  <text x="216" y="1284" text-anchor="middle" font-size="10" fill="#b8860b" font-weight="700">Jizkiyahu · invoca zjut PROPIO</text>
  <text x="216" y="1304" text-anchor="middle" font-size="10" direction="rtl" fill="#3d2f23">זְכָר נָא אֵת אֲשֶׁר הִתְהַלַּכְתִּי לְפָנֶיךָ</text>
  <text x="216" y="1322" text-anchor="middle" font-size="9" fill="#3d2f23" font-style="italic">respondido por zjut AJENO:</text>
