<g class="melej-nodo" data-id="rav-sheshet">
  <rect x="60" y="86" width="600" height="140" rx="6" fill="rgba(30,107,90,0.07)" stroke="#2d6b4e" stroke-width="1.4"/>
  <text x="360" y="112" text-anchor="middle" font-size="12" direction="rtl" fill="#1a1410">רַב שֵׁשֶׁת, כִּי כָּרַע — כָּרַע כְּחִיזְרָא · כִּי קָא זָקֵיף — זָקֵיף כְּחִיוְיָא</text>
  <text x="360" y="130" text-anchor="middle" font-size="9.5" fill="#3d2f23" font-style="italic">«al inclinarse — se inclinaba como una caña · al erguirse — se erguía como una serpiente»</text>

  <!-- la caña: baja de golpe, una diagonal seca -->
  <circle cx="176" cy="152" r="7" fill="none" stroke="#2d6b4e" stroke-width="1.6"/>
  <line x1="181" y1="157" x2="216" y2="192" stroke="#2d6b4e" stroke-width="2"/>
  <line x1="150" y1="192" x2="216" y2="192" stroke="#2d6b4e" stroke-width="0.8" opacity="0.5"/>
  <text x="255" y="168" font-size="10" direction="rtl" fill="#2d6b4e" font-weight="700">כְּחִיזְרָא</text>
  <text x="255" y="184" font-size="8.5" fill="#3d2f23" font-style="italic">baja DE GOLPE, como la caña</text>
  <text x="255" y="197" font-size="8.5" fill="#6b4423" font-style="italic">la reverencia no se regatea</text>

  <!-- la serpiente: sube lenta, en ondas -->

  <circle cx="522" cy="154" r="7" fill="none" stroke="#2d6b4e" stroke-width="1.6"/>
  <line x1="440" y1="198" x2="530" y2="198" stroke="#2d6b4e" stroke-width="0.8" opacity="0.5"/>
  <text x="620" y="168" text-anchor="end" font-size="10" direction="rtl" fill="#2d6b4e" font-weight="700">כְּחִיוְיָא</text>
  <text x="637" y="184" text-anchor="end" font-size="8.5" fill="#3d2f23" font-style="italic">sube LENTO, como la serpiente</text>
  <text x="637" y="197" text-anchor="end" font-size="8.5" fill="#6b4423" font-style="italic">que no parezca que inclinarse pesa</text>

  <text x="360" y="218" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">la coreografía perfecta del כורע וזוקף — cierre corporal del tema anterior (#38)</text>
</g>

  <text x="200" y="628" text-anchor="middle" font-size="12" direction="rtl" fill="#1e3a5f" font-weight="700">״הָאֵל הַקָּדוֹשׁ״</text>
  <text x="200" y="644" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">«el Dios santo»</text>

  <text x="200" y="724" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">amando el juicio — desde lejos</text>
</g>

  <text x="520" y="684" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">«el Rey del juicio»</text>

<!-- ============================================================ -->

  <text x="360" y="830" text-anchor="middle" font-size="12" direction="rtl" fill="#8b1a1a">אֲפִילּוּ אָמַר ״הָאֵל הַקָּדוֹשׁ״ — יָצָא</text>
  <text x="360" y="848" text-anchor="middle" font-size="9.5" fill="#3d2f23" font-style="italic">«aun quien dijo haEl haKadosh — cumplió»</text>
  <text x="360" y="868" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">su prueba: un pasuk que habla del día del juicio ¡y aun así dice haEl!</text>
</g>

  <text x="360" y="952" text-anchor="middle" font-size="12.5" direction="rtl" fill="#1e3a5f">וַיִּגְבַּה ה׳ צְבָאוֹת בַּמִּשְׁפָּט וְהָאֵל הַקָּדוֹשׁ נִקְדָּשׁ בִּצְדָקָה</text>
  <text x="360" y="972" text-anchor="middle" font-size="9.5" fill="#3d2f23" font-style="italic">«Se elevó Hashem de los ejércitos en el JUICIO — y el Dios santo fue santificado en la justicia»</text>
  <text x="360" y="992" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">bamishpat = los días del juicio · y el versículo dice הָאֵל — no הַמֶּלֶךְ</text>
</g>

  <text x="200" y="1094" text-anchor="middle" font-size="10.5" direction="rtl" fill="#8b1a1a">״הָאֵל הַקָּדוֹשׁ״ וּ״מֶלֶךְ אוֹהֵב צְדָקָה וּמִשְׁפָּט״</text>
  <text x="200" y="1112" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">se reza igual que todo el año</text>
  <text x="200" y="1130" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">no hay que cambiar el título:</text>
  <text x="200" y="1144" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">haEl ya contiene todo</text>

  <text x="520" y="1094" text-anchor="middle" font-size="10.5" direction="rtl" fill="#8b1a1a">״הַמֶּלֶךְ הַקָּדוֹשׁ״ וְ״הַמֶּלֶךְ הַמִּשְׁפָּט״</text>
  <text x="520" y="1112" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">en los diez días el título CAMBIA</text>
  <text x="520" y="1130" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">la teología del día exige</text>
  <text x="520" y="1144" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">nombrar al Rey que juzga</text>
</g>

<line x1="520" y1="1164" x2="390" y2="1198" stroke="#b8860b" stroke-width="1.4" marker-end="url(#flecha-mk-gold)"/>

      explicacion: 'Antes de entrar en el tema nuevo, el editor cierra el anterior con una miniatura corporal. El diagrama #38 terminó con la regla de Rav — korea beVaruj, zokef baShem, inclinarse en «baruj» y erguirse en el Nombre. Ahora la guemará muestra CÓMO lo hacía un maestro concreto: Rav Sheshet.\n\nDos imágenes animales, una para cada mitad del gesto:\n\n  · כְּחִיזְרָא — COMO UNA CAÑA. Al inclinarse, bajaba DE GOLPE — como una caña que se quiebra en un solo movimiento, sin etapas, sin vacilación. La reverencia no se regatea: el que se somete a HKBH no negocia el descenso centímetro a centímetro. La prontitud del cuerpo ES la sinceridad de la sumisión.\n\n  · כְּחִיוְיָא — COMO UNA SERPIENTE. Al erguirse, subía LENTO — como una serpiente que se yergue por tramos, gradualmente, sin prisa. ¿Por qué? Para que NO PAREZCA que inclinarse le pesa. El que se levanta de un salto delata que la reverencia le resultaba una carga de la que se libera con alivio. El que sube despacio muestra que estar doblado ante Dios no le incomodaba.\n\nLa asimetría es toda la enseñanza: RÁPIDO hacia abajo, LENTO hacia arriba. Exactamente lo contrario del instinto — el cuerpo natural baja con pereza y sube con alivio. La coreografía de Rav Sheshet invierte el instinto: entusiasmo en el descenso, serenidad en el ascenso.\n\nHay además una ironía deliberada en que el maestro de esta coreografía VISUAL sea Rav Sheshet — que era CIEGO. El sabio que no podía ver su propia postura la había perfeccionado hasta volverse el modelo citado por la guemará. La reverencia no se hace para el ojo ajeno: se hace ante Dios, y el ciego la ejecuta perfecta.\n\nCon el cuerpo ya educado — cómo bajar, cómo subir — el editor pasa a la siguiente enseñanza de la cadena de Rabba bar Jinnana Sava: qué PALABRAS deben cambiar cuando cambia el calendario.'

    'r-elazar': {

      hebreo: 'אֲפִילּוּ אָמַר ״הָאֵל הַקָּדוֹשׁ״ — יָצָא',
      traduccion: '«Aun quien dijo el Dios santo — cumplió»',
      explicacion: 'R. Elazar discrepa de la regla de Rav: aun quien en los diez días dijo הָאֵל הַקָּדוֹשׁ — la fórmula de todo el año — יָצָא, CUMPLIÓ su obligación. No hace falta cambiar el título.\n\nLa posición tiene su propia lógica teológica: los títulos de Dios no son contraseñas de temporada. הָאֵל («el Dios») es un nombre TOTAL — contiene en sí toda la realeza, todo el juicio, toda la santidad. El que dice haEl en los días del juicio no dijo nada FALSO: dijo un nombre verdadero de Dios, verdadero también en Tishrei. ¿Desde cuándo una verdad deja de servir por el calendario?\n\nY R. Elazar no argumenta en abstracto — trae una PRUEBA de Yeshayahu 5:16 (el nodo azul, abajo): un versículo que describe explícitamente el escenario del juicio y que, sin embargo, llama a Dios הָאֵל y no הַמֶּלֶךְ. Si el profeta pudo decir haEl en pleno contexto de mishpat, el que reza también puede.\n\nLa estructura de la disputa es un clásico de la halajá litúrgica:\n\n  · RAV exige CORRESPONDENCIA: las palabras deben reflejar el momento teológico. Días de juicio → título de Juez. La fórmula es un espejo del calendario.\n  · R. ELAZAR exige solo VERDAD: las palabras deben ser verdaderas de Dios. Y haEl es siempre verdadera. La fórmula no necesita sincronizarse — necesita no mentir.\n\n¿Precisión estacional o verdad intemporal? La guemará no lo decide en este nivel: hará falta que una generación posterior — Rav Yosef y Rabba, abajo — tome partido, y que el editor final firme el veredicto.'

    'pasuk': {

      traduccion: '«Se elevó Hashem de los ejércitos en el juicio, y el Dios santo fue santificado en la justicia» (Yeshayahu 5:16)',
      explicacion: 'La prueba de R. Elazar es un versículo leído con lupa. Yeshayahu 5:16 dice: «Se elevó Hashem de los ejércitos בַּמִּשְׁפָּט — EN EL JUICIO — y הָאֵל הַקָּדוֹשׁ — el DIOS santo — fue santificado en la justicia».\n\nLa fuerza del argumento está en la conjunción de las dos mitades:\n\n  · La primera mitad establece el CONTEXTO: בַּמִּשְׁפָּט, «en el juicio». El versículo habla del momento en que Dios se eleva juzgando — para la lectura rabínica, אֵימָתַי (¿cuándo?): en los días del juicio, entre Rosh HaShaná y Yom Kipur.\n  · La segunda mitad da el TÍTULO: y en ese preciso escenario, el profeta escribe וְהָאֵל הַקָּדוֹשׁ — «el DIOS santo». No haMelej. HaEl.\n\nEs decir: la Escritura misma, describiendo exactamente el escenario que según Rav exige decir «haMelej», usa «haEl». Si el título haEl fuera inadecuado para los días del juicio, el versículo sería el primero en evitarlo. El pasuk es el testigo perfecto de R. Elazar: haEl FUNCIONA en Tishrei.\n\nLa ironía es que el mismo versículo es también el gran texto de la posición contraria — léase entero: Dios se ELEVA en el juicio, se SANTIFICA en la justicia. Es el pasuk que enseña que la santidad de Dios se manifiesta al mundo precisamente CUANDO JUZGA — la intuición profunda detrás del cambio de título de Rav. Los dos lados de la disputa caben dentro de las mismas diez palabras de Yeshayahu: R. Elazar lee el TÍTULO (dice haEl), Rav lee el CONTENIDO (la santidad se revela en el mishpat).\n\nUn detalle para la memoria litúrgica: este versículo quedó incrustado en la propia amidá de los Yamim Noraim — la tercera berajá de esos días lo cita entero justo antes de sellar «haMelej haKadosh». El pasuk que probaba «haEl» termina sirviendo de antesala al sello «haMelej»: la disputa entera quedó rezada dentro de la berajá.'

    'rav-yosef': {

      traduccion: 'Rav Yosef dijo: «el Dios santo» y «Rey que ama la justicia y el derecho»',

      explicacion: 'Rabba toma partido por RAV: en los diez días entre Rosh HaShaná y Yom Kipur se dice הַמֶּלֶךְ הַקָּדוֹשׁ y הַמֶּלֶךְ הַמִּשְׁפָּט. El título CAMBIA, porque el tiempo cambió.\n\nLa posición de Rabba es una tesis sobre qué es la tefilá: no un catálogo de verdades intemporales sobre Dios, sino un acto situado EN EL TIEMPO. El que reza en los diez días no está describiendo a Dios en general — está parado ante un tribunal EN SESIÓN. Decir «haEl haKadosh» en esos días no es falso… pero es hablar de otra cosa. Es describir al Rey en abstracto mientras el Rey, en concreto, está juzgando al que habla.\n\nPor eso la palabra debe ser הַמֶּלֶךְ: el título de RELACIÓN. «Rey» no es un atributo que Dios tenga a solas — es un vínculo que existe solo si hay súbditos que lo reconocen. En los días en que la soberanía se revela juzgando, la liturgia debe realizar el reconocimiento: coronar. La amidá de los diez días es un acto de coronación diaria — tres veces al día, Israel repite la entronización de Rosh HaShaná.\n\nY nótese la simetría editorial: Rabba sostiene la posición de RAV — y la cadena entera de esta sugyá viene de Rabba bar Jinnana Sava בְּשֵׁם RAV. La enseñanza vuelve a casa: lo que Rav enseñó, un Rabba lo transmitió y otro Rabba lo defendió hasta convertirlo en ley.\n\nEl arco dorado del anillo — los diez días — es la posición de Rabba hecha calendario. Y la firma final del editor la vuelve irrevocable.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.melej-interactivo')
    : document.querySelector('.melej-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#melej-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.melej-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="melej-panel-header">' +
        '<p class="melej-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="melej-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="melej-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="melej-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.melej-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.melej-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="melej-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
