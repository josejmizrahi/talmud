      explicacion: 'El primer objeto de la lista del pasuk: una CAMA. El lugar de descanso propio es la base de la dignidad del huésped — no duerme en el suelo, no comparte el espacio de la familia, tiene su intimidad.\n\nPero la cama guarda además una de las dos SEÑALES DE KEDUSHÁ. Cuando la guemará pregunta cómo supo la Shunamit que Elisha era kadosh, Rav y Shmuel (otra vez ellos) dan dos respuestas — y una es esta: la SÁBANA DE LINO que ella tendía sobre su cama NUNCA vio una mancha de keri (emisión seminal).\n\nEl detalle es notable por varias razones:\n\n  · Es un dato que SOLO quien lava la ropa puede conocer. La señal de kedushá no se ve en la sinagoga ni en el discurso público — se ve en el lavadero. Por eso es la MUJER quien lo detecta.\n\n  · El lino (פשתן) es la tela que marca: en lino blanco cualquier mancha se nota. La Shunamit eligió — o la guemará imagina — el material que hace VISIBLE la pureza o su ausencia.\n\n  · La kedushá del cuerpo dormido: el keri ocurre sin voluntad, durmiendo. Que Elisha nunca lo tuviera indica una pureza que alcanza hasta el nivel INVOLUNTARIO — el cuerpo entero, incluso inconsciente, está alineado.\n\nLa lección general: la santidad verdadera se verifica en los detalles domésticos e íntimos, no en la actuación pública. El diagrama pinta este nodo de azul — es una de las dos evidencias con las que la mujer construyó su diagnóstico: אִישׁ אֱלֹהִים קָדוֹשׁ הוּא.'
    },
    'shuljan': {

      hebreo: 'שֻׁלְחָן',
      traduccion: 'La mesa — el segundo objeto de la aliyá',
      explicacion: 'El segundo objeto: una MESA propia. El huésped no come de las sobras ni depende de los horarios de la familia — tiene su lugar de comida, su autonomía alimentaria.\n\nY la mesa guarda la segunda SEÑAL DE KEDUSHÁ: la Shunamit NUNCA vio una MOSCA pasar por la mesa de Elisha.\n\nLa mosca es el signo universal de la comida descuidada — donde hay restos, migas, suciedad, hay moscas. Que la mesa del profeta no las atrajera indica algo más que limpieza: indica que su relación con la comida era de una pureza tal que ni siquiera el insecto más insistente del mundo antiguo encontraba nada que reclamar.\n\nAlgunas lecturas ven aquí un pequeño milagro (la kedushá repele físicamente la impureza); otras, una observación hiperbólica de la disciplina extrema del profeta en su mesa. En ambos casos, el punto estructural es el mismo que en la cama:\n\n  · La señal es DOMÉSTICA — se observa sirviendo la comida, no en el ámbito público.\n  · La señal es ACUMULATIVA — «nunca vio» implica observación repetida, atención sostenida en el tiempo.\n  · La señal está al alcance de quien ATIENDE la casa — por eso la mujer la detecta antes y mejor.\n\nCama y mesa forman el par de evidencias: la pureza del cuerpo dormido (keri) y la pureza del cuerpo que come (mosca). Noche y día, lo involuntario y lo cotidiano. Con esos dos datos la Shunamit emite un diagnóstico que la guemará valida como correcto y preciso.'

    'kise': {

      traduccion: 'La silla — el tercer objeto de la aliyá',
      explicacion: 'El tercer objeto: una SILLA. Sobre este objeto la guemará no cuelga ninguna derashá específica — y ese silencio también enseña.\n\nLa silla completa el MÍNIMO DIGNO de habitación. La cama es para la noche; la mesa para comer; la silla es para EL RESTO del tiempo: para sentarse a estudiar, para recibir a quien viene a consultarlo, para simplemente ESTAR. Un huésped sin silla está siempre de paso — o acostado o comiendo o de pie para irse. La silla dice: puedes quedarte, puedes habitar, este espacio es tuyo también cuando no lo estás usando para una función.\n\nEn la imaginación rabínica posterior, los cuatro objetos de la Shunamit (מטה, שלחן, כסא, מנורה) se volvieron la lista canónica del equipamiento del huésped — lo que una casa hospitalaria provee. No es una lista de lujo: es la lista de la AUTONOMÍA. Cada objeto le ahorra al huésped tener que pedir, depender, interrumpir la vida de la familia:\n\n  · cama — no pide dónde dormir\n  · mesa — no pide dónde comer\n  · silla — no pide dónde estar\n  · lámpara — no pide luz\n\nLa hospitalidad perfecta es la que hace INNECESARIO pedir. La Shunamit no espera los pedidos de Elisha — los anticipa todos en el diseño mismo de la habitación. Anticipar la necesidad ajena antes de que se formule: esa es la forma más alta de atención al otro, y es la misma capacidad de OBSERVACIÓN que después le permitirá diagnosticar la kedushá del profeta.'

    'menora': {

      traduccion: 'La lámpara — el cuarto objeto de la aliyá',
      explicacion: 'El cuarto objeto: una LÁMPARA. Como con la silla, la guemará no deriva de ella una enseñanza específica — pero su lugar en la lista es elocuente.\n\nLa lámpara extiende la autonomía del huésped a la NOCHE. Sin luz propia, el día del huésped termina cuando la familia apaga sus lámparas. Con la menorá, Elisha puede velar: estudiar de noche, rezar, escribir, recibir la palabra profética a la hora que llegue. La Shunamit no solo le dio un espacio — le dio TIEMPO, las horas nocturnas que la luz rescata de la oscuridad.\n\nPara un hombre de Torá, la lámpara es el objeto más cargado de la lista: la tradición asocia la noche con el estudio (el que estudia de noche, un hilo de jésed lo acompaña de día), y la luz de la lámpara con la Torá misma — כִּי נֵר מִצְוָה וְתוֹרָה אוֹר. Darle una menorá al profeta es equipar su servicio, no solo su descanso.\n\nHay también un eco con el final de la sugyá: los cuatro objetos culminan en la equivalencia del TAMID (ver el nodo dorado). En el Mikdash, junto al korban tamid diario, ardía la נֵר תָּמִיד — la lámpara perpetua. La habitación de la Shunamit, con su mesa que será mizbeaj y su lámpara encendida, se deja leer como un pequeño santuario doméstico: la casa que hospeda a un talmid jajam reproduce, en miniatura, la estructura del Templo.'

    'reconocimiento': {
      titulo: 'El reconocimiento · la mujer reconoce al huésped',
      hebreo: 'הִנֵּה נָא יָדַעְתִּי כִּי אִישׁ אֱלֹהִים קָדוֹשׁ הוּא',
      traduccion: '«He aquí que yo sé que es un hombre de Elokim, kadosh» (Melajim II 4:9)',
      explicacion: 'Antes de proponer la construcción, la Shunamit le dice a su marido este versículo. R. Yosei bar Janina extrae de él una enseñanza general:\n\n  מכאן שהאשה מכרת באורחין יותר מן האיש\n  «de aquí: la mujer reconoce a los huéspedes más que el hombre»\n\nLa observación es precisa en el texto bíblico: es ELLA quien emite el diagnóstico («yo sé que es kadosh»), no el marido — aunque ambos lo veían pasar. ¿Por qué ella sabe y él no?\n\nLa guemará responde con las dos señales domésticas (ver los nodos de la cama y la mesa): la sábana sin keri, la mesa sin moscas. Son datos que se recogen ATENDIENDO la casa — lavando, sirviendo, ordenando. El conocimiento de la mujer no es intuición mística: es OBSERVACIÓN EMPÍRICA acumulada en el terreno que ella administra. El marido ve al profeta pasar; ella ve lo que el profeta deja — y en lo que deja (o no deja) está la evidencia.\n\nY la guemará subraya la PRECISIÓN del diagnóstico: הוא קדוש — ÉL es kadosh, y con el pronombre enfático viene la exclusión: וּמשרתו אינו קדוש — su asistente NO lo es. La Shunamit no santificó el paquete completo «profeta + séquito»; distinguió entre el maestro y Guejazí. La guemará confirma que acertó: Guejazí después la agarraría בְּהוֹד יָפְיָהּ (por el esplendor de su belleza) — conducta que ningún kadosh tendría.\n\nEl reconocimiento fino — distinguir kedushá real de proximidad a la kedushá — es la capacidad que la sugyá celebra en ella. Estar cerca del kadosh no santifica; Guejazí compartía techo, mesa y camino con Elisha y no era kadosh. La santidad no se contagia por cercanía: se verifica en la conducta, detalle por detalle.'

    'recibir': {
      titulo: 'Recibir o no recibir · Elisha y Shmuel HaRamati',

      traduccion: '«El que quiere disfrutar, que disfrute; el que no quiere disfrutar, que no disfrute»',
      explicacion: 'Abaye (algunos dicen R. Yitzjak) extrae del episodio una halajá de conducta para el LADO DEL HUÉSPED: ¿debe el sabio aceptar lo que le ofrecen?\n\nLa respuesta es sorprendentemente liberal: HAY DOS MODELOS LEGÍTIMOS.\n\n  MODELO 1 · COMO ELISHA — הרוצה להנות יהנה. El que quiere disfrutar de lo que le ofrecen, que disfrute. Elisha aceptó la aliyá, la cama, la mesa, la silla y la lámpara. Comía de la mesa de la Shunamit cada vez que pasaba. Y NO hay en ello mengua de su kedushá — el mismo capítulo que registra su aceptación registra su santidad.\n\n  MODELO 2 · COMO SHMUEL HARAMATI — ושאינו רוצה להנות אל יהנה. El que no quiere disfrutar, que no disfrute — como el profeta Shmuel, de quien dice el pasuk: וּתְשׁוּבָתוֹ הָרָמָתָה כִּי שָׁם בֵּיתוֹ («y su regreso era a Ramá, pues allí estaba su casa», Shmuel I 7:17). R. Yojanan lo lee así: כל מקום שהלך — שם ביתו עמו: a donde fuera, SU CASA IBA CON ÉL. Shmuel recorría todo Israel juzgando al pueblo y no aceptaba hospedaje: llevaba consigo su tienda y sus provisiones para no depender de nadie.\n\nLo notable es que la guemará NO jerarquiza. No dice «Shmuel era más grande» ni «Elisha era más humano». Ambas son formas legítimas de DIGNIDAD ante la generosidad ajena:\n\n  · Elisha dignifica al ANFITRIÓN: aceptar es honrar a quien da. Su aceptación le permitió a la Shunamit el mérito inmenso que el nodo dorado describe.\n  · Shmuel dignifica su INDEPENDENCIA: no cargar a nadie, no deber nada, servir al pueblo sin que el pueblo lo mantenga.\n\nLa halajá deja la elección al temperamento de cada sabio. Lo que NO es legítimo es el tercer modelo tácito: aceptar con desprecio, o rechazar con soberbia. Recibir bien y no recibir bien — ambos requieren la misma delicadeza.'

    'tamid': {

      hebreo: 'כָּל הַמְאָרֵחַ תַּלְמִיד חָכָם בְּתוֹךְ בֵּיתוֹ וּמְהַנֵּהוּ מִנְּכָסָיו — מַעֲלֶה עָלָיו הַכָּתוּב כְּאִילּוּ מַקְרִיב תְּמִידִין',
      traduccion: '«Quien hospeda a un talmid jajam en su casa y le hace gozar de sus bienes — el versículo se lo cuenta como si ofreciera los korbanot tamid»',
      explicacion: 'El nodo culminante de la sugyá — y una de las derashot más audaces del capítulo.\n\nLa Shunamit justifica su propuesta ante el marido con la frase: אִישׁ אֱלֹהִים... עֹבֵר עָלֵינוּ תָּמִיד — «un hombre de Elokim... pasa ante nosotros TAMID (constantemente)». En el sentido llano, תָּמִיד es un adverbio: pasa siempre, con regularidad.\n\nPero R. Yosei bar Janina, en nombre de R. Eliezer ben Yaakov, escucha en esa palabra OTRA cosa: תָּמִיד es también el nombre del KORBAN TAMID — el sacrificio diario perpetuo del Mikdash, la ofrenda de la mañana y la de la tarde que estructuraban todo el servicio del Templo. Y de esa doble lectura nace la equivalencia:\n\n  · quien hospeda a un talmid jajam EN SU CASA (בתוך ביתו — adentro, no en el granero)\n  · y le hace GOZAR de sus bienes (ומהנהו מנכסיו — no solo techo: comida, uso real de lo propio)\n  · el versículo se lo cuenta COMO SI OFRECIERA LOS TEMIDIN — el sacrificio perpetuo\n\nLa transformación es total: la MESA DOMÉSTICA se vuelve MIZBEAJ (altar). Lo que la Shunamit le sirve a Elisha en la mesa de la aliyá tiene, en el cómputo divino, el estatus de la ofrenda diaria del Templo.\n\n¿Por qué el TAMID y no otro korban? Porque el tamid es la ofrenda de la CONSTANCIA — no la ofrenda extraordinaria de la fiesta ni la expiatoria de la culpa, sino la del servicio diario, invariable, sostenido. Y eso es exactamente la hospitalidad de la Shunamit: עֹבֵר עָלֵינוּ תָּמִיד — no un banquete único sino una mesa servida CADA VEZ que el profeta pasa. La hospitalidad meritoria no es el gesto grandioso: es la regularidad.\n\nLa derashá tiene además una dimensión histórica: dicha por amoraim que vivían SIN Templo, es una respuesta a la pregunta «¿cómo se ofrece el tamid cuando no hay mizbeaj?». Respuesta: hospedando al talmid jajam. La casa hospitalaria SUSTITUYE al Mikdash destruido; la mesa compartida continúa el servicio interrumpido (ver #beit-knesset — la casa como espacio sagrado).\n\nY así se cierra el arco de la sugyá: comenzó con una pared pequeña (קיר קטנה) y termina en el Templo. La Shunamit, que solo quiso darle una habitación digna a un hombre santo, resulta haber estado ofreciendo — sin saberlo — el sacrificio perpetuo. La palabra תמיד que ella dijo como adverbio, el Cielo la contó como korban.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.shuna-interactivo')
    : document.querySelector('.shuna-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#shuna-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.shuna-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="shuna-panel-header">' +
        '<p class="shuna-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="shuna-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="shuna-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="shuna-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.shuna-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.shuna-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="shuna-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
