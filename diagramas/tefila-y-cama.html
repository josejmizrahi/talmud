  <text x="360" y="110" text-anchor="middle" font-size="12" direction="rtl" fill="#1a1410">עַל שְׁנֵי דְּבָרִים הָיִיתִי מִצְטַעֵר כָּל יָמַי:</text>

  <text x="360" y="152" text-anchor="middle" font-size="11.5" direction="rtl" fill="#1a1410">וְעַל מִטָּתִי — שֶׁתְּהֵא נְתוּנָה בֵּין צָפוֹן לְדָרוֹם</text>
  <text x="360" y="174" text-anchor="middle" font-size="10" fill="#3d2f23" font-style="italic">«Sobre DOS cosas me angustié todos mis días — mi tefilá delante de mi cama · mi cama entre norte y sur»</text>
  <text x="360" y="194" text-anchor="middle" font-size="9.5" fill="#b8860b" font-style="italic">la fórmula «כָּל יָמַי» («todos mis días») es decisiva — no fue etapa, fue compromiso vital</text>
</g>

  <!-- Lectura A: espacial -->

  <text x="60" y="408" font-size="9" fill="#3d2f23">NO mejitzá entre el orador y la pared</text>
  <text x="60" y="422" font-size="9" fill="#3d2f23">concentración total · ausencia de objetos</text>
  <text x="60" y="436" font-size="9" fill="#3d2f23">la cama era el único mobiliario tolerado</text>
  <text x="60" y="450" font-size="8.5" fill="#6b4423" font-style="italic">— inmueble, no objeto activo</text>

  <!-- Lectura B: temporal -->
  <text x="60" y="476" font-size="10" fill="#1e3a5f" font-weight="600">B · Lectura temporal</text>
  <text x="60" y="492" font-size="9" fill="#3d2f23">tefilá inmediatamente ANTES de la cama</text>
  <text x="60" y="506" font-size="9" fill="#3d2f23">debe ser el último acto consciente del día</text>
  <text x="60" y="520" font-size="9" fill="#3d2f23">sin actividades intermedias</text>
  <text x="60" y="534" font-size="8.5" fill="#6b4423" font-style="italic">— proximidad temporal</text>

  <text x="180" y="556" text-anchor="middle" font-size="9" fill="#1e3a5f" font-style="italic">ambas convergen en: PROXIMIDAD estructural</text>

  <text x="420" y="438" font-size="9.5" fill="#3d2f23">→ la esposa no abortará</text>

  <text x="420" y="464" font-size="10" fill="#2d6b4e" font-weight="600">La verseta:</text>
  <text x="540" y="482" text-anchor="middle" font-size="10" direction="rtl" fill="#2d6b4e">וּצְפוּנְךָ תְּמַלֵּא בִטְנָם</text>
  <text x="540" y="498" text-anchor="middle" font-size="10" direction="rtl" fill="#2d6b4e">יִשְׂבְּעוּ בָנִים (תה' יז:יד)</text>
  <text x="420" y="516" font-size="9" fill="#3d2f23" font-style="italic">«tu tesoro/norte llena su vientre»</text>
  <text x="420" y="532" font-size="9" fill="#3d2f23" font-style="italic">«se sacian de hijos»</text>

  <text x="540" y="554" text-anchor="middle" font-size="9" fill="#2d6b4e" font-style="italic">juego: צָפוּן (tesoro) ↔ צָפוֹן (norte)</text>

  <text x="100" y="1072" font-size="9.5" fill="#3d2f23">la grandeza espiritual NO se mide solo por dogmas o hazañas</text>

  <text x="100" y="1088" font-size="9.5" fill="#3d2f23">se mide también por la ATENCIÓN persistente a detalles minúsculos</text>

  <text x="100" y="1104" font-size="9.5" fill="#3d2f23">Aba Binyamin no escribió tratados — VIVIÓ con dos preocupaciones técnicas</text>

      explicacion: 'Aba Binyamin es una figura menor del corpus tannaítico. Sus enseñanzas son pocas pero memorables. La fórmula «על שני דברים הייתי מצטער כל ימי» («sobre dos cosas me angustié todos mis días») es autobiográfica y reveladora.\n\nLa palabra clave es מִצְטַעֵר (mitsta\'er) — «me angustiaba, me preocupaba intensamente». No es un verbo neutro. Implica esfuerzo continuo, vigilancia, preocupación operante. Aba Binyamin NO se preocupó esporádicamente por estas cosas — vivió con ellas como obsesión cotidiana.\n\nY la frase «כָּל יָמַי» («todos mis días») es absoluta. No fue una etapa de juventud rabínica, no fue un período. Fue su VIDA ENTERA. Desde joven hasta su muerte, dos detalles ocupaban su sensibilidad espiritual.\n\nLa sorpresa de la baraita es lo PEQUEÑOS que son los dos detalles. Aba Binyamin pudo haber dicho cosas grandes: «me angustié por la santificación del Nombre», «por la pobreza de los huérfanos», «por la profundidad de la Torá». Dijo dos cosas técnicas, casi domésticas.\n\nLa lección metodológica es central para entender el rabinismo: la grandeza espiritual NO se manifiesta solo en grandes doctrinas. Se manifiesta también — y a veces sobre todo — en la fidelidad obsesiva a pequeñas precisiones rituales. El detalle micro IMPORTA.\n\nLa baraita prepara la sensibilidad para todo el perek de Berajot: si Aba Binyamin dedicó su vida a estos dos detalles, vale la pena estudiarlos con su mismo cuidado.'

    'brevedad': {
      titulo: 'La sorprendente brevedad',
      hebreo: 'מַה שֶּׁאָמַר וּמַה שֶּׁלֹּא אָמַר',
      traduccion: 'Lo que dijo y lo que no dijo',
      explicacion: 'La brevedad de la baraita es deliberada y reveladora. Aba Binyamin tenía toda la riqueza del repertorio rabínico para enumerar como objeto de su angustia. Eligió dos cosas pequeñas.\n\nLo que NO dijo (y pudo haber dicho):\n\n  · «me angustié por la santificación del Nombre»\n  · «por la justicia para los huérfanos y las viudas»\n  · «por la pureza de mis intenciones en cada mitzvá»\n  · «por la profundidad de mi estudio de Torá»\n  · «por el amor a HKBH en todo momento»\n\nLo que DIJO:\n\n  · que mi tefilá esté delante de mi cama\n  · que mi cama esté entre norte y sur\n\nLa elección no es accidental ni modesta. Es una DOCTRINA implícita: las grandes virtudes morales (santificación, justicia, pureza, amor) se cultivan a través de la atención a las micro-precisiones rituales. NO se puede santificar el Nombre si descuidas el detalle físico de cómo rezas. NO se puede amar a HKBH si no te ocupas de la orientación de tu cama.\n\nLa atención al detalle NO es un sustituto de las grandes virtudes — es su VEHÍCULO. Aba Binyamin entendió que la espiritualidad concreta opera por canales materiales. Sin esos canales (la posición exacta del cuerpo, la orientación exacta del mueble), las virtudes abstractas no tienen donde anclarse.\n\nEsta es la sensibilidad halájica clásica: la santidad NO es asunto de momentos sublimes sino de regularidades técnicas. Lo grande se logra atendiendo a lo pequeño.'

    'concern-tefila': {
      titulo: 'Concern 1 · «mi tefilá delante de mi cama»',
      hebreo: 'תְּפִלָּתִי לִפְנֵי מִטָּתִי',
      traduccion: '«Mi tefilá delante de mi cama»',
      explicacion: 'La primera preocupación de Aba Binyamin admite DOS lecturas clásicas, ambas con apoyo en la tradición.\n\nLECTURA A — ESPACIAL (Rashi):\n  La preocupación es que durante la amidá NO HUBIERA NADA INTERPUESTO entre el orador y la pared. Esto se basa en la halajá general de que ciertos objetos NO pueden interponerse entre el orador y el Norte (donde está la Shejiná, según Bava Batra 25a) o entre el orador y la pared.\n\n  ¿Por qué entonces «delante de MI CAMA»? Porque la cama era el único mobiliario tolerado como mejitzá. La cama es estática, inanimada, parte del cuarto. Otros objetos (mesa, sillas, herramientas) NO se permiten.\n\n  Aba Binyamin se aseguraba de que SU cama estuviera bien posicionada para que durante el rezo NO HUBIERA OTRA COSA entre él y la pared. La concentración requiere ausencia de mediadores visuales.\n\nLECTURA B — TEMPORAL:\n  Otra tradición lee «delante de mi cama» en sentido temporal — INMEDIATAMENTE antes de acostarse. Es decir, la tefilá nocturna debe ser el ÚLTIMO acto consciente del día.\n\n  El argumento: si rezo y luego ceno, conversaciono, leo, etc., la conexión espiritual del rezo se ha PERDIDO antes de dormir. El orden correcto es: actividades del día → cena → recapitulación → tefilá nocturna → SUEÑO INMEDIATO.\n\n  Aba Binyamin se aseguraba de no tener nada entre la tefilá y el sueño. La proximidad TEMPORAL preserva el efecto espiritual.\n\nAMBAS lecturas convergen en un punto: PROXIMIDAD ESTRUCTURAL entre tefilá y cama. La diferencia es si se trata de proximidad espacial (sin objetos entre) o temporal (sin actividades entre). Las dos son halájicamente operativas y ambas se incorporaron en la práctica posterior.\n\nLa lección general: el rezo NO es un evento aislado. Tiene una geometría — espacial y temporal — que importa para su eficacia espiritual.'

    'concern-orientacion': {
      titulo: 'Concern 2 · «mi cama entre norte y sur»',

      traduccion: '«Mi cama colocada entre norte y sur»',
      explicacion: 'La segunda preocupación es PRECISA: la cama debía estar orientada con su eje LONGITUDINAL (cabeza-pies) alineado norte-sur, NUNCA este-oeste.\n\nR. Yitzjak ofrece dos consecuencias positivas:\n\n  1. בָּנִים זְכָרִים — la pareja tendrá HIJOS VARONES\n  2. אִשְׁתּוֹ אֵינָהּ מַפֶּלֶת — la esposa NO ABORTARÁ\n\nLa derashá se apoya en Tehilim 17:14:\n  «וּצְפוּנְךָ תְּמַלֵּא בִטְנָם · יִשְׂבְּעוּ בָנִים»\n  «y de tu tesoro/norte llenas su vientre · se sacian de hijos»\n\nEl juego filológico es decisivo:\n  · צָפוּן (tsafún, «tesoro escondido») — el significado bíblico literal\n  · צָפוֹן (tsafón, «norte») — comparte las mismas consonantes en estado no-vocalizado\n\nLa derashá explota la ambigüedad: «tu norte llena su vientre» — la orientación al norte produce el llenado del vientre con hijos. La palabra del versículo se LEE en clave de orientación geográfica.\n\nLa consecuencia halájica: para asegurar fertilidad y nacimiento de varones, hay que orientar la cama N-S. Es una práctica que aparece codificada en los códigos halájicos posteriores (Shulján Aruj OC 3:6) y se sigue observando en comunidades observantes hoy.\n\nLa razón profunda — por qué precisamente N-S y no E-O — requiere entender la cosmología sagrada del eje E-O. Lo desarrolla el siguiente nodo.\n\nEs importante notar: la promesa de R. Yitzjak NO es mágica en sentido pagano. NO dice «la orientación causa mecánicamente el resultado». Dice que orientar la cama es UNA EXPRESIÓN DE RESPETO al orden cosmológico divino, y que ese respeto recibe a su vez bendiciones divinas (fertilidad). La causalidad es teológica, no técnica.'
    },
    'cosmologia': {
      titulo: 'La cosmología sagrada · por qué N-S y no E-O',
      hebreo: 'מִזְרָח ↔ מַעֲרָב הִיא צִיר הַקְּדֻשָּׁה',
      traduccion: 'Este-oeste es el eje de la santidad',
      explicacion: 'Para entender por qué Aba Binyamin orientaba su cama norte-sur, hay que entender la COSMOLOGÍA SAGRADA del eje este-oeste en el judaísmo.\n\nEL EJE E-O ES EL EJE DE LO SAGRADO:\n\n  1. EL SOL — sale por el este, se pone por el oeste. El movimiento diario más visible y poderoso del cosmos sigue este eje.\n\n  2. LA SHEJINÁ — la presencia divina se asocia con el OESTE. Berajot 31a y Bava Batra 25a establecen: «la Shejiná está en el oeste» (שכינה במערב). El que reza mira al oeste — o al menos no le da la espalda al oeste.\n\n  3. EL TEMPLO — se orienta E-O. El Kodesh ha-Kodashim (Santo de los Santos) está al OESTE; la entrada al este. El cohen gadol entra desde el este, avanzando hacia el oeste — hacia la Shejiná.\n\n  4. EL TABERNÁCULO — Moshé construyó el Mishkán con la misma orientación: entrada al este, Kodesh ha-Kodashim al oeste.\n\nDado que el eje E-O es SAGRADO, orientar el sueño paralelo a él sería problemático:\n\n  · El sueño es íntimo, vulnerable, sexual\n  · Orientar el cuerpo durmiente PARALELO al eje del Templo/Shejiná = «competir» con la orientación sagrada\n  · Es una falta de respeto cosmológico\n\nLA SOLUCIÓN: orientar la cama PERPENDICULAR al eje sagrado — es decir, NORTE-SUR. Así el sueño NO interfiere con el eje divino. El eje íntimo es ortogonal al eje cósmico — separados y respetuosos.\n\nLa visualización del diagrama muestra esto: el eje E-O (dorado, sagrado) atraviesa horizontalmente; el eje N-S (verde, donde se coloca la cama) lo cruza verticalmente. La cama, dibujada en el eje vertical, está en su orientación correcta.\n\nEsta cosmología es continua con la teología de los #12 (cuatro ángeles cardinales) y #5 (kinor de David, viento del norte). El cosmos rabínico está orientado, con ejes y direcciones cargadas de significado. La vida judía cotidiana se ajusta a esa geometría sagrada.'
    },
    'tabla-orientaciones': {
      titulo: 'Tabla de orientaciones · diagnóstico halájico',
      hebreo: 'הַשּׁוּלְחָן',
      traduccion: 'La tabla',
      explicacion: 'La tabla sistematiza la enseñanza en términos halájicos prácticos.\n\nORIENTACIÓN E-O — PROHIBIDA:\n  · paralela al eje sagrado del Templo y la Shejiná\n  · falta de respeto cosmológico\n  · resultado: no se reciben las bendiciones de fertilidad\n  · en algunas opiniones: prohibición técnica halájica (Shulján Aruj OC 3:6)\n\nORIENTACIÓN N-S — ÓPTIMA:\n  · perpendicular al eje sagrado\n  · honra la geometría cosmológica\n  · resultado: bendecido con fertilidad, hijos varones, sin abortos\n  · práctica recomendada para todo judío observante\n\nLa codificación posterior (Shulján Aruj OC 3:6):\n  «יְזַהֵר שֶׁלֹּא תְּהֵא מִטָּתוֹ נְתוּנָה בֵּין מִזְרָח לְמַעֲרָב, אֶלָּא בֵּין צָפוֹן לְדָרוֹם»\n  «Se cuidará de que su cama NO esté entre este y oeste, sino entre norte y sur»\n\nNote que la codificación es NEGATIVA primero (no E-O) y luego POSITIVA (sino N-S). Esto refleja la estructura de la preocupación de Aba Binyamin: la preocupación es EVITAR el eje sagrado más que abrazar uno específico. El N-S es la solución a la PROHIBICIÓN del E-O.\n\nLa práctica HOY: esta halajá sigue observándose en comunidades ortodoxas. Al amueblar un dormitorio, el primer cálculo es: ¿dónde está el este? ¿en qué orientación queda la cama? Si la única opción es E-O, se redistribuye el cuarto.\n\nLa lección es vívida: la halajá entra hasta la geometría del mobiliario doméstico. NO hay esferas neutrales en la vida del judío observante — todo lo material tiene su orientación correcta dentro del cosmos sagrado.'
    },
    'doctrina': {
      titulo: 'Doctrina meta · la halajá del detalle minúsculo',
      hebreo: 'הַהֲלָכָה שֶׁל הַפְּרָט הַקָּטָן',
      traduccion: 'La halajá del detalle pequeño',
      explicacion: 'La baraita de Aba Binyamin enseña una sensibilidad espiritual distintiva del rabinismo: la HALAJÁ DEL DETALLE MINÚSCULO.\n\nPRINCIPIOS QUE EMERGEN:\n\n  1. LA GRANDEZA NO SE MIDE SOLO POR LO GRANDE — no por dogmas heroicos, hazañas espectaculares, sufrimientos públicos. Aba Binyamin no aparece en grandes narrativas; solo en estas dos preocupaciones.\n\n  2. LA ATENCIÓN PERSISTENTE ES LA MARCA — la palabra clave es «כָּל יָמַי» («todos mis días»). No fue intensidad momentánea sino FIDELIDAD sostenida. La virtud judía es duración, no destello.\n\n  3. NO SE ESCRIBIERON TRATADOS — Aba Binyamin no nos dejó un tratado sobre la oración ni sobre la cama. Nos dejó dos PREOCUPACIONES VIVIDAS. La vida santificada es por sí misma testimonio. La doctrina sigue a la práctica, no al revés.\n\n  4. INVERSAMENTE PROPORCIONAL — cuanto MÁS PEQUEÑO el objeto al que se atiende, MÁS REVELADORA es la atención. Cualquier persona podría preocuparse por «la justicia». Solo un alma especialmente sensible se preocupa por la orientación de la cama. La rareza del objeto certifica la calidad del alma.\n\n  5. LO MICRO Y LO MACRO — la cama pequeña refleja el cosmos. Su orientación participa de la geometría del Templo, del movimiento del sol, de la presencia de la Shejiná. Lo más pequeño se conecta con lo más grande.\n\nESTA ENSEÑANZA PREPARA EL RESTO DEL PEREK:\n\n  · sugyot sobre cómo lavarse las manos exactamente\n  · sobre la posición exacta de los pies en la amidá\n  · sobre la cantidad exacta de saliva permitida durante el rezo\n  · sobre la precisión micrométrica de cada detalle litúrgico\n\nTodo esto es continuación de la sensibilidad de Aba Binyamin: el detalle micro IMPORTA y la atención a él es la VIDA ESPIRITUAL real.\n\nUNA OBSERVACIÓN FINAL: hay un peligro implícito de la doctrina — el escrúpulo neurótico, la obsesión incapacitante con detalles. El rabinismo NO romantiza esto. La sugyá presenta a Aba Binyamin como modelo precisamente porque sus dos preocupaciones eran ESPECÍFICAS Y LIMITADAS — dos cosas, no veinte. La maestría consiste en seleccionar BIEN qué detalles ocupar — y dejar lo demás en su lugar natural. No se trata de obsesionarse con todo, sino de seleccionar los pocos puntos donde la atención cosmológica es decisiva.\n\nAba Binyamin no era un escrupuloso paralizado — era un sabio FOCALIZADO. Eligió sus dos puntos críticos y los cultivó toda la vida. La lección es ese discernimiento.'
    }

  var contenedor = document.currentScript
    ? document.currentScript.closest('.tefcama-interactivo')
    : document.querySelector('.tefcama-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#tefcama-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.tefcama-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="tefcama-panel-header">' +
        '<p class="tefcama-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="tefcama-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="tefcama-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="tefcama-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.tefcama-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.tefcama-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="tefcama-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
