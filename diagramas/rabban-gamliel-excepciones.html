<!-- TÍTULO -->
<text x="360" y="28" text-anchor="middle" font-size="17" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410">Las tres excepciones de Rabban Gamliel</text>
<text x="360" y="48" text-anchor="middle" font-size="11.5" fill="#6b4423">Berajot 16a–16b · 17b · «yo no soy como los demás»</text>

<!-- ============================================================ -->
<!-- EL MARCO · TRES MISHNAYOT · LA MISMA ESCENA                  -->
<!-- ============================================================ -->
<text x="60" y="76" font-size="9.5" fill="#b8860b" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">EL MARCO · MISHNÁ 2:5–2:7 · TRES VECES LA MISMA ESCENA</text>

<g class="gamliel-nodo" data-id="marco">
  <rect x="60" y="86" width="600" height="92" rx="6" fill="rgba(184,134,11,0.10)" stroke="#b8860b" stroke-width="1.8"/>
  <text x="360" y="112" text-anchor="middle" font-size="12.5" direction="rtl" fill="#1a1410">מַעֲשֶׂה בְּרַבָּן גַּמְלִיאֵל שֶׁנָּשָׂא אִשָּׁה וְקָרָא לַיְלָה הָרִאשׁוֹנָה</text>
  <text x="360" y="132" text-anchor="middle" font-size="10.5" fill="#3d2f23" font-style="italic">«Sucedió que Rabban Gamliel se casó — y leyó el shema la primera noche»</text>
  <text x="360" y="152" text-anchor="middle" font-size="10" fill="#b8860b" font-style="italic">tres mishnayot, la misma escena: los alumnos le citan su propia Torá — él responde «no soy como los demás»</text>
  <text x="360" y="168" text-anchor="middle" font-size="9" fill="#6b4423" font-style="italic">el maestro desobedeciéndose a sí mismo — y explicándose · ¿cuándo la excepción es grandeza y cuándo soberbia?</text>
</g>

<line x1="360" y1="178" x2="360" y2="196" stroke="#b8860b" stroke-width="1.2" marker-end="url(#flecha-rg-gold)"/>

<!-- ============================================================ -->
<!-- ESCENA 1 · LEYÓ EL SHEMA                                     -->
<!-- ============================================================ -->
<text x="60" y="208" font-size="9.5" fill="#8b1a1a" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">ESCENA 1 · LEYÓ EL SHEMA LA PRIMERA NOCHE DE BODAS · 16A</text>

<g class="gamliel-nodo" data-id="escena-shema">
  <rect x="60" y="218" width="600" height="152" rx="6" fill="rgba(184,134,11,0.04)" stroke="#b8860b" stroke-width="1.5"/>
  <text x="360" y="240" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410" font-weight="600">1 · LEYÓ — el jatan exento que no quiso su exención</text>

  <rect x="76" y="252" width="272" height="104" rx="4" fill="rgba(30,58,95,0.07)" stroke="#1e3a5f" stroke-width="1"/>
  <text x="212" y="270" text-anchor="middle" font-size="9.5" fill="#1e3a5f" font-weight="600">los alumnos · la regla</text>
  <text x="212" y="290" text-anchor="middle" font-size="10" direction="rtl" fill="#1e3a5f">לִמַּדְתָּנוּ רַבֵּינוּ</text>
  <text x="212" y="306" text-anchor="middle" font-size="10" direction="rtl" fill="#1e3a5f">שֶׁחָתָן פָּטוּר מִקְּרִיאַת שְׁמַע</text>
  <text x="212" y="326" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">«¡nos enseñaste que el jatan</text>
  <text x="212" y="338" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">está exento del shema!»</text>

  <line x1="348" y1="304" x2="368" y2="304" stroke="#8b1a1a" stroke-width="1.2" marker-end="url(#flecha-rg)"/>

  <rect x="372" y="252" width="272" height="104" rx="4" fill="rgba(139,26,26,0.07)" stroke="#8b1a1a" stroke-width="1.2"/>
  <text x="508" y="270" text-anchor="middle" font-size="9.5" fill="#8b1a1a" font-weight="600">él · la excepción</text>
  <text x="508" y="290" text-anchor="middle" font-size="10" direction="rtl" fill="#8b1a1a">אֵינִי שׁוֹמֵעַ לָכֶם לְבַטֵּל הֵימֶנִּי</text>
  <text x="508" y="306" text-anchor="middle" font-size="10" direction="rtl" fill="#8b1a1a">מַלְכוּת שָׁמַיִם אֲפִילּוּ שָׁעָה אַחַת</text>
  <text x="508" y="326" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">«no os escucho para anular de mí</text>
  <text x="508" y="338" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">el Reino de los Cielos NI UNA HORA»</text>
</g>

<line x1="360" y1="370" x2="360" y2="388" stroke="#b8860b" stroke-width="1.2" marker-end="url(#flecha-rg-gold)"/>

<!-- ============================================================ -->
<!-- ESCENA 2 · SE BAÑÓ                                           -->
<!-- ============================================================ -->
<text x="60" y="400" font-size="9.5" fill="#8b1a1a" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">ESCENA 2 · SE BAÑÓ LA PRIMERA NOCHE DEL DUELO · 16B</text>

<g class="gamliel-nodo" data-id="escena-bano">
  <rect x="60" y="410" width="600" height="152" rx="6" fill="rgba(184,134,11,0.04)" stroke="#b8860b" stroke-width="1.5"/>
  <text x="360" y="432" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410" font-weight="600">2 · SE BAÑÓ — murió su esposa, y esa misma noche se bañó</text>

  <rect x="76" y="444" width="272" height="104" rx="4" fill="rgba(30,58,95,0.07)" stroke="#1e3a5f" stroke-width="1"/>
  <text x="212" y="462" text-anchor="middle" font-size="9.5" fill="#1e3a5f" font-weight="600">los alumnos · la regla</text>
  <text x="212" y="482" text-anchor="middle" font-size="10" direction="rtl" fill="#1e3a5f">לִמַּדְתָּנוּ רַבֵּינוּ</text>
  <text x="212" y="498" text-anchor="middle" font-size="10" direction="rtl" fill="#1e3a5f">שֶׁאָבֵל אָסוּר לִרְחוֹץ</text>
  <text x="212" y="518" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">«¡nos enseñaste que el avel</text>
  <text x="212" y="530" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">tiene prohibido bañarse!»</text>

  <line x1="348" y1="496" x2="368" y2="496" stroke="#8b1a1a" stroke-width="1.2" marker-end="url(#flecha-rg)"/>

  <rect x="372" y="444" width="272" height="104" rx="4" fill="rgba(139,26,26,0.07)" stroke="#8b1a1a" stroke-width="1.2"/>
  <text x="508" y="462" text-anchor="middle" font-size="9.5" fill="#8b1a1a" font-weight="600">él · la excepción</text>
  <text x="508" y="482" text-anchor="middle" font-size="10" direction="rtl" fill="#8b1a1a">אֵינִי כִּשְׁאָר כָּל אָדָם</text>
  <text x="508" y="498" text-anchor="middle" font-size="10.5" direction="rtl" fill="#8b1a1a" font-weight="700">אִסְטְנִיס אֲנִי</text>
  <text x="508" y="518" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">«no soy como los demás — soy delicado»</text>
  <text x="508" y="532" text-anchor="middle" font-size="8" fill="#6b4423" font-style="italic">la gemará: aninut nocturna es derabanan · וְאַחֲרִיתָהּ כְּיוֹם מָר</text>
</g>

<line x1="360" y1="562" x2="360" y2="580" stroke="#b8860b" stroke-width="1.2" marker-end="url(#flecha-rg-gold)"/>

<!-- ============================================================ -->
<!-- ESCENA 3 · ACEPTÓ CONSUELOS POR TAVI                         -->
<!-- ============================================================ -->
<text x="60" y="592" font-size="9.5" fill="#2d6b4e" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">ESCENA 3 · ACEPTÓ CONSUELOS POR TAVI SU ESCLAVO · 16B</text>

<g class="gamliel-nodo" data-id="escena-tavi">
  <rect x="60" y="602" width="600" height="152" rx="6" fill="rgba(184,134,11,0.04)" stroke="#b8860b" stroke-width="1.5"/>
  <text x="360" y="624" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1a1410" font-weight="600">3 · ACEPTÓ — murió Tavi su esclavo, y recibió condolencias</text>

  <rect x="76" y="636" width="272" height="104" rx="4" fill="rgba(30,58,95,0.07)" stroke="#1e3a5f" stroke-width="1"/>
  <text x="212" y="654" text-anchor="middle" font-size="9.5" fill="#1e3a5f" font-weight="600">los alumnos · la regla</text>
  <text x="212" y="674" text-anchor="middle" font-size="10" direction="rtl" fill="#1e3a5f">לִמַּדְתָּנוּ רַבֵּינוּ שֶׁאֵין מְקַבְּלִין</text>
  <text x="212" y="690" text-anchor="middle" font-size="10" direction="rtl" fill="#1e3a5f">תַּנְחוּמִין עַל הָעֲבָדִים</text>
  <text x="212" y="710" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">«¡nos enseñaste que no se aceptan</text>
  <text x="212" y="722" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">consuelos por los esclavos!»</text>

  <line x1="348" y1="688" x2="368" y2="688" stroke="#2d6b4e" stroke-width="1.2" marker-end="url(#flecha-rg)"/>

  <rect x="372" y="636" width="272" height="104" rx="4" fill="rgba(30,107,90,0.08)" stroke="#2d6b4e" stroke-width="1.2"/>
  <text x="508" y="654" text-anchor="middle" font-size="9.5" fill="#2d6b4e" font-weight="600">él · la excepción</text>
  <text x="508" y="674" text-anchor="middle" font-size="10" direction="rtl" fill="#2d6b4e">אֵין טָבִי עַבְדִּי כִּשְׁאָר כָּל הָעֲבָדִים</text>
  <text x="508" y="690" text-anchor="middle" font-size="10.5" direction="rtl" fill="#2d6b4e" font-weight="700">כָּשֵׁר הָיָה</text>
  <text x="508" y="710" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">«Tavi mi esclavo no era como</text>
  <text x="508" y="722" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">los demás esclavos — ERA KASHER»</text>
</g>

<line x1="212" y1="754" x2="212" y2="772" stroke="#3d2f23" stroke-width="1" marker-end="url(#flecha-rg)"/>
<line x1="508" y1="754" x2="508" y2="772" stroke="#3d2f23" stroke-width="1" marker-end="url(#flecha-rg)"/>

<!-- ============================================================ -->
<!-- SATÉLITES · TAVI Y LA DIGNIDAD DE LOS ESCLAVOS               -->
<!-- ============================================================ -->
<text x="60" y="786" font-size="9.5" fill="#2d6b4e" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">ALREDEDOR DE TAVI · LA DIGNIDAD NO ERA GENÉRICA — ERA GANADA</text>

<g class="gamliel-nodo" data-id="eliezer-contraste">
  <rect x="60" y="796" width="290" height="140" rx="6" fill="rgba(30,58,95,0.06)" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="205" y="818" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1e3a5f" font-weight="700">El contraste · R. Eliezer huye</text>
  <text x="205" y="838" text-anchor="middle" font-size="9.5" fill="#3d2f23">murió su sirvienta — sus alumnos entraron a consolarlo</text>
  <text x="205" y="856" text-anchor="middle" font-size="9.5" fill="#1e3a5f" font-weight="600">aliyá → anpilón → traklin</text>
  <text x="205" y="872" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">huyó de cuarto en cuarto para NO recibirlos</text>
  <text x="205" y="894" text-anchor="middle" font-size="9.5" direction="rtl" fill="#1e3a5f">הַמָּקוֹם יְמַלֵּא לְךָ חֶסְרוֹנְךָ</text>
  <text x="205" y="912" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">«que el Omnipresente te reponga la pérdida»</text>
  <text x="205" y="926" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">— lo mismo que se dice por un BUEY</text>
</g>

<g class="gamliel-nodo" data-id="yose-kasher">
  <rect x="370" y="796" width="290" height="140" rx="6" fill="rgba(30,107,90,0.07)" stroke="#2d6b4e" stroke-width="1.3"/>
  <text x="515" y="818" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#2d6b4e" font-weight="700">R. Yose · el esclavo kasher</text>
  <text x="515" y="838" text-anchor="middle" font-size="9.5" fill="#3d2f23">si era un esclavo kasher, sí se le dice:</text>
  <text x="515" y="860" text-anchor="middle" font-size="10" direction="rtl" fill="#2d6b4e">הוֹי אִישׁ טוֹב וְנֶאֱמָן</text>
  <text x="515" y="876" text-anchor="middle" font-size="10" direction="rtl" fill="#2d6b4e">וְנֶהֱנֶה מִיגִיעוֹ</text>
  <text x="515" y="896" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">«¡ay, hombre bueno y fiel,</text>
  <text x="515" y="910" text-anchor="middle" font-size="8.5" fill="#3d2f23" font-style="italic">que gozaba de su propio esfuerzo!»</text>
  <text x="515" y="926" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">la conducta abre la lamentación humana</text>
</g>

<line x1="205" y1="936" x2="205" y2="952" stroke="#2d6b4e" stroke-width="1" marker-end="url(#flecha-rg)"/>
<line x1="515" y1="936" x2="515" y2="952" stroke="#2d6b4e" stroke-width="1" marker-end="url(#flecha-rg)"/>

<g class="gamliel-nodo" data-id="aba-ima">
  <rect x="60" y="956" width="600" height="96" rx="6" fill="rgba(30,107,90,0.07)" stroke="#2d6b4e" stroke-width="1.4"/>
  <text x="360" y="978" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#2d6b4e" font-weight="700">En casa de Rabban Gamliel: los esclavos eran אַבָּא y אִמָּא</text>
  <text x="360" y="998" text-anchor="middle" font-size="10" direction="rtl" fill="#2d6b4e">אַבָּא טָבִי · אִמָּא טָבִיתָא — מִשּׁוּם דַּחֲשִׁיבִי</text>
  <text x="360" y="1016" text-anchor="middle" font-size="9" fill="#3d2f23" font-style="italic">se les llamaba «padre» y «madre» — porque eran importantes · la dignidad era ganada, no genérica</text>
  <text x="360" y="1036" text-anchor="middle" font-size="9" fill="#6b4423" font-style="italic">y la baraita vecina delimita: אָבוֹת son solo TRES · אִמָּהוֹת son solo CUATRO — el título tiene frontera</text>
</g>

<line x1="360" y1="1052" x2="360" y2="1070" stroke="#3d2f23" stroke-width="1.2" marker-end="url(#flecha-rg)"/>

<!-- ============================================================ -->
<!-- EL CIERRE · ¿QUIÉN MÁS PUEDE? · 17B                          -->
<!-- ============================================================ -->
<text x="60" y="1082" font-size="9.5" fill="#1e3a5f" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">EL CIERRE · ¿QUIÉN MÁS PUEDE SER LA EXCEPCIÓN? · MISHNÁ + 17B</text>

<g class="gamliel-nodo" data-id="rsbg">
  <rect x="60" y="1092" width="600" height="88" rx="6" fill="rgba(30,58,95,0.08)" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="360" y="1114" text-anchor="middle" font-size="11" font-family="'Cormorant Garamond', serif" font-style="italic" fill="#1e3a5f" font-weight="700">Rabban Shimon ben Gamliel · el freno</text>
  <text x="360" y="1136" text-anchor="middle" font-size="12" direction="rtl" fill="#1e3a5f">לֹא כָּל הָרוֹצֶה לִיטּוֹל אֶת הַשֵּׁם — יִטּוֹל</text>
  <text x="360" y="1156" text-anchor="middle" font-size="9.5" fill="#3d2f23" font-style="italic">«NO todo el que quiere tomarse el título — que se lo tome»</text>
  <text x="360" y="1170" text-anchor="middle" font-size="8.5" fill="#6b4423" font-style="italic">la mishná dice: el jatan que quiera leer, lee · RSBG lo frena</text>
</g>

      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="gamliel-panel-header">' +
        '<p class="gamliel-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="gamliel-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="gamliel-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="gamliel-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.gamliel-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.gamliel-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="gamliel-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
</script>
</div>
