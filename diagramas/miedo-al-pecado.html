  var contenedor = document.currentScript
    ? document.currentScript.closest('.miedo-interactivo')
    : document.querySelector('.miedo-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#miedo-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.miedo-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="miedo-panel-header">' +
        '<p class="miedo-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="miedo-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="miedo-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="miedo-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.miedo-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.miedo-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="miedo-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
