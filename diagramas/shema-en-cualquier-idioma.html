      explicacion: 'La primera palabra del shema es también su nombre — y en Berajot 13a se convierte en la primera de las dos armas hermenéuticas de la sugyá.\n\nEl verbo שמע es deliciosamente ambiguo en hebreo bíblico. Puede significar:\n\n  · OÍR físicamente — percibir sonido con los oídos\n  · ENTENDER — comprender el significado (como en «no entendían su lengua», לא ישמעו)\n  · OBEDECER — aceptar y cumplir\n\nDe esta ambigüedad viven las dos escuelas:\n\n  · Los JAJAMIM explotan el sentido de ENTENDER: בְּכָל לָשׁוֹן שֶׁאַתָּה שׁוֹמֵעַ — «en cualquier lengua que escuches», es decir, que ENTIENDAS. La Torá misma, al elegir el verbo שמע, habría autorizado cualquier idioma comprensible.\n\n  · RABBI explota el sentido de OÍR físicamente: הַשְׁמַע לְאָזְנֶיךָ — «haz oír a tus oídos». La palabra exige AUDIBILIDAD: que el lector pronuncie y se escuche a sí mismo.\n\nLa misma palabra rinde dos halajot completamente distintas — el idioma para unos, la audibilidad para el otro. Ninguna lectura «sobra»: en el sistema del midrash halájico, cada palabra debe rendir, y esta rinde doble.\n\nEl diseño del diagrama muestra las dos flechas que salen de este pilar: la continua (verde) hacia la halajá principal de los jajamim, y la punteada (azul) hacia el uso secundario de Rabbi — el cruce de armas.'

      explicacion: 'Rabbi Yehuda HaNasi — el redactor de la Mishná, el hombre que fijó el texto de la Torá oral — sostiene que el shema se lee כִּכְתָבָהּ: COMO ESTÁ ESCRITA. Solo en hebreo, en lashon hakodesh.\n\nSu fuente es וְהָיוּ: בַּהֲוָיָיתָן יְהוּ — «que sean en su ser», que las palabras permanezcan COMO SON. Y para Rabbi, el ser de las palabras incluye su lengua. El shema no es un contenido traducible: es una FÓRMULA. «Escucha Israel» en español transmite la idea, pero no ES el verso — es un comentario del verso.\n\nHay una coherencia biográfica notable: Rabbi es el gran FIJADOR de textos de la historia rabínica. Quien dedicó su vida a fijar la formulación exacta de la Mishná lee וְהָיוּ como mandato de inmutabilidad textual. Para él, la santidad habita en la FORMA — en estas palabras, en este orden, en esta lengua.\n\nSu posición también protege algo real: la traducción siempre pierde. אחד no es exactamente «uno»; ה׳ no es exactamente «el Eterno». Decir el shema en otra lengua es decir una interpretación. Rabbi prefiere que el judío pronuncie el original — aunque no lo entienda del todo — antes que una versión.\n\nLa flecha que llega a este nodo cruza el diagrama desde el pilar וְהָיוּ: la halajá principal de Rabbi se funda en la palabra que uno esperaría en manos de los jajamim (que la usan para el orden). Es la mitad azul del quiasmo.\n\nLa halajá final NO quedó como Rabbi — pero su lectura dejó huella: la práctica universal es decir el shema en hebreo, y la opción de otra lengua quedó como concesión para quien no entiende.'

    'jajamim-lashon': {

      explicacion: 'Los jajamim responden con la primera palabra del propio verso: שְׁמַע. La Torá no dijo «recita» ni «pronuncia» — dijo ESCUCHA. Y en hebreo, escuchar es entender: בְּכָל לָשׁוֹן שֶׁאַתָּה שׁוֹמֵעַ — «en cualquier lengua que escuches», es decir, que COMPRENDAS.\n\nLa lógica es profunda: el shema no es un conjuro sino una DECLARACIÓN DE FE. Su contenido — la unidad de HKBH, la aceptación del yugo del Cielo — debe pasar por la conciencia del que lo dice. Una declaración que no se entiende no declara nada: es ruido sagrado.\n\nDe ahí que la lengua sea LIBRE: el judío de Alejandría puede decirlo en griego, el de Bagdad en arameo, el de México en español — con tal de que ENTIENDA lo que dice. La comprensión no es un adorno de la mitzvá: es su condición.\n\nEsta posición conecta directamente con la sugyá anterior de la kavaná (ver kavana-del-shema): si el primer verso exige kavaná — atención al significado — entonces el significado debe ser accesible. La lectura de los jajamim hace del shema un acto INTELIGIBLE por definición: entender es la mitad de la kavaná.\n\nLa flecha verde que llega a este nodo cruza desde el pilar שְׁמַע — la palabra que Rabbi reutilizará para la audibilidad. Es la mitad verde del quiasmo.\n\nLa halajá quedó como los jajamim: el shema puede decirse en cualquier lengua que se entienda. Se entiende, vale.'

ino su LÍMITE — el lugar donde la gemará midió hasta dónde llegaba la disputa, y encontró que llegaba exactamente hasta el shema.'

  var contenedor = document.currentScript
    ? document.currentScript.closest('.idioma-interactivo')
    : document.querySelector('.idioma-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#idioma-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.idioma-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="idioma-panel-header">' +
        '<p class="idioma-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="idioma-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="idioma-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="idioma-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.idioma-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.idioma-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="idioma-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
