      hebreo: 'וְלִמַּדְתֶּם — שֶׁיְּהֵא לִמּוּדְךָ תָּם',
      traduccion: '«Y las enseñarás» — que tu enseñar sea íntegro',
      explicacion: 'La derashá gemela: Rav Ovadia lee וְלִמַּדְתֶּם («y las enseñarás», Devarim 11:19) como לִמּוּד תָּם — «que tu enseñar sea ÍNTEGRO». Misma raíz, mismo método (partir la palabra), otro órgano: si ktav tam legisla sobre la mano que escribe, limud tam legisla sobre la boca que enseña.\n\n¿Y qué es un enseñar íntegro? Dar ESPACIO entre las palabras pegadas — las parejas donde la última letra de una palabra es igual a la primera de la siguiente, y la recitación rápida las funde en una sola:\n\n  · עַל לְבָבֶךָ — al levavja: la lamed final y la lamed inicial\n  · עֵשֶׂב בְּשָׂדְךָ — esev besadja: la bet contra la bet\n  · וַאֲבַדְתֶּם מְהֵרָה — vaavadtem meherá: la mem contra la mem\n  · הַכָּנָף פְּתִיל — hakanaf petil: la pe contra la pe\n\nSon los pares de RAVA, el inventario del dikduk que la sugyá anterior celebró. La palabra mal separada es una palabra PERDIDA: quien dice «allevavja» ha pronunciado un texto que no existe. La integridad no es solo decir todas las palabras — es que cada palabra conserve sus FRONTERAS.\n\nJuntas, las dos derashot forman un pequeño tratado sobre la integridad del texto sagrado en sus dos soportes: el pergamino (escribir entero, hasta los mandatos) y el aire (pronunciar separado, hasta las consonantes gemelas). La Torá debe estar completa tanto en la puerta de la casa como en la boca del que la recita.\n\nY el detalle editorial exquisito: las dos palabras diseccionadas — וכתבתם y ולמדתם — son palabras DEL PROPIO SHEMA. La sugyá enseña integridad usando como material los mismos versos cuya recitación regula. El shema se comenta a sí mismo.'
    },
    'tiendas-arroyos': {
      titulo: 'Las tiendas y los arroyos · R. Jama bar Janina',
      hebreo: 'כִּנְחָלִים נִטָּיוּ... כַּאֲהָלִים נָטַע ה׳',
      traduccion: '«Como arroyos que se extienden... como tiendas que plantó HaShem» (Bamidbar 24:6)',
      explicacion: 'R. Jama bar Janina se detiene en una yuxtaposición del verso de Bilam: ¿por qué las TIENDAS aparecen junto a los ARROYOS? (כִּנְחָלִים נִטָּיוּ — «como arroyos que se extienden»... כַּאֲהָלִים — «como tiendas»). En la bendición de Bilam las imágenes se suceden sin explicación; la derashá exige que la vecindad signifique algo.\n\nLa respuesta es una analogía de dos movimientos ASCENDENTES:\n\n  · Los ARROYOS suben al hombre de la IMPUREZA a la PUREZA — el najal es agua viva, agua de mikvé: quien se sumerge sale con otro estatus ritual. El agua no lava suciedad física; opera una transición de estado.\n\n  · Las TIENDAS de Torá suben al hombre de la CULPA al MÉRITO — quien entra al beit midrash cargando jov (deuda, culpa) sale con zjut (mérito). El estudio opera la misma transición, en el registro moral.\n\nEl beit midrash como MIKVÉ: la ecuación es audaz. La inmersión en el texto hace lo que la inmersión en el agua — no informa, TRANSFORMA. Uno no sale del estudio sabiendo más; sale siendo otro, con otro estatus.\n\nLa colocación de esta derashá en medio de la sugyá de los errores no es azar. Acaba de establecerse que el texto debe ser ÍNTEGRO — escrito completo, pronunciado separado — y está por establecerse qué hace el que FALLÓ. Entre ambas, el editor planta esta imagen: el lugar donde se estudia es un lugar donde la falla se convierte en mérito. El que se equivocó no está condenado — está a un chapuzón de distancia de la pureza.\n\nY nótese la fuente: el verso es de BILAM — otra vez la boca del profeta gentil pronunciando la verdad más alta sobre las tiendas de Israel (como מה טובו, que abre cada mañana de sinagoga). La escena final de la sugyá — R. Elazar yendo del beit midrash a su jupá — va a poner en acción exactamente esta imagen: un hombre que entra a la tienda de Torá y sale con un mérito en la mano.'
    },
    'protocolo': {
      titulo: 'El protocolo del error · la Tosefta · a dónde volver',
      hebreo: 'קָרָא וְטָעָה — יַחֲזוֹר',
      traduccion: 'Leyó y se equivocó — vuelve',
      explicacion: 'El corazón práctico de la sugyá: קָרָא וְטָעָה — el que estaba recitando el shema y SE PERDIÓ. No sabe dónde está. Las tres parashiyot se parecen, las fórmulas se repiten, la lengua corre en automático — y de pronto la conciencia despierta y no encuentra el punto en el mapa. ¿Qué hace?\n\nLa Tosefta responde con un protocolo de tres casos, ordenados por el tipo de pérdida:\n\n  ① SE PERDIÓ EN MEDIO DE UN PÁRRAFO — sabe en qué párrafo está, pero no en qué punto. Vuelve al INICIO del párrafo (לְרֹאשׁ הַפֶּרֶק). La unidad dañada se recomienza entera; no se intenta reparar por adentro.\n\n  ② SE PERDIÓ ENTRE PÁRRAFO Y PÁRRAFO — sabe que terminó un párrafo, pero no CUÁL. Vuelve al PRIMER párrafo (לְפֶרֶק רִאשׁוֹן): a la primera frontera de ese tipo. Como no puede fechar su posición, retrocede hasta el primer punto del que está seguro.\n\n  ③ SE PERDIÓ ENTRE וכתבתם Y וכתבתם — el caso más fino. La palabra «y las escribirás» aparece DOS veces: al final del primer párrafo (Devarim 6:9) y cerca del final del segundo (11:20). El recitante sabe que acaba de decir וכתבתם — ¿pero cuál de los dos? Vuelve al PRIMERO. La repetición interna del texto crea una ambigüedad posicional, y la halajá la resuelve siempre igual: en la duda, HACIA ATRÁS.\n\nLa lógica común de los tres casos es la INTEGRIDAD — otra vez la raíz tam. El objetivo no es «haber dicho todas las palabras alguna vez» sino haber recitado un texto CONTINUO, sin agujeros posibles. Por eso la duda se paga retrocediendo: mejor repetir lo seguro que arriesgar un hueco. El shema con una laguna probable no es un shema más corto — es un shema roto.\n\nHay algo consolador en la existencia misma del protocolo: la halajá ASUME que la gente se pierde. El error no es escándalo ni excepción — es un caso previsto, con su tabla y sus reglas, igual que cualquier otro. El título de la sugyá es su lección: el que se equivoca, VUELVE. No abandona, no improvisa, no se castiga — vuelve, porque hay un camino de regreso señalizado.'
    },
    'yojanan': {
      titulo: 'El refinamiento de R. Yojanan · la rutina como testigo',
      hebreo: 'לְמַעַן יִרְבּוּ יְמֵיכֶם — סִרְכֵיהּ נָקֵט וְאָתֵי',
      traduccion: 'Si ya empezó «para que se multipliquen sus días» — su rutina lo llevó',
      explicacion: 'R. Yojanan añade el límite del caso ③. El que duda entre los dos וכתבתם debe volver al primero — PERO si ya se encuentra diciendo לְמַעַן יִרְבּוּ יְמֵיכֶם («para que se multipliquen sus días», Devarim 11:21, el verso que sigue al SEGUNDO וכתבתם), ya no vuelve.\n\nLa razón cabe en tres palabras arameas: סִרְכֵיהּ נָקֵט וְאָתֵי — «tomó su rutina y vino»: su HÁBITO lo llevó. Si la boca ya está en lemaan yirbu, lo más probable es que llegó ahí por el camino normal — pasando correctamente por el segundo párrafo. La lengua entrenada por años de recitación diaria no salta de un párrafo a otro: fluye por el surco de siempre.\n\nLa palabra סירכא es literalmente eso — el surco, la adherencia, la inercia del recorrido habitual. Lo que en la sugyá del dikduk era el ENEMIGO (la rutina que pega las palabras, que apura las consonantes) aparece aquí como ALIADO: el mismo piloto automático que amenaza la pronunciación GARANTIZA la continuidad. La halajá conoce las dos caras del hábito y las usa a ambas.\n\nEpistemológicamente el refinamiento es notable: la halajá acepta una PRESUNCIÓN ESTADÍSTICA como resolución de una duda ritual. No hay certeza de que pasó por el segundo párrafo — hay probabilidad, fundada en cómo funciona la memoria motriz de quien recita cada día. La jazaká (presunción) del cuerpo entrenado tiene fuerza legal.\n\nY hay un matiz pastoral: sin este límite, el escrupuloso viviría retrocediendo — cada duda tardía lo mandaría al principio, y el shema se volvería un laberinto de regresos infinitos. R. Yojanan cierra la puerta a la duda retroactiva: pasado cierto punto, se confía. El protocolo del error tiene un final; la sospecha no es infinita. También eso es integridad — un texto que se puede TERMINAR.'
    },
    'jupa': {
      titulo: 'La escena marco · la jupá de R. Elazar · el dayeinu',
      hebreo: 'אִלּוּ לֹא בָּאנוּ אֶלָּא לִשְׁמוֹעַ דָּבָר זֶה — דַּיֵּינוּ',
      traduccion: '«Si solo hubiéramos venido a oír esto — nos bastaba»',
      explicacion: 'La Tosefta del protocolo no llega a la guemará como cita seca — llega envuelta en una ESCENA, una de las más entrañables del tratado.\n\nR. Ami y R. Asi — los grandes amoraím de Tiberia — están ATANDO la jupá de R. Elazar: armando con sus manos el palio nupcial de su colega. Ya la imagen inicial es enseñanza: los sabios más importantes de la generación trabajando de decoradores de boda, porque el jésed con el novio es Torá práctica.\n\nEl novio, mientras tanto, les dice: iré a oír algo al BEIT MIDRASH. El día de su boda, entre los preparativos, R. Elazar se escapa a la casa de estudio — y vuelve con un botín: la Tosefta del que se equivoca recitando el shema. Tanya: se perdió en medio del párrafo — vuelve al inicio; entre párrafo y párrafo — al primero; entre וכתבתם y וכתבתם — al primero.\n\nY la respuesta de R. Ami y R. Asi es el verso emocional de la sugyá: אִלּוּ לֹא בָּאנוּ אֶלָּא לִשְׁמוֹעַ דָּבָר זֶה — דַּיֵּינוּ. «Si solo hubiéramos venido a oír ESTO, nos bastaba». El dayeinu del beit midrash: la fórmula de la Hagadá — donde cada regalo de la redención habría bastado solo — aplicada a UNA halajá sobre errores de recitación.\n\n¿Por qué TANTO entusiasmo por un detalle técnico? Porque la escena y la halajá se espejan. La derashá de R. Jama bar Janina acaba de decir que las TIENDAS de Torá suben al hombre de la culpa al mérito — y aquí hay un hombre que va de la tienda del estudio a la tienda de la boda, la ohel y la jupá, el mismo día. Y lo que trae de una tienda a la otra es precisamente la halajá del REGRESO: la noticia de que el que se pierde tiene siempre un camino de vuelta señalizado.\n\nQue esa sea la halajá que vale el viaje es la moraleja silenciosa de la sugyá: el conocimiento más precioso no es el del recitador perfecto — es el mapa para el que se equivoca. Una tradición que dedica su entusiasmo («¡nos bastaba!») a la técnica del error asumido enseña algo sobre sí misma: aquí nadie espera que no te pierdas; se espera que sepas VOLVER. Y quizás por eso la escena es una boda: también el matrimonio es un pacto recitado a diario, donde el arte no es no equivocarse nunca — es saber a dónde regresar cuando uno se pierde en medio del párrafo.'
    }

  var contenedor = document.currentScript
    ? document.currentScript.closest('.regresos-interactivo')
    : document.querySelector('.regresos-interactivo');

  if (!contenedor) return;
  var panel = contenedor.querySelector('#regresos-panel');

  function mostrar(id) {
    var d = datos[id];
    if (!d) return;
    var nodos = contenedor.querySelectorAll('.regresos-nodo');
    nodos.forEach(function(n) {
      n.classList.remove('activa', 'dim');
      if (n.dataset.id !== id) n.classList.add('dim');
      else n.classList.add('activa');
    });
    var expHtml = d.explicacion
      ? d.explicacion.replace(/\n/g, '<br>')
      : '';
    panel.innerHTML =
      '<div class="regresos-panel-header">' +
        '<p class="regresos-panel-titulo">' + d.titulo + '</p>' +
        (d.hebreo ? '<span class="regresos-panel-hebreo">' + d.hebreo + '</span>' : '') +
      '</div>' +
      (d.traduccion ? '<p class="regresos-panel-traduccion">' + d.traduccion + '</p>' : '') +
      (expHtml ? '<p class="regresos-panel-explicacion">' + expHtml + '</p>' : '');
  }

  contenedor.querySelectorAll('.regresos-nodo').forEach(function(nodo) {
    nodo.addEventListener('click', function() {
      var id = this.dataset.id;
      if (this.classList.contains('activa')) {
        contenedor.querySelectorAll('.regresos-nodo').forEach(function(n) {
          n.classList.remove('activa', 'dim');
        });
        panel.innerHTML = '<p class="regresos-vacio">↑ Click en cualquier nodo del diagrama para ver el texto y la explicación.</p>';
      } else {
        mostrar(id);
      }
    });
  });
})();
