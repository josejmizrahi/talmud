<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi estudio · Codex Talmudicus</title>
<link rel="stylesheet" href="../assets/css/main.css">
<style>
  .progress-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1rem;
    margin: 2rem 0;
  }
  .progress-card {
    background: rgba(255,255,255,0.4);
    border: 1px solid var(--pergamino-sombra);
    padding: 1.25rem;
  }
  .progress-card h4 {
    font-family: var(--font-display);
    font-size: 1.1rem;
    margin-bottom: 0.5rem;
  }
  .recent-list {
    margin-top: 2rem;
  }
  .recent-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1rem;
    background: rgba(255,255,255,0.4);
    border: 1px solid var(--pergamino-sombra);
    margin-bottom: 0.5rem;
    text-decoration: none;
    color: var(--tinta);
    transition: all 0.2s;
  }
  .recent-item:hover { background: rgba(255,255,255,0.7); }
  .recent-item .ref {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.1rem;
  }
  .recent-item .fecha {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--sepia);
  }
  .clear-btn {
    background: transparent;
    border: 1px solid var(--rojo);
    color: var(--rojo);
    padding: 0.5rem 1.25rem;
    font-family: var(--font-body);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 1rem;
  }
  .clear-btn:hover {
    background: var(--rojo);
    color: var(--pergamino);
  }
</style>
</head>
<body>

<nav class="topbar">
  <a href="../index.html" class="brand">Codex Talmudicus</a>
  <ul class="nav-links">
    <li><a href="cosmos.html">Cosmos</a></li>
    <li><a href="grafo.html">Grafo</a></li>
    <li><a href="calendario.html">Daf Yomí</a></li>
    <li><a href="buscar.html">Buscar</a></li>
    <li><a href="progreso.html">Mi estudio</a></li>
  </ul>
</nav>

<div class="codex">

  <header class="folio-header">
    <div class="meta">Tu recorrido</div>
    <div class="title">
      <h1>Mi estudio</h1>
      <div class="subtitle">Tu mapa personal del Shas</div>
    </div>
    <div class="meta" id="meta-progress">...</div>
  </header>

  <div class="stats-row" id="stats-row"></div>

  <h2 style="font-style: italic; margin: 2rem 0 1rem;">Progreso por seder</h2>
  <div class="progress-grid" id="por-seder"></div>

  <h2 style="font-style: italic; margin: 2rem 0 1rem;">Dapim recientes</h2>
  <div class="recent-list" id="recent-list"></div>

  <h2 style="font-style: italic; margin: 2rem 0 1rem;">Datos guardados</h2>
  <div class="progress-card" id="data-info"></div>

</div>

<footer>
  <p>הפוך בה והפוך בה דכולא בה</p>
</footer>

<script src="../assets/js/shas.js"></script>
<script src="../assets/js/sefaria-client.js"></script>
<script>
(function init() {
  const estudiados = JSON.parse(localStorage.getItem('codex-estudiados') || '[]');
  const fechas = JSON.parse(localStorage.getItem('codex-fechas') || '{}');
  const total = totalAmudimShas();
  const pct = (estudiados.length / total * 100).toFixed(2);

  document.getElementById('meta-progress').textContent = `${estudiados.length}/${total} · ${pct}%`;

  // Stats globales
  document.getElementById('stats-row').innerHTML = `
    <div class="stat">
      <div class="num">${estudiados.length}</div>
      <div class="label">Dapim estudiados</div>
    </div>
    <div class="stat">
      <div class="num">${pct}%</div>
      <div class="label">Del Shas</div>
    </div>
    <div class="stat">
      <div class="num">${total - estudiados.length}</div>
      <div class="label">Por estudiar</div>
    </div>
    <div class="stat">
      <div class="num">${Math.ceil((total - estudiados.length) / 365)}</div>
      <div class="label">Años restantes (a 1/día)</div>
    </div>
  `;

  // Progreso por seder
  const porSeder = document.getElementById('por-seder');
  Object.entries(SHAS).forEach(([sederKey, seder]) => {
    let estudiadosS = 0;
    let totalS = 0;
    seder.masejtot.forEach(m => {
      const d = generarDapim(m);
      totalS += d.length;
      estudiadosS += d.filter(x => estudiados.includes(x.ref)).length;
    });
    const pctS = (estudiadosS / totalS * 100).toFixed(1);
    const card = document.createElement('a');
    card.className = 'progress-card';
    card.href = `seder.html?seder=${encodeURIComponent(sederKey)}`;
    card.style.textDecoration = 'none';
    card.style.color = 'inherit';
    card.innerHTML = `
      <h4>${seder.nombre_es}</h4>
      <div style="color: var(--sepia); direction: rtl; margin-bottom: 0.5rem;">${seder.nombre_he}</div>
      <div class="progress-bar"><div class="fill" style="width: ${pctS}%"></div></div>
      <div style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--sepia);">${estudiadosS}/${totalS} · ${pctS}%</div>
    `;
    porSeder.appendChild(card);
  });

  // Recientes
  const recientes = estudiados
    .map(ref => ({ ref, fecha: fechas[ref] || null }))
    .filter(r => r.fecha)
    .sort((a, b) => new Date(b.fecha) - new Date(a.fecha))
    .slice(0, 10);

  const recientesEl = document.getElementById('recent-list');
  if (recientes.length === 0) {
    recientesEl.innerHTML = '<p style="color: var(--sepia); font-style: italic;">Aún no has marcado ningún daf como estudiado.</p>';
  } else {
    recientes.forEach(r => {
      const a = document.createElement('a');
      a.className = 'recent-item';
      a.href = `../daf.html?ref=${encodeURIComponent(r.ref)}`;
      const fecha = new Date(r.fecha);
      a.innerHTML = `
        <div class="ref">${r.ref.replace('.', ' ')}</div>
        <div class="fecha">${fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
      `;
      recientesEl.appendChild(a);
    });
  }

  // Info de datos
  const cache = SefariaClient.estadisticasCache();
  document.getElementById('data-info').innerHTML = `
    <p style="margin-bottom: 0.5rem;"><strong>${estudiados.length}</strong> dapim marcados como estudiados.</p>
    <p style="margin-bottom: 0.5rem;"><strong>${cache.entradas}</strong> respuestas de Sefaria en caché (${cache.kb} KB).</p>
    <p style="margin-bottom: 1rem;">Todos los datos viven en tu navegador (localStorage). Para respaldarlos o moverlos a otro equipo, exporta el localStorage.</p>
    <button class="clear-btn" onclick="if(confirm('¿Limpiar caché de Sefaria? (No afecta tu progreso)')) { SefariaClient.limpiarCache(); location.reload(); }">
      Limpiar caché de Sefaria
    </button>
  `;
})();
</script>

</body>
</html>
