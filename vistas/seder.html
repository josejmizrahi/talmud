<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seder · Codex Talmudicus</title>
<link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>

<nav class="topbar">
  <a href="../index.html" class="brand">Codex Talmudicus</a>
  <ul class="nav-links">
    <li><a href="cosmos.html">Cosmos</a></li>
    <li><a href="grafo.html">Grafo</a></li>
    <li><a href="calendario.html">Daf Yomí</a></li>
    <li><a href="buscar.html">Buscar</a></li>
    <li><a href="progreso.html">Mi estudio</a></li>
  </ul>
</nav>

<div class="codex">

  <header class="folio-header" id="folio-header">
    <div class="meta">...</div>
    <div class="title"><h1>...</h1><div class="subtitle">...</div></div>
    <div class="meta">...</div>
  </header>

  <div class="masejet-list" id="masejtot"></div>

</div>

<footer>
  <p>הפוך בה והפוך בה דכולא בה</p>
</footer>

<script src="../assets/js/shas.js"></script>
<script>
(function init() {
  const params = new URLSearchParams(location.search);
  const sederKey = params.get('seder');
  const seder = SHAS[sederKey];
  if (!seder) {
    document.querySelector('.codex').innerHTML = '<div class="error-box">Seder no encontrado.</div>';
    return;
  }

  const estudiados = new Set(JSON.parse(localStorage.getItem('codex-estudiados') || '[]'));
  const totalSeder = seder.masejtot.reduce((a, m) => a + m.dapim, 0);

  document.title = `${seder.nombre_es} · Codex Talmudicus`;

  document.getElementById('folio-header').innerHTML = `
    <div class="meta">Seder ${sederKey}</div>
    <div class="title">
      <h1>${seder.nombre_es}</h1>
      <div class="subtitle">${seder.nombre_he}</div>
    </div>
    <div class="meta">${seder.masejtot.length} masejtot · ${totalSeder} dapim</div>
  `;

  const cont = document.getElementById('masejtot');
  seder.masejtot.forEach(m => {
    const dapim = generarDapim(m);
    const estudiadosM = dapim.filter(d => estudiados.has(d.ref)).length;
    const card = document.createElement('a');
    card.className = 'masejet-card';
    card.href = `masejet.html?ref=${encodeURIComponent(m.ref)}`;
    card.innerHTML = `
      <div>
        <div class="nombre">${m.es}</div>
        <div class="he">${m.he}</div>
      </div>
      <div class="count">${estudiadosM}/${dapim.length}</div>
    `;
    cont.appendChild(card);
  });
})();
</script>

</body>
</html>
