<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar · Codex Talmudicus</title>
<link rel="stylesheet" href="../assets/css/main.css">
<style>
  .search-form {
    margin-bottom: 2rem;
  }
  .search-form input {
    width: 100%;
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--sepia);
    padding: 1rem 1.5rem;
    font-family: var(--font-display);
    font-size: 1.3rem;
    color: var(--tinta);
  }
  .search-form input:focus {
    outline: none;
    border-color: var(--dorado);
    background: rgba(255,255,255,0.8);
  }
  .search-result {
    background: rgba(255,255,255,0.4);
    border: 1px solid var(--pergamino-sombra);
    border-left: 3px solid var(--dorado);
    padding: 1.25rem 1.5rem;
    margin-bottom: 0.75rem;
    text-decoration: none;
    color: var(--tinta);
    display: block;
    transition: all 0.2s;
  }
  .search-result:hover {
    background: rgba(255,255,255,0.7);
    transform: translateX(2px);
  }
  .search-result .ref {
    font-family: var(--font-display);
    font-style: italic;
    color: var(--sepia);
    font-size: 1rem;
    margin-bottom: 0.5rem;
  }
  .search-result .snippet-he {
    direction: rtl;
    font-size: 1.05rem;
    line-height: 1.7;
  }
  .search-result .snippet-en {
    font-family: var(--font-display);
    font-style: italic;
    color: var(--tinta-suave);
    margin-top: 0.5rem;
    padding-top: 0.5rem;
    border-top: 1px dotted var(--pergamino-sombra);
    font-size: 0.95rem;
  }
  .search-result mark {
    background: rgba(184, 134, 11, 0.3);
    padding: 0 2px;
    color: var(--tinta);
  }
</style>
</head>
<body>

<nav class="topbar">
  <a href="../index.html" class="brand">Codex Talmudicus</a>
  <ul class="nav-links">
    <li><a href="cosmos.html">Cosmos</a></li>
    <li><a href="grafo.html">Grafo</a></li>
    <li><a href="calendario.html">Daf Yomí</a></li>
    <li><a href="buscar.html">Buscar</a></li>
    <li><a href="progreso.html">Mi estudio</a></li>
  </ul>
</nav>

<div class="codex">

  <header class="folio-header">
    <div class="meta">Búsqueda</div>
    <div class="title">
      <h1>Buscar</h1>
      <div class="subtitle">En todo el corpus de Sefaria</div>
    </div>
    <div class="meta" id="results-count"></div>
  </header>

  <div class="search-form">
    <input type="text" id="search-input" placeholder="Busca en español, inglés o hebreo..." autofocus>
  </div>

  <div id="search-results">
    <p style="font-style: italic; color: var(--sepia); text-align: center; padding: 2rem;">
      Escribe una palabra o frase y presiona Enter para buscar en todo el Talmud, Tanaj, Midrash y comentarios.
    </p>
  </div>

</div>

<footer>
  <p>הפוך בה והפוך בה דכולא בה</p>
</footer>

<script src="../assets/js/sefaria-client.js"></script>
<script>
async function buscar(query) {
  const cont = document.getElementById('search-results');
  const countEl = document.getElementById('results-count');
  cont.innerHTML = '<div class="loading">Buscando en Sefaria...</div>';
  countEl.textContent = '';

  try {
    const res = await SefariaClient.buscar(query, { size: 30 });
    const hits = res.hits?.hits || [];

    if (hits.length === 0) {
      cont.innerHTML = '<p style="font-style: italic; color: var(--sepia); text-align: center; padding: 2rem;">No se encontraron resultados.</p>';
      return;
    }

    countEl.textContent = `${res.hits?.total?.value || hits.length} resultados`;

    cont.innerHTML = '';
    hits.forEach(hit => {
      const src = hit._source || {};
      const high = hit.highlight || {};
      const link = document.createElement('a');
      // Si es un ref del Bavli, intentar abrirlo internamente
      const ref = src.ref || '';
      const esBavli = /^(Berakhot|Shabbat|Eruvin|Pesachim|Shekalim|Yoma|Sukkah|Beitzah|Rosh Hashanah|Taanit|Megillah|Moed Katan|Chagigah|Yevamot|Ketubot|Nedarim|Nazir|Sotah|Gittin|Kiddushin|Bava Kamma|Bava Metzia|Bava Batra|Sanhedrin|Makkot|Shevuot|Avodah Zarah|Horayot|Zevachim|Menachot|Chullin|Bekhorot|Arakhin|Temurah|Keritot|Meilah|Tamid|Niddah)\s+\d+[ab]/.test(ref);
      if (esBavli) {
        const refLimpio = ref.replace(/^(.+?)\s+(\d+[ab]).*$/, '$1.$2');
        link.href = `../daf.html?ref=${encodeURIComponent(refLimpio)}`;
      } else {
        link.href = `https://www.sefaria.org/${encodeURIComponent(ref)}`;
        link.target = '_blank';
      }
      link.className = 'search-result';

      const heSnippet = (high.naive_lemmatizer || high.exact || [src.exact || ''])[0] || '';
      const enSnippet = src.lang === 'en' ? (src.exact || '') : '';

      link.innerHTML = `
        <div class="ref">${src.ref || ''} · ${src.categories?.join(' › ') || ''}</div>
        ${heSnippet ? `<div class="snippet-he">${heSnippet}</div>` : ''}
        ${enSnippet && enSnippet !== heSnippet ? `<div class="snippet-en">${enSnippet}</div>` : ''}
      `;
      cont.appendChild(link);
    });
  } catch (err) {
    cont.innerHTML = `<div class="error-box">Error en la búsqueda: ${err.message}</div>`;
  }
}

const input = document.getElementById('search-input');

// Cargar query inicial desde URL
const params = new URLSearchParams(location.search);
const qInicial = params.get('q');
if (qInicial) {
  input.value = qInicial;
  buscar(qInicial);
}

let timer;
input.addEventListener('input', () => {
  clearTimeout(timer);
  const q = input.value.trim();
  if (q.length >= 2) {
    timer = setTimeout(() => buscar(q), 400);
  }
});

input.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    const q = input.value.trim();
    if (q) buscar(q);
  }
});
</script>

</body>
</html>
