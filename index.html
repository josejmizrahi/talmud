<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Talmudicus · Diagramas temáticos del Bavlí</title>
<link rel="stylesheet" href="assets/css/main.css">
<style>
  body {
    background: var(--pergamino);
    background-image: var(--noise),
      radial-gradient(ellipse at top left, rgba(184,134,11,0.04), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(139,26,26,0.03), transparent 50%);
    min-height: 100vh;
    margin: 0; padding: 0;
    font-family: var(--font-body);
    color: var(--tinta);
  }
  .codex-shell {
    max-width: 1080px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }
  .codex-header {
    text-align: center;
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--pergamino-sombra);
  }
  .codex-header .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--dorado);
    margin-bottom: 0.75rem;
  }
  .codex-header h1 {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    line-height: 1.1;
    color: var(--tinta);
    margin: 0 0 0.5rem;
  }
  .codex-header .perek {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    letter-spacing: 1.5px;
    color: var(--sepia);
  }
  .codex-header .lede {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.05rem;
    color: var(--tinta-suave);
    max-width: 640px;
    margin: 1rem auto 0;
    line-height: 1.5;
  }

  /* Índice temático */
  .codex-toc {
    margin: 2rem 0 3rem;
    padding: 1.25rem 1.5rem;
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--pergamino-sombra);
    border-radius: 4px;
  }
  .codex-toc h3 {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--sepia);
    margin: 0 0 0.75rem;
    font-weight: 500;
  }
  .codex-toc ol {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0.4rem;
  }
  .codex-toc li {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    font-size: 0.88rem;
    line-height: 1.4;
  }
  .codex-toc .orden {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--sepia);
    min-width: 22px;
  }
  .codex-toc .dap {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--sepia-claro);
    margin-left: auto;
  }
  .codex-toc a {
    color: var(--tinta);
    text-decoration: none;
    border-bottom: 1px dotted transparent;
  }
  .codex-toc a:hover { border-bottom-color: var(--rojo); color: var(--rojo); }
  .codex-toc .pendiente {
    color: var(--sepia-claro);
    opacity: 0.55;
    font-style: italic;
  }
  .codex-toc .toc-perek {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--dorado);
    padding-top: 0.5rem;
    border-bottom: 1px dashed var(--pergamino-sombra);
    margin-bottom: 0.25rem;
  }
  .codex-toc .toc-perek .heb {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 0.85rem;
    letter-spacing: 0;
    text-transform: none;
    color: var(--sepia);
    margin-left: 0.5rem;
  }

  /* Divisor de perek en el scroll */
  .perek-divisor {
    margin-top: 4.5rem;
    padding: 2.25rem 1.5rem;
    text-align: center;
    background: rgba(184,134,11,0.05);
    border-top: 3px double var(--dorado);
    border-bottom: 3px double var(--dorado);
  }
  .perek-divisor .pd-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--dorado);
    margin-bottom: 0.5rem;
  }
  .perek-divisor h2 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 500;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    color: var(--tinta);
    margin: 0 0 0.3rem;
    direction: rtl;
  }
  .perek-divisor .pd-sub {
    font-family: var(--font-display);
    font-style: italic;
    color: var(--tinta-suave);
    font-size: 1rem;
  }

  .diagrama-bloque {
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    scroll-margin-top: 1rem;
  }
  .diagrama-bloque:first-of-type { margin-top: 1rem; }

  .diagrama-cabecera {
    margin-bottom: 1.5rem;
    padding: 1.25rem 1.5rem;
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--pergamino-sombra);
    border-left: 3px solid var(--dorado);
    border-radius: 4px;
  }
  .diagrama-cabecera .ref-tag {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--dorado);
    margin-bottom: 0.4rem;
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .diagrama-cabecera .ref-tag .orden-badge {
    color: var(--sepia);
    border-right: 1px solid var(--pergamino-sombra);
    padding-right: 0.75rem;
  }
  .diagrama-cabecera h2 {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.5rem, 3vw, 2rem);
    color: var(--tinta);
    margin: 0 0 0.4rem;
    line-height: 1.2;
  }
  .diagrama-cabecera .subtitulo {
    font-family: var(--font-display);
    font-style: italic;
    color: var(--tinta-suave);
    font-size: 1.02rem;
    margin: 0;
  }

  .diagrama-puente {
    margin-bottom: 1.5rem;
    padding: 0.9rem 1.25rem;
    background: rgba(184,134,11,0.04);
    border-left: 2px solid var(--dorado);
    border-radius: 0 4px 4px 0;
    font-size: 0.92rem;
    line-height: 1.55;
    color: var(--tinta-suave);
  }
  .diagrama-puente .puente-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.4rem;
    flex-wrap: wrap;
  }
  .diagrama-puente .puente-tag {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--dorado);
  }
  .diagrama-puente .puente-tipo {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 1px;
    color: var(--sepia);
    padding: 0.1rem 0.5rem;
    border: 1px solid var(--sepia);
    border-radius: 999px;
  }
  .diagrama-puente .puente-texto {
    font-family: var(--font-display);
    font-style: italic;
  }

  .diagrama-frame {
    padding: 1.5rem;
    background: rgba(255,255,255,0.35);
    border: 1px solid var(--pergamino-sombra);
    border-radius: 4px;
    min-height: 200px;
  }
  .diagrama-frame .cargando,
  .diagrama-frame .error {
    color: var(--sepia);
    font-style: italic;
    font-size: 0.95rem;
    text-align: center;
    padding: 2rem;
  }
  .diagrama-frame .error { color: var(--rojo); }

  /* Interconexiones del tema (tejido de la red) */
  .diagrama-conexiones {
    margin-top: 1rem;
    padding: 0.85rem 1.1rem;
    background: rgba(255,255,255,0.4);
    border: 1px solid var(--pergamino-sombra);
    border-radius: 4px;
    display: flex;
    align-items: baseline;
    gap: 0.5rem 0.6rem;
    flex-wrap: wrap;
  }
  .diagrama-conexiones .conx-label {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--sepia);
    margin-right: 0.25rem;
  }
  .diagrama-conexiones .conx-chip {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 0.88rem;
    line-height: 1.3;
    color: var(--tinta);
    text-decoration: none;
    padding: 0.18rem 0.6rem 0.18rem 0.5rem;
    background: rgba(255,255,255,0.55);
    border: 1px solid var(--pergamino-sombra);
    border-left: 3px solid var(--sepia-claro);
    border-radius: 0 999px 999px 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .diagrama-conexiones .conx-chip:hover {
    background: rgba(184,134,11,0.1);
    border-color: var(--dorado);
  }
  .diagrama-conexiones .conx-chip .n {
    font-family: var(--font-mono);
    font-style: normal;
    font-size: 0.62rem;
    color: var(--sepia);
    margin-left: 0.3rem;
  }
  .diagrama-conexiones .conx-chip.editorial   { border-left-color: #b8860b; }
  .diagrama-conexiones .conx-chip.co-sabio    { border-left-color: #1e3a5f; }
  .diagrama-conexiones .conx-chip.co-pasuk    { border-left-color: #8b1a1a; }
  .diagrama-conexiones .conx-chip.co-concepto { border-left-color: #1e6b5a; }
  .diagrama-conexiones .conx-red {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 1px;
    color: var(--dorado);
    text-decoration: none;
    padding: 0.2rem 0.6rem;
    border: 1px solid var(--dorado);
    border-radius: 999px;
    margin-left: auto;
    white-space: nowrap;
  }
  .diagrama-conexiones .conx-red:hover { background: var(--dorado); color: var(--pergamino); }

  /* Ensayo del tema (nota del vault) */
  .diagrama-ensayo {
    margin-top: 1rem;
    background: rgba(255,255,255,0.45);
    border: 1px solid var(--pergamino-sombra);
    border-left: 3px solid var(--rojo);
    border-radius: 4px;
  }
  .diagrama-ensayo summary {
    cursor: pointer;
    user-select: none;
    padding: 0.75rem 1.25rem;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--sepia);
  }
  .diagrama-ensayo summary:hover { color: var(--rojo); }
  .diagrama-ensayo[open] summary { border-bottom: 1px dashed var(--pergamino-sombra); }
  .diagrama-ensayo .ensayo-cuerpo {
    padding: 1rem 1.5rem 1.25rem;
    max-width: 72ch;
  }
  .diagrama-ensayo .cargando {
    color: var(--sepia);
    font-style: italic;
    font-size: 0.9rem;
  }

  /* Navegación inter-diagrama */
  .diagrama-nav {
    margin-top: 1rem;
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .diagrama-nav a {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 1px;
    padding: 0.5rem 0.85rem;
    text-decoration: none;
    color: var(--sepia);
    border: 1px solid var(--sepia);
    border-radius: 4px;
    transition: background 0.15s, color 0.15s;
  }
  .diagrama-nav a:hover { background: var(--sepia); color: var(--pergamino); }
  .diagrama-nav .vacio { visibility: hidden; }

  .codex-footer {
    margin-top: 4rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--pergamino-sombra);
    text-align: center;
    font-size: 0.82rem;
    color: var(--sepia);
    font-style: italic;
  }
  .codex-footer a {
    color: var(--sepia);
    border-bottom: 1px dotted var(--sepia);
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="codex-shell">

  <header class="codex-header">
    <div class="eyebrow">Codex Talmudicus</div>
    <h1>Diagramas temáticos del Bavlí</h1>
    <div class="perek" id="codex-perek">cargando…</div>
    <p class="lede">cada diagrama cubre un tema completo, incluso si vuelve a aparecer en daf posteriores · orden cronológico de primera aparición</p>
    <a href="red.html" style="display: inline-block; margin-top: 1rem; font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 1.5px; color: var(--dorado); text-decoration: none; padding: 0.5rem 0.9rem; border: 1px solid var(--dorado); border-radius: 999px;">◈ ver red de temas →</a>
  </header>

  <nav class="codex-toc">
    <h3>Índice · perek 1</h3>
    <ol id="codex-toc-lista"></ol>
  </nav>

  <main id="codex-bloques"></main>

  <footer class="codex-footer">
    Texto base: Sefaria · William Davidson Edition · <a href="https://github.com/josejmizrahi/talmud" target="_blank" rel="noopener">código fuente</a>
  </footer>

</div>

<script>
/* Lee diagramas/manifest.json y renderiza:
   1. el índice (TOC) con TODOS los temas (listos y pendientes)
   2. los bloques de diagramas LISTOS, embebiendo cada fragmento
   Para agregar un diagrama: editar manifest.json (cambiar estado a "listo") +
   crear diagramas/{slug}.html. El index se regenera solo. */
(async function() {
  const cacheVersion = 'v=' + Date.now();
  const manifest = await fetch('diagramas/manifest.json?' + cacheVersion).then(r => r.json());
  document.getElementById('codex-perek').textContent = manifest.perek;

  // Nombres legibles para slugs de sabios / pesukim / conceptos
  const nombrePorSlug = {};
  ['sabios', 'pesukim', 'conceptos'].forEach(k =>
    (manifest[k] || []).forEach(e => { nombrePorSlug[e.slug] = e.nombre || e.slug; })
  );
  const nombre = slug => nombrePorSlug[slug] || slug;
  const temaPorSlug = Object.fromEntries(manifest.diagramas.map(d => [d.slug, d]));

  // Interconexiones agrupadas por vecino: slug -> Map(otherSlug -> [conexiones])
  const conexionesDe = new Map();
  (manifest.conexiones || []).forEach(c => {
    [[c.from, c.to], [c.to, c.from]].forEach(([yo, otro]) => {
      if (!conexionesDe.has(yo)) conexionesDe.set(yo, new Map());
      const m = conexionesDe.get(yo);
      if (!m.has(otro)) m.set(otro, []);
      m.get(otro).push(c);
    });
  });

  function interconexionesHtml(d) {
    const porVecino = conexionesDe.get(d.slug);
    if (!porVecino || porVecino.size === 0) return '';
    const vecinos = [...porVecino.entries()].sort((a, b) => {
      const edA = a[1].some(c => c.categoria === 'editorial') ? 1 : 0;
      const edB = b[1].some(c => c.categoria === 'editorial') ? 1 : 0;
      if (edA !== edB) return edB - edA;
      return b[1].length - a[1].length;
    });
    const MAX = 7;
    const visibles = vecinos.slice(0, MAX);
    const restantes = vecinos.length - visibles.length;
    const chips = visibles.map(([otroSlug, cs]) => {
      const otro = temaPorSlug[otroSlug];
      if (!otro) return '';
      const editorial = cs.find(c => c.categoria === 'editorial');
      const clase = editorial ? 'editorial' : cs[0].tipo;
      const detalle = cs.map(c => c.categoria === 'editorial'
        ? `puente editorial: ${c.tipo}`
        : `${c.tipo.replace('co-', '')} compartido: ${nombre(c.via)}`
      ).join(' · ');
      const cuenta = cs.length > 1 ? `<span class="n">×${cs.length}</span>` : '';
      const destino = otro.estado === 'listo' ? `#${otro.slug}` : `red.html#${otro.slug}`;
      return `<a class="conx-chip ${clase}" href="${destino}" title="${detalle.replace(/"/g, '&quot;')}">${editorial ? '⛓ ' : ''}${otro.titulo}${cuenta}</a>`;
    }).join('');
    const mas = restantes > 0
      ? `<a class="conx-chip" href="red.html#${d.slug}" title="ver todas las conexiones en la red">+${restantes} más</a>`
      : '';
    return `
      <div class="diagrama-conexiones">
        <span class="conx-label">tejido</span>
        ${chips}${mas}
        <a class="conx-red" href="red.html#${d.slug}">◈ ver en la red</a>
      </div>
    `;
  }

  // Render TOC (con divisores de perek)
  const perakim = manifest.perakim || {};
  const toc = document.getElementById('codex-toc-lista');
  let tocPerek = null;
  toc.innerHTML = manifest.diagramas.map(d => {
    const dap = d.dapim.join(' · ');
    let divisor = '';
    if (d.perek !== tocPerek) {
      tocPerek = d.perek;
      const p = perakim[d.perek] || {};
      divisor = `<li class="toc-perek">${p.titulo || 'perek ' + d.perek}<span class="heb">${p.nombre || ''}</span></li>`;
    }
    if (d.estado === 'listo') {
      return `${divisor}<li><span class="orden">${d.orden}.</span><a href="#${d.slug}">${d.titulo}</a><span class="dap">${dap}</span></li>`;
    }
    return `${divisor}<li><span class="orden">${d.orden}.</span><span class="pendiente">${d.titulo}</span><span class="dap">${dap}</span></li>`;
  }).join('');

  // Render bloques listos (con divisores de perek)
  const main = document.getElementById('codex-bloques');
  const listos = manifest.diagramas.filter(d => d.estado === 'listo');
  let perekActual = null;
  for (let i = 0; i < listos.length; i++) {
    const d = listos[i];
    if (d.perek !== perekActual) {
      perekActual = d.perek;
      const p = perakim[d.perek] || {};
      const div = document.createElement('section');
      div.className = 'perek-divisor';
      div.id = 'perek-' + d.perek;
      div.innerHTML = `
        <div class="pd-eyebrow">${p.titulo || 'perek ' + d.perek} · ${p.dapim || ''}</div>
        <h2>${p.nombre || ''}</h2>
        <div class="pd-sub">${d.perek === 1 ? 'el zman del shema · la noche y sus criaturas · la tefilá contra el decreto' : 'la kavaná · el idioma del shema · las interrupciones y sus jerarquías'}</div>
      `;
      main.appendChild(div);
    }
    const prev = i > 0 ? listos[i - 1] : null;
    const next = i < listos.length - 1 ? listos[i + 1] : null;
    const dapim = d.dapim.map(x => 'Berajot ' + x).join(' · ');
    const article = document.createElement('article');
    article.className = 'diagrama-bloque';
    article.id = d.slug;
    const puente = d.puente_desde;
    let puenteHtml = '';
    if (puente) {
      const texto = typeof puente === 'string' ? puente : (puente.texto || '');
      const tipo = (typeof puente === 'object' && puente.tipo) ? puente.tipo : null;
      const isApertura = tipo === 'apertura' || !prev;
      const tagLabel = isApertura ? 'Apertura del tratado' : 'Cómo el editor conectó ↩';
      const tipoBadge = (tipo && !isApertura) ? `<span class="puente-tipo">técnica: ${tipo}</span>` : '';
      puenteHtml = `
        <div class="diagrama-puente">
          <div class="puente-meta">
            <span class="puente-tag">${tagLabel}</span>
            ${tipoBadge}
          </div>
          <span class="puente-texto">${texto.replace(/\n/g, ' ')}</span>
        </div>
      `;
    }
    article.innerHTML = `
      <div class="diagrama-cabecera">
        <div class="ref-tag">
          <span class="orden-badge">${String(d.orden).padStart(2, '0')} de ${manifest.diagramas.length}</span>
          <span>${dapim}</span>
          <span>· ${d.grupo}</span>
        </div>
        <h2>${d.titulo}</h2>
        <p class="subtitulo">${d.subtitulo}</p>
      </div>
      ${puenteHtml}
      <div class="diagrama-frame" data-src="diagramas/${d.slug}.html?${cacheVersion}">
        <p class="cargando">Cargando…</p>
      </div>
      ${interconexionesHtml(d)}
      ${d.nota ? `
      <details class="diagrama-ensayo" data-nota="notas/temas/${d.slug}.html">
        <summary>✦ leer el ensayo del tema</summary>
        <div class="ensayo-cuerpo"><p class="cargando">Cargando…</p></div>
      </details>` : ''}
      <div class="diagrama-nav">
        ${prev ? `<a href="#${prev.slug}">← ${prev.titulo}</a>` : '<span class="vacio"></span>'}
        ${next ? `<a href="#${next.slug}">${next.titulo} →</a>` : '<span class="vacio"></span>'}
      </div>
    `;
    main.appendChild(article);
  }

  // Cargar cada fragmento + re-ejecutar scripts inline
  for (const frame of document.querySelectorAll('.diagrama-frame[data-src]')) {
    const src = frame.dataset.src;
    try {
      const resp = await fetch(src);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const html = await resp.text();
      frame.innerHTML = html;
      frame.querySelectorAll('script').forEach(viejo => {
        const nuevo = document.createElement('script');
        Array.from(viejo.attributes).forEach(a => nuevo.setAttribute(a.name, a.value));
        nuevo.textContent = viejo.textContent;
        viejo.parentNode.replaceChild(nuevo, viejo);
      });
    } catch (err) {
      frame.innerHTML = '<p class="error">No se pudo cargar ' + src + ' (' + err.message + ')</p>';
    }
  }

  // Ensayos del vault: carga perezosa al abrir el desplegable
  document.querySelectorAll('.diagrama-ensayo[data-nota]').forEach(det => {
    det.addEventListener('toggle', async () => {
      if (!det.open || det.dataset.cargado) return;
      det.dataset.cargado = '1';
      const cuerpo = det.querySelector('.ensayo-cuerpo');
      try {
        const resp = await fetch(det.dataset.nota + '?' + cacheVersion);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        cuerpo.innerHTML = await resp.text();
        // wikilinks: temas van al scroll, entidades a la red
        cuerpo.querySelectorAll('a.wiki').forEach(a => {
          const { kind, slug } = a.dataset;
          a.href = kind === 'temas' ? '#' + slug : 'red.html#' + kind + ':' + slug;
        });
      } catch (err) {
        cuerpo.innerHTML = '<p class="error">No se pudo cargar el ensayo (' + err.message + ')</p>';
      }
    });
  });
})();
</script>

</body>
</html>
